<script>
    // Global cache for admin dashboard users data
    let globalAdminUsersData = [];

    async function loadAdminDashboardData() {
        // 1. Verify admin rights
        const isAdmin = currentUser && (currentUser.role === 'Admin' || currentUser.name === 'Mayank');
        if (!isAdmin) {
            showToast("Access Denied: Admin Dashboard is restricted to administrators.");
            switchView('view-dashboard');
            return;
        }

        // Show loading skeletons, hide grid
        const loader = document.getElementById('admin-dashboard-loading');
        const grid = document.getElementById('admin-dashboard-grid');
        if (loader) loader.classList.remove('hidden');
        if (grid) grid.classList.add('hidden');

        // Set date
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-IN', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        const dateEl = document.getElementById('adminDashboardDate');
        if (dateEl) dateEl.innerText = dateStr;

        try {
            // Fetch necessary tables
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const todayISO = todayStart.toISOString();

            const todayDateForTarget = new Date();
            const prevMonthForTarget = new Date(todayDateForTarget.getFullYear(), todayDateForTarget.getMonth() - 1, 1);
            const targetPeriod = `${prevMonthForTarget.getFullYear()}-${(prevMonthForTarget.getMonth() + 1).toString().padStart(2, '0')}`;

            // Run requests in parallel
            const [
                usersRes,
                assignmentsRes,
                clientsRes,
                gstRes,
                tdsRes,
                ledgerRes,
                subsidiesListRes,
                clientSubsidiesRes,
                tasksRes,
                pageVisRes,
                taskLogsTodayRes,
                followUpLogsTodayRes,
                taskHistoryTodayRes,
                pfLogsRes
            ] = await Promise.all([
                supabaseClient.from('users').select('*').eq('is_archived', false).order('name'),
                fetchAllRows((from, to) => supabaseClient.from('client_assignments').select('*').order('id').range(from, to)),
                supabaseClient.from('clients').select('*').eq('is_active', true),
                supabaseClient.from('gst_tracking').select('*'),
                supabaseClient.from('tds_tracking').select('*'),
                supabaseClient.from('tally_ledgers').select('ledger_id, current_balance, next_followup, tally_ledger_name'),
                supabaseClient.from('client_subsidies').select('subsidy_name'),
                supabaseClient.from('client_subsidies').select('*'),
                supabaseClient.from('tasks').select('task_id, status, due_date, assigned_to, is_custom, custom_task_name, client_id, service_id, clients(display_name), services(service_type)'),
                supabaseClient.from('page_visibility_settings').select('*'),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('*').gte('timestamp', todayISO).order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
                supabaseClient.from('follow_up_logs').select('*').gte('timestamp', todayISO).order('timestamp', { ascending: false }),
                supabaseClient.from('task_history').select('*').gte('timestamp', todayISO).order('timestamp', { ascending: false }),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('client_id, note').or('note.ilike.%[PFESIC_LOG]%,note.ilike.%[PFESIC_FOLLOWUP]%,note.ilike.%[PF_LOG]%,note.ilike.%[PF_TRACKING]%').order('log_id').range(from, to))
            ]);

            if (usersRes.error) throw usersRes.error;

            const users = usersRes.data || [];
            const assignments = assignmentsRes.data || [];
            const clients = clientsRes.data || [];
            const gstData = gstRes.data || [];
            const tdsData = tdsRes.data || [];
            const tallyLedgers = ledgerRes.data || [];
            const subsidyNamesList = subsidiesListRes.data || [];
            const clientSubsidies = clientSubsidiesRes.data || [];
            const explicitTasks = tasksRes.data || [];
            const pageVisibility = pageVisRes.data || [];
            const taskLogsToday = taskLogsTodayRes.data || [];
            const followUpLogsToday = followUpLogsTodayRes.data || [];
            const taskHistoryToday = taskHistoryTodayRes.data || [];

            const pfTrackingMap = {};
            const pfFollowupMap = {};

            if (pfLogsRes.data) {
                pfLogsRes.data.forEach(log => {
                    if (log.note.startsWith('[PFESIC_LOG]')) {
                        const parts = log.note.replace('[PFESIC_LOG] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const field = parts[2];
                            const status = parts[3];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId][field] = status;
                        }
                    } else if (log.note.startsWith('[PFESIC_FOLLOWUP]')) {
                        const parts = log.note.replace('[PFESIC_FOLLOWUP] ', '').split('|');
                        if (parts.length >= 3) {
                            const cId = parts[0];
                            const fDate = parts[2];
                            pfFollowupMap[cId] = fDate;
                        }
                    } else if (log.note.startsWith('[PF_LOG]')) {
                        const parts = log.note.replace('[PF_LOG] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const fieldMap = { challanStatus: 'pfChallan', returnStatus: 'pfReturn' };
                            const field = fieldMap[parts[2]] || parts[2];
                            const status = parts[3];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId][field] = status;
                        }
                    } else if (log.note.startsWith('[PF_TRACKING]')) {
                        const parts = log.note.replace('[PF_TRACKING] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId].pfChallan = parts[2] || 'Pending';
                            pfTrackingMap[cId].pfReturn = parts[3] || 'Pending';
                        }
                    }
                });
            }

            const enrolledAuditServices = pageVisibility.find(p => p.page_id === 'view-audits')?.enrolled_services || [];
            const subsidyNames = new Set(subsidyNamesList.map(s => s.subsidy_name));
            
            // Build TDS tracking map
            const currentTdsPeriod = window.getCurrentTdsPeriod ? window.getCurrentTdsPeriod() : '';
            const tdsTrackingMap = {};
            tdsData.forEach(r => {
                if (r.period === currentTdsPeriod) {
                    tdsTrackingMap[r.client_id] = r;
                }
            });

            // Pre-calculate balances
            const ledgerBalances = {};
            const ledgerNamesMap = {};
            const ledgerFollowupMap = {};
            tallyLedgers.forEach(ledger => {
                const balStr = String(ledger.current_balance || '0');
                const balVal = parseFloat(balStr.replace(/[^0-9.-]+/g, "")) || 0;
                ledgerBalances[ledger.ledger_id] = balVal;
                ledgerNamesMap[ledger.ledger_id] = ledger.tally_ledger_name || 'Unknown Debtor';
                if (ledger.next_followup) {
                    ledgerFollowupMap[ledger.ledger_id] = ledger.next_followup;
                }
            });

            // targetPeriod is already defined above

            // Process each user
            globalAdminUsersData = users.map(user => {
                let modStats = {
                    gst: { due: 0, overdue: 0 },
                    tds: { due: 0, overdue: 0 },
                    audit: { due: 0, overdue: 0 },
                    pf: { due: 0, overdue: 0 },
                    pt: { due: 0, overdue: 0 },
                    it: { due: 0, overdue: 0 },
                    debtor: { due: 0, overdue: 0 },
                    billing: { due: 0, overdue: 0 },
                    task: { due: 0, overdue: 0 },
                    comp: { due: 0, overdue: 0 },
                    startup: { due: 0, overdue: 0 }
                };

                let validTotalTasks = 0;
                let completedTasks = 0;
                const pendingWorkIds = new Set();
                const pendingWorkDetails = [];

                // Filter assignments for this user
                const myAssignments = assignments.filter(a => a.maker_id === user.id);
                
                myAssignments.forEach(a => {
                    // 1. Debtor Recovery
                    if (a.service_type === 'Debtor Recovery') {
                        const lid = a.client_id;
                        const totalOwed = ledgerBalances[lid] || 0;
                        if (totalOwed > 0) {
                            validTotalTasks++;
                            pendingWorkIds.add(`debtor:${lid}`);
                            pendingWorkDetails.push({
                                id: `debtor:${lid}`,
                                type: 'debtor',
                                clientId: lid
                            });
                            const fDate = ledgerFollowupMap[lid];
                            const isOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                            if (isOverdue) modStats.debtor.overdue++; else modStats.debtor.due++;
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                        }
                        return;
                    }

                    // Client details
                    const clientObj = clients.find(c => c.client_id === a.client_id);
                    if (!clientObj) return;

                    const clientServicesStr = clientObj.standard_services ? clientObj.standard_services.toLowerCase() : '';

                    // 2. GST Return
                    if (a.service_type && a.service_type.toLowerCase().includes('gst')) {
                        if (!clientServicesStr.includes('gst')) return;

                        const clientGstRows = gstData.filter(r => r.client_id === a.client_id);
                        const trackRecord = clientGstRows.find(r => r.period === targetPeriod) || {};
                        const freq = clientObj.gst_frequency || 'Monthly';
                        const isQuarterly = freq === 'Quarterly';

                        let qMonthIdx = 3;
                        if (targetPeriod) {
                            const [y, mStr] = targetPeriod.split('-');
                            const monthVal = parseInt(mStr);
                            const rem = monthVal % 3;
                            if (rem === 1) qMonthIdx = 1;
                            else if (rem === 2) qMonthIdx = 2;
                            else qMonthIdx = 3;
                        }

                        const dataPending = !trackRecord.is_data && (!isQuarterly || qMonthIdx === 3);
                        const gstr1Pending = !trackRecord.is_gstr1 && (!isQuarterly || qMonthIdx === 3);
                        const gstr3bPending = !trackRecord.is_gstr3b && (!isQuarterly || qMonthIdx === 3);

                        const pendingSteps = (dataPending ? 1 : 0) + (gstr1Pending ? 1 : 0) + (gstr3bPending ? 1 : 0);
                        if (pendingSteps > 0) {
                            pendingWorkIds.add(`gst:${a.client_id}`);
                            pendingWorkDetails.push({
                                id: `gst:${a.client_id}`,
                                type: 'gst',
                                clientId: a.client_id
                            });
                            const isOverdue = window.isGstPeriodOverdue ? (window.isGstPeriodOverdue(targetPeriod) && (!isQuarterly || qMonthIdx === 3)) : false;
                            if (isOverdue) modStats.gst.overdue += pendingSteps; else modStats.gst.due += pendingSteps;
                            if (!dataPending) {
                                validTotalTasks++;
                            }
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                        }
                    } 
                    // 3. TDS Return
                    else if (a.service_type && a.service_type.toLowerCase().includes('tds')) {
                        if (!clientServicesStr.includes('tds')) return;

                        const tdsTrack = tdsTrackingMap[a.client_id] || {};
                        const returnStatus = tdsTrack.return_filed_status || 'Pending';
                        if (returnStatus !== 'NIL') {
                            const filingPending = returnStatus !== 'Done';
                            const form16Status = tdsTrack.form_16_status || 'Pending';
                            const form16Pending = form16Status !== 'Done' && form16Status !== 'NIL';
                            const billedStatus = tdsTrack.billed_status || 'Pending';
                            const billingPending = billedStatus !== 'Done' && billedStatus !== 'NIL';

                            const pendingSteps = (filingPending ? 1 : 0) + (form16Pending ? 1 : 0) + (billingPending ? 1 : 0);
                            const caseHasPendingWork = pendingSteps > 0;
                            if (caseHasPendingWork) {
                                pendingWorkIds.add(`tds:${a.client_id}`);
                                pendingWorkDetails.push({
                                    id: `tds:${a.client_id}`,
                                    type: 'tds',
                                    clientId: a.client_id
                                });
                                const isOverdue = window.isTdsPeriodOverdue ? window.isTdsPeriodOverdue(currentTdsPeriod) : false;
                                if (isOverdue) modStats.tds.overdue += pendingSteps; else modStats.tds.due += pendingSteps;
                            } else {
                                completedTasks++;
                            }
                            validTotalTasks++;
                        }
                    }
                    // 4. Audit
                    else if (
                        a.service_type === 'Audit Status' || 
                        (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                        (enrolledAuditServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
                    ) {
                        const hasAuditService = enrolledAuditServices.some(as => clientServicesStr.includes(as.toLowerCase())) || clientServicesStr.includes('audit');
                        if (!hasAuditService) return;

                        if (clientObj.audit_status !== 'Completed') {
                            validTotalTasks++;
                            pendingWorkIds.add(`audit:${a.client_id}`);
                            pendingWorkDetails.push({
                                id: `audit:${a.client_id}`,
                                type: 'audit',
                                clientId: a.client_id
                            });
                            modStats.audit.due++;
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                        }
                    }
                    // 5. Generic Compliances
                    else if (a.service_type && !a.service_type.toLowerCase().includes('startup') && !a.service_type.toLowerCase().includes('subsidy') && a.service_type !== 'Debtor Recovery' && !subsidyNames.has(a.service_type)) {
                        validTotalTasks++;
                        pendingWorkIds.add(`comp:${a.client_id}:${a.service_type}`);
                        pendingWorkDetails.push({
                            id: `comp:${a.client_id}:${a.service_type}`,
                            type: 'comp',
                            clientId: a.client_id,
                            serviceName: a.service_type
                        });
                        const st = a.service_type.toLowerCase();
                        if (st === 'pf' || st === 'esic' || st === 'pf & esic') {
                            const hasPF = clientObj.standard_services ? clientObj.standard_services.toLowerCase().includes('pf') : false;
                            const hasESIC = clientObj.standard_services ? clientObj.standard_services.toLowerCase().includes('esic') : false;
                            
                            const track = pfTrackingMap[a.client_id] || { pfChallan: 'Pending', pfReturn: 'Pending', esicChallan: 'Pending', esicReturn: 'Pending' };
                            const pfOk = !hasPF || (track.pfChallan === 'Done' && track.pfReturn === 'Done');
                            const esicOk = !hasESIC || (track.esicChallan === 'Done' && track.esicReturn === 'Done');
                            const isCompleted = pfOk && esicOk;

                            if (isCompleted) {
                                completedTasks++;
                            } else {
                                const fDate = pfFollowupMap[a.client_id] || '';
                                const isPfOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                                if (isPfOverdue) modStats.pf.overdue++; else modStats.pf.due++;
                            }
                        }
                        else if (st.includes('professional tax') || st === 'pt') modStats.pt.due++;
                        else if (st.includes('income tax')) modStats.it.due++;
                        else if (st.includes('billing')) modStats.billing.due++;
                        else modStats.comp.due++;
                    }
                });

                // 6. Startup & Subsidy cases assigned to this user
                clientSubsidies.forEach(sub => {
                    const clientObj = clients.find(c => c.client_id === sub.client_id);
                    if (!clientObj) return;

                    const isSpecificAssigned = myAssignments.some(a => a.client_id === sub.client_id && a.service_type === sub.subsidy_name);
                    const isGenericAssigned = myAssignments.some(a => a.client_id === sub.client_id && (a.service_type === 'Startup' || a.service_type === 'Subsidy'));

                    if (isSpecificAssigned || isGenericAssigned) {
                        const status = sub.status || 'Pending';
                        const isCompleted = status === 'Approved';

                        validTotalTasks++;
                        if (isCompleted) {
                            completedTasks++;
                        } else {
                            pendingWorkIds.add(`subsidy:${sub.client_id}:${sub.subsidy_name}`);
                            pendingWorkDetails.push({
                                id: `subsidy:${sub.client_id}:${sub.subsidy_name}`,
                                type: 'subsidy',
                                clientId: sub.client_id,
                                subsidyType: sub.subsidy_name
                            });
                            const fDate = sub.next_followup_date;
                            const isOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                            if (isOverdue) modStats.startup.overdue++; else modStats.startup.due++;
                        }
                    }
                });

                // 7. Explicit Custom Tasks assigned to this user
                const myExplicitTasks = explicitTasks.filter(t => t.assigned_to === user.id);
                myExplicitTasks.forEach(t => {
                    const isCancelled = t.is_custom && t.custom_task_name && t.custom_task_name.endsWith(' [Cancelled]');
                    if (isCancelled) return;
                    const isCompleted = t.status === 'Completed';
                    const isWaitingOnClient = t.status.toLowerCase().includes('client') || t.status.toLowerCase().includes('hold');

                    if (!isWaitingOnClient) {
                        validTotalTasks++;
                        if (isCompleted) {
                            completedTasks++;
                        } else {
                            pendingWorkIds.add(`task:${t.task_id}`);
                            pendingWorkDetails.push({
                                id: `task:${t.task_id}`,
                                type: 'task',
                                taskId: t.task_id
                            });
                            const isOverdue = t.due_date ? (new Date(t.due_date) < new Date().setHours(0,0,0,0)) : false;
                            if (isOverdue) modStats.task.overdue++; else modStats.task.due++;
                        }
                    }
                });

                // 8. Productivity Pulse logs and Grade today
                let updatedCount = 0;
                const updatedIds = new Set();
                const userLogsToday = [];

                // Filter logs today for this user
                const myTaskLogs = taskLogsToday.filter(l => l.user_id === user.id);
                const myFollowUpLogs = followUpLogsToday.filter(l => l.user_id === user.id);
                const myTdsHistoryLogs = taskHistoryToday.filter(l => l.user_id === user.id && l.task_type === 'TDS');

                // Consolidate logs for display
                myTaskLogs.forEach(l => {
                    userLogsToday.push({
                        type: 'task',
                        note: l.note || 'Task updated.',
                        timestamp: l.timestamp
                    });

                    // Match GST, Audits, generic compliances, explicit tasks
                    if (l.task_id && pendingWorkIds.has(`task:${l.task_id}`)) {
                        updatedIds.add(`task:${l.task_id}`);
                    }
                    const gstKey = `gst:${l.client_id}`;
                    if (pendingWorkIds.has(gstKey)) {
                        updatedIds.add(gstKey);
                    }
                    const auditKey = `audit:${l.client_id}`;
                    if (l.note && (l.bank_status !== null || l.sales_status !== null || l.ledger_status !== null || l.others_status !== null || l.note.includes('[AUDIT_FOLLOWUP]') || l.note.includes('Audit status') || l.note.includes('[Acknowledged Today]'))) {
                        if (pendingWorkIds.has(auditKey)) {
                            updatedIds.add(auditKey);
                        }
                    }
                    if (l.note && l.note.includes('|')) {
                        const parts = l.note.split('|');
                        const catPart = parts.find(p => p.includes('CAT:'));
                        if (catPart) {
                            const cat = catPart.split('CAT:')[1].trim();
                            const key = `subsidy:${l.client_id}:${cat}`;
                            if (pendingWorkIds.has(key)) {
                                updatedIds.add(key);
                            }
                        }
                    }
                    if (l.note && l.note.includes('[StartupSubsidyUpdate::')) {
                        const cat = l.note.split('[StartupSubsidyUpdate::')[1].split(']')[0];
                        const key = `subsidy:${l.client_id}:${cat}`;
                        if (pendingWorkIds.has(key)) {
                            updatedIds.add(key);
                        }
                    }
                    if (l.note && l.note.includes('[Acknowledged Today]') && l.note.includes('Subsidy type:')) {
                        const match = l.note.match(/Subsidy type: (.*?) acknowledged/);
                        if (match) {
                            const subsidyType = match[1];
                            const key = `subsidy:${l.client_id}:${subsidyType}`;
                            if (pendingWorkIds.has(key)) {
                                updatedIds.add(key);
                            }
                        }
                    }
                    if (l.note && l.note.includes('[Acknowledged Today]')) {
                        pendingWorkDetails.forEach(detail => {
                            if (detail.type === 'comp' && detail.clientId === l.client_id && l.note.includes(detail.serviceName)) {
                                updatedIds.add(detail.id);
                            }
                        });
                    }
                });

                myFollowUpLogs.forEach(l => {
                    userLogsToday.push({
                        type: 'debtor',
                        note: l.notes || 'Debtor collection follow-up log submitted.',
                        timestamp: l.timestamp
                    });

                    if (pendingWorkIds.has(`debtor:${l.ledger_id}`)) {
                        updatedIds.add(`debtor:${l.ledger_id}`);
                    }
                });

                myTdsHistoryLogs.forEach(l => {
                    userLogsToday.push({
                        type: 'tds',
                        note: l.note || 'TDS Return updated.',
                        timestamp: l.timestamp
                    });

                    const tdsKey = `tds:${l.client_id}`;
                    if (pendingWorkIds.has(tdsKey)) {
                        updatedIds.add(tdsKey);
                    }
                });

                // Sort logs by timestamp descending
                userLogsToday.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                updatedCount = updatedIds.size;
                const totalCount = pendingWorkIds.size;
                const coverage = totalCount > 0 ? (updatedCount / totalCount) * 100 : 100;

                let todayGrade = "C";
                let gradeColor = "text-amber-600";
                let gradeBg = "bg-amber-50 border-amber-100";
                
                if (coverage >= 90) { todayGrade = "A+"; gradeColor = "text-emerald-600"; gradeBg = "bg-emerald-50 border-emerald-100"; }
                else if (coverage >= 75) { todayGrade = "A"; gradeColor = "text-teal-600"; gradeBg = "bg-teal-50 border-teal-100"; }
                else if (coverage >= 60) { todayGrade = "B+"; gradeColor = "text-cyan-600"; gradeBg = "bg-cyan-50 border-cyan-100"; }
                else if (coverage >= 45) { todayGrade = "B"; gradeColor = "text-blue-600"; gradeBg = "bg-blue-50 border-blue-100"; }
                else if (coverage >= 30) { todayGrade = "C+"; gradeColor = "text-indigo-600"; gradeBg = "bg-indigo-50 border-indigo-100"; }
                else if (coverage >= 15) { todayGrade = "C"; gradeColor = "text-amber-600"; gradeBg = "bg-amber-50 border-amber-100"; }
                else if (updatedCount >= 1) { todayGrade = "D"; gradeColor = "text-rose-600"; gradeBg = "bg-rose-50 border-rose-100"; }
                else { todayGrade = "Z"; gradeColor = "text-slate-400"; gradeBg = "bg-slate-50 border-slate-200"; }

                const masterPercent = validTotalTasks > 0 ? Math.round((completedTasks / validTotalTasks) * 100) : 100;

                return {
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    permissions: user.permissions || [],
                    validTotalTasks,
                    completedTasks,
                    masterPercent,
                    totalCount,
                    updatedCount,
                    coverage: Math.round(coverage),
                    todayGrade,
                    gradeColor,
                    gradeBg,
                    recentLogs: userLogsToday.slice(0, 2),
                    totalLogsToday: userLogsToday.length,
                    modStats: modStats
                };
            });

            // Update stats widgets
            renderAdminStats();

            // Render cards
            renderAdminDashboardCards();

        } catch (err) {
            console.error("Error loading admin dashboard data:", err);
            showToast("Error loading admin dashboard details. Check console.");
        } finally {
            if (loader) loader.classList.add('hidden');
            if (grid) grid.classList.remove('hidden');
        }
    }

    function renderAdminStats() {
        const staffCount = globalAdminUsersData.length;
        const totalCompliances = globalAdminUsersData.reduce((sum, u) => sum + u.validTotalTasks, 0);
        const totalUpdatesToday = globalAdminUsersData.reduce((sum, u) => sum + u.updatedCount, 0);
        
        // Avg team score across staff who have tasks
        const staffWithTasks = globalAdminUsersData.filter(u => u.validTotalTasks > 0);
        const avgScore = staffWithTasks.length > 0 
            ? Math.round(staffWithTasks.reduce((sum, u) => sum + u.masterPercent, 0) / staffWithTasks.length)
            : 100;

        const staffCountEl = document.getElementById('adminStatActiveStaff');
        const totalTasksEl = document.getElementById('adminStatTotalTasks');
        const logsTodayEl = document.getElementById('adminStatLogsToday');
        const avgScoreEl = document.getElementById('adminStatAvgScore');

        if (staffCountEl) staffCountEl.innerText = staffCount;
        if (totalTasksEl) totalTasksEl.innerText = totalCompliances;
        if (logsTodayEl) logsTodayEl.innerText = totalUpdatesToday;
        if (avgScoreEl) avgScoreEl.innerText = `${avgScore}%`;
    }

    function renderAdminDashboardCards() {
        const grid = document.getElementById('admin-dashboard-grid');
        if (!grid) return;
        grid.innerHTML = '';

        if (globalAdminUsersData.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-users text-4xl mb-3"></i>
                    <p class="font-bold text-sm">No active staff members found.</p>
                </div>
            `;
            return;
        }

        const modulesList = [
            { id: 'view-gst-center', name: 'GST', icon: 'fa-file-invoice' },
            { id: 'view-tds-center', name: 'TDS', icon: 'fa-calculator' },
            { id: 'view-audits', name: 'Audits', icon: 'fa-list-check' },
            { id: 'view-pf-esic', name: 'PF/ESIC', icon: 'fa-user-gear' },
            { id: 'view-professional-tax', name: 'PT', icon: 'fa-building-columns' },
            { id: 'view-income-tax', name: 'IT', icon: 'fa-percent' },
            { id: 'view-debtors', name: 'Debtors', icon: 'fa-wallet' },
            { id: 'view-billing', name: 'Billing', icon: 'fa-file-invoice-dollar' },
            { id: 'view-custom-tasks', name: 'Tasks', icon: 'fa-clipboard-list' },
            { id: 'view-compliance', name: 'Compliance', icon: 'fa-calendar-check' },
            { id: 'view-startups-subsidy', name: 'Startup', icon: 'fa-rocket' }
        ];

        globalAdminUsersData.forEach(user => {
            const initials = user.name.trim().split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
            
            // Render permissions pills
            let permHtml = '';
            modulesList.forEach(m => {
                const hasPerm = user.name === 'Mayank' || user.permissions.includes(m.id);
                if (hasPerm) {
                    let statKey = m.name.toLowerCase();
                    if (m.id === 'view-gst-center') statKey = 'gst';
                    if (m.id === 'view-tds-center') statKey = 'tds';
                    if (m.id === 'view-audits') statKey = 'audit';
                    if (m.id === 'view-pf-esic') statKey = 'pf';
                    if (m.id === 'view-professional-tax') statKey = 'pt';
                    if (m.id === 'view-income-tax') statKey = 'it';
                    if (m.id === 'view-debtors') statKey = 'debtor';
                    if (m.id === 'view-billing') statKey = 'billing';
                    if (m.id === 'view-custom-tasks') statKey = 'task';
                    if (m.id === 'view-compliance') statKey = 'comp';
                    if (m.id === 'view-startups-subsidy') statKey = 'startup';
                    
                    const stats = user.modStats[statKey] || {due: 0, overdue: 0};
                    
                    permHtml += `
                        <div class="flex flex-col bg-slate-50 border border-slate-200 rounded-xl p-3 min-w-[100px] flex-1">
                            <div class="flex items-center gap-2 mb-3">
                                <div class="w-6 h-6 rounded bg-white text-indigo-600 flex items-center justify-center shrink-0 shadow-sm border border-slate-100">
                                    <i class="fa-solid ${m.icon} text-[10px]"></i>
                                </div>
                                <span class="text-[11px] font-black text-slate-700 uppercase tracking-wider truncate" title="${m.name}">${m.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5 mt-auto">
                                <div class="flex-1 text-center bg-white border border-slate-100 rounded-lg py-1 hover:border-indigo-200 transition-colors cursor-default" title="${stats.due} Due">
                                    <span class="block text-[8px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">Due</span>
                                    <span class="block text-sm font-black text-slate-700 leading-none">${stats.due}</span>
                                </div>
                                <div class="flex-1 text-center ${stats.overdue > 0 ? 'bg-rose-50 border-rose-100 text-rose-600' : 'bg-slate-50 border-slate-100 text-slate-400'} border rounded-lg py-1 cursor-default" title="${stats.overdue} Overdue">
                                    <span class="block text-[8px] font-black uppercase tracking-widest leading-none mb-1 ${stats.overdue > 0 ? 'text-rose-400' : 'text-slate-400'}">O.Due</span>
                                    <span class="block text-sm font-black leading-none">${stats.overdue}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            // Activity dot color
            const isActive = user.totalLogsToday > 0;
            const dotColor = isActive ? 'bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]' : 'bg-slate-300';
            const statusLabel = isActive ? 'Active Today' : 'Idle Today';

            // Logs today html
            let logsHtml = '';
            if (user.recentLogs.length > 0) {
                user.recentLogs.forEach(log => {
                    let timeStr = 'Today';
                    if (log.timestamp) {
                        timeStr = new Date(log.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    }
                    logsHtml += `
                        <div class="flex items-start gap-2.5 text-[11px] border-b border-slate-100 pb-2 last:border-b-0 last:pb-0">
                            <span class="text-[9px] font-black font-mono text-slate-400 bg-slate-50 border border-slate-100 px-1.5 py-0.5 rounded-md shrink-0">${timeStr}</span>
                            <p class="text-slate-600 font-semibold line-clamp-2 break-all flex-1 leading-normal" title="${log.note.replace(/"/g, '&quot;')}">${log.note}</p>
                        </div>
                    `;
                });
            } else {
                logsHtml = `
                    <p class="text-slate-400 text-xs font-semibold py-2 italic flex items-center gap-1.5 justify-center bg-slate-50/50 border border-dashed border-slate-200 rounded-xl">
                        <i class="fa-solid fa-circle-info text-[11px]"></i> No activity logged today.
                    </p>
                `;
            }

            // Create card HTML
            const cardId = `admin-user-card-${user.id}`;
            const cardHtml = `
                <div id="${cardId}" class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between h-full group" data-username="${user.name.toLowerCase()}">
                    <div>
                        <!-- Header: User info -->
                        <div class="flex items-center justify-between mb-5">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center font-black text-white text-sm shadow-md group-hover:scale-105 transition-transform">
                                    ${initials}
                                </div>
                                <div>
                                    <h3 class="text-sm font-black text-slate-800 tracking-tight leading-none">${user.name}</h3>
                                    <span class="text-[10px] text-slate-400 font-black uppercase tracking-wider block mt-1.5">${user.role}</span>
                                </div>
                            </div>
                            
                            <!-- Status badge -->
                            <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-100 px-2.5 py-1 rounded-full shrink-0">
                                <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest leading-none">${statusLabel}</span>
                            </div>
                        </div>

                        <!-- Section 1: Productivity Pulse Stats -->
                        <div class="bg-slate-50/60 border border-slate-100/50 rounded-2xl p-4 mb-5 grid grid-cols-3 gap-3 items-center">
                            <!-- Today Grade -->
                            <div class="text-center border-r border-slate-200/50 pr-2">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1">Today's Grade</span>
                                <div class="w-10 h-10 mx-auto rounded-xl ${user.gradeBg} border flex items-center justify-center font-black text-lg ${user.gradeColor}">
                                    ${user.todayGrade}
                                </div>
                            </div>
                            <!-- Today updates count -->
                            <div class="text-center border-r border-slate-200/55 pr-2">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1">Logs Today</span>
                                <span class="text-base font-black text-slate-800 block">${user.updatedCount}/${user.totalCount}</span>
                                <span class="text-[9px] text-slate-400 font-bold block mt-0.5">${user.coverage}% Done</span>
                            </div>
                            <!-- Master score progress bar -->
                            <div class="text-center pl-1">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1">Master Score</span>
                                <span class="text-base font-black text-indigo-600 block">${user.completedTasks}/${user.validTotalTasks}</span>
                                <div class="w-full bg-slate-200 rounded-full h-1.5 mt-1.5 overflow-hidden">
                                    <div class="bg-indigo-600 h-1.5 rounded-full transition-all duration-500" style="width: ${user.masterPercent}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Dashboard Modules -->
                        <div class="mb-5">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.15em] block mb-2.5">My Action Modules</span>
                            <div class="flex flex-wrap gap-2 max-h-[220px] overflow-y-auto os-scroll pr-1 pb-1">
                                ${permHtml}
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Recent Activity Log Stream -->
                    <div class="border-t border-slate-100/80 pt-4 mt-auto">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.15em] block mb-2.5">Recent Remarks</span>
                        <div class="space-y-2">
                            ${logsHtml}
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    function filterAdminDashboardCards() {
        const searchInput = document.getElementById('adminUserSearchInput');
        if (!searchInput) return;
        const searchVal = searchInput.value.toLowerCase().trim();
        const cards = document.querySelectorAll('#admin-dashboard-grid > div[id^="admin-user-card-"]');
        
        cards.forEach(card => {
            const userName = card.getAttribute('data-username') || '';
            if (userName.includes(searchVal)) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }
</script>
