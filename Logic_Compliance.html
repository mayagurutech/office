<script>
    // ==========================================
    // MODULE: COMPLIANCE MANAGER
    // ==========================================

    let currentReminderServiceId = null; 
    let currentReminderDueDate = null;

    async function loadComplianceData() {
        await refreshGlobalCache(); 
        const filterDropdown = document.getElementById('complianceFilterSelect');
        filterDropdown.innerHTML = '<option value="">All Services</option>';
        globalServicesList.forEach(s => filterDropdown.innerHTML += `<option value="${s.service_type}">${s.service_type}</option>`);
        loadEnrolledClientsList(); 
        loadActiveReminders(); 
        await loadPageVisibilitySettings(); 
    }

    function loadEnrolledClientsList() {
        const filterVal = document.getElementById('complianceFilterSelect').value;
        const tbody = document.getElementById('enrolled-clients-tbody');
        tbody.innerHTML = '';
        let filteredClients = globalClientsList;
        if (filterVal) { filteredClients = globalClientsList.filter(c => c.standard_services && c.standard_services.split(',').map(s => s.trim().toLowerCase()).includes(filterVal.toLowerCase())); }
        document.getElementById('enrolled-count').innerText = filteredClients.length;
        if (filteredClients.length === 0) { tbody.innerHTML = `<tr><td colspan="2" class="text-center py-6 text-gray-500">No clients enrolled in this service.</td></tr>`; return; }
        filteredClients.forEach(c => { tbody.innerHTML += `<tr class="border-b border-gray-100 hover:bg-gray-50"><td class="px-4 py-3 font-bold text-blue-600 hover:underline cursor-pointer text-sm" onclick="openUniversalClientProfile('${c.client_id}')">${c.display_name}</td><td class="px-4 py-3 text-gray-500 text-xs">${c.entity_type || '-'}</td></tr>`; });
    }

    async function generateManualTasksFromEnrollment(btn) {
        const serviceName = document.getElementById('complianceFilterSelect').value;
        if (!serviceName) return showToast("Please select a specific service from the dropdown first.");

        const srvObj = globalServicesList.find(s => s.service_type === serviceName);
        if(!srvObj) return;

        const filteredClients = globalClientsList.filter(c => c.standard_services && c.standard_services.split(',').map(s => s.trim().toLowerCase()).includes(serviceName.toLowerCase()));
        if (filteredClients.length === 0) return showToast("No clients are enrolled in this service.");

        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';

        try {
            const { data: existingTasks } = await supabaseClient.from('tasks').select('client_id').eq('service_id', srvObj.id).neq('status', 'Completed');
            const existingClientIds = existingTasks ? existingTasks.map(t => t.client_id) : [];
            const clientsToCreate = filteredClients.filter(c => !existingClientIds.includes(c.client_id));

            if (clientsToCreate.length === 0) {
                btn.innerHTML = ogHtml;
                return showToast("All enrolled clients already have an active task for this service on the Task Board.");
            }

            if(!confirm(`Create ${clientsToCreate.length} new tasks and send them to the Task Board? (Skipping ${filteredClients.length - clientsToCreate.length} who already have active tasks)`)) {
                btn.innerHTML = ogHtml; return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';

            const payload = clientsToCreate.map(c => ({ client_id: c.client_id, service_id: srvObj.id, status: 'Pending' }));
            const { error } = await supabaseClient.from('tasks').insert(payload);
            
            if (error) throw error;
            showToast(`Successfully pushed ${payload.length} tasks to the Task Board!`);
            globalRefresh();
        } catch (err) {
            showToast("Error generating tasks: " + err.message); btn.innerHTML = ogHtml;
        }
    }

    function openComplianceBuilder() {
        const listContainer = document.getElementById('masterServicesList'); listContainer.innerHTML = '';
        globalServicesList.forEach(srv => {
            // NEW: The Star Icon to toggle Audit Board visibility
            const auditIcon = srv.is_audit ? '<i class="fa-solid fa-star text-amber-400" title="Tracked on Audit Board"></i>' : '<i class="fa-regular fa-star text-gray-300" title="Not Tracked on Audit Board"></i>';

            listContainer.innerHTML += `
            <div class="flex justify-between items-center p-3 border-b border-gray-100 hover:bg-gray-50 group">
                <span class="font-bold text-gray-700 flex-1">${srv.service_type}</span>
                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition mr-2">
                    <button onclick="toggleAuditStatus('${srv.id}', ${srv.is_audit})" class="p-1.5 rounded hover:bg-gray-200 transition">${auditIcon}</button>
                    <button onclick="editMasterService('${srv.id}', '${srv.service_type.replace(/'/g, "\\'")}')" class="text-blue-500 hover:text-blue-700 p-1.5 rounded bg-blue-50 transition" title="Rename"><i class="fa-solid fa-pen text-[10px]"></i></button>
                    <button onclick="deleteMasterService('${srv.id}', '${srv.service_type.replace(/'/g, "\\'")}')" class="text-red-500 hover:text-red-700 p-1.5 rounded bg-red-50 transition" title="Delete"><i class="fa-solid fa-trash text-[10px]"></i></button>
                </div>
                <button onclick="editServiceDeadlines('${srv.id}', '${srv.service_type.replace(/'/g, "\\'")}')" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded font-bold hover:bg-indigo-100">Deadlines</button>
            </div>`;
        });
        document.getElementById('complianceBuilderOverlay').classList.remove('hidden');
    }

    // NEW: Toggles whether a service forces a client onto the Audit Board
    async function toggleAuditStatus(id, currentStatus) {
        const { error } = await supabaseClient.from('services').update({ is_audit: !currentStatus }).eq('id', id);
        if(error) showToast("Error toggling status: " + error.message); 
        else { await refreshGlobalCache(); openComplianceBuilder(); }
    }

    async function editMasterService(id, currentName) {
        const newName = prompt("Rename compliance service:", currentName);
        if(!newName || newName.trim() === '' || newName === currentName) return;
        const { error } = await supabaseClient.from('services').update({ service_type: newName.trim() }).eq('id', id);
        if(error) showToast("Error renaming: " + error.message); else { await refreshGlobalCache(); openComplianceBuilder(); }
    }

    async function deleteMasterService(id, name) {
        if(!confirm(`WARNING: Are you sure you want to permanently delete "${name}"?\n\nThis will remove it from the master list and wipe its associated deadlines.`)) return;
        const { error } = await supabaseClient.from('services').delete().eq('id', id);
        if(error) showToast("Error deleting: " + error.message); else { await refreshGlobalCache(); openComplianceBuilder(); }
    }

    async function addNewMasterService() {
        const nameInput = document.getElementById('newMasterServiceName'); const name = nameInput.value.trim();
        if (!name) return showToast("Please enter a service name.");
        const btn = nameInput.nextElementSibling; const ogHtml = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
        const { error } = await supabaseClient.from('services').insert([{ service_type: name, standard_fee: 0 }]);
        btn.innerHTML = ogHtml; btn.disabled = false;
        if (error) showToast("Error adding service: " + error.message); else { nameInput.value = ''; await refreshGlobalCache(); openComplianceBuilder(); }
    }

    function closeComplianceBuilder() { document.getElementById('complianceBuilderOverlay').classList.add('hidden'); document.getElementById('deadlineEditorArea').classList.add('hidden'); currentEditingServiceId = null; }

    async function editServiceDeadlines(serviceId, serviceName) {
        currentEditingServiceId = serviceId; document.getElementById('builderServiceName').innerText = serviceName; document.getElementById('deadlineEditorArea').classList.remove('hidden');
        const tbody = document.getElementById('deadlines-tbody'); tbody.innerHTML = '<tr><td colspan="4" class="text-center text-sm text-gray-500 py-4">Loading...</td></tr>';
        const { data } = await supabaseClient.from('compliance_deadlines').select('*').eq('service_id', serviceId).order('due_date');
        tbody.innerHTML = '';
        if (!data || data.length === 0) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-sm text-gray-500 py-4">No deadlines configured.</td></tr>';
        else data.forEach(dl => appendDeadlineRow(dl.id, dl.title, dl.due_date, dl.reminder_days));
    }

    function appendDeadlineRow(id = 'new', title = '', date = '', days = 7) {
        const tbody = document.getElementById('deadlines-tbody'); if(tbody.innerHTML.includes('No deadlines')) tbody.innerHTML = '';
        const tr = document.createElement('tr'); tr.className = "border-b border-gray-100 deadline-row"; tr.dataset.id = id;
        tr.innerHTML = `<td class="p-2"><input type="text" class="dl-title w-full border rounded p-1.5 text-sm" placeholder="e.g. Q1 Return" value="${title}"></td><td class="p-2"><input type="date" class="dl-date w-full border rounded p-1.5 text-sm" value="${date}"></td><td class="p-2"><input type="number" class="dl-days w-full border rounded p-1.5 text-sm text-center" value="${days}"></td><td class="p-2 text-center"><button onclick="this.closest('tr').remove()" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button></td>`;
        tbody.appendChild(tr);
    }

    async function saveDeadlines() {
        if(!currentEditingServiceId) return;
        const btn = document.getElementById('saveDeadlinesBtn'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        const rows = document.querySelectorAll('.deadline-row'); const newDeadlines = [];
        rows.forEach(row => { const title = row.querySelector('.dl-title').value.trim(); const date = row.querySelector('.dl-date').value; const days = row.querySelector('.dl-days').value; if(title && date) { newDeadlines.push({ service_id: currentEditingServiceId, title: title, due_date: date, reminder_days: parseInt(days) || 0 }); } });
        await supabaseClient.from('compliance_deadlines').delete().eq('service_id', currentEditingServiceId);
        if(newDeadlines.length > 0) await supabaseClient.from('compliance_deadlines').insert(newDeadlines);
        btn.innerHTML = 'Save Deadlines'; showToast("Deadlines updated successfully!");
    }

    async function loadActiveReminders() {
        const container = document.getElementById('active-reminders-list'); container.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">Checking deadlines...</div>';
        const { data: deadlines } = await supabaseClient.from('compliance_deadlines').select('*, services(service_type)').order('due_date', { ascending: true });
        container.innerHTML = ''; const today = new Date(); today.setHours(0,0,0,0); let hasActive = false;
        if (deadlines && deadlines.length > 0) {
            deadlines.forEach(dl => {
                const dDate = new Date(dl.due_date); dDate.setHours(0,0,0,0);
                const triggerDate = new Date(dDate); triggerDate.setDate(triggerDate.getDate() - dl.reminder_days);
                if (today >= triggerDate && today <= dDate) {
                    hasActive = true; const diffDays = Math.ceil((dDate - today) / (1000 * 60 * 60 * 24)); const urgencyColor = diffDays <= 3 ? 'text-red-600 bg-red-50 border-red-200' : 'text-orange-600 bg-orange-50 border-orange-200';
                    container.innerHTML += `<div onclick="openEligibleClients('${dl.id}', '${dl.service_id}', '${dl.services?.service_type}', '${dl.title.replace(/'/g, "\\'")}', '${dl.due_date}')" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm cursor-pointer hover:border-orange-400 hover:shadow-md transition"><div class="flex justify-between items-start mb-2"><div><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">${dl.services?.service_type}</span><h4 class="font-bold text-gray-800 text-base">${dl.title}</h4></div><span class="px-2 py-1 rounded text-[10px] font-bold border ${urgencyColor}">Due in ${diffDays} days</span></div><div class="text-xs text-gray-500 flex items-center gap-1"><i class="fa-regular fa-calendar text-gray-400"></i> Due: ${dDate.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})}</div></div>`;
                }
            });
        }
        if (!hasActive) container.innerHTML = '<div class="text-center text-sm text-gray-400 py-8 flex flex-col items-center"><i class="fa-solid fa-mug-hot text-3xl mb-3 text-gray-200"></i>No deadlines currently in their reminder window.</div>';
    }

    function openEligibleClients(dlId, serviceId, serviceType, title, dueDate) {
        currentReminderServiceId = serviceId; currentReminderDueDate = dueDate;
        document.getElementById('elg-service-name').innerText = serviceType; document.getElementById('elg-deadline-title').innerText = title;
        document.getElementById('elg-due-date').innerText = new Date(dueDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
        
        const listContainer = document.getElementById('elg-client-list'); 
        listContainer.innerHTML = '';
        
        const eligibleClients = globalClientsList.filter(c => { if(!c.standard_services) return false; return c.standard_services.split(',').map(s=>s.trim().toLowerCase()).includes(serviceType.toLowerCase()); });
        
        document.getElementById('elg-client-count').innerText = eligibleClients.length;
        
        if (eligibleClients.length === 0) {
            listContainer.innerHTML = '<li class="p-4 text-center text-sm text-gray-400">No clients enrolled in this service.</li>';
        } else {
            eligibleClients.forEach(c => { 
                listContainer.innerHTML += `
                <li class="p-3 flex justify-between items-center hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0" onclick="const cb = document.getElementById('cb-${c.client_id}'); cb.checked = !cb.checked;">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="cb-${c.client_id}" value="${c.client_id}" class="elg-client-cb w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer" checked onclick="event.stopPropagation()">
                        <div>
                            <span class="font-bold text-gray-800 text-sm block">${c.display_name}</span>
                            <span class="text-[10px] text-gray-400 uppercase">${c.entity_type || 'Unknown'}</span>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); openUniversalClientProfile('${c.client_id}')" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2 py-1 rounded text-xs font-bold transition border border-indigo-100">Profile</button>
                </li>`; 
            }); 
        }
        document.getElementById('eligibleClientsDrawer').classList.remove('hidden');
    }

    function closeEligibleClientsDrawer() { document.getElementById('eligibleClientsDrawer').classList.add('hidden'); }

    async function generateBulkTasksFromReminder() {
        if(!currentReminderServiceId || !currentReminderDueDate) return;
        
        const checkboxes = document.querySelectorAll('.elg-client-cb:checked');
        const selectedClientIds = Array.from(checkboxes).map(cb => cb.value);

        if (selectedClientIds.length === 0) return showToast("Please select at least one client to generate a task for.");

        const serviceObj = globalServicesList.find(s => s.id === currentReminderServiceId); 
        if(!serviceObj) return;

        if(!confirm(`Generate tasks for ${selectedClientIds.length} selected client(s) for "${serviceObj.service_type}" due on ${currentReminderDueDate}?`)) return;

        const payload = selectedClientIds.map(clientId => ({ 
            client_id: clientId, 
            service_id: currentReminderServiceId, 
            status: 'Pending', 
            due_date: currentReminderDueDate 
        }));
        
        const { error } = await supabaseClient.from('tasks').insert(payload);
        if (error) showToast("Error generating tasks: " + error.message); 
        else { 
            showToast(`Successfully generated ${payload.length} tasks!`); 
            closeEligibleClientsDrawer(); 
            loadTasksData(); 
            loadAuditsData(); 
        }
    }
    let globalPageVisibilitySettings = [];

    async function loadPageVisibilitySettings() {
        const tbody = document.getElementById('page-visibility-tbody');
        if (!tbody) return;
        
        try {
            const { data, error } = await supabaseClient.from('page_visibility_settings').select('*');
            if (error) throw error;
            
            globalPageVisibilitySettings = data || [];
            renderPageVisibilityTable();
        } catch (error) {
            console.error("Error loading page visibility settings:", error);
            tbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-red-500">Error loading settings: ${error.message}</td></tr>`;
        }
    }

    function renderPageVisibilityTable() {
        const tbody = document.getElementById('page-visibility-tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        const pages = [
            { id: 'view-gst-center', name: 'GST Center' },
            { id: 'view-tds-center', name: 'TDS Returns' },
            { id: 'view-audits', name: 'Audit Status' },
            { id: 'view-startups-subsidy', name: 'Startups & Subsidy' },
            { id: 'view-professional-tax', name: 'Professional Tax' },
            { id: 'view-income-tax', name: 'Income Tax Center' },
            { id: 'view-pf-esic', name: 'Pf & ESIC' }
        ];

        pages.forEach(page => {
            const setting = globalPageVisibilitySettings.find(s => s.page_id === page.id) || { enrolled_services: [] };
            
            let checkboxesHtml = `<div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 border border-slate-100 rounded-lg bg-slate-50">`;
            
            const allServices = globalServicesList.map(s => s.service_type);
            if (allServices.length === 0) {
                allServices.push('GST', 'TDS Return', 'Startup', 'Subsidy');
            }
            
            const uniqueServices = [...new Set(allServices)];

            uniqueServices.forEach(service => {
                const isChecked = setting.enrolled_services.includes(service) ? 'checked' : '';
                checkboxesHtml += `
                    <label class="flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer hover:text-indigo-600">
                        <input type="checkbox" class="page-vis-cb w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" data-page="${page.id}" value="${service}" ${isChecked}>
                        ${service}
                    </label>`;
            });
            checkboxesHtml += `</div>`;

            tbody.innerHTML += `
                <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition">
                    <td class="px-4 py-3 font-bold text-slate-800 text-sm">${page.name}</td>
                    <td class="px-4 py-3">${checkboxesHtml}</td>
                </tr>`;
        });
    }

    async function savePageVisibilitySettings() {
        const btn = document.getElementById('savePageVisBtn');
        if (!btn) return;
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        try {
            const pages = ['view-gst-center', 'view-tds-center', 'view-audits', 'view-startups-subsidy', 'view-professional-tax', 'view-income-tax', 'view-pf-esic'];
            
            for (const pageId of pages) {
                const checkboxes = document.querySelectorAll(`.page-vis-cb[data-page="${pageId}"]:checked`);
                const selectedServices = Array.from(checkboxes).map(cb => cb.value);
                
                const existing = globalPageVisibilitySettings.find(s => s.page_id === pageId);
                
                let query;
                if (existing) {
                    query = supabaseClient.from('page_visibility_settings').update({ enrolled_services: selectedServices }).eq('page_id', pageId);
                } else {
                    query = supabaseClient.from('page_visibility_settings').insert([{ page_id: pageId, enrolled_services: selectedServices }]);
                }
                
                const { error } = await query;
                if (error) throw error;
            }
            
            showToast("Settings saved successfully!");
            await loadPageVisibilitySettings(); // Reload
        } catch (error) {
            console.error("Error saving page visibility settings:", error);
            showToast("Error saving settings: " + error.message);
        } finally {
            btn.innerHTML = ogHtml;
            btn.disabled = false;
        }
    }
</script>
