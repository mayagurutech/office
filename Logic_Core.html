    window.isGstPeriodOverdue = function(period) {
        if (!period) return false;
        const [y, m] = period.split('-').map(Number);
        const dueDate = new Date(y, m, 20); // 20th of the next month (JS month is 0-indexed, so Date(y, m, 20) is 20th of month m+1)
        return new Date() > dueDate;
    };

    window.isTdsPeriodOverdue = function(period) {
        if (!period) return false;
        const match = period.match(/(\d{4})-\d{2}\s+Q(\d)/);
        if (!match) return false;
        const year = parseInt(match[1]);
        const quarter = parseInt(match[2]);
        let dueDate;
        if (quarter === 1) dueDate = new Date(year, 6, 31);
        else if (quarter === 2) dueDate = new Date(year, 9, 31);
        else if (quarter === 3) dueDate = new Date(year + 1, 0, 31);
        else if (quarter === 4) dueDate = new Date(year + 1, 4, 31);
        return new Date() > dueDate;
    };

    window.getCurrentTdsPeriod = function() {
        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() - 3; 
        if (month < 0) { month += 12; year--; }

        let fyStart, fyEnd, quarter;
        if (month >= 3) {
            fyStart = year;
            fyEnd = year + 1;
            quarter = Math.floor((month - 3) / 3) + 1;
        } else {
            fyStart = year - 1;
            fyEnd = year;
            quarter = 4;
        }
        const fyStr = `FY ${fyStart}-${fyEnd.toString().slice(-2)}`;
        return `${fyStr} Q${quarter}`;
    };

    window.getServiceType = function(serviceName) {
        if (!serviceName) return 'monthly';
        const lower = serviceName.toLowerCase();
        if (lower.includes('gst') || lower.includes('pf') || lower.includes('esic')) {
            return 'monthly';
        }
        if (lower.includes('tds')) {
            return 'quarterly';
        }
        // Income Tax / Professional Tax / Audit Status / etc.
        return 'yearly';
    };

    window.parsePeriodToValue = function(periodStr, type) {
        if (!periodStr) return 0;
        try {
            if (type === 'monthly') {
                const parts = periodStr.split('-');
                if (parts.length >= 2) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10);
                    return y * 12 + m;
                }
            } else if (type === 'quarterly') {
                // Period string could be "FY 2026-27 Q1"
                const match = periodStr.match(/FY\s+(\d{4})-\d{2}\s+Q(\d)/i);
                if (match) {
                    const year = parseInt(match[1], 10);
                    const quarter = parseInt(match[2], 10);
                    return year * 4 + quarter;
                }
                // Fallback for Q1-2026-27
                const match2 = periodStr.match(/Q(\d)-(\d{4})-\d{2}/i);
                if (match2) {
                    const quarter = parseInt(match2[1], 10);
                    const year = parseInt(match2[2], 10);
                    return year * 4 + quarter;
                }
            } else if (type === 'yearly') {
                // Format: AY_2025_26
                const matchAY = periodStr.match(/AY_(\d{4})_(\d{2})/i);
                if (matchAY) {
                    return parseInt(matchAY[1], 10) - 1; // AY 2025-26 corresponds to FY 2024-25 (value 2024)
                }
                // Format: AY 2025-26
                const matchAY2 = periodStr.match(/AY\s+(\d{4})-\d{2}/i);
                if (matchAY2) {
                    return parseInt(matchAY2[1], 10) - 1;
                }
                // Format: FY_2025_26
                const match = periodStr.match(/FY_(\d{4})_(\d{2})/i);
                if (match) {
                    return parseInt(match[1], 10);
                }
                // Format: FY 2025-26
                const match2 = periodStr.match(/FY\s+(\d{4})-\d{2}/i);
                if (match2) {
                    return parseInt(match2[1], 10);
                }
            }
        } catch (e) {
            console.error("Error parsing period to value:", periodStr, type, e);
        }
        return 0;
    };

    window.isClientVisibleForPeriod = function(clientOrId, compName, pagePeriod, pageType) {
        let client = clientOrId;
        if (typeof client === 'string') {
            client = (window.globalAllClientsList || []).find(c => c.client_id === clientOrId);
        }
        if (!client) return false;
        
        const clientId = client.client_id;
        const isEnrolledNow = client.standard_services && client.standard_services.split(',').map(s => s.trim().toLowerCase()).includes(compName.toLowerCase());
        
        if (!window.globalCompliancePeriodsMap || 
            !window.globalCompliancePeriodsMap[clientId] || 
            !window.globalCompliancePeriodsMap[clientId][compName]) {
            return isEnrolledNow;
        }
        
        const periodData = window.globalCompliancePeriodsMap[clientId][compName];
        if (periodData.rawStart === 'DELETED') {
            return false;
        }
        
        const startVal = periodData.start ? window.parsePeriodToValue(periodData.start, pageType) : null;
        const endVal = periodData.end ? window.parsePeriodToValue(periodData.end, pageType) : null;
        const pageVal = window.parsePeriodToValue(pagePeriod, pageType);

        if (startVal !== null && startVal > 0 && pageVal < startVal) {
            return false;
        }
        if (endVal !== null && endVal > 0 && pageVal > endVal) {
            return false;
        }
        
        if (isEnrolledNow) {
            return true;
        } else {
            return endVal !== null && endVal > 0;
        }
    };

    window.formatPeriodForDisplay = function(periodStr, type) {
        if (!periodStr) return '';
        if (type === 'monthly') {
            const parts = periodStr.split('-');
            if (parts.length >= 2) {
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const mIdx = parseInt(parts[1], 10) - 1;
                return `${months[mIdx]} ${parts[0]}`;
            }
        } else if (type === 'quarterly') {
            // "FY 2026-27 Q1" -> "Q1 FY 2026-27"
            const match = periodStr.match(/FY\s+(\d{4}-\d{2})\s+Q(\d)/i);
            if (match) {
                return `Q${match[2]} FY ${match[1]}`;
            }
        } else if (type === 'yearly') {
            // "FY_2025_26" -> "FY 2025-26", "AY_2025_26" -> "AY 2025-26"
            return periodStr.replace('FY_', 'FY ').replace('AY_', 'AY ').replace('_', '-');
        }
        return periodStr;
    };

        } else if (viewId === 'view-professional-tax') {

        } else if (viewId === 'view-debtors') {

    window.navigateFromPriority = function(taskId, clientName, serviceName, taskName) {
        if (!taskId) return;
        
        let viewId = 'view-custom-tasks';
        let filterInputId = null;
        let filterFunction = null;
        
        const sNameLower = (serviceName || '').toLowerCase();
        const taskIdLower = (taskId || '').toLowerCase();
        
        if (taskIdLower.startsWith('audit:')) {
            viewId = 'view-audits';
            filterInputId = 'auditSearchInput';
            filterFunction = typeof filterAudits === 'function' ? filterAudits : null;
            
            // Auto open audit drawer for this client
            const clientId = taskId.split(':')[1];
            setTimeout(() => {
                const client = (window.globalAuditsList || []).find(c => c.client_id === clientId) || 
                               (window.globalClientsList || []).find(c => c.client_id === clientId);
                if (client && typeof openAuditDrawer === 'function') {
                    openAuditDrawer(client);
                }
            }, 300);
        } else if (taskIdLower.startsWith('subsidy:')) {
            viewId = 'view-startups-subsidy';
            filterInputId = 'startupSubsidySearchInput';
            filterFunction = typeof renderStartupsSubsidyTable === 'function' ? renderStartupsSubsidyTable : null;
            
            // Extract the subsidy name from taskName (e.g. "GST Subsidy Follow-up" -> "GST Subsidy")
            const subsidyName = (taskName || '').replace(' Follow-up', '').trim();
            setTimeout(() => {
                const client = (window.globalClientsList || []).find(c => c.display_name === clientName);
                if (client && subsidyName && typeof openStartupSubsidyDrawer === 'function') {
                    openStartupSubsidyDrawer(client.client_id, clientName, subsidyName);
                }
            }, 300);
        } else if (taskIdLower.startsWith('debtor:')) {
            viewId = 'view-debtors';
            filterInputId = 'debtorSearch';
            filterFunction = typeof filterDebtors === 'function' ? filterDebtors : null;
            
            // Auto open debtor drawer
            const ledgerId = taskId.split(':')[1];
            setTimeout(() => {
                const ledger = (window.globalDebtorsList || []).find(l => (l.ledger_id || l.id) === ledgerId);
                if (ledger && typeof openDebtorDetails === 'function') {
                    openDebtorDetails(ledger);
                }
            }, 300);
        } else {
            // Check based on service name
            if (sNameLower.includes('gst')) {
                viewId = 'view-gst-center';
                filterInputId = 'gstSearchInput';
                filterFunction = typeof renderFilteredGSTTable === 'function' ? renderFilteredGSTTable : null;
            } else if (sNameLower.includes('tds')) {
                viewId = 'view-tds-center';
                filterInputId = 'tdsSearchInput';
                filterFunction = typeof renderFilteredTDSTable === 'function' ? renderFilteredTDSTable : null;
            } else if (sNameLower.includes('audit')) {
                viewId = 'view-audits';
                filterInputId = 'auditSearchInput';
                filterFunction = typeof filterAudits === 'function' ? filterAudits : null;
            } else if (sNameLower.includes('professional tax') || sNameLower === 'pt') {
                viewId = 'view-professional-tax';
                filterInputId = 'ptSearchInput';
                filterFunction = typeof renderFilteredPTTable === 'function' ? renderFilteredPTTable : null;
            } else if (sNameLower.includes('income tax') || sNameLower === 'it') {
                viewId = 'view-income-tax';
                filterInputId = 'itSearchInput';
                filterFunction = typeof renderFilteredITTable === 'function' ? renderFilteredITTable : null;
            } else if (sNameLower.includes('pf') || sNameLower.includes('esic')) {
                viewId = 'view-pf-esic';
                filterInputId = 'pfSearchInput';
                filterFunction = typeof renderFilteredPFTable === 'function' ? renderFilteredPFTable : null;
            } else if (sNameLower.includes('debtor') || sNameLower.includes('recovery')) {
                viewId = 'view-debtors';
                filterInputId = 'debtorSearch';
                filterFunction = typeof filterDebtors === 'function' ? filterDebtors : null;
            } else {
                viewId = 'view-custom-tasks';
                filterFunction = function() {
                    if (typeof filterCustomTasks === 'function') {
                        filterCustomTasks(clientName);
                    }
                };
                
                // Open drawer for the custom task if we can find it
                setTimeout(() => {
                    const task = (window.globalCustomTasksList || []).find(t => t.task_id === taskId || t.id === taskId);
                    if (task && typeof openTaskDrawer === 'function') {
                        openTaskDrawer(task);
                    }
                }, 300);
            }
        }
        
        // 1. Switch the view
        switchView(viewId);
        
        // 2. Set the header search input value
        const headerSearch = document.getElementById('headerSearchInput');
        if (headerSearch) {
            headerSearch.value = clientName;
        }
        
        // 3. Set the module's specific search input value
        if (filterInputId) {
            const el = document.getElementById(filterInputId);
            if (el) {
                el.value = clientName;
            }
        }
        
        // 4. Trigger the filtering logic
        if (filterFunction) {
            setTimeout(() => {
                if (filterInputId) {
                    const el = document.getElementById(filterInputId);
                    if (el) el.value = clientName;
                }
                filterFunction();
            }, 100);
        }
    }

    // Ends the Supabase session on this device only (other devices stay logged in, as before).
    async function clearSavedSession() {
        localStorage.removeItem('office_os_user_name');
        localStorage.removeItem('office_os_user_pin');
        localStorage.removeItem('office_os_login_date');
        try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch (e) { console.warn("Sign-out warning:", e); }
    }

    async function checkSavedSession() {
        // PINs used to be kept in localStorage for auto-login; the Supabase session replaces that.
        localStorage.removeItem('office_os_user_pin');
        const savedDate = localStorage.getItem('office_os_login_date');
        const today = new Date().toDateString();
        const { data: { session } } = await supabaseClient.auth.getSession();
        const appUserId = session?.user?.app_metadata?.app_user_id;

        if (appUserId && savedDate === today) {
            const { data, error } = await supabaseClient.from('users').select('*').eq('id', appUserId).single();

            if (!error && data) {
                currentUser = data;
                if (typeof checkAdminUIInit === 'function') checkAdminUIInit();
                document.getElementById('userNameDisplay').innerText = data.name.split(' ')[0];
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                
                if (typeof updateShellUserDisplay === 'function') updateShellUserDisplay(data.name);

                const now = new Date();
                document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('en-IN', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
                
                await refreshGlobalCache();
                switchView('view-dashboard');
            } else {
                await clearSavedSession();
            }
        } else if (session || (savedDate && savedDate !== today)) {
            // Logins last for the day they were made on, as before.
            await clearSavedSession();
        }
    }

    // Name + PIN are checked server-side by the office-login edge function, which returns a
    // one-time token that becomes this browser's Supabase session.
    async function signInWithPin(name, pin) {
        const { data, error } = await supabaseClient.functions.invoke('office-login', { body: { name, pin } });
        if (error) {
            let message = "Login error: Connection failed";
            try {
                const body = await error.context.json();
                if (body && body.error) message = body.error;
            } catch (e) {}
            return { error: message };
        }
        const { error: otpError } = await supabaseClient.auth.verifyOtp({ token_hash: data.token_hash, type: 'magiclink' });
        if (otpError) {
            console.error("Session exchange failed:", otpError);
            return { error: "Login error: " + otpError.message };
        }
        return { user: data.user };
    }

    // --- AUTHENTICATION ---
    async function attemptLogin() {
        const name = document.getElementById('loginName').value.trim();
        const pin = document.getElementById('loginPin').value;
        const err = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        if(!name || !pin) { err.innerText = "Please enter name and PIN."; err.classList.remove('hidden'); return; }
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const { user: data, error } = await signInWithPin(name, pin);

            if(error || !data) {
                err.innerText = error || "Invalid Name or PIN.";
                err.classList.remove('hidden');
                btn.innerHTML = 'Sign In';
            } else {
                localStorage.setItem('office_os_user_name', name);
                localStorage.setItem('office_os_login_date', new Date().toDateString());

                currentUser = data;
                if (typeof checkAdminUIInit === 'function') checkAdminUIInit();
                const displayName = data.name.split(' ')[0];
                document.getElementById('userNameDisplay').innerText = displayName;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                
                if (typeof updateShellUserDisplay === 'function') updateShellUserDisplay(data.name);

                const today = new Date();
                document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString('en-IN', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
                
                await refreshGlobalCache();
                switchView('view-dashboard');
            }
        } catch (e) {
            console.error("Login exception:", e);
            err.innerText = "Login error: " + (e.message || "Connection failed");
            err.classList.remove('hidden');
            btn.innerHTML = 'Sign In';
        }
    }

    function logout() {
        clearSavedSession();

        currentUser = null;
        if (typeof checkAdminUIInit === 'function') checkAdminUIInit();
        document.getElementById('loginName').value = '';
        document.getElementById('loginPin').value = '';
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');

    function checkAdminUIInit() {
        const isAdmin = currentUser && (currentUser.role === 'Admin' || currentUser.name === 'Mayank');
        const adminBtn = document.getElementById('nav-view-admin-dashboard');
        if (adminBtn) {
            if (isAdmin) {
                adminBtn.classList.remove('hidden');
            } else {

            }
        }
    }

    async function fetchAllRows(queryFn, pageSize = 1000) {
        let allData = [];
        let from = 0;
        let hasMore = true;
        let lastError = null;

        while (hasMore) {
            const to = from + pageSize - 1;
            const res = await queryFn(from, to);
            if (res.error) {
                lastError = res.error;
                break;
            }
            const chunk = res.data || [];
            allData = allData.concat(chunk);
            if (chunk.length < pageSize) {
                hasMore = false;
            } else {
                from += pageSize;
            }
        }
        return { data: allData, error: lastError };
    }

    // --- STATE MANAGEMENT ---
    async function refreshGlobalCache() {
        globalTeamMembers = []; // Reset team members cache to filter out archived users
        
        const [
            clientsRes,
            servicesRes,
            assignmentsRes,
            usersRes,
            tasksRes,
            ignoredPansRes
        ] = await Promise.all([
            supabaseClient.from('clients').select('*').order('display_name'),
            supabaseClient.from('services').select('*').order('service_type'),
            fetchAllRows((from, to) => supabaseClient.from('client_assignments').select('*').order('id').range(from, to)),
            supabaseClient.from('users').select('id, name').eq('is_archived', false).order('name'),
            supabaseClient.from('tasks').select('*', { count: 'exact', head: true }).neq('status', 'Completed'),
            supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'ignored_duplicate_pans').maybeSingle()
        ]);

        // Diagnostic check for errors
        const errors = [];
        if (clientsRes.error) errors.push("clients: " + (clientsRes.error.message || JSON.stringify(clientsRes.error)));

    let _isChecklistLogsLoading = false;
    async function loadChecklistLogsInBackground() {
        if (_isChecklistLogsLoading) return;
        _isChecklistLogsLoading = true;
        try {
            const checklistLogsRes = await fetchAllRows((from, to) => 
                supabaseClient.from('task_logs')
                    .select('client_id, note, timestamp, user_id')
                    .or('note.ilike.%[AUDIT_CHECKLIST_STATUS]%,note.ilike.%[SUBSIDY_CHECKLIST_STATUS]%,note.ilike.%[COMPLIANCE_PERIOD]%')
                    .order('timestamp', { ascending: false })
                    .order('log_id', { ascending: false })
                    .range(from, to)
            );

            if (checklistLogsRes.data) {
                parseChecklistLogsData(checklistLogsRes.data);
            }
        } catch (e) {
            console.warn("Background checklist logs load warning:", e);
        } finally {
            _isChecklistLogsLoading = false;
        }
    }

    function parseChecklistLogsData(checklistLogs) {
        window.globalChecklistStatusMap = {}; // clientId -> cat -> doc -> status
        window.globalChecklistRemarksMap = {}; // clientId -> cat -> doc -> remark
        window.globalChecklistUsersMap = {}; // clientId -> mapKey -> doc -> user_id
        window.globalChecklistAdminStatusMap = {}; // clientId -> mapKey -> doc -> admin_status
        window.globalChecklistAdminUsersMap = {}; // clientId -> mapKey -> doc -> admin_user_id
        window.globalCompliancePeriodsMap = {}; // clientId -> complianceName -> { start, end }
        
        const logs = checklistLogs || [];
        logs.forEach(log => {
            if (!log.note) return;
            if (log.note.startsWith('[COMPLIANCE_PERIOD]')) {
                const cleanNote = log.note.replace('[COMPLIANCE_PERIOD] ', '').trim();
                const parts = cleanNote.split('|');
                if (parts.length >= 4) {
                    const cId = parts[0].trim();
                    const compName = parts[1].trim();
                    const startVal = parts[2].trim();
                    const endVal = parts[3].trim();
                    
                    if (!window.globalCompliancePeriodsMap[cId]) {
                        window.globalCompliancePeriodsMap[cId] = {};
                    }
                    if (window.globalCompliancePeriodsMap[cId][compName] === undefined) {
                        window.globalCompliancePeriodsMap[cId][compName] = {
                            start: (startVal === 'DELETED' || startVal === 'null') ? null : startVal,
                            end: (endVal === 'DELETED' || endVal === 'null' || endVal === 'Present') ? null : endVal,
                            rawStart: startVal,
                            rawEnd: endVal
                        };
                    }
                }
            }
            if (log.note.startsWith('[SUBSIDY_CHECKLIST_STATUS]')) {
                const cleanNote = log.note.replace('[SUBSIDY_CHECKLIST_STATUS] ', '');
                const parts = cleanNote.split('|');
                const catPart = parts.find(p => p.startsWith('CAT:'));
                const docPart = parts.find(p => p.startsWith('DOC:'));
                const statusPart = parts.find(p => p.startsWith('STATUS:'));
                if (catPart && docPart && statusPart) {
                    const cat = catPart.replace('CAT:', '');
                    const doc = docPart.replace('DOC:', '');
                    const status = statusPart.replace('STATUS:', '') === 'true';
                    if (!window.globalChecklistStatusMap[log.client_id]) window.globalChecklistStatusMap[log.client_id] = {};
                    if (!window.globalChecklistStatusMap[log.client_id][cat]) window.globalChecklistStatusMap[log.client_id][cat] = {};
                    if (window.globalChecklistStatusMap[log.client_id][cat][doc] === undefined) {
                        window.globalChecklistStatusMap[log.client_id][cat][doc] = status;
                    }
                }
            } else if (log.note.startsWith('[AUDIT_CHECKLIST_STATUS]')) {
                const cleanNote = log.note.replace('[AUDIT_CHECKLIST_STATUS] ', '');
                const parts = cleanNote.split('|');
                const typePart = parts.find(p => p.startsWith('TYPE:'));
                const stagePart = parts.find(p => p.startsWith('STAGE:'));
                const statusPart = parts.find(p => p.startsWith('STATUS:'));
                const remarkPart = parts.find(p => p.startsWith('REMARK:'));
                const yearPart = parts.find(p => p.startsWith('YEAR:'));
                if (typePart && stagePart && statusPart) {
                    const cat = typePart.replace('TYPE:', '');
                    const doc = stagePart.replace('STAGE:', '');
                    const year = yearPart ? yearPart.replace('YEAR:', '') : 'FY_2025_26';
                    let status = statusPart.replace('STATUS:', '');
                    if (status === 'true') status = true;
                    else if (status === 'false') status = false;
                    
                    if (!window.globalChecklistStatusMap[log.client_id]) window.globalChecklistStatusMap[log.client_id] = {};
                    
                    const mapKey = `${cat}|${year}`;
                    if (!window.globalChecklistStatusMap[log.client_id][mapKey]) window.globalChecklistStatusMap[log.client_id][mapKey] = {};
                    if (window.globalChecklistStatusMap[log.client_id][mapKey][doc] === undefined) {
                        window.globalChecklistStatusMap[log.client_id][mapKey][doc] = status;
                    }
                    
                    if (year === 'FY_2025_26') {
                        if (!window.globalChecklistStatusMap[log.client_id][cat]) window.globalChecklistStatusMap[log.client_id][cat] = {};
                        if (window.globalChecklistStatusMap[log.client_id][cat][doc] === undefined) {
                            window.globalChecklistStatusMap[log.client_id][cat][doc] = status;
                        }
                    }
                    
                    if (remarkPart) {
                        const remark = remarkPart.replace('REMARK:', '');
                        if (!window.globalChecklistRemarksMap[log.client_id]) window.globalChecklistRemarksMap[log.client_id] = {};
                        
                        if (!window.globalChecklistRemarksMap[log.client_id][mapKey]) window.globalChecklistRemarksMap[log.client_id][mapKey] = {};
                        if (window.globalChecklistRemarksMap[log.client_id][mapKey][doc] === undefined) {
                            window.globalChecklistRemarksMap[log.client_id][mapKey][doc] = remark;
                        }
                        
                        if (year === 'FY_2025_26') {
                            if (!window.globalChecklistRemarksMap[log.client_id][cat]) window.globalChecklistRemarksMap[log.client_id][cat] = {};
                            if (window.globalChecklistRemarksMap[log.client_id][cat][doc] === undefined) {
                                window.globalChecklistRemarksMap[log.client_id][cat][doc] = remark;
                            }
                        }
                    }
                    
                    const userPart = parts.find(p => p.startsWith('USER_ID:'));
                    let checkerId = log.user_id;
                    if (userPart) {
                        const parsedUser = userPart.replace('USER_ID:', '').trim();
                        if (parsedUser) checkerId = parsedUser;
                    }
                    
                    if (checkerId && status === true) {
                        if (!window.globalChecklistUsersMap[log.client_id]) window.globalChecklistUsersMap[log.client_id] = {};
                        if (!window.globalChecklistUsersMap[log.client_id][mapKey]) window.globalChecklistUsersMap[log.client_id][mapKey] = {};
                        if (window.globalChecklistUsersMap[log.client_id][mapKey][doc] === undefined) {
                            window.globalChecklistUsersMap[log.client_id][mapKey][doc] = checkerId;
                        }
                        if (year === 'FY_2025_26') {
                            if (!window.globalChecklistUsersMap[log.client_id][cat]) window.globalChecklistUsersMap[log.client_id][cat] = {};
                            if (window.globalChecklistUsersMap[log.client_id][cat][doc] === undefined) {
                                window.globalChecklistUsersMap[log.client_id][cat][doc] = checkerId;
                            }
                        }
                    }

                    // Populate Admin Status & User Map
                    const adminStatusPart = parts.find(p => p.startsWith('ADMIN_STATUS:'));
                    const adminUserPart = parts.find(p => p.startsWith('ADMIN_USER_ID:'));
                    if (adminStatusPart) {
                        const adminStatus = adminStatusPart.replace('ADMIN_STATUS:', '') === 'true';
                        if (!window.globalChecklistAdminStatusMap[log.client_id]) window.globalChecklistAdminStatusMap[log.client_id] = {};
                        if (!window.globalChecklistAdminStatusMap[log.client_id][mapKey]) window.globalChecklistAdminStatusMap[log.client_id][mapKey] = {};
                        if (window.globalChecklistAdminStatusMap[log.client_id][mapKey][doc] === undefined) {
                            window.globalChecklistAdminStatusMap[log.client_id][mapKey][doc] = adminStatus;
                        }
                        if (year === 'FY_2025_26') {
                            if (!window.globalChecklistAdminStatusMap[log.client_id][cat]) window.globalChecklistAdminStatusMap[log.client_id][cat] = {};
                            if (window.globalChecklistAdminStatusMap[log.client_id][cat][doc] === undefined) {
                                window.globalChecklistAdminStatusMap[log.client_id][cat][doc] = adminStatus;
                            }
                        }
                    }
                    if (adminUserPart) {
                        const adminUserId = adminUserPart.replace('ADMIN_USER_ID:', '').trim();
                        if (adminUserId) {
                            if (!window.globalChecklistAdminUsersMap[log.client_id]) window.globalChecklistAdminUsersMap[log.client_id] = {};
                            if (!window.globalChecklistAdminUsersMap[log.client_id][mapKey]) window.globalChecklistAdminUsersMap[log.client_id][mapKey] = {};
                            if (window.globalChecklistAdminUsersMap[log.client_id][mapKey][doc] === undefined) {
                                window.globalChecklistAdminUsersMap[log.client_id][mapKey][doc] = adminUserId;
                            }
                            if (year === 'FY_2025_26') {
                                if (!window.globalChecklistAdminUsersMap[log.client_id][cat]) window.globalChecklistAdminUsersMap[log.client_id][cat] = {};
                                if (window.globalChecklistAdminUsersMap[log.client_id][cat][doc] === undefined) {
                                    window.globalChecklistAdminUsersMap[log.client_id][cat][doc] = adminUserId;
                                }
                            }
                        }
                    }
                }
            }
        });
    }

    async function deduplicateClients() {
        if (!confirm("Are you sure you want to delete duplicate clients based on PAN? This action cannot be undone.")) return;

        const { data: rawClients } = await supabaseClient.from('clients').select('*');
        if (!rawClients) return showToast("No clients found or error fetching data.");
        const clients = rawClients.filter(c => c.is_active !== false);

        const groups = {};
        clients.forEach(c => {
            const pan = (c.pan_number || '').trim().toUpperCase();
            if (!pan) return; // Skip if no PAN
            if (!groups[pan]) groups[pan] = [];
            groups[pan].push(c);
        });

        const deletes = [];
        const allLogUpdates = [];

        Object.keys(groups).forEach(pan => {
            const group = groups[pan];
            if (group.length <= 1) return;

            // Sort so that clients WITH GST come first
            group.sort((a, b) => {
                const gstA = (a.gstin || '').trim();
                const gstB = (b.gstin || '').trim();
                if (gstA && !gstB) return -1;
                if (!gstA && gstB) return 1;
                return 0;
            });

            const kept = [];
            const logUpdates = [];
            
            group.forEach(current => {
                if (kept.length === 0) {
                    kept.push(current);
                    return;
                }
                
                const currentGst = (current.gstin || '').trim().toUpperCase();
                
                let matchingKept = null;
                const isDuplicate = kept.some(k => {
                    const keptGst = (k.gstin || '').trim().toUpperCase();
                    if (currentGst === keptGst || !currentGst) {
                        matchingKept = k;
                        return true;
                    }
                    return false;
                });
                
                if (isDuplicate) {
                    deletes.push(current.client_id);
                    allLogUpdates.push({ from: current.client_id, to: matchingKept.client_id });
                } else {
                    kept.push(current); // Distinct GST, keep it!
                }
            });
        });

        // Run log updates first to avoid foreign key violations
        if (allLogUpdates.length > 0) {
            console.log(`[Deduplication] Moving logs for ${allLogUpdates.length} duplicates...`);
            for (const update of allLogUpdates) {
                const { error: logErr } = await supabaseClient
                    .from('task_logs')
                    .update({ client_id: update.to })
                    .eq('client_id', update.from);
                if (logErr) console.error(`Error moving logs from ${update.from} to ${update.to}:`, logErr);
            }
        }

        if (deletes.length > 0) {
            console.log(`[Deduplication] Deleting ${deletes.length} duplicate clients:`, deletes);
            const { error } = await supabaseClient
                .from('clients')
                .delete()
                .in('client_id', deletes);
                
            if (error) {
                console.error("Error deleting duplicates:", error);
                showToast("Error deleting duplicates: " + error.message);
            } else {
                showToast(`Successfully deleted ${deletes.length} duplicate clients!`);
                await loadDashboardData(); // Refresh list
            }
        } else {
            showToast("No duplicate clients found based on the rules.");
        }
    }

    // SCROLL MEMORY FIX
    async function globalRefresh() {
        const btn = document.getElementById('globalRefreshBtn');
        if(btn) btn.classList.add('animate-spin');
        
        // Clear all client-side cache entries to force fresh server load
        window.supabaseClientCacheMemory = {};
        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const key = localStorage.key(i);
                if (key && (key.startsWith('sb_c_') || key.startsWith('sb_t_keys_'))) {
                    localStorage.removeItem(key);
                }
            }
            console.log("Client-side cache cleared for manual refresh.");
        } catch (e) {
            console.warn("Failed to clear localStorage during manual refresh:", e);
        }
        
        const start = performance.now();
        window.updatePerfBadge('Refreshing...', 'info');
        
        let activeView = 'view-dashboard';
        let activeContainer = null;
        
        const views = document.querySelectorAll('div[id^="view-"]');
        views.forEach(v => {
            if(!v.classList.contains('hidden')) {
                activeView = v.id;
                activeContainer = v;
            }
        });

        // 1. Snapshot scroll position
        const currentScrollPos = activeContainer ? activeContainer.scrollTop : 0;

        await refreshGlobalCache();
        await loadDataForView(activeView);
        
        // 2. Wait longer (150ms) for HTML to fully draw, then restore position
        if (activeContainer) {
            setTimeout(() => {
                activeContainer.scrollTop = currentScrollPos;
            }, 150);
        }
        
        if(btn) btn.classList.remove('animate-spin');
        
        const duration = ((performance.now() - start) / 1000).toFixed(2);
        window.updatePerfBadge(`Refreshed: ${duration}s`, duration < 0.6 ? 'fast' : 'info');
    }

    function switchView(viewId) {
        window.currentActiveViewId = viewId;
        
        // Clear due/overdue filters when switching view normally, unless it was just set
        if (!window.keepDueFiltersOnce) {
            window.gstDueFilterStatus = 'all';
            window.tdsDueFilterStatus = 'all';
            window.auditDueFilterStatus = 'all';
            window.customTasksDueFilterStatus = 'all';
            window.startupDueFilterStatus = 'all';
            window.debtorsDueFilterStatus = 'all';
            window.itDueFilterStatus = 'all';
            window.pfDueFilterStatus = 'all';
        } else {
            window.keepDueFiltersOnce = false; // consume it
        }
        
        // 0. ADMIN ROUTING SECURITY CHECK
        if (viewId === 'view-admin-dashboard') {
            const isAdmin = currentUser && (currentUser.role === 'Admin' || currentUser.name === 'Mayank');
            if (!isAdmin) {
                showToast("Access Denied: Admin Dashboard is restricted to administrators.");
                return;
            }
        }

        // 1. THE BOUNCER: Check if user has permission
        if (currentUser && currentUser.name !== "Mayank" && currentUser.role !== "Admin") {
            const myPerms = currentUser.permissions || [];
            
            // If the viewId isn't in their list, and it's not the default dashboard, block them!
            if (!myPerms.includes(viewId) && viewId !== 'view-dashboard' && viewId !== 'view-excel-import-preview') {
                showToast("Access Denied: You do not have permission to view this module.");
                return; // Stop the function here, don't load the page
            }
        }

        // 2. STANDARD ROUTING
        const allViews = document.querySelectorAll('div[id^="view-"]');
        allViews.forEach(v => v.classList.add('hidden'));
        
        const target = document.getElementById(viewId);
        if(target) target.classList.remove('hidden');
        setActiveNavButton(viewId);
        closeSidebar();
        
        loadDataForView(viewId);
        
        // Clear global search when switching views

    async function updatePin() {

    function getGstinDisplay(gstin) {
        if (!gstin) return '-';
        try {
            const json = JSON.parse(gstin);
            let display = json.gst || '';
            if (json.no_gst === true) display = 'No GST';
            if (json.udyam) {
                if (display && display !== 'No GST') {
                    display += ` / Udyam: ${json.udyam}`;
                } else {

                }
            }
            return display || '-';
        } catch (e) {

        }

    window.handleLogoUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return window.removeFirmLogo();
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Resize if too large
                const MAX_WIDTH = 300;
                const MAX_HEIGHT = 300;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH || height > MAX_HEIGHT) {
                    if (width > height) { height = Math.round((height *= MAX_WIDTH / width)); width = MAX_WIDTH; } 
                    else { width = Math.round((width *= MAX_HEIGHT / height)); height = MAX_HEIGHT; }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                const dataUrl = canvas.toDataURL('image/webp', 0.85); // Use webp for compression
                document.getElementById('settingsFirmLogoBase64').value = dataUrl;
                document.getElementById('settingsFirmLogoPreview').src = dataUrl;
                document.getElementById('settingsFirmLogoPreviewContainer').classList.remove('hidden');
                document.getElementById('settingsFirmLogoRemoveBtn').classList.remove('hidden');
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    window.handleQrUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return window.removeFirmQr();
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Resize if too large
                const MAX_WIDTH = 500;
                const MAX_HEIGHT = 500;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH || height > MAX_HEIGHT) {
                    if (width > height) { height = Math.round((height *= MAX_WIDTH / width)); width = MAX_WIDTH; } 
                    else { width = Math.round((width *= MAX_HEIGHT / height)); height = MAX_HEIGHT; }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                
                // Fill white background just in case of transparency causing issues with some scanners
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                
                const dataUrl = canvas.toDataURL('image/png'); // Use lossless png for QR codes
                document.getElementById('settingsFirmQrBase64').value = dataUrl;
                document.getElementById('settingsFirmQrPreview').src = dataUrl;
                document.getElementById('settingsFirmQrPreviewContainer').classList.remove('hidden');
                document.getElementById('settingsFirmQrRemoveBtn').classList.remove('hidden');
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
