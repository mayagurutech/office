            const { data: dbAssignments } = await supabaseClient.from('client_assignments')
                .select('*').eq('maker_id', currentUser.id);
            myAssignments = dbAssignments || [];

            if (myAssignments && myAssignments.length > 0) {
                
                // Fetch GST data, Ledger Balances, Audit Followup Logs, TDS Tracking, Page Visibility and Subsidies in parallel
                const currentTdsPeriod = window.getCurrentTdsPeriod ? window.getCurrentTdsPeriod() : '';
                const todayForIT = new Date();
                const itYear = todayForIT.getFullYear();
                const itMonth = todayForIT.getMonth();
                const activeStartYear = (itMonth >= 3) ? itYear : (itYear - 1);
                const endYearShort = (activeStartYear + 1).toString().slice(-2);
                const targetITPeriod = `AY_${activeStartYear}_${endYearShort}`;
                
                const todayDateForTarget = new Date();
                const prevMonthForTarget = new Date(todayDateForTarget.getFullYear(), todayDateForTarget.getMonth() - 1, 1);
                const targetPeriod = `${prevMonthForTarget.getFullYear()}-${(prevMonthForTarget.getMonth() + 1).toString().padStart(2, '0')}`;

                // Fetch all IT logs with pagination to prevent Supabase 1000-row cutoff
                const fetchDashboardITLogs = async () => {
                    let allLogs = [];
                    let from = 0;
                    const step = 1000;
                    let hasMore = true;
                    while (hasMore) {
                        const { data, error } = await supabaseClient
                            .from('task_logs')
                            .select('client_id, note, timestamp')
                            .or('note.ilike.%[IT_LOG]%,note.ilike.%[IT_FOLLOWUP]%,note.ilike.%[IT_TRACKING]%')
                            .order('timestamp', { ascending: true })
                            .order('log_id', { ascending: true })
                            .range(from, from + step - 1);
                        if (error) {
                            console.error("Dashboard IT logs fetch error:", error);
                            break;
                        }
                        if (data && data.length > 0) {
                            allLogs = allLogs.concat(data);
                            if (data.length < step) hasMore = false;
                            else from += step;
                        } else {
                            hasMore = false;
                        }
                    }
                    return allLogs;
                };

                const [gstRes, ledgerRes, auditFollowupRes, tdsTrackingRes, pageVisRes, subsidiesListRes, itLogs, pfLogsRes] = await Promise.all([
                    supabaseClient.from('gst_tracking').select('*'),
                    supabaseClient.from('tally_ledgers').select('ledger_id, current_balance, next_followup, tally_ledger_name'),
                    fetchAllRows((from, to) => supabaseClient.from('task_logs').select('client_id, note').ilike('note', '%[AUDIT_FOLLOWUP]%').order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
                    currentTdsPeriod ? supabaseClient.from('tds_tracking').select('client_id, return_filed_status, form_16_status, billed_status').eq('period', currentTdsPeriod) : Promise.resolve({ data: [] }),
                    supabaseClient.from('page_visibility_settings').select('*'),
                    supabaseClient.from('client_subsidies').select('subsidy_name'),
                    fetchDashboardITLogs(),
                    fetchAllRows((from, to) => supabaseClient.from('task_logs').select('client_id, note').or('note.ilike.%[PFESIC_LOG]%,note.ilike.%[PFESIC_FOLLOWUP]%,note.ilike.%[PF_LOG]%,note.ilike.%[PF_TRACKING]%').order('log_id').range(from, to))
                ]);
                
                const gstData = gstRes.data;
                const tallyLedgers = ledgerRes.data || [];
                const auditFollowupLogs = auditFollowupRes.data || [];
                enrolledAuditServices = pageVisRes.data ? (pageVisRes.data.find(p => p.page_id === 'view-audits')?.enrolled_services || []) : [];
                const enrolledITServices = pageVisRes.data ? (pageVisRes.data.find(p => p.page_id === 'view-income-tax')?.enrolled_services || []) : [];
                const subsidyNames = new Set((subsidiesListRes.data || []).map(s => s.subsidy_name));

                const itCommentsMap = {};
                const itFollowupMap = {};
                const itP1 = targetITPeriod;
                const itP2 = targetITPeriod.replace('AY_', 'AY ');
                const itP3 = targetITPeriod.replace('AY_', 'AY ').replace('_', '-');

                (itLogs || []).forEach(log => {
                    if (!log.note.includes(`|${itP1}|`) && !log.note.includes(`|${itP2}|`) && !log.note.includes(`|${itP3}|`)) {
                        return;
                    }
                    if (log.note.startsWith('[IT_LOG]')) {
                        const payload = log.note.replace('[IT_LOG] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const colKey = parts[2];
                            const statusVal = parts[3];
                            const textRemark = parts[4] || '';
                            
                            if (statusVal === 'Filed') {
                                itCommentsMap[cId] = 'Filed';
                            } else if (colKey === 'comment') {
                                if (statusVal && statusVal !== 'Completed' && statusVal !== 'Reverted to Pending') {
                                    itCommentsMap[cId] = statusVal;
                                } else if (textRemark && textRemark !== 'Completed' && textRemark !== 'Reverted to Pending') {
                                    if (itCommentsMap[cId] !== 'Filed') {
                                        itCommentsMap[cId] = textRemark;
                                    }
                                }
                            } else if (colKey !== 'billStatus' && textRemark && textRemark !== 'Completed' && textRemark !== 'Reverted to Pending') {
                                if (itCommentsMap[cId] !== 'Filed') {
                                    itCommentsMap[cId] = textRemark;
                                }
                            }
                        }
                    } else if (log.note.startsWith('[IT_TRACKING]')) {
                        const payload = log.note.replace('[IT_TRACKING] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const returnStatus = parts[3] || 'Pending';
                            if (returnStatus === 'Done' || returnStatus === 'Filed') {
                                itCommentsMap[cId] = 'Filed';
                            }
                        }
                    } else if (log.note.startsWith('[IT_FOLLOWUP]')) {
                        const payload = log.note.replace('[IT_FOLLOWUP] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 3) {
                            const cId = parts[0];
                            const fDate = parts[2];
                            itFollowupMap[cId] = fDate;
                        }
                    }
                });

                // Build TDS tracking map for the current period
                const tdsTrackingMap = {};
                (tdsTrackingRes.data || []).forEach(r => { tdsTrackingMap[r.client_id] = r; });
                
                // Build PF & ESIC tracking map
                const pfTrackingMap = {};
                const pfFollowupMap = {};

                (pfLogsRes.data || []).forEach(log => {
                    if (log.note.startsWith('[PFESIC_LOG]')) {
                        const parts = log.note.replace('[PFESIC_LOG] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const field = parts[2];
                            const status = parts[3];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId][field] = status;
                        }
                    } else if (log.note.startsWith('[PFESIC_FOLLOWUP]')) {
                        const parts = log.note.replace('[PFESIC_FOLLOWUP] ', '').split('|');
                        if (parts.length >= 3) {
                            const cId = parts[0];
                            const fDate = parts[2];
                            pfFollowupMap[cId] = fDate;
                        }
                    } else if (log.note.startsWith('[PF_LOG]')) {
                        const parts = log.note.replace('[PF_LOG] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const fieldMap = { challanStatus: 'pfChallan', returnStatus: 'pfReturn' };
                            const field = fieldMap[parts[2]] || parts[2];
                            const status = parts[3];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId][field] = status;
                        }
                    } else if (log.note.startsWith('[PF_TRACKING]')) {
                        const parts = log.note.replace('[PF_TRACKING] ', '').split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            if (!pfTrackingMap[cId]) pfTrackingMap[cId] = {};
                            pfTrackingMap[cId].pfChallan = parts[2] || 'Pending';
                            pfTrackingMap[cId].pfReturn = parts[3] || 'Pending';
                        }
                    }
                });
                
                // Pre-calculate outstanding ledger balances and properties directly
                let ledgerBalances = {};
                let ledgerFollowupMap = {};
                let ledgerNamesMap = {};
                let latestAuditFollowupMap = {}; // To track latest follow-up date for audit
                
                auditFollowupLogs.forEach(log => {
                    if (log.note && !latestAuditFollowupMap[log.client_id]) {
                        const match = log.note.match(/\[AUDIT_FOLLOWUP\] Date: (.*?)(?:\s*\||$)/);
                        if (match) {
                            latestAuditFollowupMap[log.client_id] = match[1];
                        }
                    }
                });
                
                tallyLedgers.forEach(ledger => {
                    const balStr = String(ledger.current_balance || '0');
                    const balVal = parseFloat(balStr.replace(/[^0-9.-]+/g, "")) || 0;
                    ledgerBalances[ledger.ledger_id] = balVal;
                    ledgerNamesMap[ledger.ledger_id] = ledger.tally_ledger_name || 'Unknown Debtor';
                    if (ledger.next_followup) {
                        ledgerFollowupMap[ledger.ledger_id] = ledger.next_followup;
                    }
                });
                
                // targetPeriod is already defined above

                myAssignments.forEach(a => {
                    if (a.service_type === 'Debtor Recovery') {
                        const lid = a.client_id; // ledger_id is stored in client_id
                        const totalOwed = ledgerBalances[lid] || 0;
                        const ledgerName = ledgerNamesMap[lid] || 'Unknown Debtor';
                        
                        if (totalOwed > 0) {
                            myDebtorCount++;
                            console.log(`DASHBOARD_DEBTOR_DEBUG: Ledger="${ledgerName}" Balance=₹${totalOwed} Maker=${a.maker_id}`);
                            validTotalTasks++; 
                            window.globalMasterScoreDetails.push({
                                type: 'debtor',
                                clientName: ledgerName,
                                serviceName: 'Debtor Recovery',
                                status: 'Pending',
                                details: `Outstanding: ₹${totalOwed.toLocaleString('en-IN')}`,
                                pageName: 'Debtor Recovery',
                                viewName: 'view-debtors'
                            });
                            
                            pendingWorkIds.add(`debtor:${lid}`);
                            const fDate = ledgerFollowupMap[lid];
                            const isOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                            if (isOverdue) debtorOverdue++; else debtorDue++;
                            window.globalDashboardPulsePendingDetails.push({
                                id: `debtor:${lid}`,
                                clientName: ledgerName,
                                serviceName: 'Debtor Recovery',
                                pageName: 'Debtor Recovery',
                                viewName: 'view-debtors',
                                isOverdue: isOverdue,
                                ledgerId: lid,
                                type: 'debtor'
                            });

                            if (a.maker_id === currentUser.id) {
                                if (fDate) {
                                    const dObj = new Date(fDate);
                                    const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                    const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                                    
                                    if (diffDays <= 0) {
                                        if (diffDays < 0) firmOverdue++;
                                        if (diffDays === 0) firmToday++;
                                        
                                        topPriorities.push({
                                            task_id: `debtor:${lid}`,
                                            task_name: `Debtor Collection Follow-up`,
                                            clientName: ledgerName,
                                            serviceName: 'Debtor Recovery',
                                            diffDays: diffDays
                                        });
                                    }
                                }
                            }
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'debtor',
                                clientName: ledgerName,
                                serviceName: 'Debtor Recovery',
                                status: 'Completed',
                                details: 'Outstanding: ₹0 (Fully Collected)',
                                pageName: 'Debtor Recovery',
                                viewName: 'view-debtors'
                            });
                        }
                        return;
                    }

                    let clientObj = globalClientsList.find(c => c.client_id === a.client_id);
                    if (!clientObj || clientObj.is_active === false) return; // Skip archived

                    const clientServicesStr = clientObj.standard_services ? clientObj.standard_services.toLowerCase() : '';

                    // --- GST BUCKET LOGIC ---
                    if (a.service_type && a.service_type.toLowerCase().includes('gst')) {
                        if (!clientServicesStr.includes('gst')) return; // STRICT FILTER

                        const clientGstRows = gstData ? gstData.filter(r => r.client_id === a.client_id) : [];
                        const trackRecord = clientGstRows.find(r => r.period === targetPeriod) || {};
                        const freq = clientObj.gst_frequency || 'Monthly';
                        const isQuarterly = freq === 'Quarterly';
                        
                        let qMonthIdx = 3;
                        if (targetPeriod) {
                            const [y, mStr] = targetPeriod.split('-');
                            const monthVal = parseInt(mStr);
                            const rem = monthVal % 3;
                            if (rem === 1) qMonthIdx = 1;
                            else if (rem === 2) qMonthIdx = 2;
                            else qMonthIdx = 3;
                        }

                        const dataPending = !trackRecord.is_data && (!isQuarterly || qMonthIdx === 3);
                        const gstr1Pending = !trackRecord.is_gstr1 && (!isQuarterly || qMonthIdx === 3);
                        const gstr3bPending = !trackRecord.is_gstr3b && (!isQuarterly || qMonthIdx === 3);

                        // Tile = sum of all pending steps for this client
                        const pendingStepsForClient = (dataPending ? 1 : 0) + (gstr1Pending ? 1 : 0) + (gstr3bPending ? 1 : 0);
                        myGstCount += pendingStepsForClient;
                        const isGstOverdue = window.isGstPeriodOverdue(targetPeriod) && (!isQuarterly || qMonthIdx === 3);
                        if (isGstOverdue) gstOverdue += pendingStepsForClient; else gstDue += pendingStepsForClient;

                        const caseHasPendingWork = pendingStepsForClient > 0;
                        let gstDetailsText = [];
                        if (!dataPending) gstDetailsText.push('Data Received'); else gstDetailsText.push('Data Pending');
                        if (!gstr1Pending) gstDetailsText.push('GSTR-1 Filed'); else gstDetailsText.push('GSTR-1 Pending');
                        if (!gstr3bPending) gstDetailsText.push('GSTR-3B Filed'); else gstDetailsText.push('GSTR-3B Pending');

                        if (caseHasPendingWork) {
                            pendingWorkIds.add(`gst:${a.client_id}`); // Track for Pulse
                            window.globalDashboardPulsePendingDetails.push({
                                id: `gst:${a.client_id}`,
                                clientName: clientObj.display_name,
                                serviceName: 'GST Return',
                                pageName: 'GST Center',
                                viewName: 'view-gst-center',
                                isOverdue: isGstOverdue,
                                clientId: a.client_id,
                                period: targetPeriod,
                                type: 'gst'
                            });
                            
                            if (targetPeriod) {
                                const [y, m] = targetPeriod.split('-').map(Number);
                                const dueDate = new Date(y, m, 20);
                                const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                const diffDays = Math.ceil((dueDate - todayObj) / (1000 * 60 * 60 * 24));
                                
                                if (diffDays <= 0) {
                                    if (diffDays < 0) firmOverdue++;
                                    else if (diffDays === 0) firmToday++;
                                    
                                    topPriorities.push({
                                        task_id: `gst:${a.client_id}:${targetPeriod}`,
                                        task_name: `GST Return Filing (${targetPeriod})`,
                                        clientName: clientObj.display_name,
                                        serviceName: 'GST Return',
                                        diffDays: diffDays
                                    });
                                }
                            }

                            const waitingOnClient = dataPending; 
                            if (!waitingOnClient) {
                                validTotalTasks++; 
                                window.globalMasterScoreDetails.push({
                                    type: 'gst',
                                    clientName: clientObj.display_name,
                                    serviceName: 'GST Return',
                                    status: 'Pending',
                                    details: `Period: ${targetPeriod} | ${gstDetailsText.join(', ')}`,
                                    pageName: 'GST Center',
                                    viewName: 'view-gst-center'
                                });
                            } else {
                                window.globalMasterScoreDetails.push({
                                    type: 'gst',
                                    clientName: clientObj.display_name,
                                    serviceName: 'GST Return',
                                    status: 'Completed',
                                    details: `Period: ${targetPeriod} | Waiting on Client (Excluded)`,
                                    pageName: 'GST Center',
                                    viewName: 'view-gst-center'
                                });
                            }
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'gst',
                                clientName: clientObj.display_name,
                                serviceName: 'GST Return',
                                status: 'Completed',
                                details: `Period: ${targetPeriod} | ${gstDetailsText.join(', ')}`,
                                pageName: 'GST Center',
                                viewName: 'view-gst-center'
                            });
                        }
                    } else if (a.service_type && a.service_type.toLowerCase().includes('tds')) {
                        if (!clientServicesStr.includes('tds')) return; // STRICT FILTER

                        const tdsTrack = tdsTrackingMap[a.client_id] || {};
                        const returnStatus = tdsTrack.return_filed_status || 'Pending';
                        const isNilReturn = returnStatus === 'NIL';

                        // Count individual pending task-steps (matching TDS page stat tiles)
                        if (!isNilReturn) {
                            const filingPending = returnStatus !== 'Done';
                            const form16Status = tdsTrack.form_16_status || 'Pending';
                            const form16Pending = form16Status !== 'Done' && form16Status !== 'NIL';
                            const billedStatus = tdsTrack.billed_status || 'Pending';
                            const billingPending = billedStatus !== 'Done' && billedStatus !== 'NIL';

                            // Tile = sum of all pending steps for this client
                            const pendingStepsForClient = (filingPending ? 1 : 0) + (form16Pending ? 1 : 0) + (billingPending ? 1 : 0);
                            myTdsCount += pendingStepsForClient;
                            const isTdsOverdue = window.isTdsPeriodOverdue(currentTdsPeriod);
                            if (isTdsOverdue) tdsOverdue += pendingStepsForClient; else tdsDue += pendingStepsForClient;

                            // Pulse = unique client/case with any pending step
                            const caseHasPendingWork = filingPending || form16Pending || billingPending;
                            if (caseHasPendingWork) {
                                pendingWorkIds.add(`tds:${a.client_id}`);
                                window.globalDashboardPulsePendingDetails.push({
                                    id: `tds:${a.client_id}`,
                                    clientName: clientObj.display_name,
                                    serviceName: 'TDS Return',
                                    pageName: 'TDS Returns',
                                    viewName: 'view-tds-center',
                                    isOverdue: window.isTdsPeriodOverdue(currentTdsPeriod),
                                    clientId: a.client_id,
                                    period: currentTdsPeriod,
                                    type: 'tds'
                                });

                                if (currentTdsPeriod) {
                                    const match = currentTdsPeriod.match(/(\d{4})-\d{2}\s+Q(\d)/);
                                    if (match) {
                                        const year = parseInt(match[1]);
                                        const quarter = parseInt(match[2]);
                                        let dueDate;
                                        if (quarter === 1) dueDate = new Date(year, 6, 31);
                                        else if (quarter === 2) dueDate = new Date(year, 9, 31);
                                        else if (quarter === 3) dueDate = new Date(year + 1, 0, 31);
                                        else if (quarter === 4) dueDate = new Date(year + 1, 4, 31);
                                        
                                        const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                        const diffDays = Math.ceil((dueDate - todayObj) / (1000 * 60 * 60 * 24));
                                        
                                        if (diffDays <= 0) {
                                            if (diffDays < 0) firmOverdue++;
                                            else if (diffDays === 0) firmToday++;
                                            
                                            let taskName = `TDS Return Filing (${currentTdsPeriod})`;
                                            if (!filingPending && form16Pending) {
                                                taskName = `TDS Form 16 Issuance (${currentTdsPeriod})`;
                                            } else if (!filingPending && !form16Pending && billingPending) {
                                                taskName = `TDS Return Billing (${currentTdsPeriod})`;
                                            }
                                            
                                            topPriorities.push({
                                                task_id: `tds:${a.client_id}:${currentTdsPeriod}`,
                                                task_name: taskName,
                                                clientName: clientObj.display_name,
                                                serviceName: 'TDS Return',
                                                diffDays: diffDays
                                            });
                                        }
                                    }
                                }
                            }

                            // Master Score
                            validTotalTasks++;
                            if (!caseHasPendingWork) {
                                completedTasks++;
                                window.globalMasterScoreDetails.push({
                                    type: 'tds',
                                    clientName: clientObj.display_name,
                                    serviceName: 'TDS Return',
                                    status: 'Completed',
                                    details: `Period: ${currentTdsPeriod || 'N/A'} | Filed: ${returnStatus}, Form 16: ${form16Status}, Billed: ${billedStatus}`,
                                    pageName: 'TDS Returns',
                                    viewName: 'view-tds-center'
                                });
                            } else {
                                window.globalMasterScoreDetails.push({
                                    type: 'tds',
                                    clientName: clientObj.display_name,
                                    serviceName: 'TDS Return',
                                    status: 'Pending',
                                    details: `Period: ${currentTdsPeriod || 'N/A'} | Filed: ${returnStatus}, Form 16: ${form16Status}, Billed: ${billedStatus}`,
                                    pageName: 'TDS Returns',
                                    viewName: 'view-tds-center'
                                });
                            }
                        }
                        // NIL return clients: fully done, excluded from tile & pulse
                    } else if (
                        a.service_type === 'Audit Status' || 
                        (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                        (enrolledAuditServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
                    ) {
                        const hasAuditService = enrolledAuditServices.some(as => clientServicesStr.includes(as.toLowerCase())) || clientServicesStr.includes('audit');
                        if (!hasAuditService) return; // STRICT FILTER
                        // Audit logic
                        if (clientObj.audit_status !== 'Completed') {
                            myAuditCount++;
                            const isAuditOverdue = latestAuditFollowupMap[a.client_id] ? (new Date(latestAuditFollowupMap[a.client_id]) < new Date().setHours(0,0,0,0)) : false;
                            if (isAuditOverdue) auditOverdue++; else auditDue++;
                            validTotalTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'audit',
                                clientName: clientObj.display_name,
                                serviceName: 'Audit Status',
                                status: 'Pending',
                                details: `Status: ${clientObj.audit_status || 'Pending'}`,
                                pageName: 'Audits',
                                viewName: 'view-audits'
                            });
                            
                            pendingWorkIds.add(`audit:${a.client_id}`);
                            window.globalDashboardPulsePendingDetails.push({
                                id: `audit:${a.client_id}`,
                                clientName: clientObj.display_name,
                                serviceName: 'Audit Status',
                                pageName: 'Audits',
                                viewName: 'view-audits',
                                isOverdue: latestAuditFollowupMap[a.client_id] ? (new Date(latestAuditFollowupMap[a.client_id]) < new Date().setHours(0,0,0,0)) : false,
                                clientId: a.client_id,
                                type: 'audit'
                            });
                            
                            // Audit follow-up priority check
                            const fDate = latestAuditFollowupMap[a.client_id];
                            if (fDate) {
                                const dObj = new Date(fDate);
                                const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                                
                                if (diffDays <= 0) {
                                    firmOverdue++;
                                    if (diffDays === 0) firmToday++;
                                    
                                    topPriorities.push({
                                        task_id: `audit:${a.client_id}`,
                                        task_name: `Audit Status Follow-up`,
                                        clientName: clientObj.display_name,
                                        serviceName: 'Audit Status',
                                        diffDays: diffDays
                                    });
                                }
                            }
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'audit',
                                clientName: clientObj.display_name,
                                serviceName: 'Audit Status',
                                status: 'Completed',
                                details: `Status: Completed`,
                                pageName: 'Audits',
                                viewName: 'view-audits'
                            });
                        }
                    } else if (
                        a.service_type && 
                        (a.service_type.toLowerCase().includes('income tax') || 
                         a.service_type.toLowerCase() === 'it' || 
                         a.service_type.toLowerCase().includes('itr') ||
                         enrolledITServices.some(as => a.service_type.toLowerCase() === as.toLowerCase()))
                    ) {
                        // STRICT FILTER: same enrollment check as the Income Tax Center (skips removed compliances)
                        const itServicesToCheck = [a.service_type, ...enrolledITServices];
                        if (!itServicesToCheck.some(s => window.isClientVisibleForPeriod(clientObj, s, targetITPeriod, 'yearly'))) return;

                        const commentStatus = itCommentsMap[a.client_id] || '';
                        const filingPending = commentStatus !== 'Filed';

                        if (filingPending) {
                            myITCount++;
                            const todayObj = new Date(new Date().toISOString().split('T')[0]);
                            const dueDate = new Date(activeStartYear, 6, 31, 23, 59, 59); // July 31st of activeStartYear
                            
                            // A follow-up date, when set, supersedes the statutory due date
                            const fDate = itFollowupMap[a.client_id] || '';
                            const effectiveDate = fDate ? new Date(fDate) : dueDate;

                            const isItOverdue = fDate ? (effectiveDate < todayObj) : (todayObj > dueDate);
                            if (isItOverdue) itOverdue++; else itDue++;

                            validTotalTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'it',
                                clientName: clientObj.display_name,
                                serviceName: 'Income Tax',
                                status: 'Pending',
                                details: `Period: ${targetITPeriod.replace('AY_', 'AY ')} | Status: ${commentStatus || 'Pending'}`,
                                pageName: 'Income Tax Center',
                                viewName: 'view-income-tax'
                            });

                            pendingWorkIds.add(`it:${a.client_id}`);
                            window.globalDashboardPulsePendingDetails.push({
                                id: `it:${a.client_id}`,
                                clientName: clientObj.display_name,
                                serviceName: 'Income Tax',
                                pageName: 'Income Tax Center',
                                viewName: 'view-income-tax',
                                isOverdue: isItOverdue,
                                clientId: a.client_id,
                                period: targetITPeriod,
                                type: 'it'
                            });

                            // ITR priority check
                            const diffDays = Math.ceil((effectiveDate - todayObj) / (1000 * 60 * 60 * 24));
                            if (diffDays <= 0) {
                                if (diffDays < 0) firmOverdue++;
                                else if (diffDays === 0) firmToday++;

                                topPriorities.push({
                                    task_id: `it:${a.client_id}:${targetITPeriod}`,
                                    task_name: `Income Tax Return Filing (${targetITPeriod.replace('AY_', 'AY ')})`,
                                    clientName: clientObj.display_name,
                                    serviceName: 'Income Tax',
                                    diffDays: diffDays
                                });
                            }
                        } else {
                            validTotalTasks++;
                            completedTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'it',
                                clientName: clientObj.display_name,
                                serviceName: 'Income Tax',
                                status: 'Completed',
                                details: `Period: ${targetITPeriod.replace('AY_', 'AY ')} | Status: Filed`,
                                pageName: 'Income Tax Center',
                                viewName: 'view-income-tax'
                            });
                        }
                    } else if (
                        a.service_type &&
                        (a.service_type === 'PF' || a.service_type === 'ESIC' || a.service_type === 'PF & ESIC')
                    ) {
                        // PF & ESIC tracking
                        const hasPF = clientObj.standard_services ? clientObj.standard_services.toLowerCase().includes('pf') : false;
                        const hasESIC = clientObj.standard_services ? clientObj.standard_services.toLowerCase().includes('esic') : false;
                        
                        const track = pfTrackingMap[a.client_id] || { pfChallan: 'Pending', pfReturn: 'Pending', esicChallan: 'Pending', esicReturn: 'Pending' };
                        const pfOk = !hasPF || (track.pfChallan === 'Done' && track.pfReturn === 'Done');
                        const esicOk = !hasESIC || (track.esicChallan === 'Done' && track.esicReturn === 'Done');
                        const isCompleted = pfOk && esicOk;

                        validTotalTasks++;
                        if (isCompleted) {
                            completedTasks++;
                            window.globalMasterScoreDetails.push({
                                type: 'pf',
                                clientName: clientObj.display_name,
                                serviceName: 'PF & ESIC',
                                status: 'Completed',
                                details: `Period: ${targetPeriod} | Status: Completed`,
                                pageName: 'Pf & ESIC',
                                viewName: 'view-pf-esic'
                            });
                        } else {
                            myPFCount++;
                            const fDate = pfFollowupMap[a.client_id] || '';
                            const isPfOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                            if (isPfOverdue) pfOverdue++; else pfDue++;

                            window.globalMasterScoreDetails.push({
                                type: 'pf',
                                clientName: clientObj.display_name,
                                serviceName: 'PF & ESIC',
                                status: 'Pending',
                                details: `Period: ${targetPeriod} | Status: Pending`,
                                pageName: 'Pf & ESIC',
                                viewName: 'view-pf-esic'
                            });

                            pendingWorkIds.add(`pf:${a.client_id}`);
                            window.globalDashboardPulsePendingDetails.push({
                                id: `pf:${a.client_id}`,
                                clientName: clientObj.display_name,
                                serviceName: 'PF & ESIC',
                                pageName: 'Pf & ESIC',
                                viewName: 'view-pf-esic',
                                isOverdue: isPfOverdue,
                                clientId: a.client_id,
                                period: targetPeriod,
                                type: 'pf'
                            });

                            // Priority check
                            if (fDate) {
                                const dObj = new Date(fDate);
                                const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                                if (diffDays <= 0) {
                                    if (diffDays < 0) firmOverdue++;
                                    else if (diffDays === 0) firmToday++;
                                    
                                    topPriorities.push({
                                        task_id: `pf:${a.client_id}:${targetPeriod}`,
                                        task_name: `PF & ESIC Follow-up`,
                                        clientName: clientObj.display_name,
                                        serviceName: 'PF & ESIC',
                                        diffDays: diffDays
                                    });
                                }
                            }
                        }
                    } else if (a.service_type && !a.service_type.toLowerCase().includes('startup') && !a.service_type.toLowerCase().includes('subsidy') && a.service_type !== 'Debtor Recovery' && !subsidyNames.has(a.service_type) && a.service_type.toLowerCase() !== 'pf' && a.service_type.toLowerCase() !== 'esic' && a.service_type.toLowerCase() !== 'pf & esic') {
                        // Generic Compliances
                        myCompCount++;
                        compDue++;
                        validTotalTasks++;
                        pendingWorkIds.add(`comp:${a.client_id}:${a.service_type}`);
                        
                        let pageName = 'Compliances';
                        let viewName = 'view-compliance';
                        if (a.service_type.toLowerCase() === 'professional tax' || a.service_type.toLowerCase() === 'pt') {
                            pageName = 'Professional Tax Center';
                            viewName = 'view-professional-tax';
                        }
                        
                        window.globalDashboardPulsePendingDetails.push({
                            id: `comp:${a.client_id}:${a.service_type}`,
                            clientName: clientObj.display_name,
                            serviceName: a.service_type,
                            pageName: pageName,
                            viewName: viewName,
                            isOverdue: false, // Default compliance assignments don't have direct assignment-level due dates
                            clientId: a.client_id,
                            type: 'comp'
                        });

                        window.globalMasterScoreDetails.push({
                            type: 'comp',
                            clientName: clientObj.display_name,
                            serviceName: a.service_type,
                            status: 'Pending',
                            details: 'Continuous Compliance tracking',
                            pageName: pageName,
                            viewName: viewName
                        });
                    }

                });
            }
        } catch (e) { console.error("Portfolio Engine Error:", e); }

        // --- 1.5 STARTUP & SUBSIDY ENGINE ---
        let myStartupCount = 0;
        let startupDue = 0, startupOverdue = 0;
        try {
            // Fetch all subsidies and assignments in parallel
            const [subsidiesRes, assignmentsRes] = await Promise.all([
                supabaseClient.from('client_subsidies').select('*'),
                fetchAllRows((from, to) => supabaseClient.from('client_assignments').select('*').order('id').range(from, to))
            ]);
            
            const allSubsidies = subsidiesRes.data || [];
            const allAssignments = assignmentsRes.data || [];
            
            // Filter assignments for the current user
            const myUserAssignments = allAssignments.filter(a => a.maker_id === currentUser.id);
            
            allSubsidies.forEach(sub => {
                const clientObj = globalClientsList.find(c => c.client_id === sub.client_id);
                if (!clientObj || clientObj.is_active === false) return; // Skip archived clients
                
                // Determine if this specific case is assigned to the current user
                const isSpecificAssigned = myUserAssignments.some(a => a.client_id === sub.client_id && a.service_type === sub.subsidy_name);
                const isGenericAssigned = myUserAssignments.some(a => a.client_id === sub.client_id && (a.service_type === 'Startup' || a.service_type === 'Subsidy'));
                
                if (isSpecificAssigned || isGenericAssigned) {
                    const status = sub.status || 'Pending';
                    const isCompleted = status === 'Approved'; // "Approved" means completed/archived
                    
                    if (!isCompleted) {
                        myStartupCount++;
                        const isSubOverdue = sub.next_followup_date ? (new Date(sub.next_followup_date) < new Date().setHours(0,0,0,0)) : false;
                        if (isSubOverdue) startupOverdue++; else startupDue++;
                    }
                    
                    // Connect with master score
                    validTotalTasks++;
                    if (isCompleted) {
                        completedTasks++;
                        window.globalMasterScoreDetails.push({
                            type: 'subsidy',
                            clientName: clientObj.display_name,
                            serviceName: `${sub.subsidy_name} Case`,
                            status: 'Completed',
                            details: `Status: ${status}`,
                            pageName: 'Startup & Subsidy',
                            viewName: 'view-startups-subsidy'
                        });
                    } else {
                        window.globalMasterScoreDetails.push({
                            type: 'subsidy',
                            clientName: clientObj.display_name,
                            serviceName: `${sub.subsidy_name} Case`,
                            status: 'Pending',
                            details: `Status: ${status}`,
                            pageName: 'Startup & Subsidy',
                            viewName: 'view-startups-subsidy'
                        });
                        
                        // Connect with productivity pulse
                        pendingWorkIds.add(`subsidy:${sub.client_id}:${sub.subsidy_name}`);
                        window.globalDashboardPulsePendingDetails.push({
                            id: `subsidy:${sub.client_id}:${sub.subsidy_name}`,
                            clientName: clientObj.display_name,
                            serviceName: `${sub.subsidy_name} Case`,
                            pageName: 'Startup & Subsidy',
                            viewName: 'view-startups-subsidy',
                            isOverdue: sub.next_followup_date ? (new Date(sub.next_followup_date) < new Date().setHours(0,0,0,0)) : false,
                            clientId: sub.client_id,
                            subsidyType: sub.subsidy_name,
                            type: 'subsidy'
                        });
                    }
                    
                    // Connect with critical deadlines / top priorities:
                    // If user cases are past followup date then it should come in top priorities list of dashboard.
                    if (!isCompleted && sub.next_followup_date) {
                        const dObj = new Date(sub.next_followup_date);
                        const todayObj = new Date(new Date().toISOString().split('T')[0]);
                        const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                        
                        if (diffDays <= 0) { // Past or due today
                            firmOverdue++;
                            if (diffDays === 0) {
                                firmToday++;
                            }
                            
                            topPriorities.push({
                                task_id: `subsidy:${sub.id}`,
                                task_name: `${sub.subsidy_name} Follow-up`,
                                clientName: clientObj.display_name,
                                serviceName: 'Startup/Subsidy',
                                diffDays: diffDays
                            });
                        }
                    }
                }
            });
        } catch (e) { console.error("Startup Dashboard Engine Error:", e); }

        // --- 2. EXPLICIT TASKS ENGINE ---
        try {
            const { data: explicitTasks } = await supabaseClient.from('tasks').select('task_id, status, due_date, assigned_to, is_custom, custom_task_name, clients(display_name), services(service_type)');
            if (explicitTasks) {
                explicitTasks.forEach(t => {
                    const isCancelled = t.is_custom && t.custom_task_name && t.custom_task_name.endsWith(' [Cancelled]');
                    if (isCancelled) return;
                    if (t.assigned_to === currentUser.id) {
                        const isCompleted = t.status === 'Completed';
                        const isWaitingOnClient = t.status.toLowerCase().includes('client') || t.status.toLowerCase().includes('hold');
                        
                        // PERFORMANCE CHECK
                        if (!isWaitingOnClient) {
                            validTotalTasks++;
                            const taskName = t.is_custom ? t.custom_task_name : (t.services?.service_type || 'Task');
                            const clientName = t.clients ? t.clients.display_name : 'General Task';
                            
                            if (isCompleted) {
                                completedTasks++;
                                window.globalMasterScoreDetails.push({
                                    type: 'task',
                                    clientName: clientName,
                                    serviceName: taskName,
                                    status: 'Completed',
                                    details: `Status: Completed`,
                                    pageName: 'Custom Tasks',
                                    viewName: 'view-custom-tasks'
                                });
                            } else {
                                window.globalMasterScoreDetails.push({
                                    type: 'task',
                                    clientName: clientName,
                                    serviceName: taskName,
                                    status: 'Pending',
                                    details: `Status: ${t.status || 'Pending'}`,
                                    pageName: 'Custom Tasks',
                                    viewName: 'view-custom-tasks'
                                });
                            }
                            
                            if (!isCompleted) {
                                pendingWorkIds.add(`task:${t.task_id}`);
                                window.globalDashboardPulsePendingDetails.push({
                                    id: `task:${t.task_id}`,
                                    clientName: clientName,
                                    serviceName: taskName,
                                    pageName: 'Custom Tasks',
                                    viewName: 'view-custom-tasks',
                                    isOverdue: t.due_date ? (new Date(t.due_date.split('T')[0]) < new Date().setHours(0,0,0,0)) : false,
                                    taskId: t.task_id,
                                    type: 'task'
                                });
                            }
                        }

                        // TILE COUNTING & PRIORITIES
                        if (!isCompleted) {
                            const isOverdue = t.due_date ? (new Date(t.due_date.split('T')[0]) < new Date().setHours(0,0,0,0)) : false;
                            if (t.services && t.services.service_type) {
                                const stype = t.services.service_type.toLowerCase();
                                if (stype.includes('gst')) {
                                    myGstCount++;
                                    if (isOverdue) gstOverdue++; else gstDue++;
                                }
                                else if (stype.includes('tds')) {
                                    myTdsCount++;
                                    if (isOverdue) tdsOverdue++; else tdsDue++;
                                }
                                else if (stype.includes('audit')) {
                                    myAuditCount++;
                                    if (isOverdue) auditOverdue++; else auditDue++;
                                }
                                else if (stype.includes('income tax') || stype === 'it' || stype.includes('itr')) {
                                    myITCount++;
                                    if (isOverdue) itOverdue++; else itDue++;
                                }
                                else {
                                    myCompCount++;
                                    if (isOverdue) compOverdue++; else compDue++;
                                }
                            }
                            else {
                                myCustomCount++;
                                if (isOverdue) customOverdue++; else customDue++;
                            }

                            // PRIORITY LOGIC
                            if (t.due_date) {
                                const dObj = new Date(t.due_date.split('T')[0]);
                                const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                                
                                if (diffDays <= 0) {
                                    const taskName = t.is_custom ? t.custom_task_name : (t.services?.service_type || 'Task');
                                    topPriorities.push({
                                        ...t,
                                        task_name: taskName,
                                        diffDays: diffDays,
                                        clientName: t.clients ? t.clients.display_name : 'General Task',
                                        serviceName: t.services ? t.services.service_type : 'Custom Task'
                                    });
                                }
                            }
                        }
                    }

                    if (t.status !== 'Completed' && t.due_date) {
                        const isMine = t.assigned_to === currentUser.id || 
                                       (!t.assigned_to && (myAssignments || []).some(a => a.client_id === t.client_id && a.service_type === t.services?.service_type && a.maker_id === currentUser.id));
                        if (isMine) {
                            const dObj = new Date(t.due_date.split('T')[0]);
                            const todayObj = new Date(new Date().toISOString().split('T')[0]);
                            const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                            if (diffDays < 0) firmOverdue++;
                            if (diffDays === 0) firmToday++;
                        }
                    }
                });
            }

            // --- 2.5 USER-SPECIFIC AUDITS & SUBSIDIES ENGINE ---
            const myMakerAssignments = (myAssignments || []).filter(a => a.maker_id === currentUser.id);
            
            // Audits overdue calculation
            const myAuditClientIds = myMakerAssignments
                .filter(a => 
                    a.service_type === 'Audit Status' || 
                    (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                    (enrolledAuditServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
                )
                .map(a => a.client_id);
            
            if (myAuditClientIds.length > 0) {
                const { data: auditFollowupLogs } = await fetchAllRows((from, to) => supabaseClient
                    .from('task_logs')
                    .select('client_id, note, timestamp')
                    .in('client_id', myAuditClientIds)
                    .ilike('note', '%[AUDIT_FOLLOWUP]%')
                    .order('timestamp', { ascending: false })
                    .order('log_id', { ascending: false })
                    .range(from, to));
                    
                const auditFollowupMap = {};
                if (auditFollowupLogs) {
                    auditFollowupLogs.forEach(log => {
                        if (log.note && !auditFollowupMap[log.client_id]) {
                            const match = log.note.match(/\[AUDIT_FOLLOWUP\] Date: (.*?)(?:\s*\||$)/);
                            if (match) {
                                auditFollowupMap[log.client_id] = match[1];
                            }
                        }
                    });
                }
                
                myAuditClientIds.forEach(clientId => {
                    const clientObj = globalClientsList.find(c => c.client_id === clientId);
                    if (clientObj && clientObj.is_active !== false && clientObj.audit_status !== 'Completed') {
                        const followupDate = auditFollowupMap[clientId];
                        if (followupDate) {
                            const dObj = new Date(followupDate);
                            const todayObj = new Date(new Date().toISOString().split('T')[0]);
                            const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                            if (diffDays < 0) firmOverdue++;
                            if (diffDays === 0) firmToday++;
                        }
                    }
                });
            }

            // Subsidies overdue calculation
            const mySubsidyAssignments = myMakerAssignments.filter(a => 
                a.service_type && (
                    a.service_type.toLowerCase().includes('startup') || 
                    a.service_type.toLowerCase().includes('subsidy')
                )
            );
            const mySubsidyClientIds = mySubsidyAssignments.map(a => a.client_id);
            
            if (mySubsidyClientIds.length > 0) {
                const { data: mySubsidiesData } = await supabaseClient
                    .from('client_subsidies')
                    .select('*')
                    .in('client_id', mySubsidyClientIds);
                    
                if (mySubsidiesData) {
                    mySubsidiesData.forEach(sub => {
                        const isAssigned = mySubsidyAssignments.some(a => a.client_id === sub.client_id && a.service_type === sub.subsidy_name);
                        if (isAssigned && sub.status !== 'Approved' && sub.status !== 'Filed' && sub.status !== 'Completed') {
                            if (sub.next_followup_date) {
                                const dObj = new Date(sub.next_followup_date);
                                const todayObj = new Date(new Date().toISOString().split('T')[0]);
                                const diffDays = Math.ceil((dObj - todayObj) / (1000 * 60 * 60 * 24));
                                if (diffDays < 0) firmOverdue++;
                                if (diffDays === 0) firmToday++;
                            }
                        }
                    });
                }
            }

            // Render Top Priorities
            const priorityContainer = document.getElementById('dash-top-priorities');
            if (priorityContainer) {
                if (topPriorities.length > 0) {
                    // Sort by urgency (most overdue first)
                    topPriorities.sort((a, b) => a.diffDays - b.diffDays);
                    
                    let priorityHtml = '';
                    topPriorities.slice(0, 5).forEach(p => {
                        const dateLabel = p.diffDays < 0 ? `${Math.abs(p.diffDays)}d Overdue` : 'Due Today';
                        const colorClass = p.diffDays < 0 ? 'bg-red-50 text-red-700 border-red-100' : 'bg-amber-50 text-amber-700 border-amber-100';
                        
                        const safeTaskId = (p.task_id || p.id || '').toString().replace(/'/g, "\\'");
                        const safeClientName = (p.clientName || '').replace(/'/g, "\\'");
                        const safeServiceName = (p.serviceName || '').replace(/'/g, "\\'");
                        const safeTaskName = (p.task_name || '').replace(/'/g, "\\'");
                        
                        priorityHtml += `
                            <div onclick="navigateFromPriority('${safeTaskId}', '${safeClientName}', '${safeServiceName}', '${safeTaskName}')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between group hover:border-indigo-200 transition-all cursor-pointer hover:shadow-md">
                                <div class="flex-1 min-w-0">
                                    <h5 class="text-xs font-black text-slate-800 truncate">${p.task_name}</h5>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter truncate">${p.clientName} • ${p.serviceName}</p>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider border ${colorClass} ml-3 whitespace-nowrap">${dateLabel}</span>
                            </div>
                        `;
                    });
                    priorityContainer.innerHTML = priorityHtml;
                } else {
                    priorityContainer.innerHTML = `
                        <div class="bg-white p-8 rounded-2xl border border-dashed border-slate-200 flex flex-col items-center justify-center text-center h-full">
                            <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center mb-3"><i class="fa-solid fa-check"></i></div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-tight">You're all caught up!</p>
                            <p class="text-[10px] text-slate-400 mt-1">No urgent deadlines pending.</p>
                        </div>
                    `;
                }
            }

        } catch (e) { console.error("Tasks Engine Error:", e); }

        // --- 3. TODAY's PULSE (Daily Rating) ---
        let updatedCount = 0;
        let totalCount = pendingWorkIds.size;
        let todayGrade = "C";
        let gradeColor = "text-amber-500";
        try {
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const todayISO = todayStart.toISOString();

            // Fetch Task Logs, Debtor Logs, and TDS Logs in parallel
            const [taskLogsRes, debtorLogsRes, tdsLogsRes] = await Promise.all([
                supabaseClient.from('task_logs').select('task_id, client_id, note, bank_status, sales_status, ledger_status, others_status').eq('user_id', currentUser.id).gte('timestamp', todayISO),
                supabaseClient.from('follow_up_logs').select('ledger_id, notes').eq('user_id', currentUser.id).gte('timestamp', todayISO),
                supabaseClient.from('task_history').select('client_id, note').eq('user_id', currentUser.id).gte('timestamp', todayISO).eq('task_type', 'TDS')
            ]);

            let updatedIds = new Set();

            if (taskLogsRes.data) {
                taskLogsRes.data.forEach(l => { 
                    // 1. Task check
                    if (l.task_id && pendingWorkIds.has(`task:${l.task_id}`)) {
                        const key = `task:${l.task_id}`;
                        if (!updatedIds.has(key)) {
                            updatedIds.add(key);
                            const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                            if (detail) {
                                window.globalDashboardPulseUpdatedDetails.push({
                                    ...detail,
                                    logNote: l.note
                                });
                            }
                        }
                    }

                    // 2. GST check — any activity today on this client counts as acknowledged
                    const gstKey = `gst:${l.client_id}`;
                    if (pendingWorkIds.has(gstKey) && !updatedIds.has(gstKey)) {
                        updatedIds.add(gstKey);
                        const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === gstKey);
                        if (detail) {
                            window.globalDashboardPulseUpdatedDetails.push({
                                ...detail,
                                logNote: l.note
                            });
                        }
                    }

                    // 3. Audit check
                    if (l.note && (l.bank_status !== null || l.sales_status !== null || l.ledger_status !== null || l.others_status !== null || l.note.includes('[AUDIT_FOLLOWUP]') || l.note.includes('Audit status') || l.note.includes('[Acknowledged Today]'))) {
                        const key = `audit:${l.client_id}`;
                        if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                            updatedIds.add(key);
                            const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                            if (detail) {
                                window.globalDashboardPulseUpdatedDetails.push({
                                    ...detail,
                                    logNote: l.note
                                });
                            }
                        }
                    }

                    // 4. Subsidy checklist updates (CAT:)
                    if (l.note && l.note.includes('|')) {
                        const parts = l.note.split('|');
                        const catPart = parts.find(p => p.includes('CAT:'));
                        if (catPart) {
                            const cat = catPart.split('CAT:')[1].trim();
                            const key = `subsidy:${l.client_id}:${cat}`;
                            if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                                updatedIds.add(key);
                                const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                                if (detail) {
                                    window.globalDashboardPulseUpdatedDetails.push({
                                        ...detail,
                                        logNote: l.note
                                    });
                                }
                            }
                        }
                    }

                    // 5. Subsidy general case updates
                    if (l.note && l.note.includes('[StartupSubsidyUpdate::')) {
                        const cat = l.note.split('[StartupSubsidyUpdate::')[1].split(']')[0];
                        const key = `subsidy:${l.client_id}:${cat}`;
                        if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                            updatedIds.add(key);
                            const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                            if (detail) {
                                window.globalDashboardPulseUpdatedDetails.push({
                                    ...detail,
                                    logNote: l.note
                                });
                            }
                        }
                    }

                    // 6. Subsidy case acknowledgements
                    if (l.note && l.note.includes('[Acknowledged Today]') && l.note.includes('Subsidy type:')) {
                        const match = l.note.match(/Subsidy type: (.*?) acknowledged/);
                        if (match) {
                            const subsidyType = match[1];
                            const key = `subsidy:${l.client_id}:${subsidyType}`;
                            if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                                updatedIds.add(key);
                                const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                                if (detail) {
                                    window.globalDashboardPulseUpdatedDetails.push({
                                        ...detail,
                                        logNote: l.note
                                    });
                                }
                            }
                        }
                    }

                    // 6.5 PF & ESIC check
                    const pfKey = `pf:${l.client_id}`;
                    if (pendingWorkIds.has(pfKey) && !updatedIds.has(pfKey)) {
                        if (l.note.startsWith('[PFESIC_LOG]') || l.note.startsWith('[PFESIC_FOLLOWUP]') || l.note.startsWith('[PF_LOG]') || l.note.startsWith('[PF_TRACKING]')) {
                            updatedIds.add(pfKey);
                            const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === pfKey);
                            if (detail) {
                                window.globalDashboardPulseUpdatedDetails.push({
                                    ...detail,
                                    logNote: l.note
                                });
                            }
                        }
                    }

                    // 7. Generic Compliances check
                    if (l.note && l.note.includes('[Acknowledged Today]')) {
                        window.globalDashboardPulsePendingDetails.forEach(detail => {
                            if (detail.type === 'comp' && detail.clientId === l.client_id && l.note.includes(detail.serviceName)) {
                                const key = detail.id;
                                if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                                    updatedIds.add(key);
                                    window.globalDashboardPulseUpdatedDetails.push({
                                        ...detail,
                                        logNote: l.note
                                    });
                                }
                             }
                        });
                    }
                });
            }

            // TDS check
            if (tdsLogsRes.data) {
                tdsLogsRes.data.forEach(log => {
                    const key = `tds:${log.client_id}`;
                    if (pendingWorkIds.has(key) && !updatedIds.has(key)) {
                        updatedIds.add(key);
                        const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                        if (detail) {
                            window.globalDashboardPulseUpdatedDetails.push({
                                ...detail,
                                logNote: log.note
                            });
                        }
                    }
                });
            }

            // Debtor check
            if (debtorLogsRes.data) {
                debtorLogsRes.data.forEach(l => { 
                    if (pendingWorkIds.has(`debtor:${l.ledger_id}`)) {
                        const key = `debtor:${l.ledger_id}`;
                        if (!updatedIds.has(key)) {
                            updatedIds.add(key);
                            const detail = window.globalDashboardPulsePendingDetails.find(item => item.id === key);
                            if (detail) {
                                window.globalDashboardPulseUpdatedDetails.push({
                                    ...detail,
                                    logNote: l.notes || 'Debtor collection follow-up log submitted.'
                                });
                            }
                        }
                    }
                });
            }

            updatedCount = updatedIds.size;


            // Calculate Grade based on percentage or raw coverage
            const coverage = totalCount > 0 ? (updatedCount / totalCount) * 100 : 100;
            if (coverage >= 90) { todayGrade = "A+"; gradeColor = "text-emerald-500"; }
            else if (coverage >= 75) { todayGrade = "A"; gradeColor = "text-teal-500"; }
            else if (coverage >= 60) { todayGrade = "B+"; gradeColor = "text-cyan-500"; }
            else if (coverage >= 45) { todayGrade = "B"; gradeColor = "text-blue-500"; }
            else if (coverage >= 30) { todayGrade = "C+"; gradeColor = "text-indigo-500"; }
            else if (coverage >= 15) { todayGrade = "C"; gradeColor = "text-amber-500"; }
            else if (updatedCount >= 1) { todayGrade = "D"; gradeColor = "text-rose-500"; }
            else { todayGrade = "Z"; gradeColor = "text-slate-300"; }

            window.globalDashboardPulseStats = {
                totalCount: totalCount,
                updatedCount: updatedCount,
                coverage: Math.round(coverage),
                grade: todayGrade
            };

    window.validatePan = function(pan) {
        if (!pan) return false;
        const regex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/i;
        return regex.test(pan.trim());
    };

    window.validateGst = function(gst) {
        if (!gst || gst.trim() === '') return true; // GSTIN is optional
        const regex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[0-9A-Z]{1}Z[0-9A-Z]{1}$/i;
        return regex.test(gst.trim());
    };

    window.checkDuplicateConflict = function(clientId, pan, gstin, activeClients, seenClientsList) {
        const pVal = (pan || '').trim().toUpperCase();
        const gVal = (gstin || '').trim().toUpperCase();
        if (!pVal) return false;

        // Skip duplicate warnings for whitelisted PANs
        if (window.globalIgnoredDuplicatePans && window.globalIgnoredDuplicatePans.includes(pVal)) {
            return false;
        }

        function isConflicting(cId, cPan, cGst) {
            if (cId === clientId) return false; // skip self
            const otherPan = (cPan || '').trim().toUpperCase();
            const otherGst = (cGst || '').trim().toUpperCase();
            if (!otherPan) return false;

            // 1. Same GSTIN (if non-empty) is always a duplicate
            if (gVal && otherGst && gVal === otherGst) return true;

            // 2. Same PAN
            if (pVal === otherPan) {
                // If at least one has no GST, or if they have the same GST
                if (!gVal || !otherGst || gVal === otherGst) return true;
            }

            return false;
        }

        // Check database active clients
        for (const c of activeClients) {
            if (c.is_active === false) continue;
            if (isConflicting(c.client_id, c.pan_number, c.gstin)) {
                return true;
            }
        }

        // Check already processed Excel rows
        for (const row of seenClientsList) {
            if (isConflicting(row.client_id, row.pan_number, row.gstin)) {
                return true;
            }
        }

        return false;
    };
