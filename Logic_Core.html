    window.loadPendencyCounts = async function() {
        try {
            // Get all active clients
            const { data: clients, error: cliErr } = await supabaseClient
                .from('clients')
                .select('client_id, display_name, entity_type, standard_services, pan_number, gstin')
                .eq('is_active', true);
            if (cliErr) throw cliErr;

            // 1. Count clients without enrolled services
            const noServicesClients = (clients || []).filter(c => {
                return !c.standard_services || c.standard_services.trim() === '';
            });
            window.globalNoServicesClientsList = noServicesClients;
            const noServicesCountEl = document.getElementById('pendencyNoServicesCount');
            if (noServicesCountEl) noServicesCountEl.innerText = noServicesClients.length;

            // 2. Count clients with invalid PAN/GST or missing fields
            const invalidFieldsClients = (clients || []).filter(c => {
                const nameMissing = !c.display_name || !c.display_name.trim();
                const panValid = window.validatePan(c.pan_number);
                const gstValid = window.validateGst(c.gstin);
                return nameMissing || !panValid || !gstValid;
            });
            window.globalInvalidFieldsClientsList = invalidFieldsClients;
            const invalidFieldsCountEl = document.getElementById('pendencyInvalidFieldsCount');
            if (invalidFieldsCountEl) invalidFieldsCountEl.innerText = invalidFieldsClients.length;

            // 3. Count duplicate clients
            const groups = {};
            (clients || []).forEach(c => {
                const pan = (c.pan_number || '').trim().toUpperCase();
                if (!pan) return;
                if (window.globalIgnoredDuplicatePans && window.globalIgnoredDuplicatePans.includes(pan)) return;
                if (!groups[pan]) groups[pan] = [];
                groups[pan].push(c);
            });

            let totalDuplicatesToDelete = 0;
            const duplicateGroups = [];
            Object.keys(groups).forEach(pan => {
                const group = groups[pan];
                if (group.length <= 1) return;

                // Sort so that clients WITH GST come first
                group.sort((a, b) => {
                    const gstA = (a.gstin || '').trim();
                    const gstB = (b.gstin || '').trim();
                    if (gstA && !gstB) return -1;
                    if (!gstA && gstB) return 1;
                    return 0;
                });

                const kept = [];
                const toDelete = [];
                
                group.forEach(current => {
                    if (kept.length === 0) {
                        kept.push(current);
                        return;
                    }
                    
                    const currentGst = (current.gstin || '').trim().toUpperCase();
                    
                    const isDuplicate = kept.some(k => {
                        const keptGst = (k.gstin || '').trim().toUpperCase();
                        return currentGst === keptGst || !currentGst;
                    });
                    
                    if (isDuplicate) {
                        toDelete.push(current);
                    } else {
                        kept.push(current);
                    }
                });

                if (toDelete.length > 0) {
                    totalDuplicatesToDelete += toDelete.length;
                    duplicateGroups.push({
                        pan: pan,
                        kept: kept,
                        toDelete: toDelete,
                        all: group
                    });
                }
            });

            window.globalDuplicateClientsGroupsList = duplicateGroups;
            const duplicateCountEl = document.getElementById('pendencyDuplicateClientsCount');
            if (duplicateCountEl) duplicateCountEl.innerText = totalDuplicatesToDelete;

        } catch (e) {
            console.error("Error in loadPendencyCounts:", e);
        }
    };

    window.deleteAllClientsWithoutServices = async function() {

        const btn = document.getElementById('deleteAllNoServicesBtn');
        const ogText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Deleting...';
        btn.disabled = true;
        
        try {
            const clientIds = clients.map(c => c.client_id);
            
            // Delete from all referencing tables first to prevent constraint violations
            await Promise.all([
                supabaseClient.from('client_assignments').delete().in('client_id', clientIds),
                supabaseClient.from('client_contacts').delete().in('client_id', clientIds),
                supabaseClient.from('client_subsidies').delete().in('client_id', clientIds),
                supabaseClient.from('task_logs').delete().in('client_id', clientIds),
                supabaseClient.from('task_history').delete().in('client_id', clientIds),
                supabaseClient.from('tasks').delete().in('client_id', clientIds),
                supabaseClient.from('invoices').delete().in('client_id', clientIds),
                supabaseClient.from('gst_tracking').delete().in('client_id', clientIds),
                supabaseClient.from('tds_tracking').delete().in('client_id', clientIds),
                supabaseClient.from('pt_tracking').delete().in('client_id', clientIds),
                supabaseClient.from('it_tracking').delete().in('client_id', clientIds),
                supabaseClient.from('pf_tracking').delete().in('client_id', clientIds),

    window.saveClientFieldsInline = async function(clientId) {
        const nameInput = document.getElementById(`inline-name-${clientId}`);
        const panInput = document.getElementById(`inline-pan-${clientId}`);
        const gstInput = document.getElementById(`inline-gst-${clientId}`);
        const saveBtn = document.getElementById(`inline-save-btn-${clientId}`);

        if (!nameInput || !panInput || !gstInput || !saveBtn) return;

        const name = nameInput.value.trim();
        const pan = panInput.value.trim().toUpperCase();
        const gst = gstInput.value.trim().toUpperCase();

        if (!name) {
            showToast("Client Name is required.");
            return;
        }

        if (!window.validatePan(pan)) {
            showToast("Invalid PAN Format. PAN must be a 10-character alphanumeric string following the format (5 letters, 4 digits, 1 letter), e.g. ABCDE1234F.");
            return;
        }

        if (gst && !window.validateGst(gst)) {
            showToast("Invalid GSTIN Format. GSTIN must be a 15-character alphanumeric string, e.g. 24ABCDE1234F1Z9.");
            return;
        }

        const originalBtnHtml = saveBtn.innerHTML;
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...';

        try {
            // Get all active clients to run duplicate checks
            const { data: activeClients, error: fetchErr } = await supabaseClient
                .from('clients')
                .select('client_id, display_name, pan_number, gstin')
                .eq('is_active', true);
            
            if (fetchErr) throw fetchErr;

            // 1. Global GSTIN duplicate check (cannot add/update if GST already exists for another client)
            if (gst) {
                const sameGstClientAnywhere = activeClients.find(c => 
                    c.gstin === gst && c.client_id !== clientId
                );
                if (sameGstClientAnywhere) {
                    showToast(`Cannot save client: A client with the same GSTIN (${gst}) already exists under the name "${sameGstClientAnywhere.display_name}".`);
                    return;
                }
            }

            // 2. PAN duplicate check
            const samePanClients = activeClients.filter(c => 
                c.pan_number === pan && c.client_id !== clientId
            );
            
            if (samePanClients.length > 0) {
                const sameGstClient = samePanClients.find(c => c.gstin === gst);
                if (sameGstClient) {
                    showToast(`Cannot save client: A client with the same PAN (${pan}) and GSTIN (${gst || 'Empty'}) already exists under the name "${sameGstClient.display_name}".`);
                    return;
                }
                
                if (!confirm(`Warning: A client with the same PAN (${pan}) already exists under the name "${samePanClients.map(c => c.display_name).join(', ')}".\n\nDo you want to proceed anyway?`)) {
                    return;
                }
            }

            // Perform the update
            const { error: updateErr } = await supabaseClient
                .from('clients')
                .update({
                    display_name: name,
                    pan_number: pan,
                    gstin: gst || null
                })
                .eq('client_id', clientId);

            if (updateErr) throw updateErr;

            // Update local memory list and re-filter
            if (typeof refreshGlobalCache === 'function') {
                await refreshGlobalCache();
            } else if (typeof globalRefresh === 'function') {
                await globalRefresh();
            }

            // Re-load the counts
            await window.loadPendencyCounts();

            // Re-render the popup modal table body with the updated list
            window.showInvalidFieldsPopup();

            showToast("Client details updated successfully!");
        } catch (error) {
            console.error("Error saving client inline:", error);
            showToast("Error: " + error.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalBtnHtml;
        }
    };

    window.processInvalidFieldsExcel = async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const loader = document.getElementById('excelLoadingModal');
        if (loader) loader.classList.remove('hidden');

        // Reset memory for import
        window.globalProposedInvalidCorrections = {
            updates: [], // list of { client_id, display_name, pan_number, gstin }
            invalidCount: 0,
            fileEventTarget: event.target
        };

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Read as array of rows
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                if (rows.length <= 1) {
                    if (loader) loader.classList.add('hidden');
                    event.target.value = '';
                    showToast("The uploaded sheet is empty.");
                    return;
                }
                
                const headers = rows[0].map(h => (h || '').toString().trim());
                const colIndices = {
                    clientId: headers.indexOf("Client ID"),
                    name: headers.indexOf("Client Name"),
                    pan: headers.indexOf("PAN Number"),
                    gstin: headers.indexOf("GSTIN")
                };

                if (colIndices.clientId === -1) {
                    if (loader) loader.classList.add('hidden');
                    event.target.value = '';
                    showToast("Error: 'Client ID' column not found in the uploaded Excel file.");
                    return;
                }

                const activeClients = (window.globalAllClientsList || []).filter(c => c.is_active !== false);
                const seenClientsList = [];

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const clientId = (row[colIndices.clientId] || '').toString().trim();
                    if (!clientId) continue;

                    const name = colIndices.name !== -1 ? (row[colIndices.name] || '').toString().trim() : '';
                    const pan = colIndices.pan !== -1 ? (row[colIndices.pan] || '').toString().trim().toUpperCase() : '';
                    const gstin = colIndices.gstin !== -1 ? (row[colIndices.gstin] || '').toString().trim().toUpperCase() : '';

                    // Find this client in database
                    const existing = activeClients.find(c => c.client_id === clientId);
                    if (!existing) {
                        // Not found, skip
                        continue;
                    }

                    // Check validation rules for proposed PAN and GSTIN
                    const panValid = window.validatePan(pan);
                    const gstValid = window.validateGst(gstin);

                    let isDuplicateConflict = false;
                    if (panValid && gstValid) {
                        isDuplicateConflict = window.checkDuplicateConflict(clientId, pan, gstin, activeClients, seenClientsList);
                    }

                    if (name && panValid && gstValid && !isDuplicateConflict) {
                        // Check if there's any change
                        const currentPan = (existing.pan_number || '').trim().toUpperCase();
                        const currentGst = (existing.gstin || '').trim().toUpperCase();
                        const currentName = (existing.display_name || '').trim();

                        if (currentPan !== pan || currentGst !== gstin || currentName !== name) {
                            const changes = [];
                            if (currentName !== name) changes.push({ field: 'Client Name', oldVal: currentName || '[None]', newVal: name || '[None]' });
                            if (currentPan !== pan) changes.push({ field: 'PAN Number', oldVal: currentPan || '[None]', newVal: pan || '[None]' });
                            if (currentGst !== gstin) changes.push({ field: 'GSTIN', oldVal: currentGst || '[None]', newVal: gstin || '[None]' });

                            window.globalProposedInvalidCorrections.updates.push({
                                client_id: clientId,
                                display_name: name,
                                pan_number: pan,
                                gstin: gstin || null,
                                changes: changes
                            });

                            // Record as seen
                            seenClientsList.push({
                                client_id: clientId,
                                pan_number: pan,
                                gstin: gstin
                            });
                        } else {
                            window.globalProposedInvalidCorrections.invalidCount++;
                        }
                    } else {
                        // Still invalid format, name missing, or duplicate conflict
                        window.globalProposedInvalidCorrections.invalidCount++;
                    }
                }

                if (loader) loader.classList.add('hidden');

                // Populate summary modal
                document.getElementById('invalid-summary-valid-count').innerText = window.globalProposedInvalidCorrections.updates.length;
                document.getElementById('invalid-summary-invalid-count').innerText = window.globalProposedInvalidCorrections.invalidCount;

                document.getElementById('invalidFieldsImportSummaryModal').classList.remove('hidden');

            } catch (err) {
                if (loader) loader.classList.add('hidden');
                event.target.value = '';
                console.error("Error parsing correction Excel:", err);
                showToast("Failed to parse correction Excel file. Please ensure it is a valid .xlsx file.");
            }
        };
        reader.readAsArrayBuffer(file);
    };

    window.confirmInvalidFieldsImport = async function() {
        const updates = window.globalProposedInvalidCorrections.updates || [];
        if (updates.length === 0) {
            showToast("No valid corrections to import.");
            window.denyInvalidFieldsImport();
            return;
        }

        const confirmBtn = document.getElementById('invalidSummaryConfirmBtn');
        const originalText = confirmBtn.innerHTML;
        confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...';
        confirmBtn.disabled = true;

        try {
            // Fetch fresh active clients list for duplicate validation
            const { data: activeClients, error: fetchErr } = await supabaseClient
                .from('clients')
                .select('client_id, display_name, pan_number, gstin')
                .eq('is_active', true);
            if (fetchErr) throw fetchErr;

            // Validate all updates against duplicates
            const finalUpdatesToApply = [];
            const duplicateBlocked = [];
            const seenClientsList = [];

            for (const item of updates) {
                const clientId = item.client_id;
                const pan = item.pan_number;
                const gst = item.gstin;
                const name = item.display_name;

                const isDuplicateConflict = window.checkDuplicateConflict(clientId, pan, gst, activeClients, seenClientsList);
                if (isDuplicateConflict) {
                    duplicateBlocked.push(`Client "${name}" has duplicate/conflicting PAN (${pan}) or GSTIN (${gst || 'Empty'}).`);
                    continue;
                }

                // Record as seen
                seenClientsList.push({
                    client_id: clientId,
                    pan_number: pan,
                    gstin: gst
                });

                // If passed, add to list to apply
                finalUpdatesToApply.push(item);
            }

            if (duplicateBlocked.length > 0) {
                showToast(`Warning: The following duplicates were detected and skipped:\n\n${duplicateBlocked.slice(0, 5).join('\n')}\n${duplicateBlocked.length > 5 ? '...and others' : ''}`);
            }

            if (finalUpdatesToApply.length === 0) {
                showToast("No changes applied due to duplicate conflicts.");
                window.denyInvalidFieldsImport();
                return;
            }

            // Perform Supabase updates (never delete, only update)
            for (const item of finalUpdatesToApply) {
                await supabaseClient.from('clients').update({
                    display_name: item.display_name,
                    pan_number: item.pan_number,
                    gstin: item.gstin
                }).eq('client_id', item.client_id);
            }

            showToast(`Successfully updated ${finalUpdatesToApply.length} client details!`);
            window.denyInvalidFieldsImport();

            // Refresh global cache and reload counts
            if (typeof refreshGlobalCache === 'function') {
                await refreshGlobalCache();
            } else if (typeof globalRefresh === 'function') {
                await globalRefresh();
            }

            await window.loadPendencyCounts();
            window.showInvalidFieldsPopup();

        } catch (err) {
            console.error("Error applying corrections:", err);
            showToast("Database Error: " + err.message);
        } finally {
            confirmBtn.innerHTML = originalText;
            confirmBtn.disabled = false;
        }
    };

                    const checkboxHtml = isKept
                        ? `<i class="fa-solid fa-check text-emerald-500 text-sm"></i>`
                        : `<input type="checkbox" class="duplicate-delete-cb w-4 h-4 text-rose-600 rounded border-slate-300 cursor-pointer" data-id="${c.client_id}" checked>`;
                    
                    const isAdmin = currentUser && (currentUser.role === 'Admin' || currentUser.name === 'Mayank');
                    const keepBothBtn = isAdmin
                        ? `<button onclick="window.whitelistDuplicatePan('${g.pan}', event)" class="mr-2 px-2 py-1 text-[10px] font-black uppercase tracking-wider text-amber-700 bg-amber-50 border border-amber-200 rounded hover:bg-amber-100 transition-all active:scale-95 shadow-sm inline-flex items-center gap-1" title="Keep both clients and stop duplicate warnings for this PAN"><i class="fa-solid fa-star text-amber-500"></i> Keep Both</button>`
                        : '';

                    const statusBadge = isKept
                        ? `<span class="px-2 py-1 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-lg text-[10px] font-bold uppercase tracking-wider">Keep (First/GST)</span>`
                        : `<span class="px-2 py-1 bg-rose-50 text-rose-700 border border-rose-100 rounded-lg text-[10px] font-bold uppercase tracking-wider">To Be Deleted</span>`;
                        
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                            <td class="px-6 py-4 text-center align-middle">${checkboxHtml}</td>
                            <td class="px-6 py-4 font-bold text-slate-800 align-middle">${c.display_name}</td>
                            <td class="px-6 py-4 font-mono text-slate-500 text-xs align-middle">${g.pan}</td>
                            <td class="px-6 py-4 font-mono text-slate-500 text-xs align-middle">${c.gstin || '-'}</td>
                            <td class="px-6 py-4 text-right align-middle">
                                <div class="flex items-center justify-end gap-1">
                                    ${keepBothBtn}
                                    ${statusBadge}
                                </div>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        document.getElementById('pendencyListModal').classList.remove('hidden');
    };

    window.cleanSelectedDuplicates = async function() {
        const checkboxes = document.querySelectorAll('.duplicate-delete-cb:checked');
        if (checkboxes.length === 0) {
            showToast("Please select at least one duplicate client to clean.");
            return;
        }

        if (!confirm(`Are you sure you want to clean/delete the ${checkboxes.length} selected duplicate clients? This action cannot be undone.`)) {
            return;
        }

        const cleanBtn = document.getElementById('cleanSelectedDuplicatesBtn');
        const originalText = cleanBtn.innerHTML;
        cleanBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Cleaning...';
        cleanBtn.disabled = true;

        try {
            const selectedToDeleteIds = Array.from(checkboxes).map(cb => cb.getAttribute('data-id'));

            // Fetch fresh active clients list for matching targets
            const { data: activeClients } = await supabaseClient.from('clients').select('*');
            
            // Loop through selected duplicates to transfer logs and delete
            const allLogUpdates = [];
            
            for (const deletedClientId of selectedToDeleteIds) {
                const deletedClient = activeClients.find(c => c.client_id === deletedClientId);
                if (!deletedClient) continue;

                const deletedPan = (deletedClient.pan_number || '').trim().toUpperCase();
                const deletedGst = (deletedClient.gstin || '').trim().toUpperCase();

                // Find a kept target client with same PAN that is NOT scheduled for deletion
                const samePanActive = activeClients.filter(c => 
                    (c.pan_number || '').trim().toUpperCase() === deletedPan && 
                    !selectedToDeleteIds.includes(c.client_id)
                );

                if (samePanActive.length > 0) {
                    // Find target with same GSTIN first, otherwise take the first kept one
                    let targetKeep = samePanActive.find(c => 
                        (c.gstin || '').trim().toUpperCase() === deletedGst
                    );
                    if (!targetKeep) {
                        targetKeep = samePanActive[0];
                    }

                    allLogUpdates.push({ from: deletedClientId, to: targetKeep.client_id });
                }
            }

            // Transfer logs first
            if (allLogUpdates.length > 0) {
                console.log(`[Deduplication] Moving logs for ${allLogUpdates.length} duplicate clients...`);
                for (const update of allLogUpdates) {
                    const { error: logErr } = await supabaseClient
                        .from('task_logs')
                        .update({ client_id: update.to })
                        .eq('client_id', update.from);
                    if (logErr) console.error(`Error moving logs from ${update.from} to ${update.to}:`, logErr);
                }
            }

            // Delete referencing records first, then the client
            console.log(`[Deduplication] Deleting referencing records and clients for IDs:`, selectedToDeleteIds);
            await Promise.all([
                supabaseClient.from('client_assignments').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('client_contacts').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('client_subsidies').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('task_logs').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('task_history').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('tasks').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('invoices').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('gst_tracking').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('tds_tracking').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('pt_tracking').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('it_tracking').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('pf_tracking').delete().in('client_id', selectedToDeleteIds),
                supabaseClient.from('payments').delete().in('ledger_id', selectedToDeleteIds),
                supabaseClient.from('follow_up_logs').delete().in('ledger_id', selectedToDeleteIds),
                supabaseClient.from('tally_ledgers').delete().in('ledger_id', selectedToDeleteIds)
            ]);

            const { error: deleteErr } = await supabaseClient
                .from('clients')
                .delete()
                .in('client_id', selectedToDeleteIds);
            if (deleteErr) throw deleteErr;

            showToast(`Successfully cleaned ${selectedToDeleteIds.length} duplicate clients!`);
            window.closePendencyListModal();

            // Refresh global cache and load counts
            if (typeof refreshGlobalCache === 'function') {
                await refreshGlobalCache();
            } else if (typeof globalRefresh === 'function') {
                await globalRefresh();
            }

            await window.loadPendencyCounts();

        } catch (err) {
            console.error("Error cleaning selected duplicates:", err);
            showToast("Error: " + err.message);
        } finally {
            cleanBtn.innerHTML = originalText;
            cleanBtn.disabled = false;
        }
    };


    // ==================== CLIENT MERGER WIZARD LOGIC ====================
    window.showMergeClientsModal = function() {
        document.getElementById('mergeSourceCode').value = '';
        document.getElementById('mergeTargetCode').value = '';
        document.getElementById('mergeNewName').value = '';
        document.getElementById('mergeClientsModal').classList.remove('hidden');
    };

    window.closeMergeClientsModal = function() {
        document.getElementById('mergeClientsModal').classList.add('hidden');
    };

    window.executeMergeClients = async function() {
        const sourceCode = document.getElementById('mergeSourceCode').value.trim();
        const targetCode = document.getElementById('mergeTargetCode').value.trim();
        const newName = document.getElementById('mergeNewName').value.trim();
        const submitBtn = document.getElementById('mergeClientsSubmitBtn');

        if (!sourceCode || !targetCode) {
            showToast("Please enter both Source and Target client codes.");
            return;
        }

        if (sourceCode.toLowerCase() === targetCode.toLowerCase()) {
            showToast("Source and Target client codes must be different.");
            return;
        }

        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Merging...';
        submitBtn.disabled = true;

        try {
            // 1. Resolve client codes.
            const { data: clients, error: fetchErr } = await supabaseClient
                .from('clients')
                .select('*')
                .or(`client_code.ilike.${sourceCode},client_code.ilike.${targetCode}`);

            if (fetchErr) throw fetchErr;

            const sourceClient = (clients || []).find(c => (c.client_code || '').toLowerCase() === sourceCode.toLowerCase());
            const targetClient = (clients || []).find(c => (c.client_code || '').toLowerCase() === targetCode.toLowerCase());

            if (!sourceClient) {
                showToast(`Source client with code "${sourceCode}" not found.`);
                return;
            }
            if (!targetClient) {
                showToast(`Target client with code "${targetCode}" not found.`);
                return;
            }

            if (sourceClient.client_id === targetClient.client_id) {
                showToast("Source and Target resolved to the same client ID.");
                return;
            }

            // Stern warning confirmation popup
            const confirmMsg = `Are you sure you want to merge "${sourceClient.display_name}" (${sourceClient.client_code}) into "${targetClient.display_name}" (${targetClient.client_code})?\n\nThis will transfer all assignments, tasks, invoices, payments, and compliance filing logs to "${targetClient.display_name}".\n\n"${sourceClient.display_name}" will be PERMANENTLY DELETED.\n\nTHIS ACTION CANNOT BE UNDONE. Type 'MERGE' to confirm:`;
            const confirmation = prompt(confirmMsg);
            if (confirmation !== 'MERGE') {
                showToast("Merge cancelled.");
                return;
            }

            console.log(`[Merger] Starting merge of ${sourceClient.client_code} into ${targetClient.client_code}`);

            // 2. Combine standard services (mathematical union)
            const services1 = (sourceClient.standard_services || '').split(',').map(s => s.trim()).filter(Boolean);
            const services2 = (targetClient.standard_services || '').split(',').map(s => s.trim()).filter(Boolean);
            const unionSet = new Set();
            services1.forEach(s => unionSet.add(s.toUpperCase()));
            services2.forEach(s => unionSet.add(s.toUpperCase()));
            const combinedServices = Array.from(unionSet).join(', ');

            // 3. Update target client info (services, name, empty fields fallback)
            const targetUpdates = {
                standard_services: combinedServices
            };
            if (newName) {
                targetUpdates.display_name = newName;
            }
            if (!targetClient.pan_number && sourceClient.pan_number) {
                targetUpdates.pan_number = sourceClient.pan_number;
            }
            if (!targetClient.gstin && sourceClient.gstin) {
                targetUpdates.gstin = sourceClient.gstin;
            }
            if (!targetClient.entity_type && sourceClient.entity_type) {
                targetUpdates.entity_type = sourceClient.entity_type;
            }
            if (!targetClient.gst_frequency && sourceClient.gst_frequency) {
                targetUpdates.gst_frequency = sourceClient.gst_frequency;
            }

            const { error: updateTargetErr } = await supabaseClient
                .from('clients')
                .update(targetUpdates)
                .eq('client_id', targetClient.client_id);
            if (updateTargetErr) throw updateTargetErr;

            // 4. Move assignments (deduplicating same service types)
            const { data: sourceAss, error: errAss1 } = await supabaseClient.from('client_assignments').select('*').eq('client_id', sourceClient.client_id);
            if (errAss1) throw errAss1;
            const { data: targetAss, error: errAss2 } = await supabaseClient.from('client_assignments').select('*').eq('client_id', targetClient.client_id);
            if (errAss2) throw errAss2;

            for (const sAss of (sourceAss || [])) {
                const hasConflict = (targetAss || []).some(tAss => (tAss.service_type || '').toLowerCase() === (sAss.service_type || '').toLowerCase());
                if (hasConflict) {
                    await supabaseClient.from('client_assignments').delete().eq('client_id', sourceClient.client_id).eq('service_type', sAss.service_type);
                } else {
                    await supabaseClient.from('client_assignments').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id).eq('service_type', sAss.service_type);
                }
            }

            // 5. Move client_contacts
            const { error: contactErr } = await supabaseClient.from('client_contacts').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id);
            if (contactErr) throw contactErr;

            // 6. Move client_subsidies (deduplicating same subsidy names)
            const { data: sourceSubs, error: errSubs1 } = await supabaseClient.from('client_subsidies').select('*').eq('client_id', sourceClient.client_id);
            if (errSubs1) throw errSubs1;
            const { data: targetSubs, error: errSubs2 } = await supabaseClient.from('client_subsidies').select('*').eq('client_id', targetClient.client_id);
            if (errSubs2) throw errSubs2;

            for (const sSub of (sourceSubs || [])) {
                const hasConflict = (targetSubs || []).find(tSub => (tSub.subsidy_name || '').toLowerCase() === (sSub.subsidy_name || '').toLowerCase());
                if (hasConflict) {
                    const mergedFields = {};
                    if (!hasConflict.rate && sSub.rate) mergedFields.rate = sSub.rate;
                    if (!hasConflict.fees_received && sSub.fees_received) mergedFields.fees_received = sSub.fees_received;
                    if ((!hasConflict.status || hasConflict.status === 'Pending') && sSub.status) mergedFields.status = sSub.status;
                    if (!hasConflict.remark && sSub.remark) mergedFields.remark = sSub.remark;
                    if (!hasConflict.next_followup_date && sSub.next_followup_date) mergedFields.next_followup_date = sSub.next_followup_date;

                    if (Object.keys(mergedFields).length > 0) {
                        await supabaseClient.from('client_subsidies').update(mergedFields).eq('id', hasConflict.id);
                    }
                    await supabaseClient.from('client_subsidies').delete().eq('id', sSub.id);
                } else {
                    await supabaseClient.from('client_subsidies').update({ client_id: targetClient.client_id }).eq('id', sSub.id);
                }
            }

            // 7. Move tasks, task_logs, task_history, invoices
            const { error: tasksErr } = await supabaseClient.from('tasks').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id);
            if (tasksErr) throw tasksErr;

            const { error: taskLogsErr } = await supabaseClient.from('task_logs').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id);
            if (taskLogsErr) throw taskLogsErr;

            const { error: taskHistoryErr } = await supabaseClient.from('task_history').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id);
            if (taskHistoryErr) throw taskHistoryErr;

            const { error: invoicesErr } = await supabaseClient.from('invoices').update({ client_id: targetClient.client_id }).eq('client_id', sourceClient.client_id);
            if (invoicesErr) throw invoicesErr;

            // 8. Merge tracking tables (gst, tds, pt, it, pf)
            const mergeStatus = (v1, v2) => {
                if (!v1) return v2;
                if (!v2) return v1;
                const priority = { 'Done': 3, 'completed': 3, 'NIL': 2, 'nil': 2, 'Pending': 1, 'pending': 1 };
                const p1 = priority[v1] || 0;
                const p2 = priority[v2] || 0;
                return p1 >= p2 ? v1 : v2;
            };

            const mergeTrackingTableHelper = async (tableName, keyCols) => {
                const { data: sourceRows, error: errSrc } = await supabaseClient.from(tableName).select('*').eq('client_id', sourceClient.client_id);
                if (errSrc) throw errSrc;
                const { data: targetRows, error: errTgt } = await supabaseClient.from(tableName).select('*').eq('client_id', targetClient.client_id);
                if (errTgt) throw errTgt;

                const getKey = (row) => keyCols.map(col => String(row[col] || '').toLowerCase()).join('|');
                const targetMap = new Map();
                for (const row of (targetRows || [])) {
                    targetMap.set(getKey(row), row);
                }

                for (const srcRow of (sourceRows || [])) {
                    const key = getKey(srcRow);
                    const tgtRow = targetMap.get(key);

                    if (!tgtRow) {
                        const query = supabaseClient.from(tableName).update({ client_id: targetClient.client_id });
                        if (srcRow.id !== undefined) {
                            await query.eq('id', srcRow.id);
                        } else {
                            let q = query.eq('client_id', sourceClient.client_id);
                            for (const col of keyCols) {
                                q = q.eq(col, srcRow[col]);
                            }
                            await q;
                        }
                    } else {
                        const updatePayload = {};
                        const ignoreCols = new Set(['id', 'client_id', 'created_at', 'updated_at', ...keyCols]);

                        for (const col of Object.keys(srcRow)) {
                            if (ignoreCols.has(col)) continue;

                            const srcVal = srcRow[col];
                            const tgtVal = tgtRow[col];

                            if (typeof srcVal === 'boolean') {
                                updatePayload[col] = tgtVal || srcVal;
                            } else if (typeof srcVal === 'string') {
                                const isStatus = ['done', 'nil', 'pending', 'completed'].includes(String(srcVal).toLowerCase()) ||
                                                 ['done', 'nil', 'pending', 'completed'].includes(String(tgtVal).toLowerCase());
                                if (isStatus) {
                                    updatePayload[col] = mergeStatus(tgtVal, srcVal);
                                } else {
                                    updatePayload[col] = tgtVal || srcVal;
                                }
                            } else {
                                updatePayload[col] = (tgtVal !== null && tgtVal !== undefined) ? tgtVal : srcVal;
                            }
                        }

                        if (Object.keys(updatePayload).length > 0) {
                            const query = supabaseClient.from(tableName).update(updatePayload);
                            if (tgtRow.id !== undefined) {
                                await query.eq('id', tgtRow.id);
                            } else {
                                let q = query.eq('client_id', targetClient.client_id);
                                for (const col of keyCols) {
                                    q = q.eq(col, tgtRow[col]);
                                }
                                await q;
                            }
                        }

                        const delQuery = supabaseClient.from(tableName).delete();
                        if (srcRow.id !== undefined) {
                            await delQuery.eq('id', srcRow.id);
                        } else {
                            let q = delQuery.eq('client_id', sourceClient.client_id);
                            for (const col of keyCols) {
                                q = q.eq(col, srcRow[col]);
                            }
                            await q;
                        }
                    }
                }
            };

            await mergeTrackingTableHelper('gst_tracking', ['period']);
            await mergeTrackingTableHelper('tds_tracking', ['period', 'tds_type']);


            // 9. Move tally_ledgers, payments, follow_up_logs
            const { data: sourceLedger } = await supabaseClient.from('tally_ledgers').select('*').eq('ledger_id', sourceClient.client_id).maybeSingle();
            const { data: targetLedger } = await supabaseClient.from('tally_ledgers').select('*').eq('ledger_id', targetClient.client_id).maybeSingle();

            if (sourceLedger) {
                if (targetLedger) {
                    await supabaseClient.from('tally_ledgers').delete().eq('ledger_id', sourceClient.client_id);
                } else {
                    await supabaseClient.from('tally_ledgers').update({ ledger_id: targetClient.client_id }).eq('ledger_id', sourceClient.client_id);
                }
            }

            const { error: payErr } = await supabaseClient.from('payments').update({ ledger_id: targetClient.client_id }).eq('ledger_id', sourceClient.client_id);
            if (payErr) throw payErr;

            const { error: followUpErr } = await supabaseClient.from('follow_up_logs').update({ ledger_id: targetClient.client_id }).eq('ledger_id', sourceClient.client_id);
            if (followUpErr) throw followUpErr;

            // 10. Delete source client record
            const { error: deleteClientErr } = await supabaseClient.from('clients').delete().eq('client_id', sourceClient.client_id);
            if (deleteClientErr) throw deleteClientErr;

            showToast("Clients merged successfully!");
            closeMergeClientsModal();

            // Refresh cache & views
            if (typeof refreshGlobalCache === 'function') {
                await refreshGlobalCache();
            } else if (typeof globalRefresh === 'function') {
                await globalRefresh();
            }

            if (typeof window.loadPendencyCounts === 'function') {
                await window.loadPendencyCounts();
            }
        } catch (err) {
            console.error("Error executing client merge:", err);
            showToast("Error merging clients: " + err.message);
        } finally {
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
        }
    };

    window.whitelistDuplicatePan = async function(pan, event) {
        if (event) event.stopPropagation();
        if (!confirm(`Are you sure you want to whitelist PAN "${pan}"? This will ignore duplicate warnings for this PAN, and all clients with this PAN will be kept.`)) return;

        const btn = event ? event.currentTarget : null;
        const originalHtml = btn ? btn.innerHTML : '';
        if (btn) {
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Whitelisting...';
            btn.disabled = true;
        }

        try {
            // Get currently ignored PANs
            const { data, error } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'ignored_duplicate_pans').maybeSingle();
            if (error) throw error;

            let ignored = [];
            if (data && data.setting_value) {
                ignored = data.setting_value.split(',').map(p => p.trim().toUpperCase()).filter(Boolean);
            }

            if (!ignored.includes(pan.toUpperCase())) {
                ignored.push(pan.toUpperCase());
            }

            const newValue = ignored.join(',');
            
            // Save back to Supabase
            let saveErr;
            if (data) {
                const { error: updErr } = await supabaseClient.from('app_settings').update({ setting_value: newValue }).eq('setting_key', 'ignored_duplicate_pans');
                saveErr = updErr;
            } else {
                const { error: insErr } = await supabaseClient.from('app_settings').insert([{ setting_key: 'ignored_duplicate_pans', setting_value: newValue }]);
                saveErr = insErr;
            }

            if (saveErr) throw saveErr;

            showToast(`PAN "${pan}" has been whitelisted successfully. These clients will now be kept and ignored from duplicate counts.`);
            
            // Reload global cache and pendency counts, and refresh modal view
            if (typeof refreshGlobalCache === 'function') {
                await refreshGlobalCache();
            }
            if (typeof window.loadPendencyCounts === 'function') {
                await window.loadPendencyCounts();
            }
            window.showDuplicateClientsPopup();

        } catch (err) {
            console.error("Error whitelisting PAN:", err);
            showToast("Error whitelisting PAN: " + err.message);
        } finally {
            if (btn) {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }
    };
