<script>
    // ==========================================
    // MODULE: PF & ESIC CENTER (v2 — Dual Tracking)
    // ==========================================

    let globalPFESICClients = [];
    let globalPFESICMap = {}; // key: clientId_period -> { pfChallan, pfReturn, esicChallan, esicReturn, billStatus, isCall, advance, filingDate }
    let pfesicSortCol = 'display_name';
    let pfesicSortAsc = true;

    function _svcHasPF(svc) { return (svc || '').toLowerCase().includes('pf'); }
    function _svcHasESIC(svc) { return (svc || '').toLowerCase().includes('esic'); }

    function _pfFieldLabel(field) {
        return { pfChallan: 'PF Challan', pfReturn: 'PF Return', esicChallan: 'ESIC Challan', esicReturn: 'ESIC Return',
                 billStatus: 'Bill Status', isCall: 'Call / Contact', advance: 'Advance Fee', filingDate: 'Filing Date' }[field] || field;
    }

    function _pfPeriodDisplay(period) {
        if (!period) return '';
        if (period.match(/^\d{4}-\d{2}$/)) {
            const [yr, mo] = period.split('-');
            return new Date(parseInt(yr), parseInt(mo) - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }
        return period.replace('FY_', 'FY ');
    }

    function populatePFMonths() {
        const select = document.getElementById('pfMonthFilter');
        if (!select || select.options.length > 0) return;
        const today = new Date();
        let html = '';
        for (let i = 0; i < 18; i++) {
            const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
            const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            html += `<option value="${val}">${_pfPeriodDisplay(val)}</option>`;
        }
        select.innerHTML = html;
    }

    async function loadPFCenterData(forceRefresh = false) {
        const tbody = document.getElementById('pf-table-body');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading PF &amp; ESIC Data...</td></tr>';

        try {
            populatePFMonths();
            
            const needsCacheRefresh = forceRefresh || !window.globalAllClientsList || window.globalAllClientsList.length === 0;
            if (needsCacheRefresh) {
                await Promise.all([refreshGlobalCache(), fetchTeamMembers()]);
            } else {
                await fetchTeamMembers();
            }

            const selectedPeriod = document.getElementById('pfMonthFilter')?.value || '';
            if (!selectedPeriod) throw new Error("No period selected.");

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;

            const [visRes, rateRes, invRes, logsRes] = await Promise.all([
                supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-pf-esic').maybeSingle(),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('note').like('note', '[PAGE_RATE] view-pf-esic%').order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
                supabaseClient.from('invoices').select('client_id, service_name, status').or('service_name.like.PF & ESIC%,service_name.like.PF Fees%,service_name.like.ESIC Fees%'),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('log_id, note, timestamp')
                    .or('note.ilike.%[PFESIC_LOG]%,note.ilike.%[PF_LOG]%,note.ilike.%[PF_TRACKING]%')
                    .order('timestamp', { ascending: true })
                    .order('log_id', { ascending: true })
                    .range(from, to))
            ]);

            // 1. Allowed services
            const allowedServices = visRes.data?.enrolled_services?.length
                ? visRes.data.enrolled_services
                : ['PF & ESIC', 'PF', 'ESIC'];
            window.globalPFAllowedServices = allowedServices;

            // 2. Filter clients + compute hasPF / hasESIC
            globalPFESICClients = globalClientsList
                .filter(c => {
                    return allowedServices.some(as => window.isClientVisibleForPeriod(c, as, selectedPeriod, 'monthly'));
                })
                .map(c => {
                    const svcs = (c.standard_services || '').split(',').map(s => s.trim().toLowerCase());
                    const matched = allowedServices.filter(as => svcs.includes((as || '').toLowerCase()));
                    let hasPF = matched.some(s => _svcHasPF(s));
                    let hasESIC = matched.some(s => _svcHasESIC(s));
                    // Default: if neither keyword found, treat as both
                    if (!hasPF && !hasESIC) { hasPF = true; hasESIC = true; }
                    return { ...c, hasPF, hasESIC };
                });

            // 3. Rates map
            window.globalPFRatesMap = {};
            (rateRes.data || []).forEach(log => {
                const parts = log.note.split('|');
                if (parts.length >= 3 && window.globalPFRatesMap[parts[1]] === undefined) {
                    window.globalPFRatesMap[parts[1]] = parts[2];
                }
            });

            // 4. Billed map (match by period display string in invoice name)
            window.globalPFBilledMap = {};
            const periodStr = _pfPeriodDisplay(selectedPeriod); // e.g. "May 2026"
            (invRes.data || []).forEach(inv => {
                if (inv.status === 'Cancelled') return;
                if (inv.service_name && (inv.service_name.includes(periodStr) || inv.service_name.includes(selectedPeriod))) {
                    window.globalPFBilledMap[inv.client_id] = true;
                }
            });

            // 5. Parse tracking logs
            globalPFESICMap = {};

            const _initEntry = (cId) => {
                const key = `${cId}_${selectedPeriod}`;
                if (!globalPFESICMap[key]) {
                    globalPFESICMap[key] = {
                        pfChallan: 'Pending', pfReturn: 'Pending',
                        esicChallan: 'Pending', esicReturn: 'Pending',
                        billStatus: window.globalPFBilledMap?.[cId] ? 'Billed' : 'Unbilled',
                        isCall: 'Pending', advance: 'Pending', filingDate: ''
                    };
                }
                return globalPFESICMap[key];
            };

            window.globalPFRtUptoMap = {};
            window.globalEsicRtUptoMap = {};
            window.globalPFESICFollowupMap = {};

            (logsRes.data || []).forEach(log => {
                if (log.note.startsWith('[PFESIC_LOG]')) {
                    const parts = log.note.replace('[PFESIC_LOG] ', '').split('|');
                    if (parts.length >= 4) {
                        const clientId = parts[0];
                        const period = parts[1];
                        const field = parts[2];
                        const status = parts[3];

                        if (period === selectedPeriod) {
                            const e = _initEntry(clientId);
                            e[field] = status;
                            if (parts[5] && (field === 'pfReturn' || field === 'esicReturn')) e.filingDate = parts[5];
                            if (window.globalPFBilledMap?.[clientId]) e.billStatus = 'Billed';
                        }

                        if (status === 'Done') {
                            if (field === 'pfReturn') {
                                if (!window.globalPFRtUptoMap[clientId] || period > window.globalPFRtUptoMap[clientId]) {
                                    window.globalPFRtUptoMap[clientId] = period;
                                }
                            } else if (field === 'esicReturn') {
                                if (!window.globalEsicRtUptoMap[clientId] || period > window.globalEsicRtUptoMap[clientId]) {
                                    window.globalEsicRtUptoMap[clientId] = period;
                                }
                            }
                        }
                    }
                } else if (log.note.startsWith('[PF_LOG]')) {
                    const parts = log.note.replace('[PF_LOG] ', '').split('|');
                    if (parts.length >= 4) {
                        const clientId = parts[0];
                        const period = parts[1];
                        const fieldMap = { challanStatus: 'pfChallan', returnStatus: 'pfReturn' };
                        const field = fieldMap[parts[2]] || parts[2];
                        const status = parts[3];

                        if (period === selectedPeriod) {
                            const e = _initEntry(clientId);
                            e[field] = status;
                            if (parts[5] && (parts[2] === 'returnStatus' || parts[2] === 'pfReturn')) e.filingDate = parts[5];
                            if (window.globalPFBilledMap?.[clientId]) e.billStatus = 'Billed';
                        }

                        if (status === 'Done' && field === 'pfReturn') {
                            if (!window.globalPFRtUptoMap[clientId] || period > window.globalPFRtUptoMap[clientId]) {
                                window.globalPFRtUptoMap[clientId] = period;
                            }
                        }
                    }
                } else if (log.note.startsWith('[PF_TRACKING]')) {
                    const parts = log.note.replace('[PF_TRACKING] ', '').split('|');
                    if (parts.length >= 6) {
                        const clientId = parts[0];
                        const period = parts[1];
                        const pfReturn = parts[3] || 'Pending';

                        if (period === selectedPeriod) {
                            const e = _initEntry(clientId);
                            e.pfChallan = parts[2] || 'Pending';
                            e.pfReturn  = parts[3] || 'Pending';
                            if (parts[5]) e.filingDate = parts[5];
                            if (parts[6]) e.isCall  = parts[6];
                            if (parts[7]) e.advance = parts[7];
                            e.billStatus = window.globalPFBilledMap?.[clientId] ? 'Billed' : (parts[4] || 'Unbilled');
                        }

                        if (pfReturn === 'Done') {
                            if (!window.globalPFRtUptoMap[clientId] || period > window.globalPFRtUptoMap[clientId]) {
                                window.globalPFRtUptoMap[clientId] = period;
                            }
                        }
                    }
                } else if (log.note.startsWith('[PFESIC_FOLLOWUP]')) {
                    const parts = log.note.replace('[PFESIC_FOLLOWUP] ', '').split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[0];
                        const period = parts[1];
                        const fDate = parts[2];
                        const key = `${clientId}_${period}`;
                        window.globalPFESICFollowupMap[key] = fDate;
                    }
                }
            });

            renderFilteredPFTable();

        } catch (err) {
            console.error("PF load error:", err);
            tbody.innerHTML = `<tr><td colspan="12" class="text-center py-8 text-rose-500 font-bold"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>Error: ${err.message}</td></tr>`;
        }
    }

    function renderFilteredPFTable() {
        const tbody = document.getElementById('pf-table-body');
        if (!tbody) return;

        const assignFilter   = document.getElementById('pfAssignFilter')?.value || 'all';
        const searchInput    = document.getElementById('pfSearchInput')?.value.trim().toLowerCase() || '';
        const selectedPeriod = document.getElementById('pfMonthFilter')?.value || '';
        const svcFilter      = document.getElementById('pfServiceFilter')?.value || 'all';

        let filtered = globalPFESICClients || [];

        if (assignFilter === 'mine') {
            const myIds = (window.globalAssignmentsList || []).filter(a => a.maker_id === currentUser?.id).map(a => a.client_id);
            filtered = filtered.filter(c => myIds.includes(c.client_id));
        }

        if (assignFilter === 'all') window.pfDueFilterStatus = 'all';

        if (window.pfDueFilterStatus === 'due') {
            filtered = filtered.filter(c => {
                const key = `${c.client_id}_${selectedPeriod}`;
                const t = globalPFESICMap[key] || { pfChallan: 'Pending', pfReturn: 'Pending', esicChallan: 'Pending', esicReturn: 'Pending' };
                const pfOk = !c.hasPF || (t.pfChallan === 'Done' && t.pfReturn === 'Done');
                const esicOk = !c.hasESIC || (t.esicChallan === 'Done' && t.esicReturn === 'Done');
                return !(pfOk && esicOk);
            });
        } else if (window.pfDueFilterStatus === 'overdue') {
            filtered = filtered.filter(c => {
                const key = `${c.client_id}_${selectedPeriod}`;
                const t = globalPFESICMap[key] || { pfChallan: 'Pending', pfReturn: 'Pending', esicChallan: 'Pending', esicReturn: 'Pending' };
                const pfOk = !c.hasPF || (t.pfChallan === 'Done' && t.pfReturn === 'Done');
                const esicOk = !c.hasESIC || (t.esicChallan === 'Done' && t.esicReturn === 'Done');
                const isCompleted = pfOk && esicOk;
                if (isCompleted) return false;

                const fDate = window.globalPFESICFollowupMap?.[key] || '';
                const isOverdue = fDate ? (new Date(fDate) < new Date().setHours(0,0,0,0)) : false;
                return isOverdue;
            });
        }
        if (searchInput) filtered = filtered.filter(c => (c.display_name || '').toLowerCase().includes(searchInput));
        if (svcFilter === 'pf')   filtered = filtered.filter(c => c.hasPF);
        if (svcFilter === 'esic') filtered = filtered.filter(c => c.hasESIC);

        // Build processed rows
        const processed = filtered.map(c => {
            const key = `${c.client_id}_${selectedPeriod}`;
            const track = globalPFESICMap[key] || {
                pfChallan: 'Pending', pfReturn: 'Pending',
                esicChallan: 'Pending', esicReturn: 'Pending',
                billStatus: 'Unbilled', isCall: 'Pending', advance: 'Pending', filingDate: ''
            };
            const assignment = (window.globalAssignmentsList || []).find(a =>
                a.client_id === c.client_id && a.service_type &&
                (window.globalPFAllowedServices || []).some(as => a.service_type.toLowerCase() === (as || '').toLowerCase())
            );
            const assigneeName = assignment?.maker_id
                ? ((window.globalTeamMembers || []).find(u => u.id === assignment.maker_id)?.name || 'Unknown')
                : 'Unassigned';
            const pfFiledUpto = window.globalPFRtUptoMap?.[c.client_id] || '';
            const esicFiledUpto = window.globalEsicRtUptoMap?.[c.client_id] || '';
            return { client: c, display_name: c.display_name || '', hasPF: c.hasPF, hasESIC: c.hasESIC, track, assigneeName, key, pfFiledUpto, esicFiledUpto };
        });

        // Sort
        processed.sort((a, b) => {
            const va = String(a[pfesicSortCol] || '');
            const vb = String(b[pfesicSortCol] || '');
            return pfesicSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        // Stats
        let pfChallanPend = 0, pfReturnPend = 0, esicChallanPend = 0, esicReturnPend = 0, fullyDone = 0;
        processed.forEach(item => {
            const t = item.track;
            if (item.hasPF && t.pfChallan !== 'Done') pfChallanPend++;
            if (item.hasPF && t.pfReturn  !== 'Done') pfReturnPend++;
            if (item.hasESIC && t.esicChallan !== 'Done') esicChallanPend++;
            if (item.hasESIC && t.esicReturn  !== 'Done') esicReturnPend++;
            const pfOk   = !item.hasPF   || (t.pfChallan === 'Done' && t.pfReturn === 'Done');
            const esicOk = !item.hasESIC || (t.esicChallan === 'Done' && t.esicReturn === 'Done');
            if (pfOk && esicOk) fullyDone++;
        });

        const setEl = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };
        setEl('pf-total-count',          processed.length);
        setEl('pf-pending-challan-count', pfChallanPend);
        setEl('pf-pending-return-count',  pfReturnPend);
        setEl('pf-esic-challan-pending',  esicChallanPend);
        setEl('pf-esic-return-pending',   esicReturnPend);
        setEl('pf-completed-filings-count', fullyDone);

        tbody.innerHTML = '';
        if (processed.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-slate-400 italic">No clients found.</td></tr>';
            return;
        }

        processed.forEach((item, idx) => {
            const c = item.client;
            const t = item.track;
            const safeName = item.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const period   = selectedPeriod;

            // Generic status cell builder
            const mkCell = (field, isDone, isNA) => {
                if (isNA) return `<td class="px-1 py-3 text-center border-l border-gray-100 bg-slate-50/60"><span class="text-slate-300 font-bold text-sm">—</span></td>`;
                const label = _pfFieldLabel(field);
                if (isDone) return `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/30">
                    <button onclick="openPFDrawer('${c.client_id}','${safeName}','${field}','${label}','${period}',true)"
                        class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition border border-transparent hover:border-emerald-200">
                        <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                    </button></td>`;
                return `<td class="px-1 py-3 text-center border-l border-gray-100">
                    <button onclick="openPFDrawer('${c.client_id}','${safeName}','${field}','${label}','${period}',false)"
                        class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                        <i class="fa-solid fa-check text-sm"></i>
                    </button></td>`;
            };

            // Call
            const callCell = t.isCall === 'Done'
                ? `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openPFDrawer('${c.client_id}','${safeName}','isCall','Call / Contact','${period}',true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition border border-transparent hover:border-emerald-200"><div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>`
                : `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openPFDrawer('${c.client_id}','${safeName}','isCall','Call / Contact','${period}',false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;

            // Advance
            const advCell = t.advance === 'Received'
                ? `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openPFDrawer('${c.client_id}','${safeName}','advance','Advance Fee','${period}',true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition"><span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">Rcvd</span></button></td>`
                : `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openPFDrawer('${c.client_id}','${safeName}','advance','Advance Fee','${period}',false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-400 hover:text-indigo-600 transition flex items-center justify-center"><span class="text-[10px] font-bold text-slate-400">Pend</span></button></td>`;

            // Bill
            const allReturnsDone = (!item.hasPF || t.pfReturn === 'Done') && (!item.hasESIC || t.esicReturn === 'Done');
            const isBilled = t.billStatus === 'Billed';
            let billCell = '';
            if (isBilled) {
                billCell = `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="promptCancelPFBill('${c.client_id}','${safeName}','${period}')" class="w-full h-8 flex items-center justify-center rounded hover:bg-red-50 text-blue-600 hover:text-red-600 transition" title="Click to cancel billing"><div class="w-6 h-6 rounded-full bg-blue-100 text-current flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>`;
            } else if (allReturnsDone) {
                billCell = `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="preparePFBill('${c.client_id}','${safeName}','${period}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-1 rounded text-xs font-bold transition shadow-sm">Bill</button></td>`;
            } else {
                billCell = `<td class="px-1 py-3 text-center border-l border-gray-100"><div class="w-full h-8"></div></td>`;
            }

            // Filing date
            const dateStr = t.filingDate ? new Date(t.filingDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
            const filingCell = `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openPFDrawer('${c.client_id}','${safeName}','filingDate','Filing Date','${period}',${t.filingDate ? 'true' : 'false'})" class="w-full h-8 rounded hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center font-black text-[12px]">${dateStr}</button></td>`;

            // Service badges
            const svcBadges = [
                item.hasPF   ? `<span class="px-1 py-0.5 bg-blue-50 text-blue-600 border border-blue-100 rounded text-[8px] font-black">PF</span>` : '',
                item.hasESIC ? `<span class="px-1 py-0.5 bg-violet-50 text-violet-600 border border-violet-100 rounded text-[8px] font-black">ESIC</span>` : ''
            ].join('');

            const assigneeBadge = item.assigneeName !== 'Unassigned'
                ? `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${item.assigneeName.split(' ')[0]}</span>`
                : '';

            const fDate = window.globalPFESICFollowupMap?.[item.key] || '';
            let followupBadge = '';
            if (fDate) {
                const parts = fDate.split('-');
                const formattedDate = (parts.length === 3) ? `${parts[2]}-${parts[1]}-${parts[0]}` : fDate;
                const isOverdue = new Date(fDate) < new Date().setHours(0,0,0,0);
                const tagClass = isOverdue ? 'bg-red-50 text-red-600 border-red-100 animate-pulse' : 'bg-slate-50 text-slate-500 border-slate-100';
                followupBadge = `<span class="px-1.5 py-0.5 ${tagClass} rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center border leading-none"><i class="fa-solid fa-clock mr-1"></i>Followup: ${formattedDate}</span>`;
            }

            // formatUpto helper
            const formatUpto = (periodStr, isNA, extraClass = '') => {
                if (isNA) return `<td class="px-1 py-3 text-center border-l border-gray-100 bg-slate-50/60 ${extraClass}"><span class="text-slate-300 font-bold text-sm">—</span></td>`;
                if (!periodStr) return `<td class="px-1 py-3 text-center border-l border-gray-100 ${extraClass}"><span class="text-slate-300 font-bold text-sm">—</span></td>`;
                const [y, m] = periodStr.split('-');
                const d = new Date(y, parseInt(m) - 1, 1);
                const disp = d.toLocaleDateString('en-IN', {month:'short', year:'2-digit'});
                return `<td class="px-1 py-3 text-center border-l border-gray-100 ${extraClass}">
                    <span class="text-indigo-700 font-bold text-xs bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100 whitespace-nowrap">${disp}</span>
                </td>`;
            };

            const pfFiledUptoCell = formatUpto(item.pfFiledUpto, !item.hasPF);
            const esicFiledUptoCell = formatUpto(item.esicFiledUpto, !item.hasESIC, 'border-r border-slate-200');

            tbody.innerHTML += `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                <td class="px-2 py-3 text-center text-xs font-bold text-slate-400">${idx + 1}</td>
                <td class="px-3 py-3 border-r border-slate-100 min-w-[180px]">
                    <span onclick="openUniversalClientProfile('${c.client_id}')" class="font-black text-slate-800 hover:text-indigo-600 cursor-pointer text-[13px] hover:underline leading-tight block">${item.display_name}</span>
                    <div class="flex items-center gap-1.5 flex-wrap mt-1">${svcBadges}${assigneeBadge}${followupBadge}</div>
                </td>
                ${pfFiledUptoCell}
                ${esicFiledUptoCell}
                ${callCell}
                ${advCell}
                ${mkCell('pfChallan',   t.pfChallan   === 'Done', !item.hasPF)}
                ${mkCell('pfReturn',    t.pfReturn    === 'Done', !item.hasPF)}
                ${mkCell('esicChallan', t.esicChallan === 'Done', !item.hasESIC)}
                ${mkCell('esicReturn',  t.esicReturn  === 'Done', !item.hasESIC)}
                ${billCell}
                ${filingCell}
            </tr>`;
        });
    }

    function sortPfTable(field) {
        if (pfesicSortCol === field) pfesicSortAsc = !pfesicSortAsc;
        else { pfesicSortCol = field; pfesicSortAsc = true; }
        renderFilteredPFTable();
    }

    async function _savePFESICField(clientId, period, field, status, remark, filingDate) {
        const key = `${clientId}_${period}`;
        if (!globalPFESICMap[key]) {
            globalPFESICMap[key] = { pfChallan: 'Pending', pfReturn: 'Pending', esicChallan: 'Pending', esicReturn: 'Pending', billStatus: 'Unbilled', isCall: 'Pending', advance: 'Pending', filingDate: '' };
        }
        globalPFESICMap[key][field] = status;
        if (filingDate) globalPFESICMap[key].filingDate = filingDate;
        renderFilteredPFTable();

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) throw new Error("No host client found.");

        const note = `[PFESIC_LOG] ${clientId}|${period}|${field}|${status}|${remark || ''}|${filingDate || ''}`;
        const { error } = await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note }]);
        if (error) throw error;
    }

    // Legacy compat
    async function savePFStatus(clientId, period, field, value) {
        await _savePFESICField(clientId, period, field, value, '', '');
    }

    async function openPFDrawer(clientId, clientName, columnKey, taskName, period, isDone) {
        try {
            document.getElementById('pfDrawerClientId').value  = clientId;
            document.getElementById('pfDrawerPeriod').value    = period;
            document.getElementById('pfDrawerColumn').value    = columnKey;
            document.getElementById('pfDrawerClientName').innerText  = clientName;
            document.getElementById('pfDrawerTaskName').textContent  = `${taskName} — ${_pfPeriodDisplay(period)}`;
            document.getElementById('pfDrawerNote').value      = '';

            const transferSelect = document.getElementById('pfTransferUserSelect');
            if (transferSelect) {
                transferSelect.innerHTML = '<option value="">— No Transfer —</option>';
                (window.globalTeamMembers || []).forEach(u => {
                    transferSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`;
                });
                const assignment = (window.globalAssignmentsList || []).find(a =>
                    a.client_id === clientId && a.service_type &&
                    (window.globalPFAllowedServices || []).some(as => a.service_type.toLowerCase() === (as || '').toLowerCase())
                );
                if (assignment?.maker_id) transferSelect.value = assignment.maker_id;
            }

            const dateDiv = document.getElementById('pfDrawerFilingDateDiv');
            if (columnKey === 'filingDate' || ((columnKey === 'pfReturn' || columnKey === 'esicReturn') && !isDone)) {
                dateDiv.classList.remove('hidden');
                document.getElementById('pfDrawerFilingDate').value = new Date().toISOString().split('T')[0];
            } else {
                dateDiv.classList.add('hidden');
            }

            const btnNote = document.getElementById('pfSaveNoteOnlyBtn');
            const btnDone = document.getElementById('pfSaveTaskBtn');
            const doneText   = columnKey === 'advance' ? 'Mark Received' : columnKey === 'billStatus' ? 'Mark Billed' : 'Mark Done';
            const revertText = columnKey === 'billStatus' ? 'Revert to Unbilled' : 'Revert to Pending';

            if (isDone) {
                btnDone.className = 'flex-1 bg-rose-500 hover:bg-rose-600 text-white px-4 py-3 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2';
                btnDone.setAttribute('onclick', 'savePFTaskFromDrawer(true)');
                btnDone.innerHTML = `<i class="fa-solid fa-rotate-left"></i> ${revertText}`;
            } else {
                btnDone.className = 'flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2';
                btnDone.setAttribute('onclick', 'savePFTaskFromDrawer(false)');
                btnDone.innerHTML = `<i class="fa-solid fa-check-double"></i> ${doneText}`;
            }
            btnNote.className = 'flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-3 rounded-xl font-bold transition shadow-sm flex justify-center items-center gap-2';

            const key = `${clientId}_${period}`;
            const fDate = window.globalPFESICFollowupMap?.[key] || '';
            document.getElementById('pfDrawerFollowupDate').value = fDate;

            document.getElementById('pfTaskDrawer').classList.remove('hidden');

            // Load history
            const tl = document.getElementById('pfDrawerHistoryTimeline');
            tl.innerHTML = '<div class="text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading history...</div>';

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (hostClientId) {
                const { data: logs } = await supabaseClient.from('task_logs').select('*, users(name)')
                    .or(`note.ilike.%[PFESIC_LOG] ${clientId}|${period}|%,note.ilike.%[PF_LOG] ${clientId}|${period}|%,note.ilike.%[PF_TRACKING] ${clientId}|${period}|%`)
                    .order('timestamp', { ascending: false });

                const filteredLogs = (logs || []).filter(log => {
                    if (log.note.startsWith('[PFESIC_LOG]')) {
                        return log.note.replace('[PFESIC_LOG] ', '').split('|')[2] === columnKey;
                    }
                    if (log.note.startsWith('[PF_LOG]')) {
                        const parts = log.note.replace('[PF_LOG] ', '').split('|');
                        const fieldMap = { challanStatus: 'pfChallan', returnStatus: 'pfReturn' };
                        return (fieldMap[parts[2]] || parts[2]) === columnKey;
                    }
                    return log.note.startsWith('[PF_TRACKING]');
                });

                tl.innerHTML = '';
                if (filteredLogs.length === 0) {
                    tl.innerHTML = '<div class="text-xs text-gray-400 italic py-2">No history for this task yet.</div>';
                } else {
                    filteredLogs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                        let msg = '';
                        if (log.note.startsWith('[PFESIC_LOG]')) {
                            const p = log.note.replace('[PFESIC_LOG] ', '').split('|');
                            msg = `Status → <strong>${p[3] || 'Updated'}</strong>`;
                            if (p[4]) msg += `<br><span class="text-gray-600 italic">"${p[4]}"</span>`;
                            if (p[5]) msg += `<br><span class="text-xs text-indigo-600 font-medium">Date: ${p[5]}</span>`;
                        } else if (log.note.startsWith('[PF_LOG]')) {
                            const p = log.note.replace('[PF_LOG] ', '').split('|');
                            msg = `Status → <strong>${p[3] || 'Updated'}</strong>`;
                            if (p[4]) msg += `<br><span class="text-gray-600 italic">"${p[4]}"</span>`;
                        } else {
                            const p = log.note.replace('[PF_TRACKING] ', '').split('|');
                            msg = `<span class="text-xs font-bold text-amber-600 bg-amber-50 px-1 rounded border border-amber-100">Legacy</span> Challan: ${p[2]||'?'}, Return: ${p[3]||'?'}`;
                        }
                        tl.innerHTML += `
                        <div class="bg-white rounded-xl border border-gray-200 mb-3 shadow-sm overflow-hidden border-l-4 border-l-indigo-400">
                            <div class="px-4 py-2 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                                <span class="text-xs font-bold text-gray-500 uppercase">${date}</span>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold text-indigo-600 uppercase">${log.users?.name || 'System'}</span>
                                    <button onclick="deletePFLog('${log.log_id}','${clientId}','${columnKey}','${period}')" class="text-gray-400 hover:text-red-500 transition p-1"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                                </div>
                            </div>
                            <div class="p-4"><p class="text-sm text-gray-700">${msg}</p></div>
                        </div>`;
                    });
                }
            }
        } catch (err) {
            console.error("Error opening PF drawer:", err);
        }
    }

    async function deletePFLog(logId, clientId, columnKey, period) {
        if (!confirm("Delete this log? Status will revert on next reload.")) return;
        try {
            const { error } = await supabaseClient.from('task_logs').delete().eq('log_id', logId);
            if (error) throw error;
            closePFDrawer();
            await loadPFCenterData();
        } catch (err) { showToast("Error: " + err.message); }
    }

    async function checkAndSaveFollowupAndAssignment(clientId, period) {
        // 1. Mandatory User Assignment Check
        const assignment = (window.globalAssignmentsList || []).find(a =>
            a.client_id === clientId && a.service_type &&
            (window.globalPFAllowedServices || []).some(as => a.service_type.toLowerCase() === (as || '').toLowerCase())
        );
        const currentAssignee = assignment?.maker_id || '';
        const transferTo = document.getElementById('pfTransferUserSelect').value;

        if (!currentAssignee && !transferTo) {
            showToast("User assignment is mandatory! Please select a user to assign to this client.");
            return false;
        }

        // 2. Followup Date Check
        const key = `${clientId}_${period}`;
        const currentFollowupDate = window.globalPFESICFollowupMap?.[key] || '';
        const isOverdue = currentFollowupDate ? (new Date(currentFollowupDate) < new Date().setHours(0,0,0,0)) : false;
        const newFollowupDate = document.getElementById('pfDrawerFollowupDate').value;

        if (isOverdue) {
            if (!newFollowupDate) {
                showToast("The current follow-up date has passed. A new follow-up date is mandatory!");
                return false;
            }
            if (new Date(newFollowupDate) < new Date().setHours(0,0,0,0)) {
                showToast("The new follow-up date cannot be in the past!");
                return false;
            }
        }

        // 3. Save Followup if changed
        if (newFollowupDate !== currentFollowupDate) {
            const logFollowup = `[PFESIC_FOLLOWUP] ${clientId}|${period}|${newFollowupDate}|Follow-up date updated from ${currentFollowupDate || 'None'} to ${newFollowupDate || 'None'}`;
            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (hostClientId) {
                const { error } = await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note: logFollowup }]);
                if (error) throw error;
            }
            if (!window.globalPFESICFollowupMap) window.globalPFESICFollowupMap = {};
            window.globalPFESICFollowupMap[key] = newFollowupDate;
        }

        // 4. Save User Assignment if selected/changed
        if (transferTo && transferTo !== currentAssignee) {
            await assignPFClient(clientId, transferTo);
        }

        return true;
    }

    async function savePFTaskFromDrawer(isRevert) {
        const btn = document.getElementById('pfSaveTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;
        try {
            const clientId  = document.getElementById('pfDrawerClientId').value;
            const period    = document.getElementById('pfDrawerPeriod').value;
            const columnKey = document.getElementById('pfDrawerColumn').value;
            const noteText  = document.getElementById('pfDrawerNote').value.trim();
            const filingDate = isRevert ? '' : (document.getElementById('pfDrawerFilingDate')?.value || '');

            const checkOk = await checkAndSaveFollowupAndAssignment(clientId, period);
            if (!checkOk) return;

            let status = 'Pending';
            if (!isRevert) {
                if (['pfChallan','pfReturn','esicChallan','esicReturn','isCall'].includes(columnKey)) status = 'Done';
                else if (columnKey === 'advance') status = 'Received';
                else if (columnKey === 'billStatus') status = 'Billed';
            } else {
                status = columnKey === 'billStatus' ? 'Unbilled' : 'Pending';
            }

            await _savePFESICField(clientId, period, columnKey, status, noteText || (isRevert ? 'Reverted' : 'Completed'), filingDate);

            closePFDrawer();
        } catch (err) { showToast("Error: " + err.message); }
        finally { btn.innerHTML = ogHtml; btn.disabled = false; }
    }

    async function savePFNoteOnlyFromDrawer() {
        const btn = document.getElementById('pfSaveNoteOnlyBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Recording...';
        btn.disabled = true;
        try {
            const clientId  = document.getElementById('pfDrawerClientId').value;
            const period    = document.getElementById('pfDrawerPeriod').value;
            const columnKey = document.getElementById('pfDrawerColumn').value;
            const noteText  = document.getElementById('pfDrawerNote').value.trim();
            const transferTo = document.getElementById('pfTransferUserSelect').value;

            const checkOk = await checkAndSaveFollowupAndAssignment(clientId, period);
            if (!checkOk) return;

            if (!noteText && !transferTo) return showToast("Please enter a remark or select a user to transfer.");

            const key = `${clientId}_${period}`;
            const currentStatus = globalPFESICMap[key]?.[columnKey] || 'Pending';
            if (noteText) await _savePFESICField(clientId, period, columnKey, currentStatus, noteText, '');
            closePFDrawer();
            renderFilteredPFTable();
        } catch (err) { showToast("Error: " + err.message); }
        finally { btn.innerHTML = ogHtml; btn.disabled = false; }
    }

    function closePFDrawer() {
        document.getElementById('pfTaskDrawer').classList.add('hidden');
    }

    async function assignPFClient(clientId, makerId) {
        try {
            const client = globalPFESICClients.find(c => c.client_id === clientId) || {};
            const servicesToAssign = [];
            if (client.hasPF) servicesToAssign.push('PF');
            if (client.hasESIC) servicesToAssign.push('ESIC');
            if (servicesToAssign.length === 0) servicesToAssign.push('PF & ESIC');

            for (const svc of servicesToAssign) {
                await supabaseClient.from('client_assignments').delete().eq('client_id', clientId).eq('service_type', svc);
            }

            if (makerId) {
                const inserts = servicesToAssign.map(svc => ({ client_id: clientId, service_type: svc, maker_id: makerId }));
                const { error } = await supabaseClient.from('client_assignments').insert(inserts);
                if (error) throw error;
            }

            if (!window.globalAssignmentsList) window.globalAssignmentsList = [];
            window.globalAssignmentsList = window.globalAssignmentsList.filter(a => !(a.client_id === clientId && servicesToAssign.includes(a.service_type)));
            if (makerId) {
                servicesToAssign.forEach(svc => {
                    window.globalAssignmentsList.push({
                        client_id: clientId,
                        service_type: svc,
                        maker_id: makerId
                    });
                });
            }
            renderFilteredPFTable();
        } catch (err) { showToast("Assignment error: " + err.message); }
    }

    // ==================== BULK BILL MODAL ====================
    window.openPFBulkBillModal = function() {
        const modal = document.getElementById('pfBulkBillModal');
        if (!modal) return;
        const selectedPeriod = document.getElementById('pfMonthFilter')?.value || '';
        if (!selectedPeriod) return showToast("Please select a period first!");

        const periodDisplay = _pfPeriodDisplay(selectedPeriod);
        document.getElementById('pfBulkBillModalPeriod').innerText = `Period: ${periodDisplay}`;

        const tbody = document.getElementById('pfBulkBillModalTableBody');
        tbody.innerHTML = '';
        let totalClients = 0, totalAmount = 0;
        window.pfBulkBillClientsList = [];

        globalPFESICClients.forEach(client => {
            const key = `${client.client_id}_${selectedPeriod}`;
            const track = globalPFESICMap[key] || {};
            const pfOk   = !client.hasPF   || track.pfReturn   === 'Done';
            const esicOk = !client.hasESIC || track.esicReturn === 'Done';
            const isBilled = !!(window.globalPFBilledMap?.[client.client_id]);
            if (pfOk && esicOk && !isBilled) {
                const rate = parseFloat(window.globalPFRatesMap?.[client.client_id]) || 0;
                totalClients++;
                totalAmount += rate;
                window.pfBulkBillClientsList.push({ client_id: client.client_id, display_name: client.display_name, rate, hasPF: client.hasPF, hasESIC: client.hasESIC });
                tbody.innerHTML += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="px-4 py-3 font-semibold text-slate-800">${client.display_name}</td>
                    <td class="px-4 py-3 text-right font-mono text-slate-600">₹${rate.toFixed(2)}</td>
                </tr>`;
            }
        });

        document.getElementById('pfBulkBillModalTotalClients').innerText = totalClients;
        document.getElementById('pfBulkBillModalTotalAmount').innerText  = `₹${totalAmount.toFixed(2)}`;
        if (totalClients === 0) tbody.innerHTML = `<tr><td colspan="2" class="text-center py-6 text-slate-400 italic">No unbilled clients with completed returns for this period.</td></tr>`;
        modal.classList.remove('hidden');
    };

    window.closePFBulkBillModal = function() {
        document.getElementById('pfBulkBillModal')?.classList.add('hidden');
    };

    window.generatePFBulkBills = async function() {
        if (!window.pfBulkBillClientsList?.length) return showToast("No clients to bill!");
        const selectedPeriod = document.getElementById('pfMonthFilter')?.value || '';
        const periodDisplay  = _pfPeriodDisplay(selectedPeriod);
        if (!confirm(`Generate PF & ESIC bills for ${window.pfBulkBillClientsList.length} clients for ${periodDisplay}?`)) return;

        closePFBulkBillModal();
        document.getElementById('pf-table-body').innerHTML = '<tr><td colspan="12" class="text-center py-8 text-slate-400 italic"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-600"></i><br>Generating Bulk Bills...</td></tr>';

        try {
            let firmId = null;
            const { data: s1 } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_pf_firm').maybeSingle();
            if (s1) firmId = s1.setting_value;
            else {
                const { data: s2 } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
                if (s2) firmId = s2.setting_value;
            }

            let successCount = 0;
            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            for (const client of window.pfBulkBillClientsList) {
                try {
                    const billNo = await window.getNextInvoiceNumber(firmId);
                    let label = 'PF & ESIC';
                    if (client.hasPF && !client.hasESIC) label = 'PF';
                    else if (!client.hasPF && client.hasESIC) label = 'ESIC';
                    const invoiceData = { client_id: client.client_id, service_name: `${label} Fees - ${periodDisplay}`, amount: client.rate, status: 'Unpaid', bill_number: billNo, generated_date: new Date().toISOString() };
                    if (firmId) invoiceData.firm_id = firmId;
                    const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                    if (error) throw error;
                    if (hostClientId) {
                        await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note: `[PFESIC_LOG] ${client.client_id}|${selectedPeriod}|billStatus|Billed|Bulk Bill Generated|` }]);
                    }
                    successCount++;
                } catch (err) { console.error(`Bill error for ${client.display_name}:`, err); }
            }
            showToast(`Successfully generated ${successCount} PF & ESIC bills!`);
            await loadPFCenterData();
        } catch (err) { showToast("Bulk billing error: " + err.message); await loadPFCenterData(); }
    };

    window.preparePFBill = async function(clientId, clientName, period) {
        const rate = window.globalPFRatesMap?.[clientId] || 0;
        const client = globalPFESICClients.find(c => c.client_id === clientId) || {};
        let label = 'PF & ESIC';
        if (client.hasPF && !client.hasESIC) label = 'PF';
        else if (!client.hasPF && client.hasESIC) label = 'ESIC';

        const confirmed = prompt(`Confirm ${label} billing rate for ${clientName} (${_pfPeriodDisplay(period)}):`, rate);
        if (confirmed === null) return;
        const amount = parseFloat(confirmed);
        if (isNaN(amount)) return showToast("Invalid amount!");

        const periodDisplay = _pfPeriodDisplay(period);
        try {
            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (amount === 0) {
                if (hostClientId) await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note: `[PFESIC_LOG] ${clientId}|${period}|billStatus|Billed|Marked Free (₹0)|` }]);
                showToast("Marked as completed with ₹0 rate.");
            } else {
                let firmId = null;
                const { data: s1 } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_pf_firm').maybeSingle();
                if (s1) firmId = s1.setting_value;
                else {
                    const { data: s2 } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
                    if (s2) firmId = s2.setting_value;
                }
                const billNo = await window.getNextInvoiceNumber(firmId);
                const invoiceData = { client_id: clientId, service_name: `${label} Fees - ${periodDisplay}`, amount, status: 'Unpaid', bill_number: billNo, generated_date: new Date().toISOString() };
                if (firmId) invoiceData.firm_id = firmId;
                const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                if (error) throw error;
                if (hostClientId) await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note: `[PFESIC_LOG] ${clientId}|${period}|billStatus|Billed|Bill Prepared (₹${amount})|` }]);
                showToast("Bill prepared successfully!");
            }
            await loadPFCenterData();
        } catch (err) { showToast("Error: " + err.message); }
    };

    window.promptCancelPFBill = async function(clientId, clientName, period) {
        const client = globalPFESICClients.find(c => c.client_id === clientId) || {};
        let label = 'PF & ESIC';
        if (client.hasPF && !client.hasESIC) label = 'PF';
        else if (!client.hasPF && client.hasESIC) label = 'ESIC';
        if (!confirm(`Cancel ${label} billing for ${clientName}?`)) return;
        const reason = prompt("Reason for cancellation (required):");
        if (!reason?.trim()) { showToast("A reason is required."); return; }

        const periodDisplay = _pfPeriodDisplay(period);
        try {
            const { data: invoices } = await supabaseClient.from('invoices').select('*').eq('client_id', clientId).neq('status', 'Cancelled');
            if (invoices?.length) {
                const matching = invoices.filter(inv => inv.service_name?.includes(periodDisplay));
                if (matching.length) {
                    const pkCol = matching[0].invoice_id !== undefined ? 'invoice_id' : 'id';
                    await supabaseClient.from('invoices').update({ status: 'Cancelled' }).in(pkCol, matching.map(inv => inv[pkCol]));
                }
            }
            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (hostClientId) await supabaseClient.from('task_logs').insert([{ client_id: hostClientId, user_id: currentUser.id, note: `[PFESIC_LOG] ${clientId}|${period}|billStatus|Unbilled|Cancelled: ${reason}|` }]);
            showToast("Billing cancelled successfully.");
            await loadPFCenterData();
        } catch (err) { showToast("Error: " + err.message); }
    };

    window.openPFDrawer = openPFDrawer;
    window.savePFTaskFromDrawer = savePFTaskFromDrawer;
    window.savePFNoteOnlyFromDrawer = savePFNoteOnlyFromDrawer;
    window.deletePFLog = deletePFLog;
</script>
