<script>
    console.log("Executing Logic_Billing.html script tag...");
    // ==========================================
    // MODULE: BILLING & INVOICING
    // ==========================================

    let globalInvoicesList = [];

    // Small memoized id->row lookups (rebuilt only when the underlying list is reloaded,
    // i.e. a new array reference) so repeated GST calc / render passes over many invoices
    // don't re-scan the full clients/firms lists with .find() every time.
    let _billingFirmsMapSrc = null, _billingFirmsMap = null;
    function getBillingFirmsMap() {
        const src = window.globalBillingFirmsList || [];
        if (_billingFirmsMapSrc !== src) {
            _billingFirmsMap = new Map(src.map(f => [String(f.id), f]));
            _billingFirmsMapSrc = src;
        }
        return _billingFirmsMap;
    }
    let _billingClientsMapSrc = null, _billingClientsMap = null;
    function getBillingClientsMap() {
        const src = window.globalAllClientsList || globalClientsList || [];
        if (_billingClientsMapSrc !== src) {
            _billingClientsMap = new Map(src.map(c => [c.client_id, c]));
            _billingClientsMapSrc = src;
        }
        return _billingClientsMap;
    }

    window.getGstCalculation = function(firmId, clientId, baseAmount) {
        let hasGst = false;
        let firmGst = '';
        let clientGst = '';

        const firm = getBillingFirmsMap().get(String(firmId));
        if (firm && firm.gstin) {
            try {
                const json = JSON.parse(firm.gstin);
                firmGst = json.gst || '';
                const noGst = json.no_gst === true;
                if (firmGst.trim() !== '' && !noGst) {
                    hasGst = true;
                }
            } catch (e) {}
        }

        if (!hasGst) {
            const total = Math.round(baseAmount);
            const roundOff = Math.round((total - baseAmount) * 100) / 100;
            return {
                hasGst: false,
                taxable: baseAmount,
                cgst: 0,
                sgst: 0,
                igst: 0,
                total: total,
                roundOff: roundOff,
                gstType: 'none',
                firmGst: ''
            };
        }

        const client = getBillingClientsMap().get(clientId);
        if (client && client.gstin) {
            clientGst = client.gstin.trim();
        }

        const firmState = firmGst.trim().substring(0, 2);
        const clientState = clientGst.substring(0, 2);

        const isNumeric = (str) => /^\d{2}$/.test(str);

        let gstType = 'CGST_SGST';
        if (isNumeric(firmState) && isNumeric(clientState) && firmState !== clientState) {
            gstType = 'IGST';
        }

        const cgst = gstType === 'CGST_SGST' ? Math.round(baseAmount * 0.09 * 100) / 100 : 0;
        const sgst = gstType === 'CGST_SGST' ? Math.round(baseAmount * 0.09 * 100) / 100 : 0;
        const igst = gstType === 'IGST' ? Math.round(baseAmount * 0.18 * 100) / 100 : 0;
        const totalUnrounded = baseAmount + cgst + sgst + igst;
        const total = Math.round(totalUnrounded);
        const roundOff = Math.round((total - totalUnrounded) * 100) / 100;

        return {
            hasGst: true,
            taxable: baseAmount,
            cgst: cgst,
            sgst: sgst,
            igst: igst,
            total: total,
            roundOff: roundOff,
            gstType: gstType,
            firmGst: firmGst,
            clientGst: clientGst
        };
    }

    window.getNextInvoiceNumber = async function(firmId, isCreditNote = false) {
        const currentYearStr = new Date().getFullYear().toString().substr(-2);
        let prefix = isCreditNote ? `CN-${currentYearStr}-` : `INV-${currentYearStr}-`;
        let startingNo = 1;
        let queryPattern = isCreditNote ? `CN-${currentYearStr}-%` : `INV-${currentYearStr}-%`;

        if (firmId) {
            const { data: firm } = await supabaseClient.from('billing_firms').select('gstin').eq('id', firmId).single();
            if (firm && firm.gstin) {
                try {
                    const json = JSON.parse(firm.gstin);
                    if (isCreditNote) {
                        if (json.starting_cn_number) startingNo = parseInt(json.starting_cn_number, 10);
                        if (json.cn_prefix) {
                            prefix = json.cn_prefix;
                            queryPattern = `${prefix}%`;
                        }
                    } else {
                        if (json.starting_bill_number) startingNo = parseInt(json.starting_bill_number, 10);
                        if (json.bill_prefix) {
                            prefix = json.bill_prefix;
                            queryPattern = `${prefix}%`;
                        }
                    }
                } catch (e) {
                    // Not JSON
                }
            }
        }

        const { data } = await supabaseClient.from('invoices').select('bill_number').ilike('bill_number', queryPattern).order('generated_date', { ascending: false }).limit(50); 
        let maxNum = 0;
        if (data && data.length > 0) {
            data.forEach(inv => { 
                if (inv.bill_number) { 
                    // Extract number from the end of the string
                    const match = inv.bill_number.match(/(\d+)$/);
                    if (match) {
                        const num = parseInt(match[1], 10); 
                        if (!isNaN(num) && num > maxNum) maxNum = num; 
                    }
                } 
            }); 
        }

        const nextNum = Math.max(maxNum + 1, startingNo);
        // If it uses standard prefix, pad it to 3 digits. If custom, maybe just append or pad? Let's pad just in case.
        return `${prefix}${nextNum.toString().padStart(3, '0')}`;
    }

    // Supabase caps every response at 1000 rows regardless of .limit(), so page through
    // with fetchAllRows (Logic_Core) — otherwise bills older than the newest 1000 never load.
    function fetchAllInvoices() {
        return fetchAllRows((from, to) => supabaseClient.from('invoices')
            .select('invoice_id, bill_number, client_id, firm_id, service_name, amount, status, generated_date')
            .order('generated_date', { ascending: false })
            .order('invoice_id', { ascending: false })
            .range(from, to));
    }

    window.loadBillingData = async function() {
        const tbody = document.getElementById('billing-table-body'); tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>';
        
        console.time('BillingTotalLoad');
        try {
            console.time('SupabaseParallelFetch');
            // Execute invoices, billing_firms, and (only if not already warm from login) the
            // shared clients/services cache concurrently, instead of always re-fetching the
            // whole global cache before even starting the invoices query. refreshGlobalCache()
            // already runs once at login, so on a normal visit this cache is already populated
            // and Billing can skip straight to fetching just its own data.
            const promises = [fetchAllInvoices()];

            const fetchFirms = !window.globalBillingFirmsList || window.globalBillingFirmsList.length === 0;
            const firmsIndex = fetchFirms ? promises.push(supabaseClient.from('billing_firms').select('*')) - 1 : -1;

            const needsClientCache = !window.globalAllClientsList || window.globalAllClientsList.length === 0;
            if (needsClientCache) {
                promises.push(refreshGlobalCache());
            }

            const results = await Promise.all(promises);
            console.timeEnd('SupabaseParallelFetch');

            const invoicesRes = results[0];
            const firmsRes = firmsIndex >= 0 ? results[firmsIndex] : null;

            if (firmsRes && firmsRes.data) {
                window.globalBillingFirmsList = firmsRes.data;
            }
            
            let data = invoicesRes.data;
            let error = invoicesRes.error;
            
            if (error) {
                console.error("Primary query failed:", error);
                showToast("Primary query failed: " + error.message);
                console.time('SupabaseInvoicesFetchFallback');
                const fallback = await fetchAllInvoices();
                console.timeEnd('SupabaseInvoicesFetchFallback');
                
                if (fallback.error) {
                    showToast("Fallback query failed: " + fallback.error.message);
                }
                data = fallback.data;
            }
            
            // Map relations locally in JS in <1ms to eliminate slow database joins!
            // Note: billing_firms.gstin can carry a large embedded logo/QR image (needed only
            // in the single-invoice print preview), so we attach just id/firm_name here rather
            // than the full firm row — otherwise every row's onclick handler below would
            // serialize that image, which is what was making this table slow to render.
            // openInvoicePreview() already lazy-fetches the full gstin blob for the one
            // invoice being opened, so nothing here loses functionality.
            const invoices = data || [];
            const clientsMap = getBillingClientsMap();
            const firmsMap = getBillingFirmsMap();
            invoices.forEach(inv => {
                inv.clients = clientsMap.get(inv.client_id) || { display_name: 'Unknown' };
                const firm = firmsMap.get(String(inv.firm_id));
                inv.billing_firms = firm ? { id: firm.id, firm_name: firm.firm_name } : null;
            });

            globalInvoicesList = invoices;
            console.time('BillingFilterAndRender');
            window.filterBills();
            console.timeEnd('BillingFilterAndRender');
        } catch (err) {
            showToast("Exception loading invoices: " + err.message);
        }
        console.timeEnd('BillingTotalLoad');
    }

    window.renderBillsTable = function(invoices) {
        const tbody = document.getElementById('billing-table-body'); tbody.innerHTML = '';
        if (!invoices || invoices.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-500">No invoices found.</td></tr>'; document.getElementById('total-unbilled').innerText = '₹0'; return; }
        let totalInvoiced = 0;
        const htmlRows = [];
        invoices.forEach(inv => {
            try {
                const dateStr = new Date(inv.generated_date || inv.created_at || new Date()).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
                const isCancelled = inv.status === 'Cancelled';
                
                const baseAmt = parseFloat(inv.amount) || 0;
                const calc = window.getGstCalculation(inv.firm_id, inv.client_id, baseAmt);
                const displayAmt = calc.total;

                if (!isCancelled) totalInvoiced += displayAmt;
                const rowStyle = isCancelled ? 'opacity-60 bg-gray-50' : 'hover:bg-gray-50 transition';
                let billNoDisplay = isCancelled ? `<span class="line-through text-gray-400">${inv.bill_number || 'N/A'}</span> <span class="text-red-500 text-xs font-bold bg-red-50 px-2 py-0.5 rounded ml-2">CANCELLED</span>` : `<span class="font-bold text-gray-800">${inv.bill_number || 'N/A'}</span>`;
                if (!isCancelled && displayAmt < 0) {
                    billNoDisplay += ` <span class="text-emerald-600 text-[10px] font-bold bg-emerald-50 px-1.5 py-0.5 rounded ml-2 uppercase tracking-wider">Credit Note</span>`;
                }
                const safeId = inv.invoice_id !== undefined ? inv.invoice_id : inv.id;
                
                const actionButtons = isCancelled ? `<button onclick='openInvoicePreview(${JSON.stringify(inv).replace(/'/g, "&#39;")})' class="bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm"><i class="fa-solid fa-eye mr-1"></i> View</button>` : `<div class="flex items-center justify-end gap-2"><button onclick='openInvoicePreview(${JSON.stringify(inv).replace(/'/g, "&#39;")})' class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm" title="View / Print"><i class="fa-solid fa-print"></i></button><button onclick="editInvoice('${safeId}')" class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white border border-blue-200 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm" title="Edit Bill"><i class="fa-solid fa-pen"></i></button><button onclick="cancelInvoice('${safeId}')" class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm" title="Cancel Bill"><i class="fa-solid fa-ban"></i></button></div>`;
                const checked = window.selectedBillIds.has(String(safeId)) ? 'checked' : '';
                htmlRows.push(`<tr class="border-b border-gray-100 ${rowStyle}"><td class="pl-4 pr-1 py-3"><input type="checkbox" class="bill-row-cb w-4 h-4 accent-indigo-600 cursor-pointer" data-id="${safeId}" ${checked} onchange="toggleBillSelection('${safeId}', this.checked)"></td><td class="px-3 py-3 text-sm">${billNoDisplay}</td><td class="px-3 py-3 font-bold text-blue-600 hover:underline cursor-pointer" onclick="openUniversalClientProfile('${inv.client_id}')">${inv.clients?.display_name || 'Unknown'}</td><td class="px-3 py-3 text-gray-600">${inv.service_name}</td><td class="px-3 py-3 text-gray-500 whitespace-nowrap">${dateStr}</td><td class="px-3 py-3 font-bold text-gray-800">&#8377;${displayAmt.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td><td class="px-3 py-3 text-right">${actionButtons}</td></tr>`);
            } catch (e) {
                console.error("Error rendering invoice:", e);
            }
        });
        tbody.innerHTML = htmlRows.join('');
        window.currentVisibleBills = invoices;
        window.updateBillBulkBar();
        document.getElementById('total-unbilled').innerText = '₹' + totalInvoiced.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    window.filterBills = function() {
        const globalQuery = document.getElementById('billSearchInput').value.toLowerCase();
        const noQuery = document.getElementById('filterBillNo').value.toLowerCase();
        const clientQuery = document.getElementById('filterClientName').value.toLowerCase();
        const serviceQuery = document.getElementById('filterService').value.toLowerCase();
        const startDateQuery = document.getElementById('filterStartDate').value;
        const endDateQuery = document.getElementById('filterEndDate').value;
        const amountQuery = document.getElementById('filterAmount').value.toLowerCase();
        const statusFilter = document.getElementById('billStatusFilter') ? document.getElementById('billStatusFilter').value : 'active';

        const filtered = globalInvoicesList.filter(inv => {
            const billNo = (inv.bill_number || '').toLowerCase();
            if (billNo.startsWith('external-')) return false;

            const isCancelled = inv.status === 'Cancelled';
            if (statusFilter === 'active' && isCancelled) return false;
            if (statusFilter === 'cancelled' && !isCancelled) return false;

            const clientName = (inv.clients?.display_name || '').toLowerCase();
            const service = (inv.service_name || '').toLowerCase();
            
            const d = new Date(inv.generated_date || inv.created_at);
            
            // Check inclusive/exclusive display amount matching the filter
            const baseAmt = parseFloat(inv.amount) || 0;
            const calc = window.getGstCalculation(inv.firm_id, inv.client_id, baseAmt);
            const displayAmt = calc.total;
            const amount = displayAmt ? displayAmt.toString() : '';

            // Global search checks bill no or client name
            const globalMatch = !globalQuery || billNo.includes(globalQuery) || clientName.includes(globalQuery);
            
            // Column filters
            const noMatch = !noQuery || billNo.includes(noQuery);
            const clientMatch = !clientQuery || clientName.includes(clientQuery);
            const serviceMatch = !serviceQuery || service.includes(serviceQuery);
            
            let dateMatch = true;
            if (startDateQuery || endDateQuery) {
                const invDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
                if (startDateQuery) {
                    const startD = new Date(startDateQuery);
                    if (invDate < new Date(startD.getFullYear(), startD.getMonth(), startD.getDate()).getTime()) dateMatch = false;
                }
                if (endDateQuery) {
                    const endD = new Date(endDateQuery);
                    if (invDate > new Date(endD.getFullYear(), endD.getMonth(), endD.getDate()).getTime()) dateMatch = false;
                }
            }
            
            const amountMatch = !amountQuery || amount.includes(amountQuery);

            return globalMatch && noMatch && clientMatch && serviceMatch && dateMatch && amountMatch;
        });
        
        window.currentFilteredBills = filtered;
        window.renderBillsTable(filtered);
    }
    
    window.exportBillingToCSV = function() {
        const bills = window.currentFilteredBills || globalInvoicesList || [];
        if (bills.length === 0) {
            showToast("No bills available to export.");
            return;
        }

        // Define CSV headers
        const headers = [
            'Bill No', 
            'Client Name', 
            'Service Description', 
            'Date', 
            'Taxable Value', 
            'CGST', 
            'SGST', 
            'IGST', 
            'Round Off',
            'Total Invoice Value', 
            'Billing Firm GSTIN', 
            'Client GSTIN', 
            'Status'
        ];
        
        // Map data to rows
        const rows = bills.map(inv => {
            const billNo = inv.bill_number || '';
            const clientName = inv.clients?.display_name ? `"${inv.clients.display_name.replace(/"/g, '""')}"` : '';
            const service = inv.service_name ? `"${inv.service_name.replace(/"/g, '""')}"` : '';
            
            const d = new Date(inv.generated_date || inv.created_at);
            const dateStr = d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
            
            const baseAmt = parseFloat(inv.amount) || 0;
            const calc = window.getGstCalculation(inv.firm_id, inv.client_id, baseAmt);
            
            const taxable = baseAmt;
            const cgst = calc.hasGst ? calc.cgst : 0;
            const sgst = calc.hasGst ? calc.sgst : 0;
            const igst = calc.hasGst ? calc.igst : 0;
            const roundOff = calc.roundOff || 0;
            const totalVal = calc.total;
            
            const firmGst = calc.hasGst ? calc.firmGst : '';
            const clientGst = calc.clientGst || '';
            
            const status = inv.status || 'GENERATED';

            return [
                billNo, 
                clientName, 
                service, 
                dateStr, 
                taxable.toFixed(2), 
                cgst.toFixed(2), 
                sgst.toFixed(2), 
                igst.toFixed(2), 
                roundOff.toFixed(2),
                totalVal.toFixed(2), 
                firmGst, 
                clientGst, 
                status
            ].join(',');
        });

        // Combine headers and rows
        const csvContent = headers.join(',') + '\n' + rows.join('\n');
        
        // Create Blob and trigger download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "billing_export_" + new Date().toISOString().substring(0, 10) + ".csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    window.toggleInvAlreadyBilled = function(checkbox) {
        const firmContainer = document.getElementById('invFirmSelectContainer');
        const proposedContainer = document.getElementById('invProposedBillNumberContainer');
        const gstBreakdown = document.getElementById('autoInvoiceGstBreakdown');
        const submitBtn = document.getElementById('generateInvBtn');
        
        if (checkbox.checked) {
            if (firmContainer) firmContainer.classList.add('hidden');
            if (proposedContainer) proposedContainer.classList.add('hidden');
            if (gstBreakdown) gstBreakdown.classList.add('hidden');
            if (submitBtn) submitBtn.innerText = "Mark as Billed";
        } else {
            if (firmContainer) firmContainer.classList.remove('hidden');
            if (submitBtn) submitBtn.innerText = "Generate & Save";
            window.updateAutoInvoiceProposedNumber();
        }
    }

    window.openAutoInvoiceModal = async function(task) { 
        window.autoInvoiceTask = task; 
        
        // Retrieve default firm
        let defaultFirmId = null;
        try {
            const { data: gstSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
            if (gstSetting) defaultFirmId = gstSetting.setting_value;
        } catch(e) {
            console.error("Error fetching default firm setting:", e);
        }

        const firmSelect = document.getElementById('invFirmSelect');
        if (firmSelect) {
            firmSelect.innerHTML = '<option value="">-- Select Billing Firm --</option>';
            if (!window.globalBillingFirmsList || window.globalBillingFirmsList.length === 0) {
                try {
                    const { data: firms } = await supabaseClient.from('billing_firms').select('*');
                    window.globalBillingFirmsList = firms || [];
                } catch (e) {
                    console.error("Error fetching billing firms:", e);
                }
            }
            if (window.globalBillingFirmsList) {
                window.globalBillingFirmsList.forEach(f => {
                    const isSelected = f.id === defaultFirmId ? 'selected' : '';
                    firmSelect.innerHTML += `<option value="${f.id}" ${isSelected}>${f.firm_name}</option>`;
                });
                if (defaultFirmId) {
                    firmSelect.value = defaultFirmId;
                }
            }
        }

        const titleEl = document.getElementById('autoInvoiceTitle');
        const descEl = document.getElementById('autoInvoiceDesc');
        const cancelBtn = document.getElementById('autoInvoiceCancelBtn');

        if (task && task.is_subsidy) {
            if (titleEl) titleEl.innerText = "Prepare Subsidy Bill";
            if (descEl) descEl.innerText = "Enter billing details to prepare the invoice for this subsidy case.";
            if (cancelBtn) cancelBtn.innerText = "Cancel";
        } else {
            if (titleEl) titleEl.innerText = "Task Completed!";
            if (descEl) descEl.innerText = "Would you like to generate an invoice for this service?";
            if (cancelBtn) cancelBtn.innerText = "Skip";
        }

        const proposedContainer = document.getElementById('invProposedBillNumberContainer');
        if (proposedContainer) proposedContainer.classList.add('hidden');
        
        const gstBreakdown = document.getElementById('autoInvoiceGstBreakdown');
        if (gstBreakdown) gstBreakdown.classList.add('hidden');

        const alreadyBilledCb = document.getElementById('invAlreadyBilled');
        if (alreadyBilledCb) {
            alreadyBilledCb.checked = false;
            window.toggleInvAlreadyBilled(alreadyBilledCb);
        }

        if(task) {
            document.getElementById('invClientName').innerText = task.clients?.display_name || 'Unknown Client';
            document.getElementById('invServiceName').innerText = task.services?.service_type || task.custom_task_name || 'Task';
            
            if(task.estimated_fee && task.estimated_fee > 0) {
                document.getElementById('invAmount').value = task.estimated_fee;
            } else {
                document.getElementById('invAmount').value = 0;
            }
        }
        document.getElementById('autoInvoiceOverlay').classList.remove('hidden'); 

        // Automatically trigger calculation/number preview if a firm is pre-selected
        if (firmSelect && firmSelect.value) {
            window.updateAutoInvoiceProposedNumber();
        }
    }
    
    window.updateAutoInvoiceProposedNumber = async function() {
        const firmId = document.getElementById('invFirmSelect').value;
        const container = document.getElementById('invProposedBillNumberContainer');
        const display = document.getElementById('invProposedBillNumberDisplay');
        const gstBreakdown = document.getElementById('autoInvoiceGstBreakdown');

        if (!firmId) {
            if (container) container.classList.add('hidden');
            if (gstBreakdown) gstBreakdown.classList.add('hidden');
            return;
        }
        
        if (display) display.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i>';
        if (container) container.classList.remove('hidden');
        
        try {
            const proposedNum = await getNextInvoiceNumber(firmId);
            if (display) display.innerText = proposedNum;
        } catch (e) {
            console.error("Error fetching next invoice number:", e);
            if (display) display.innerText = "Error";
        }

        // Check if the selected firm has GST registered using getGstCalculation
        let hasGst = false;
        if (window.autoInvoiceTask) {
            const calc = window.getGstCalculation(firmId, window.autoInvoiceTask.client_id, 0);
            hasGst = calc.hasGst;
        }

        if (hasGst) {
            if (gstBreakdown) gstBreakdown.classList.remove('hidden');
            recalculateAutoInvoiceGst();
        } else {
            if (gstBreakdown) gstBreakdown.classList.add('hidden');
        }
    }

    window.recalculateAutoInvoiceGst = function() {
        const firmId = document.getElementById('invFirmSelect').value;
        const gstBreakdown = document.getElementById('autoInvoiceGstBreakdown');
        if (!firmId || !window.autoInvoiceTask) {
            if (gstBreakdown) gstBreakdown.classList.add('hidden');
            return;
        }

        const baseVal = parseFloat(document.getElementById('invAmount').value) || 0;
        const calc = window.getGstCalculation(firmId, window.autoInvoiceTask.client_id, baseVal);

        if (!calc.hasGst) {
            if (gstBreakdown) gstBreakdown.classList.add('hidden');
            return;
        }

        if (gstBreakdown) gstBreakdown.classList.remove('hidden');

        const taxableDisplay = document.getElementById('autoInvoiceTaxableDisplay');
        const cgstDisplay = document.getElementById('autoInvoiceCgstDisplay');
        const sgstDisplay = document.getElementById('autoInvoiceSgstDisplay');
        const igstDisplay = document.getElementById('autoInvoiceIgstDisplay');
        const roundOffDisplay = document.getElementById('autoInvoiceRoundOffDisplay');
        const totalDisplay = document.getElementById('autoInvoiceTotalDisplay');

        const cgstRow = document.getElementById('autoInvoiceCgstRow');
        const sgstRow = document.getElementById('autoInvoiceSgstRow');
        const igstRow = document.getElementById('autoInvoiceIgstRow');
        const roundOffRow = document.getElementById('autoInvoiceRoundOffRow');

    window.generateInvoice = async function() {
        const alreadyBilled = document.getElementById('invAlreadyBilled')?.checked;
        const firmId = document.getElementById('invFirmSelect').value;
        if (!alreadyBilled && !firmId) {
            showToast("Please select a Billing Firm.");
            return;
        }

        const amount = document.getElementById('invAmount').value; 
        const btn = document.getElementById('generateInvBtn'); 
        const originalText = btn.innerHTML;
        btn.innerHTML = alreadyBilled ? '<i class="fa-solid fa-spinner fa-spin"></i> Saving...' : '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
        
        let task = window.autoInvoiceTask;
        if (!task) {
            showToast("Task data lost. Please create invoice manually.");
            btn.innerHTML = originalText;
            return;
        }

        // Amount saved to DB is the exclusive base rate
        const baseVal = parseFloat(amount) || 0;

        try {
            const billNo = alreadyBilled ? ('EXTERNAL-' + Date.now()) : await getNextInvoiceNumber(firmId);
            const serviceName = task.services?.service_type || task.custom_task_name || 'General Service';
            const { error } = await supabaseClient.from('invoices').insert([{ 
                task_id: task.task_id || task.id || null, 
                client_id: task.client_id, 
                firm_id: alreadyBilled ? null : firmId,
                service_name: serviceName, 
                amount: baseVal, 
                status: alreadyBilled ? 'Paid' : 'Unpaid', 
                bill_number: billNo, 
                generated_date: new Date().toISOString() 
            }]);
            
            if (error) throw error;

            // Add bill in work history
            const billTaskId = task.task_id || task.id || null;
            const billHistoryNote = `[BILL_GENERATED] Service: ${serviceName} | Bill No: ${billNo} | Amount: ₹${baseVal}`;
            const { error: logError } = await supabaseClient.from('task_logs').insert([{
                client_id: task.client_id,
                task_id: billTaskId,
                user_id: (typeof currentUser !== 'undefined' && currentUser ? currentUser.id : null),
                note: billHistoryNote,
                timestamp: new Date().toISOString()
            }]);
            if (logError) {
                console.error("Error creating billing history log:", logError);
            }

            showToast(alreadyBilled ? "Billed status updated successfully!" : "Bill prepared successfully!");
            document.getElementById('autoInvoiceOverlay').classList.add('hidden'); 
            window.autoInvoiceTask = null;
            if (typeof globalRefresh === 'function') globalRefresh();
        } catch (err) { 
            showToast("Database Error: " + err.message); 
            btn.innerHTML = originalText; 
        }
    }

        iframe.style.right = '0';

        doc.write('<html><head><title>Invoice</title>');

        doc.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        
        // Copy all styles and links from main document
        const styles = document.querySelectorAll('link, style');
        styles.forEach(style => doc.write(style.outerHTML));

        }, 800);
    }

    window.numberToWords = function(num) {
        num = Math.round(num);
        if (num === 0) return 'Zero';
        const a = ['','One ','Two ','Three ','Four ', 'Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
        const b = ['', '', 'Twenty','Thirty','Forty','Fifty', 'Sixty','Seventy','Eighty','Ninety'];
        if ((num = num.toString()).length > 9) return 'overflow';
        let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n) return; let str = '';
        str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) + 'Only' : 'Only';
        return str.trim();
    }

        const n = window.selectedBillIds.size;
        document.getElementById('bill-bulk-count').innerText = n;
        bar.classList.toggle('hidden', n === 0);
        const all = document.getElementById('bill-select-all');
        if (all) {
            const visible = window.currentVisibleBills.map(billIdOf);
            const selVisible = visible.filter(id => window.selectedBillIds.has(id)).length;
            all.checked = visible.length > 0 && selVisible === visible.length;
            all.indeterminate = selVisible > 0 && selVisible < visible.length;
        }
    }

    window.toggleBillSelection = function(id, on) {
        if (on) window.selectedBillIds.add(String(id)); else window.selectedBillIds.delete(String(id));
        window.updateBillBulkBar();
    }

    window.toggleAllBills = function(on) {
        window.currentVisibleBills.forEach(inv => on ? window.selectedBillIds.add(billIdOf(inv)) : window.selectedBillIds.delete(billIdOf(inv)));
        document.querySelectorAll('.bill-row-cb').forEach(cb => cb.checked = on);
        window.updateBillBulkBar();
    }

    window.clearBillSelection = function() { window.toggleAllBills(false); window.selectedBillIds.clear(); window.updateBillBulkBar(); }

    const loadScriptOnce = (src, globalName) => window[globalName] ? Promise.resolve() : new Promise((res, rej) => {
        const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src));
        document.head.appendChild(s);
    });

    const safeFileName = s => String(s || 'bill').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'bill';

    const waitForImages = el => Promise.all([...el.querySelectorAll('img')].filter(i => !i.classList.contains('hidden') && i.src).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })));

    // Renders one invoice into the preview template and returns it as a PDF Blob.
    async function renderInvoicePdfBlob(inv) {
        await window.openInvoicePreview(inv);
        const src = document.getElementById('print-invoice-area');
        const holder = document.createElement('div');
        // Render on-screen at (0,0) but behind the app (z-index) — off-screen positions make
        // html2canvas crop the capture.
        holder.style.cssText = 'position:absolute;left:0;top:0;width:820px;background:#fff;z-index:-9999;pointer-events:none;';
        const clone = src.cloneNode(true);
        clone.removeAttribute('id');
        clone.style.width = '820px';
        const fix = document.createElement('style');
        fix.textContent = '.bill-pdf-render, .bill-pdf-render * { letter-spacing: normal !important; word-spacing: normal !important; font-variant-ligatures: none !important; font-feature-settings: normal !important; text-rendering: auto !important; }';
        clone.classList.add('bill-pdf-render');
        holder.appendChild(fix);
        holder.appendChild(clone);
        document.body.appendChild(holder);
        const prevScroll = [window.scrollX, window.scrollY];
        window.scrollTo(0, 0);
        try {
            await waitForImages(clone);
            if (document.fonts && document.fonts.ready) await document.fonts.ready;
            const canvas = await html2canvas(clone, {
                scale: 2, useCORS: true, backgroundColor: '#ffffff',
                x: 0, y: 0, scrollX: 0, scrollY: 0,
                width: clone.offsetWidth, height: clone.offsetHeight,
                windowWidth: 820, windowHeight: clone.offsetHeight,
                // html2canvas lays text out inside a cloned iframe. If Inter hasn't loaded there
                // yet, words are positioned with a narrower fallback font but drawn in Inter,
                // which swallows the spaces. Wait for the font inside the clone first.
                onclone: async (doc) => {
                    if (!doc.fonts) return;
                    const loads = [];
                    ['400', '500', '600', '700', '800', '900'].forEach(w => {
                        loads.push(doc.fonts.load(`${w} 16px Inter`), doc.fonts.load(`italic ${w} 16px Inter`));
                    });
                    await Promise.race([Promise.allSettled(loads).then(() => doc.fonts.ready), new Promise(r => setTimeout(r, 5000))]);
                }
            });
            // Fit the whole invoice onto a single A4 page.
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
            const pw = 210, ph = 297, m = 8;
            const ratio = Math.min((pw - 2 * m) / canvas.width, (ph - 2 * m) / canvas.height);
            const w = canvas.width * ratio, h = canvas.height * ratio;
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', (pw - w) / 2, m, w, h);
            return pdf.output('blob');
        } finally {
            window.scrollTo(prevScroll[0], prevScroll[1]);
            document.body.removeChild(holder);
        }
    }

    const triggerDownload = (blob, name) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };

    window.bulkDownloadBills = async function(mode) {
        const ids = window.selectedBillIds;
        const bills = (globalInvoicesList || []).filter(inv => ids.has(billIdOf(inv)));
        if (bills.length === 0) { showToast('Select at least one bill.'); return; }
        const cancelled = bills.filter(b => b.status === 'Cancelled').length;
        if (cancelled && !confirm(`${cancelled} selected bill(s) are cancelled and will be marked CANCELLED in the PDF. Continue?`)) return;

        const bar = document.getElementById('bill-bulk-bar');
        bar.querySelectorAll('button').forEach(b => b.disabled = true);
        const countEl = document.getElementById('bill-bulk-count');
        const modal = document.getElementById('invoicePreviewModal');
        modal.style.visibility = 'hidden';

        try {
            await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'html2canvas');
            await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf');
            if (mode === 'zip') await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');

            const zip = mode === 'zip' ? new JSZip() : null;
            const used = new Map();
            let failed = 0;
            for (let i = 0; i < bills.length; i++) {
                const inv = bills[i];
                countEl.innerText = `Generating ${i + 1}/${bills.length}…`;
                try {
                    const blob = await renderInvoicePdfBlob(inv);
                    let base = safeFileName(inv.bill_number || ('Bill-' + billIdOf(inv)));
                    const k = used.get(base) || 0; used.set(base, k + 1);
                    const name = (k ? `${base} (${k + 1})` : base) + '.pdf';
                    if (zip) zip.file(name, blob);
                    else { triggerDownload(blob, name); await new Promise(r => setTimeout(r, 400)); }
                } catch (e) { console.error('Bill PDF failed', inv.bill_number, e); failed++; }
            }
            if (zip) {
                countEl.innerText = 'Zipping…';
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                triggerDownload(zipBlob, `Bills_${new Date().toISOString().slice(0, 10)}_${bills.length - failed}.zip`);
            }
            showToast(failed ? `Downloaded ${bills.length - failed} bill(s); ${failed} failed.` : `Downloaded ${bills.length} bill(s).`);
        } catch (err) {
            console.error(err); showToast('Bulk download failed: ' + err.message);
        } finally {
            modal.classList.add('hidden');
            modal.style.visibility = '';
            bar.querySelectorAll('button').forEach(b => b.disabled = false);
            window.updateBillBulkBar();
        }
    }
</script>
