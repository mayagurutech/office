<script>
    // ==========================================
    // MODULE: AUDITS & CUSTOM TASKS
    // ==========================================

    let globalAuditsList = [];
    let globalCustomTasksList = [];
    let globalCustomTasksAckMap = {};
    let currentActiveClient = null; // Used for the Client Audit Board
    let activeTask = null;          // Universal for Task Board & Custom Tasks
    // --- SHARED UTILS (Moved to Core) ---

    // ==========================================
    // TASK BOARD LOGIC (Generic & Custom Tasks)
    // ==========================================
    async function loadTasksData() {
        ['col-Pending', 'col-In Progress', 'col-Review', 'col-Completed'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });
        
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);
        
        // Parallel fetch of tasks and today's acknowledgements
        const [tasksRes, ackLogsRes] = await Promise.all([
            supabaseClient.from('tasks').select(`*, clients(client_id, display_name), services(service_type, standard_fee)`).eq('assigned_to', currentUser.id),
            supabaseClient.from('task_logs').select('task_id').eq('user_id', currentUser.id).gte('timestamp', todayStart.toISOString()).ilike('note', '%[Acknowledged Today]%')
        ]);
        
        const ackMap = {};
        if (ackLogsRes.data) {
            ackLogsRes.data.forEach(l => {
                if (l.task_id) ackMap[l.task_id] = true;
            });
        }

        if (tasksRes.data) {
            tasksRes.data.forEach(task => {
                const isCancelled = task.is_custom && task.custom_task_name && task.custom_task_name.endsWith(' [Cancelled]');
                if (isCancelled) return;
                const clientName = task.clients ? task.clients.display_name : 'Unknown Client';
                const taskName = task.is_custom ? task.custom_task_name : (task.services?.service_type || 'Task');
                
                let isOverdue = false;
                let dateBadgeClass = "bg-blue-50 text-blue-600 border border-blue-100";
                if (task.due_date) {
                    const dDate = new Date(task.due_date.split('T')[0]); dDate.setHours(0,0,0,0);
                    const today = new Date(); today.setHours(0,0,0,0);
                    if (dDate < today) {
                        isOverdue = true;
                        dateBadgeClass = "bg-red-50 text-red-600 border border-red-100 animate-pulse";
                    } else if (dDate.getTime() === today.getTime()) {
                        dateBadgeClass = "bg-amber-50 text-amber-600 border border-amber-100";
                    }
                }
                
                const dueDateBadge = task.due_date ? `<div class="text-[10px] font-bold ${dateBadgeClass} px-2 py-0.5 rounded uppercase mt-2 w-max"><i class="fa-regular fa-clock"></i> Due: ${new Date(task.due_date).toLocaleDateString('en-IN', {month:'short', day:'numeric'})}</div>` : '';
                
                const isAcked = !!ackMap[task.task_id];
                let ackCheckboxHtml = '';
                if (!isOverdue && task.status !== 'Completed') {
                    if (isAcked) {
                        ackCheckboxHtml = `
                            <div onclick="event.stopPropagation()" class="flex items-center gap-1 mt-2 text-[10px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 font-bold uppercase tracking-wider w-max shadow-sm" title="Acknowledged today">
                                <i class="fa-solid fa-square-check text-xs"></i> Checked
                            </div>
                        `;
                    } else {
                        const safeId = task.task_id !== undefined ? task.task_id : task.id;
                        ackCheckboxHtml = `
                            <button onclick="acknowledgeTaskToday('${safeId}', event)" class="flex items-center gap-1 mt-2 text-[10px] text-indigo-600 bg-indigo-50 border border-indigo-200 px-2 py-0.5 rounded hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition font-bold uppercase tracking-wider shadow-sm w-max" title="Acknowledge today">
                                <i class="fa-regular fa-square text-xs"></i> Acknowledge
                            </button>
                        `;
                    }
                }
                
                // NEW: Clicking a task card now opens the universal Task Drawer
                const cardHtml = `
                    <div onclick='openTaskDrawer(${JSON.stringify(task).replace(/'/g, "&#39;")})' class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 cursor-pointer hover:border-indigo-400 hover:shadow-md transition mb-3">
                        <div class="text-xs font-bold text-indigo-600 mb-1 uppercase tracking-wider">${taskName}</div>
                        <div class="font-bold text-gray-800 text-sm mb-2 hover:text-indigo-600 hover:underline" onclick="event.stopPropagation(); openUniversalClientProfile('${task.client_id}')">${clientName}</div>
                        <div class="flex flex-wrap items-center gap-2">
                            ${dueDateBadge}
                            ${ackCheckboxHtml}
                        </div>
                    </div>`;
                const col = document.getElementById(`col-${task.status}`);
                if (col) col.innerHTML += cardHtml;
            });
        }
    }

    // ==========================================
    // AUDIT STATUS BOARD LOGIC (Client-Centric)
    // ==========================================
    function safeGetSessionStorage(key) {
        try {
            return sessionStorage.getItem(key);
        } catch (e) {
            return window[key] || null;
        }
    }

    function safeSetSessionStorage(key, val) {
        try {
            sessionStorage.setItem(key, val);
        } catch (e) {
            window[key] = val;
        }
    }

    window.auditIsLoading = false;

    function setupAuditScrollListener() {
        const viewContainer = document.getElementById('view-audits');
        if (viewContainer && !viewContainer.dataset.scrollListenerAttached) {
            viewContainer.addEventListener('scroll', () => {
                if (window.auditIsLoading) return;
                safeSetSessionStorage('audit_scroll_top', viewContainer.scrollTop);
            });
            viewContainer.dataset.scrollListenerAttached = 'true';
        }
    }

    function populateAuditFilters() {
        const filterSelect = document.getElementById('auditServiceFilter');
        if (!filterSelect) return;
        const savedVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">All Audit Services</option>';
        const auditServices = globalServicesList.filter(s => s.is_audit);
        auditServices.forEach(s => {
            filterSelect.innerHTML += `<option value="${s.service_type}">${s.service_type}</option>`;
        });
        if (savedVal) {
            filterSelect.value = savedVal;
        }
    }

    async function loadAuditsData() {
        const container = document.getElementById('audit-list-container');
        if (container) {
            container.innerHTML = '<div class="text-center p-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading active audits...</div>';
        }
        
        setupAuditScrollListener();
        window.auditIsLoading = true;
        
        // Refresh cache to ensure we have the absolute latest client tracking statuses
        await refreshGlobalCache();
        await fetchTeamMembers();
        await fetchSubsidySettings(); // Ensure checklist categories are loaded
        populateAuditFilters();

        const { data: visSettings } = await supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-audits').single();
        const fallbackServices = globalServicesList.filter(s => s.is_audit).map(s => s.service_type);
        const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : fallbackServices;
        window.globalAuditAllowedServices = allowedServices;
        
        const selectedYear = document.getElementById('auditYearFilter')?.value || 'FY_2025_26';
        
        const activeAuditClients = globalClientsList.filter(c => {
            return allowedServices.some(as => window.isClientVisibleForPeriod(c, as, selectedYear, 'yearly'));
        });

        // Fetch follow-up dates and today's updates for these clients
        const clientIds = activeAuditClients.map(c => c.client_id);
        if (clientIds.length > 0) {
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);

            const [followupRes, todayLogsRes, trackingLogsRes, invoicesRes] = await Promise.all([
                fetchAllRows((from, to) => supabaseClient
                    .from('task_logs')
                    .select('client_id, note, timestamp')
                    .in('client_id', clientIds)
                    .ilike('note', '%[AUDIT_FOLLOWUP]%')
                    .order('timestamp', { ascending: false })
                    .order('log_id', { ascending: false })
                    .range(from, to)),
                supabaseClient
                    .from('task_logs')
                    .select('client_id, note, bank_status, sales_status, ledger_status, others_status')
                    .in('client_id', clientIds)
                    .is('task_id', null)
                    .gte('timestamp', todayStart.toISOString()),
                fetchAllRows((from, to) => supabaseClient
                    .from('task_logs')
                    .select('client_id, note, timestamp')
                    .in('client_id', clientIds)
                    .ilike('note', '[AUDIT_TRACKING] %')
                    .order('timestamp', { ascending: true })
                    .order('log_id', { ascending: true })
                    .range(from, to)),
                supabaseClient
                    .from('invoices')
                    .select('client_id, service_name, amount, status, firm_id')
                    .in('client_id', clientIds)
                    .neq('status', 'Cancelled')
            ]);
                
            const followupLogs = followupRes.data || [];
            const todayLogs = todayLogsRes.data || [];
            const trackingLogs = trackingLogsRes.data || [];
            const invoicesList = invoicesRes.data || [];

            const billedMap = {};
            invoicesList.forEach(inv => {
                const sName = inv.service_name || '';
                const cleanYear = selectedYear.replace('_', ' '); // e.g. "FY 2025-26"
                if (sName.toLowerCase().includes('audit') && sName.includes(cleanYear)) {
                    const baseAmt = parseFloat(inv.amount) || 0;
                    const calc = window.getGstCalculation ? window.getGstCalculation(inv.firm_id, inv.client_id, baseAmt) : { total: baseAmt };
                    const finalAmt = calc.total;
                    
                    billedMap[inv.client_id] = {
                        amount: finalAmt
                    };
                }
            });

            const followupMap = {};
            if (followupLogs) {
                followupLogs.forEach(log => {
                    if (log.note && !followupMap[log.client_id]) {
                        const match = log.note.match(/\[AUDIT_FOLLOWUP\] Date: (.*?)(?:\s*\||$)/);
                        if (match) {
                            followupMap[log.client_id] = match[1];
                        }
                    }
                });
            }

            const updatedTodayMap = {};
            if (todayLogs) {
                todayLogs.forEach(log => {
                    if (log.note && (
                        log.bank_status !== null || 
                        log.sales_status !== null || 
                        log.ledger_status !== null || 
                        log.others_status !== null || 
                        log.note.includes('[AUDIT_FOLLOWUP]') || 
                        log.note.includes('Audit status') || 
                        log.note.includes('[Acknowledged Today]')
                    )) {
                        updatedTodayMap[log.client_id] = true;
                    }
                });
            }

            const trackingMap = {};
            trackingLogs.forEach(log => {
                const payload = log.note.replace('[AUDIT_TRACKING] ', '').trim();
                const parts = payload.split('|');
                if (parts.length >= 7) {
                    const cId = parts[0];
                    const period = parts[1];
                    if (period === selectedYear) {
                        trackingMap[cId] = {
                            status: parts[2],
                            bank: parts[3] === 'null' ? null : parts[3],
                            sales: parts[4] === 'null' ? null : parts[4],
                            ledger: parts[5] === 'null' ? null : parts[5],
                            others: parts[6] === 'null' ? null : parts[6]
                        };
                    }
                }
            });
            
            activeAuditClients.forEach(c => {
                c.followup_date = followupMap[c.client_id] || '';
                c.updated_today = !!updatedTodayMap[c.client_id];

                const bill = billedMap[c.client_id];
                if (bill) {
                    c.is_billed = true;
                    c.billed_amount = bill.amount;
                } else {
                    c.is_billed = false;
                    c.billed_amount = 0;
                }

                const tracking = trackingMap[c.client_id];
                if (tracking) {
                    c.audit_status = tracking.status;
                    c.audit_bank = tracking.bank;
                    c.audit_sales = tracking.sales;
                    c.audit_ledger = tracking.ledger;
                    c.audit_others = tracking.others;
                } else if (selectedYear !== 'FY_2025_26') {
                    c.audit_status = 'Not yet started';
                    c.audit_bank = null;
                    c.audit_sales = null;
                    c.audit_ledger = null;
                    c.audit_others = null;
                }
            });
        }

        globalAuditsList = activeAuditClients;
        filterAudits();
    }

    function getAuditMasterChecklist(auditType) {
        const checklists = window.globalSubsidyChecklistsCache || (typeof globalSubsidyChecklistsCache !== 'undefined' ? globalSubsidyChecklistsCache : {});
        if (!auditType) return [];
        
        const cleanType = auditType.toUpperCase().replace(/^AUDIT_/, '').trim();
        const candidateKeys = [
            `AUDIT_${cleanType}`,
            `AUDIT_${auditType.toUpperCase()}`
        ];
        
        for (const key of candidateKeys) {
            if (checklists[key] && Array.isArray(checklists[key]) && checklists[key].length > 0) {
                return checklists[key];
            }
        }
        
        const allKeys = Object.keys(checklists).filter(k => k.startsWith('AUDIT_'));
        const matchedKey = allKeys.find(k => {
            const kClean = k.substring(6).trim();
            return kClean === cleanType || kClean.includes(cleanType) || cleanType.includes(kClean);
        });
        
        if (matchedKey && checklists[matchedKey] && Array.isArray(checklists[matchedKey])) {
            return checklists[matchedKey];
        }
        
        return [];
    }

    function getAuditClientStatusMap(clientId, auditType, selectedYear) {
        if (!window.globalChecklistStatusMap || !window.globalChecklistStatusMap[clientId]) {
            return {};
        }
        const clientMap = window.globalChecklistStatusMap[clientId];
        const mapKey = `${auditType}|${selectedYear}`;
        
        if (clientMap[mapKey] && Object.keys(clientMap[mapKey]).length > 0) {
            return clientMap[mapKey];
        }
        
        if (selectedYear === 'FY_2025_26' && clientMap[auditType] && Object.keys(clientMap[auditType]).length > 0) {
            return clientMap[auditType];
        }
        
        const cleanType = (auditType || '').toLowerCase().replace(/^audit_/, '').trim();
        const foundKey = Object.keys(clientMap).find(k => {
            const kLower = k.toLowerCase().replace(/^audit_/, '').trim();
            const kMapKey = `${cleanType}|${selectedYear.toLowerCase()}`;
            return kLower === kMapKey || (selectedYear === 'FY_2025_26' && kLower === cleanType) || kLower.startsWith(cleanType);
        });
        
        if (foundKey && clientMap[foundKey]) {
            return clientMap[foundKey];
        }
        
        return {};
    }

    function computeAuditCurrentStage(masterList, statusMap) {
        if (!masterList || masterList.length === 0) {
            return 'Not Configured';
        }
        
        let lastCompletedStage = 'Not Started';
        let foundNotCompleted = false;
        
        for (let item of masterList) {
            const stage = item["Stage Name"] || item["stage"];
            if (!stage) continue;
            
            let isDone = false;
            if (statusMap && (statusMap[stage] === true || statusMap[stage] === 'NIL')) {
                isDone = true;
            } else if (statusMap) {
                const cleanStage = stage.toLowerCase().trim();
                const matchingKey = Object.keys(statusMap).find(k => k.toLowerCase().trim() === cleanStage);
                if (matchingKey && (statusMap[matchingKey] === true || statusMap[matchingKey] === 'NIL')) {
                    isDone = true;
                }
            }
            
            if (isDone) {
                lastCompletedStage = stage;
            } else {
                if (!foundNotCompleted) {
                    lastCompletedStage = `Pending: ${stage}`;
                }
                foundNotCompleted = true;
            }
        }
        
        if (!foundNotCompleted) {
            return 'All Stages Completed';
        }
        
        return lastCompletedStage;
    }

    function getClientAuditType(client, selectedYear) {
        const serviceFilter = document.getElementById('auditServiceFilter')?.value || '';
        if (serviceFilter) {
            return serviceFilter;
        }

        const configuredAuditTypes = (window.globalSubsidyCategoriesCache || [])
            .filter(c => c.toUpperCase().startsWith('AUDIT_'))
            .map(c => c.substring(6).trim());
        
        // 1. Check if client has AUDIT checklist logs matching configured audit types
        if (window.globalChecklistStatusMap && window.globalChecklistStatusMap[client.client_id]) {
            const clientLogs = window.globalChecklistStatusMap[client.client_id];
            const matchingKeys = Object.keys(clientLogs).filter(k => {
                const rawType = (k.includes('|') ? k.split('|')[0] : k).replace(/^AUDIT_/i, '').trim();
                const matchesAuditType = configuredAuditTypes.some(at => at.toLowerCase() === rawType.toLowerCase());
                const matchesYear = k.includes('|') ? k.endsWith(`|${selectedYear}`) : (selectedYear === 'FY_2025_26');
                return matchesAuditType && matchesYear;
            });
            if (matchingKeys.length > 0) {
                return matchingKeys[0].split('|')[0].replace(/^AUDIT_/i, '').trim();
            }
        }
        
        // 2. Check enrolled services matching configured audit types or allowed audit services
        const auditServiceNames = window.globalAuditAllowedServices || (typeof globalServicesList !== 'undefined' ? globalServicesList.filter(s => s.is_audit).map(s => s.service_type) : []);
        const enrolled = client.standard_services ? client.standard_services.split(',').map(s => s.trim()) : [];
        
        const matchedWithConfigured = enrolled.find(s => configuredAuditTypes.some(at => at.toLowerCase() === s.toLowerCase() || s.toLowerCase().includes(at.toLowerCase()) || at.toLowerCase().includes(s.toLowerCase())));
        if (matchedWithConfigured) return matchedWithConfigured;

        const matchedWithAuditServices = enrolled.find(s => auditServiceNames.some(asn => asn.toLowerCase() === s.toLowerCase()));
        if (matchedWithAuditServices) return matchedWithAuditServices;
        
        const fallbackAudit = enrolled.find(s => s.toLowerCase().includes('audit'));
        if (fallbackAudit) return fallbackAudit;
        
        return configuredAuditTypes.length > 0 ? configuredAuditTypes[0] : '';
    }

    function renderAuditsTable(clients) {
        const container = document.getElementById('audit-list-container');
        if(!clients || clients.length === 0) return container.innerHTML = '<div class="text-center p-8 text-gray-500 border border-dashed rounded-xl bg-white">No active audits match your filters. Go to Compliance Manager to Star a service.</div>';

        const auditServiceNames = window.globalAuditAllowedServices || globalServicesList.filter(s => s.is_audit).map(s => s.service_type);

        let html = '';
        clients.forEach((client, index) => {
            // Find exactly which audit services triggered this client to appear
            const enrolled = client.standard_services ? client.standard_services.split(',').map(s => s.trim()) : [];
            const activeServices = enrolled.map(s => {
                return auditServiceNames.find(asn => asn.toLowerCase() === s.toLowerCase());
            }).filter(Boolean).join(', ');
            
            // Find assignee
            let assigneeName = 'Unassigned';
            if (window.globalAssignmentsList) {
                const allowedServices = window.globalAuditAllowedServices || [];
                const assignment = window.globalAssignmentsList.find(a => 
                    a.client_id === client.client_id && 
                    (
                        a.service_type === 'Audit Status' || 
                        (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                        (allowedServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
                    )
                );
                if (assignment && assignment.maker_id) {
                    const user = globalTeamMembers.find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }
            }
            
            const assigneeBadge = assigneeName !== 'Unassigned' ? `<span class="ml-2 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${assigneeName}</span>` : '';

            let billedBadge = '';
            if (client.is_billed) {
                billedBadge = `<span class="ml-2 px-1.5 py-0.5 bg-blue-50 text-blue-600 border border-blue-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center" title="Billed"><i class="fa-solid fa-circle-check text-blue-500 mr-1"></i>₹${client.billed_amount.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>`;
            }

            const badgeClass = "bg-indigo-50 text-indigo-700 px-3 py-2.5 rounded-md text-xs font-medium w-full block text-left min-h-[40px] flex items-center";

            let st = client.audit_status || 'Not yet started';
            if (st === 'Pending') st = 'Not yet started';
            if (st === 'In Progress') st = 'In progress';
            
            let cardClass = "bg-white rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-gray-400 p-4 mb-4 cursor-pointer hover:shadow-md hover:border-gray-300 transition flex flex-col xl:flex-row items-start xl:items-center gap-4";
            if (st === 'Not yet started') {
                cardClass = "bg-yellow-50 rounded-xl shadow-sm border border-yellow-200 border-l-4 border-l-yellow-400 p-4 mb-4 cursor-pointer hover:shadow-md hover:border-yellow-300 transition flex flex-col xl:flex-row items-start xl:items-center gap-4";
            } else if (st === 'Completed') {
                cardClass = "bg-blue-50 rounded-xl shadow-sm border border-blue-200 border-l-4 border-l-blue-500 p-4 mb-4 cursor-pointer hover:shadow-md hover:border-blue-300 transition flex flex-col xl:flex-row items-start xl:items-center gap-4";
            }

            let followupBadge = '';
            if (client.followup_date) {
                const today = new Date(); today.setHours(0,0,0,0);
                const parts = client.followup_date.split('-');
                const fDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                fDate.setHours(0,0,0,0);
                
                let tagClass = '';
                if (fDate < today) {
                    tagClass = 'bg-red-50 text-red-700 border-red-100';
                } else if (fDate.getTime() === today.getTime()) {
                    tagClass = 'bg-pink-50 text-pink-700 border-pink-100';
                } else {
                    tagClass = 'bg-emerald-50 text-emerald-700 border-emerald-100';
                }
                
                followupBadge = `<span class="ml-2 px-1.5 py-0.5 ${tagClass} rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center border"><i class="fa-solid fa-clock mr-1"></i>Followup: ${client.followup_date}</span>`;
            }

            let ackCheckboxHtml = '';
            if (st !== 'Completed') {
                if (client.updated_today) {
                    ackCheckboxHtml = `
                        <span onclick="event.stopPropagation()" class="ml-2 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-square-check mr-1"></i>Checked</span>
                    `;
                } else {
                    ackCheckboxHtml = `
                        <button onclick="acknowledgeAuditToday('${client.client_id}', event)" class="ml-2 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-bold uppercase tracking-wider hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition inline-flex items-center"><i class="fa-regular fa-square mr-1"></i>Acknowledge</button>
                    `;
                }
            }

            // Current Stage from checklist
            const selectedYear = document.getElementById('auditYearFilter')?.value || 'FY_2025_26';
            const auditType = getClientAuditType(client, selectedYear);
            const masterList = getAuditMasterChecklist(auditType);
            const statusMap = getAuditClientStatusMap(client.client_id, auditType, selectedYear);
            const currentStage = computeAuditCurrentStage(masterList, statusMap);

            // Check DPT3 status if Company Audit is applicable
            let dpt3BadgeHtml = '';
            const isCompanyAuditEnrolled = (client.standard_services && client.standard_services.toLowerCase().includes('company audit'));
            let hasCompanyAuditKey = false;
            if (window.globalChecklistStatusMap && window.globalChecklistStatusMap[client.client_id]) {
                hasCompanyAuditKey = Object.keys(window.globalChecklistStatusMap[client.client_id]).some(k => k.toLowerCase().startsWith('company audit'));
            }

            if (isCompanyAuditEnrolled || hasCompanyAuditKey) {
                let dpt3Val = false;
                if (window.globalChecklistStatusMap && window.globalChecklistStatusMap[client.client_id]) {
                    const clientMaps = window.globalChecklistStatusMap[client.client_id];
                    const matchingKey = Object.keys(clientMaps).find(k => k.toLowerCase().startsWith('company audit'));
                    if (matchingKey && clientMaps[matchingKey]) {
                        const statusMap = clientMaps[matchingKey];
                        const dpt3StageKey = Object.keys(statusMap).find(s => s.toLowerCase().includes('dpt3'));
                        if (dpt3StageKey) {
                            dpt3Val = statusMap[dpt3StageKey];
                        }
                    }
                }

                if (dpt3Val === true) {

    function filterAudits() {
        const query = document.getElementById('auditSearchInput').value.toLowerCase();
        const serviceQuery = document.getElementById('auditServiceFilter').value;
        const assignQuery = document.getElementById('auditAssignFilter').value;
        if (assignQuery === 'all') window.auditDueFilterStatus = 'all';
        
        const filtered = globalAuditsList.filter(client => {
            if (window.auditDueFilterStatus === 'due') {
                if (client.audit_status === 'Completed') return false;
                const isOverdue = client.followup_date ? (new Date(client.followup_date) < new Date().setHours(0,0,0,0)) : false;
                if (isOverdue) return false;
            } else if (window.auditDueFilterStatus === 'overdue') {
                if (client.audit_status === 'Completed') return false;
                const isOverdue = client.followup_date ? (new Date(client.followup_date) < new Date().setHours(0,0,0,0)) : false;
                if (!isOverdue) return false;
            }
            
            const clientMatch = client.display_name?.toLowerCase().includes(query) || 
                                (client.client_code && client.client_code.toLowerCase().includes(query)) || 
                                false;
            
            const enrolled = client.standard_services ? client.standard_services.split(',').map(s => s.trim()) : [];
            const auditServiceNames = window.globalAuditAllowedServices || globalServicesList.filter(s => s.is_audit).map(s => s.service_type);
            const activeAuditServices = enrolled.map(s => {
                return auditServiceNames.find(asn => asn.toLowerCase() === s.toLowerCase());
            }).filter(Boolean);
            
            const serviceSearchMatch = activeAuditServices.some(s => s.toLowerCase().includes(query));
            const dropdownMatch = serviceQuery === "" || activeAuditServices.includes(serviceQuery);
            
            // Assignment and Archiving logic
            let assignmentMatch = true;
            if (assignQuery === 'mine') {
                const allowedServices = window.globalAuditAllowedServices || [];
                const assignment = (window.globalAssignmentsList || []).find(a => 
                    a.client_id === client.client_id && 
                    (
                        a.service_type === 'Audit Status' || 
                        (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                        (allowedServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
                    ) && 
                    a.maker_id === currentUser.id
                );
                assignmentMatch = !!assignment && !client.is_billed;
            } else if (assignQuery === 'archived') {
                assignmentMatch = !!client.is_billed;
            } else {
                // 'all' audits excludes archived (billed) tasks by default
                assignmentMatch = !client.is_billed;
            }
            
            return (clientMatch || serviceSearchMatch) && dropdownMatch && assignmentMatch;
        });
        
        const sortOrder = document.getElementById('auditSortOrder')?.value || 'none';
        
        if (sortOrder === 'followup_asc') {
            filtered.sort((a, b) => {
                if (!a.followup_date) return 1;
                if (!b.followup_date) return -1;
                return new Date(a.followup_date) - new Date(b.followup_date);
            });
        } else if (sortOrder === 'followup_desc') {
            filtered.sort((a, b) => {
                if (!a.followup_date) return 1;
                if (!b.followup_date) return -1;
                return new Date(b.followup_date) - new Date(a.followup_date);
            });
        }

        renderAuditsTable(filtered);

        if (window.auditIsLoading) {
            window.auditIsLoading = false;
            const lastScrollPos = safeGetSessionStorage('audit_scroll_top') ? parseInt(safeGetSessionStorage('audit_scroll_top'), 10) : 0;
            if (lastScrollPos > 0) {
                setTimeout(() => {
                    const viewContainer = document.getElementById('view-audits');
                    if (viewContainer) viewContainer.scrollTop = lastScrollPos;
                }, 100);
            }
        }
    }

    function updateAuditStatusColor(selectEl) {
        const container = document.getElementById('auditStatusContainer');
        const label = document.getElementById('auditStatusLabel');
        if (!container) return;
        
        container.className = "px-4 py-2 rounded-lg border flex items-center gap-3 transition-colors min-w-[200px]";
        selectEl.className = "bg-transparent font-bold outline-none text-sm cursor-pointer w-full";
        if(label) label.className = "block text-[10px] font-bold uppercase tracking-wider whitespace-nowrap";
        
        const val = selectEl.value;
        if (val === 'Not yet started') {
            container.classList.add('bg-yellow-50', 'border-yellow-200');
            selectEl.classList.add('text-yellow-900');
            if(label) label.classList.add('text-yellow-800');
        } else if (val === 'In progress') {
            container.classList.add('bg-white', 'border-gray-300', 'shadow-sm');
            selectEl.classList.add('text-gray-900');
            if(label) label.classList.add('text-gray-600');
        } else if (val === 'Completed') {
            container.classList.add('bg-blue-50', 'border-blue-200');
            selectEl.classList.add('text-blue-900');
            if(label) label.classList.add('text-blue-800');
        }
    }

    async function openAuditDrawer(client) {
        currentActiveClient = client;

        nameHeader.innerText = client.display_name;
        nameHeader.onclick = () => { openUniversalClientProfile(client.client_id); };
        
        // Fill the fields using the tracking data permanently locked to the client

        if (st === 'In Progress') st = 'In progress';
        const stSelect = document.getElementById('drawMainStatus');
        stSelect.value = st;
        if (typeof updateAuditStatusColor === 'function') updateAuditStatusColor(stSelect);
        document.getElementById('drawBank').value = client.audit_bank || '';
        document.getElementById('drawSales').value = client.audit_sales || '';
        document.getElementById('drawLedger').value = client.audit_ledger || '';
        document.getElementById('drawOthers').value = client.audit_others || '';
        const transferSelect = document.getElementById('drawTransferUser');
        if (transferSelect) {
            transferSelect.innerHTML = '<option value="">-- Keep Current Owner --</option>';
            globalTeamMembers.forEach(u => transferSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`);
            transferSelect.value = '';
        }
        
        document.getElementById('drawNote').value = ''; 
        document.getElementById('drawFollowupDate').value = ''; // Clear

        // 3.5. Ensure client-specific audit checklist status maps are fully fetched & populated from DB
        try {
            const { data: clientChecklistLogs } = await supabaseClient
                .from('task_logs')
                .select('client_id, note, timestamp, user_id')
                .eq('client_id', client.client_id)
                .like('note', '[AUDIT_CHECKLIST_STATUS]%')
                .order('timestamp', { ascending: false });

            if (clientChecklistLogs && clientChecklistLogs.length > 0) {
                if (!window.globalChecklistStatusMap) window.globalChecklistStatusMap = {};
                if (!window.globalChecklistRemarksMap) window.globalChecklistRemarksMap = {};
                if (!window.globalChecklistUsersMap) window.globalChecklistUsersMap = {};
                if (!window.globalChecklistAdminStatusMap) window.globalChecklistAdminStatusMap = {};
                if (!window.globalChecklistAdminUsersMap) window.globalChecklistAdminUsersMap = {};

                clientChecklistLogs.forEach(log => {
                    if (!log.note) return;
                    const cleanNote = log.note.replace('[AUDIT_CHECKLIST_STATUS] ', '');
                    const parts = cleanNote.split('|');
                    const typePart = parts.find(p => p.startsWith('TYPE:'));
                    const stagePart = parts.find(p => p.startsWith('STAGE:'));
                    const statusPart = parts.find(p => p.startsWith('STATUS:'));
                    const remarkPart = parts.find(p => p.startsWith('REMARK:'));
                    const yearPart = parts.find(p => p.startsWith('YEAR:'));
                    if (typePart && stagePart && statusPart) {
                        const cat = typePart.replace('TYPE:', '');
                        const doc = stagePart.replace('STAGE:', '');
                        const year = yearPart ? yearPart.replace('YEAR:', '') : 'FY_2025_26';
                        let status = statusPart.replace('STATUS:', '');
                        if (status === 'true') status = true;
                        else if (status === 'false') status = false;
                        
                        if (!window.globalChecklistStatusMap[log.client_id]) window.globalChecklistStatusMap[log.client_id] = {};
                        const mapKey = `${cat}|${year}`;
                        if (!window.globalChecklistStatusMap[log.client_id][mapKey]) window.globalChecklistStatusMap[log.client_id][mapKey] = {};
                        if (window.globalChecklistStatusMap[log.client_id][mapKey][doc] === undefined) {
                            window.globalChecklistStatusMap[log.client_id][mapKey][doc] = status;
                        }
                        if (year === 'FY_2025_26') {
                            if (!window.globalChecklistStatusMap[log.client_id][cat]) window.globalChecklistStatusMap[log.client_id][cat] = {};
                            if (window.globalChecklistStatusMap[log.client_id][cat][doc] === undefined) {
                                window.globalChecklistStatusMap[log.client_id][cat][doc] = status;
                            }
                        }

                        if (remarkPart) {
                            const remark = remarkPart.replace('REMARK:', '');
                            if (!window.globalChecklistRemarksMap[log.client_id]) window.globalChecklistRemarksMap[log.client_id] = {};
                            if (!window.globalChecklistRemarksMap[log.client_id][mapKey]) window.globalChecklistRemarksMap[log.client_id][mapKey] = {};
                            if (window.globalChecklistRemarksMap[log.client_id][mapKey][doc] === undefined) {
                                window.globalChecklistRemarksMap[log.client_id][mapKey][doc] = remark;
                            }
                            if (year === 'FY_2025_26') {
                                if (!window.globalChecklistRemarksMap[log.client_id][cat]) window.globalChecklistRemarksMap[log.client_id][cat] = {};
                                if (window.globalChecklistRemarksMap[log.client_id][cat][doc] === undefined) {
                                    window.globalChecklistRemarksMap[log.client_id][cat][doc] = remark;
                                }
                            }
                        }

                        const userPart = parts.find(p => p.startsWith('USER_ID:'));
                        let checkerId = log.user_id;
                        if (userPart) {
                            const parsedUser = userPart.replace('USER_ID:', '').trim();
                            if (parsedUser) checkerId = parsedUser;
                        }
                        if (checkerId && status === true) {
                            if (!window.globalChecklistUsersMap[log.client_id]) window.globalChecklistUsersMap[log.client_id] = {};
                            if (!window.globalChecklistUsersMap[log.client_id][mapKey]) window.globalChecklistUsersMap[log.client_id][mapKey] = {};
                            if (window.globalChecklistUsersMap[log.client_id][mapKey][doc] === undefined) {
                                window.globalChecklistUsersMap[log.client_id][mapKey][doc] = checkerId;
                            }
                            if (year === 'FY_2025_26') {
                                if (!window.globalChecklistUsersMap[log.client_id][cat]) window.globalChecklistUsersMap[log.client_id][cat] = {};
                                if (window.globalChecklistUsersMap[log.client_id][cat][doc] === undefined) {
                                    window.globalChecklistUsersMap[log.client_id][cat][doc] = checkerId;
                                }
                            }
                        }

                        const adminStatusPart = parts.find(p => p.startsWith('ADMIN_STATUS:'));
                        const adminUserPart = parts.find(p => p.startsWith('ADMIN_USER_ID:'));
                        if (adminStatusPart) {
                            const adminStatus = adminStatusPart.replace('ADMIN_STATUS:', '') === 'true';
                            if (!window.globalChecklistAdminStatusMap[log.client_id]) window.globalChecklistAdminStatusMap[log.client_id] = {};
                            if (!window.globalChecklistAdminStatusMap[log.client_id][mapKey]) window.globalChecklistAdminStatusMap[log.client_id][mapKey] = {};
                            if (window.globalChecklistAdminStatusMap[log.client_id][mapKey][doc] === undefined) {
                                window.globalChecklistAdminStatusMap[log.client_id][mapKey][doc] = adminStatus;
                            }
                            if (year === 'FY_2025_26') {
                                if (!window.globalChecklistAdminStatusMap[log.client_id][cat]) window.globalChecklistAdminStatusMap[log.client_id][cat] = {};
                                if (window.globalChecklistAdminStatusMap[log.client_id][cat][doc] === undefined) {
                                    window.globalChecklistAdminStatusMap[log.client_id][cat][doc] = adminStatus;
                                }
                            }
                        }
                        if (adminUserPart) {
                            const adminUserId = adminUserPart.replace('ADMIN_USER_ID:', '').trim();
                            if (adminUserId) {
                                if (!window.globalChecklistAdminUsersMap[log.client_id]) window.globalChecklistAdminUsersMap[log.client_id] = {};
                                if (!window.globalChecklistAdminUsersMap[log.client_id][mapKey]) window.globalChecklistAdminUsersMap[log.client_id][mapKey] = {};
                                if (window.globalChecklistAdminUsersMap[log.client_id][mapKey][doc] === undefined) {
                                    window.globalChecklistAdminUsersMap[log.client_id][mapKey][doc] = adminUserId;
                                }
                                if (year === 'FY_2025_26') {
                                    if (!window.globalChecklistAdminUsersMap[log.client_id][cat]) window.globalChecklistAdminUsersMap[log.client_id][cat] = {};
                                    if (window.globalChecklistAdminUsersMap[log.client_id][cat][doc] === undefined) {
                                        window.globalChecklistAdminUsersMap[log.client_id][cat][doc] = adminUserId;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Error loading client audit checklist logs:", e);
        }
        
        // 4. Update the Select dropdown for Audit Types
        const typeSelect = document.getElementById('auditChecklistTypeSelect');
        if (typeSelect && window.globalSubsidyCategoriesCache) {
            typeSelect.innerHTML = '<option value="">-- Select Audit Type --</option>';
            const availableOptions = [];
            window.globalSubsidyCategoriesCache.forEach(cat => {
                if (cat.toUpperCase().startsWith('AUDIT_')) {
                    const displayName = cat.substring(6);
                    typeSelect.innerHTML += `<option value="${displayName}">${displayName}</option>`;
                    availableOptions.push(displayName);
                }
            });
            
            let autoSelected = false;
            const selectedYear = document.getElementById('auditYearFilter')?.value || 'FY_2025_26';
            if (window.globalChecklistStatusMap && window.globalChecklistStatusMap[client.client_id]) {
                const types = Object.keys(window.globalChecklistStatusMap[client.client_id]).filter(k => {
                    const rawType = (k.includes('|') ? k.split('|')[0] : k).replace(/^AUDIT_/i, '').trim();
                    const matchesAuditType = availableOptions.some(opt => opt.toLowerCase() === rawType.toLowerCase());
                    const matchesYear = k.includes('|') ? k.endsWith(`|${selectedYear}`) : (selectedYear === 'FY_2025_26');
                    return matchesAuditType && matchesYear;
                });
                if (types.length > 0) {
                    const firstTypeKey = types[0];
                    const rawType = (firstTypeKey.includes('|') ? firstTypeKey.split('|')[0] : firstTypeKey).replace(/^AUDIT_/i, '').trim();
                    
                    const matchedOpt = availableOptions.find(opt => opt.toLowerCase() === rawType.toLowerCase());
                    if (matchedOpt) {
                        typeSelect.value = matchedOpt;
                        autoSelected = true;
                    }
                }
            }

            // Fallback: If no previous checklist state map exists yet, auto-select based on client's enrolled services
            if (!autoSelected && client.standard_services) {
                const enrolled = client.standard_services.split(',').map(s => s.trim());
                for (const enc of enrolled) {
                    const matchedOpt = availableOptions.find(opt => opt.toLowerCase() === enc.toLowerCase() || enc.toLowerCase().includes(opt.toLowerCase()) || opt.toLowerCase().includes(enc.toLowerCase()));
                    if (matchedOpt) {
                        typeSelect.value = matchedOpt;
                        autoSelected = true;
                        break;
                    }
                }
            }

            if (autoSelected) {
                loadSelectedAuditChecklist();
            } else {
                document.getElementById('auditChecklistContainer').innerHTML = '<div class="text-center py-10 text-gray-400 text-sm font-bold bg-gray-50 rounded-2xl border border-dashed border-gray-200">Please select an Audit Type above to load the checklist.</div>';
                document.getElementById('auditChecklistProgress').innerText = '0/0 Completed';
            }
        }

        // 5. Open Modal
        document.getElementById('auditDrawerOverlay').classList.remove('hidden');

        // Fetch all client-level logs (including followup, checklist updates, and billing)
        const { data: logs } = await fetchAllRows((from, to) => supabaseClient
            .from('task_logs')
            .select('*, users(name)')
            .eq('client_id', client.client_id)
            .is('task_id', null)
            .order('timestamp', { ascending: false })
            .order('log_id', { ascending: false })
            .range(from, to));

        window.currentWorkHistoryLogs = logs || [];

        // Find latest follow-up date
        const followupLog = logs ? logs.find(log => log.note && log.note.includes('[AUDIT_FOLLOWUP]')) : null;
        if (followupLog) {
            const match = followupLog.note.match(/\[AUDIT_FOLLOWUP\] Date: (.*?)(?:\s*\||$)/);
            if (match) {
                document.getElementById('drawFollowupDate').value = match[1];
            }
        }

        window.currentWorkHistoryFilter = 'all';
        renderAuditWorkHistory('all');
    }

    function renderAuditWorkHistory(filterCategory = 'all') {
        const tl = document.getElementById('drawerHistoryTimeline');
        if (!tl) return;

        // Update tab buttons state
        ['all', 'status', 'checklist', 'billing'].forEach(cat => {
            const btn = document.getElementById(`btnHistFilter-${cat}`);
            if (btn) {
                if (cat === filterCategory) {
                    btn.className = 'px-2.5 py-1 rounded-lg transition bg-white text-indigo-700 shadow-sm border border-slate-200/80 font-black';
                } else {
                    btn.className = 'px-2.5 py-1 rounded-lg transition text-slate-500 font-bold hover:text-slate-800 hover:bg-slate-200/50';
                }
            }
        });

        const logs = window.currentWorkHistoryLogs || [];
        if (!logs || logs.length === 0) {
            tl.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs font-bold bg-slate-50 rounded-2xl border border-dashed border-slate-200">No work history recorded yet.</div>';
            return;
        }

        // Classify logs
        const categorizedLogs = logs.map(log => {
            let cat = 'status';
            const note = log.note || '';
            if (note.includes('[AUDIT_CHECKLIST_STATUS]')) {
                cat = 'checklist';
            } else if (note.includes('[BILL_GENERATED]')) {
                cat = 'billing';
            } else if (log.bank_status !== null || log.sales_status !== null || log.ledger_status !== null || log.others_status !== null || note.includes('[AUDIT_FOLLOWUP]')) {
                cat = 'status';
            }
            return { log, category: cat };
        });

        const filtered = categorizedLogs.filter(item => {
            if (filterCategory === 'all') return true;
            return item.category === filterCategory;
        });

        if (filtered.length === 0) {
            tl.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs font-bold bg-slate-50 rounded-2xl border border-dashed border-slate-200">No history found for filter: <span class="capitalize font-black text-slate-600">${filterCategory}</span></div>`;
            return;
        }

        let html = '';
        filtered.forEach(({ log, category }) => {
            const d = new Date(log.timestamp).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            const t = new Date(log.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            
            // Resolve user name and initial
            let userName = log.users?.name;
            if (!userName && window.globalTeamMembers) {
                const u = window.globalTeamMembers.find(mem => mem.id === log.user_id);
                if (u) userName = u.name;
            }
            if (!userName) userName = 'System';
            const initial = userName.charAt(0).toUpperCase();

            if (category === 'checklist') {
                const cleanNote = log.note.replace('[AUDIT_CHECKLIST_STATUS] ', '');
                const parts = cleanNote.split('|');
                const typePart = parts.find(p => p.startsWith('TYPE:'));
                const stagePart = parts.find(p => p.startsWith('STAGE:'));
                const statusPart = parts.find(p => p.startsWith('STATUS:'));
                const remarkPart = parts.find(p => p.startsWith('REMARK:'));
                const yearPart = parts.find(p => p.startsWith('YEAR:'));
                const adminStatusPart = parts.find(p => p.startsWith('ADMIN_STATUS:'));
                const adminUserPart = parts.find(p => p.startsWith('ADMIN_USER_ID:'));

                const type = typePart ? typePart.replace('TYPE:', '') : '';
                const stage = stagePart ? stagePart.replace('STAGE:', '') : 'Stage Update';

    async function saveAuditDrawer() {
        const btn = document.getElementById('saveDrawerBtn'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        
        const newStatus = document.getElementById('drawMainStatus').value;
        const b = document.getElementById('drawBank').value.trim();
        const s = document.getElementById('drawSales').value.trim();
        const l = document.getElementById('drawLedger').value.trim();
        const o = document.getElementById('drawOthers').value.trim();
        const newNote = document.getElementById('drawNote').value.trim();
        const followupDate = document.getElementById('drawFollowupDate').value;
        const transferTo = document.getElementById('drawTransferUser') ? document.getElementById('drawTransferUser').value : '';

        const isOverdue = currentActiveClient.followup_date ? (new Date(currentActiveClient.followup_date) < new Date().setHours(0,0,0,0)) : false;
        const hasNoFollowup = !currentActiveClient.followup_date;
        const origFollowupDate = currentActiveClient.followup_date || '';
        const isDateChanged = origFollowupDate !== followupDate;

        // 1. Mandatory follow-up date check if overdue or no follow-up date
        if ((isOverdue || hasNoFollowup) && newStatus !== 'Completed') {
            if (!followupDate) {
                showToast("A follow-up date is mandatory because there is currently no follow-up date set or the previous one has passed.");
                btn.innerHTML = 'Save Update';
                return;
            }
        }

        // Prevent past follow-up date selection
        if (followupDate) {
            const selectedDate = new Date(followupDate);
            selectedDate.setHours(0,0,0,0);
            const today = new Date();
            today.setHours(0,0,0,0);
            if (selectedDate < today) {
                showToast("The new follow-up date cannot be in the past.");
                btn.innerHTML = 'Save Update';
                return;
            }
        }

        // 2. Mandatory workflow assignment check if no one is assigned yet
        const allowedServices = window.globalAuditAllowedServices || [];
        const existingAssignment = (window.globalAssignmentsList || []).find(a => 
            a.client_id === currentActiveClient.client_id && 
            (
                a.service_type === 'Audit Status' || 
                (a.service_type && a.service_type.toLowerCase().includes('audit')) ||
                (allowedServices.some(as => a.service_type && a.service_type.toLowerCase() === as.toLowerCase()))
            )
        );
        const isAssigned = existingAssignment && existingAssignment.maker_id;

        if (!isAssigned && !transferTo) {
            showToast("No team member is assigned to this audit workflow yet. You must select a user in 'Transfer Audit Workflow To' to assign them.");
            btn.innerHTML = 'Save Update';
            return;
        }

        if (isOverdue && newStatus !== 'Completed') {
            const hasComment = newNote.length > 0;
            const hasDateChanged = isDateChanged;
            if (!hasComment && !hasDateChanged) {
                showToast("This audit follow-up is overdue. You must write a comment or update the follow-up date to save.");
                btn.innerHTML = 'Save Update';
                return;
            }
        }

        // 1. Update the actual Client record if it is the default financial year (FY 2025-26)
        const selectedYear = document.getElementById('auditYearFilter')?.value || 'FY_2025_26';
        const updates = { audit_status: newStatus, audit_bank: b, audit_sales: s, audit_ledger: l, audit_others: o };
        if (selectedYear === 'FY_2025_26') {
            await supabaseClient.from('clients').update(updates).eq('client_id', currentActiveClient.client_id);
        }
        
        // 2. Insert into the client's history log
        let logNote = newNote || `Audit status for ${selectedYear.replace('_', ' ')} updated to ${newStatus}`;
        if (isDateChanged) {
            const dateLogStr = `Follow-up date updated from ${origFollowupDate || 'None'} to ${followupDate || 'None'}`;
            logNote = newNote ? `${newNote} | ${dateLogStr}` : dateLogStr;
        }
        if (followupDate) {
            logNote = `[AUDIT_FOLLOWUP] Date: ${followupDate} | Note: ${logNote}`;
        }

        // If completed, ensure follow-up date is cleared to prevent overdue alerts
        if (newStatus === 'Completed') {
            logNote = `[AUDIT_FOLLOWUP] Date: None | Note: Audit status for ${selectedYear.replace('_', ' ')} completed`;
        }

        // 3. Create year-specific tracking log
        // Format: [AUDIT_TRACKING] client_id|period|status|bank|sales|ledger|others
        const trackingNote = `[AUDIT_TRACKING] ${currentActiveClient.client_id}|${selectedYear}|${newStatus}|${b || 'null'}|${s || 'null'}|${l || 'null'}|${o || 'null'}`;

        await Promise.all([
            supabaseClient.from('task_logs').insert([{ 
                client_id: currentActiveClient.client_id, 
                user_id: currentUser.id, 
                note: trackingNote,
                timestamp: new Date().toISOString()
            }]),
            supabaseClient.from('task_logs').insert([{ 
                client_id: currentActiveClient.client_id, 
                user_id: currentUser.id, 
                note: logNote, 
                bank_status: b, 
                sales_status: s, 
                ledger_status: l, 
                others_status: o,
                timestamp: new Date().toISOString()
            }])
        ]);

        if (transferTo) {
            // Delete any existing audit-related assignments for this client to prevent duplicates
            const existingAuditAssignments = (window.globalAssignmentsList || []).filter(a => 
                a.client_id === currentActiveClient.client_id && 
                (a.service_type === 'Audit Status' || (a.service_type && a.service_type.toLowerCase().includes('audit')))
            );
            for (const ea of existingAuditAssignments) {
                await supabaseClient.from('client_assignments')
                    .delete()
                    .eq('id', ea.id);
            }
            await supabaseClient.from('client_assignments').insert([{
                client_id: currentActiveClient.client_id,
                service_type: 'Audit Status',
                maker_id: transferTo,
                checker_id: null
            }]);
            await supabaseClient.from('task_logs').insert([{
                client_id: currentActiveClient.client_id,
                user_id: currentUser.id,
                note: `Audit workflow transferred to ${globalTeamMembers.find(u => u.id === transferTo)?.name || 'selected user'}`,
                timestamp: new Date().toISOString()
            }]);
        }
        
        closeAuditDrawer(); 
        btn.innerHTML = 'Save Update';

        if (newStatus === 'Completed' && currentActiveClient.audit_status !== 'Completed') {
            let auditServiceName = 'Audit Status';
            const auditServiceNames = window.globalAuditAllowedServices || (globalServicesList || []).filter(s => s.is_audit).map(s => s.service_type);
            const enrolled = currentActiveClient.standard_services ? currentActiveClient.standard_services.split(',').map(s => s.trim()) : [];
            const activeServices = enrolled.map(s => {
                return auditServiceNames.find(asn => asn.toLowerCase() === s.toLowerCase());
            }).filter(Boolean);
            
            if (activeServices.length > 0) {
                auditServiceName = activeServices[0];
            } else {
                const selectedFilterService = document.getElementById('auditServiceFilter')?.value;
                if (selectedFilterService) {
                    auditServiceName = selectedFilterService;
                }
            }

            const auditService = (globalServicesList || []).find(s => s.service_type === auditServiceName) || (globalServicesList || []).find(s => s.service_type === 'Audit Status');
            const mockTask = {
                client_id: currentActiveClient.client_id,
                clients: { display_name: currentActiveClient.display_name },
                custom_task_name: `${auditServiceName} - ${selectedYear.replace('_', ' ')}`,
                estimated_fee: auditService ? auditService.standard_fee : 0
            };
            openAutoInvoiceModal(mockTask);
        } else {
            globalRefresh();
        }
    }

    async function loadCustomTasksData() {
        await fetchTeamMembers();
        const container = document.getElementById('custom-task-list-container');
        container.innerHTML = '<div class="text-center p-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading tasks...</div>';
        
        const { data } = await supabaseClient.from('tasks').select(`*, clients(client_id, display_name)`).eq('is_custom', true).order('due_date', { ascending: true });
        
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);
        const { data: ackLogs } = await supabaseClient.from('task_logs')
            .select('task_id')
            .eq('user_id', currentUser.id)
            .gte('timestamp', todayStart.toISOString())
            .ilike('note', '%[Acknowledged Today]%');
        
        const ackMap = {};
        if (ackLogs) {
            ackLogs.forEach(l => {
                if (l.task_id) ackMap[l.task_id] = true;
            });
        }

        globalCustomTasksList = data || [];
        globalCustomTasksAckMap = ackMap;

        filterCustomTasks();
    }

    window.filterCustomTasks = function(searchQuery) {
        const filterVal = document.getElementById('customTasksFilterSelect')?.value || 'all';
        if (filterVal !== 'my') window.customTasksDueFilterStatus = 'all';
        const container = document.getElementById('custom-task-list-container');
        if (!container) return;

        let filtered = globalCustomTasksList;
        if (filterVal === 'all') {
            filtered = globalCustomTasksList.filter(task => task.status !== 'Completed' && task.status !== 'Cancelled');
        } else if (filterVal === 'my') {
            filtered = globalCustomTasksList.filter(task => task.status !== 'Completed' && task.status !== 'Cancelled' && task.assigned_to === currentUser.id);
        } else if (filterVal === 'completed') {
            filtered = globalCustomTasksList.filter(task => task.status === 'Completed' || task.status === 'Cancelled');
        }

        if (window.customTasksDueFilterStatus === 'due') {
            filtered = filtered.filter(task => {
                if (task.status === 'Completed' || task.status === 'Cancelled') return false;
                const isWaitingOnClient = task.status.toLowerCase().includes('client') || task.status.toLowerCase().includes('hold');
                if (isWaitingOnClient) return false;
                let isOverdue = false;
                if (task.due_date) {
                    const dDate = new Date(task.due_date); dDate.setHours(0,0,0,0);
                    const today = new Date(); today.setHours(0,0,0,0);
                    if (dDate < today) isOverdue = true;
                }
                return !isOverdue;
            });
        } else if (window.customTasksDueFilterStatus === 'overdue') {
            filtered = filtered.filter(task => {
                if (task.status === 'Completed' || task.status === 'Cancelled') return false;
                const isWaitingOnClient = task.status.toLowerCase().includes('client') || task.status.toLowerCase().includes('hold');
                if (isWaitingOnClient) return false;
                let isOverdue = false;
                if (task.due_date) {
                    const dDate = new Date(task.due_date); dDate.setHours(0,0,0,0);
                    const today = new Date(); today.setHours(0,0,0,0);
                    if (dDate < today) isOverdue = true;
                }
                return isOverdue;
            });
        }

        const query = (searchQuery !== undefined ? searchQuery : (document.getElementById('headerSearchInput')?.value || '')).trim().toLowerCase();
        if (query) {
            filtered = filtered.filter(task => {
                const clientName = (task.clients?.display_name || '').toLowerCase();
                const taskName = (task.custom_task_name || '').toLowerCase();
                return clientName.includes(query) || taskName.includes(query);
            });
        }

        container.innerHTML = '';
        if(!filtered || filtered.length === 0) {
            const noMsg = filterVal === 'completed' ? 'No completed custom tasks found.' : 'No active custom tasks found.';
            return container.innerHTML = `<div class="text-center p-12 text-gray-500 border border-dashed rounded-xl bg-white"><i class="fa-solid fa-clipboard-check text-4xl text-gray-300 mb-3"></i><br>${noMsg}</div>`;
        }

        filtered.forEach((task) => {
            const clientName = task.clients?.display_name || 'Unknown Client';
            const assignee = globalTeamMembers.find(u => u.id === task.assigned_to)?.name || 'Unassigned';
            
            const isCancelled = task.is_custom && task.custom_task_name && task.custom_task_name.endsWith(' [Cancelled]');
            const cleanTaskName = task.is_custom ? task.custom_task_name.replace(/ \[Cancelled\]$/, '') : '';
            
            let isOverdue = false;
            let dateColor = "bg-gray-100 text-gray-600";
            let dateText = "No Due Date";
            if (task.due_date) {
                const dDate = new Date(task.due_date); dDate.setHours(0,0,0,0);
                const today = new Date(); today.setHours(0,0,0,0);
                if (dDate < today) {
                    dateColor = "bg-red-100 text-red-700 border border-red-200";
                    isOverdue = true;
                }
                else if (dDate.getTime() === today.getTime()) dateColor = "bg-amber-100 text-amber-700 border border-amber-200";
                else dateColor = "bg-blue-50 text-blue-600 border border-blue-100";
                dateText = dDate.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
            }

            let statusColor = 'bg-indigo-100 text-indigo-700';
            let displayStatus = task.status;
            if (task.status === 'Pending') {
                statusColor = 'bg-gray-100 text-gray-600';
            } else if (isCancelled) {
                statusColor = 'bg-rose-50 text-rose-700 border border-rose-100';
                displayStatus = 'Cancelled';
            } else if (task.status === 'Completed') {
                statusColor = 'bg-emerald-50 text-emerald-700 border border-emerald-100';
            }

            const isAcked = !!globalCustomTasksAckMap[task.task_id];
            let ackCheckboxHtml = '';
            if (!isOverdue && !isCancelled) {
                if (isAcked) {
                    ackCheckboxHtml = `
                        <div onclick="event.stopPropagation()" class="flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1.5 rounded-xl border border-emerald-100 font-black uppercase tracking-wider">
                            <i class="fa-solid fa-square-check text-sm"></i> Checked
                        </div>
                    `;
                } else {
                    const safeId = task.task_id !== undefined ? task.task_id : task.id;
                    ackCheckboxHtml = `
                        <button onclick="acknowledgeTaskToday('${safeId}', event)" class="flex items-center gap-1.5 text-xs text-indigo-600 bg-indigo-50 border border-indigo-200 px-2.5 py-1.5 rounded-xl hover:bg-indigo-600 hover:text-white transition font-black uppercase tracking-wider shadow-sm" title="Acknowledge you know about this task today">
                            <i class="fa-regular fa-square text-sm"></i> Acknowledge
                        </button>
                    `;
                }
            }

            const titleClass = isCancelled ? 'font-bold text-gray-400 text-lg line-through' : 'font-bold text-gray-900 text-lg';
            const borderLeftColor = isCancelled ? 'border-l-gray-400' : 'border-l-indigo-500';
            const cardBg = isCancelled ? 'bg-gray-50/80 opacity-75' : 'bg-white';

            // Uses the same openTaskDrawer as the generic Task Board!
            container.innerHTML += `
            <div onclick='openTaskDrawer(${JSON.stringify(task).replace(/'/g, "&#39;")})' class="${cardBg} rounded-xl shadow-sm border border-gray-200 border-l-4 ${borderLeftColor} p-5 cursor-pointer hover:shadow-md hover:border-indigo-300 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex-1">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1 hover:text-blue-600 hover:underline cursor-pointer w-max" onclick="event.stopPropagation(); openUniversalClientProfile('${task.client_id}')">${clientName}</span>
                    <h4 class="${titleClass}">${cleanTaskName}</h4>
                </div>
                <div class="flex flex-wrap items-center gap-3 text-xs font-bold">
                    ${ackCheckboxHtml}
                    <div class="flex items-center gap-1.5 text-gray-600"><i class="fa-solid fa-user-tie text-gray-400"></i> ${assignee}</div>
                    <div class="px-3 py-1.5 rounded-xl ${dateColor}"><i class="fa-regular fa-clock mr-1"></i> ${dateText}</div>
                    <div class="px-3 py-1.5 rounded-xl ${statusColor}">${displayStatus}</div>
                </div>
            </div>`;
        });
    }

    window.acknowledgeTaskToday = async function(taskId, event) {
        if (event) event.stopPropagation();
        
        try {
            const { error } = await supabaseClient.from('task_logs').insert([{
                task_id: taskId,

    window.acknowledgeAuditToday = async function(clientId, event) {
        if (event) event.stopPropagation();
        
        try {
            let client = (globalAuditsList || []).find(c => c.client_id === clientId);
            if (!client) {
                // Fallback to globalClientsList if audits view is not loaded yet
                client = (globalClientsList || []).find(c => c.client_id === clientId);
                if (client) {
                    // Fetch the latest followup date for this client from supabase task_logs
                    const { data: followupLogs } = await supabaseClient
                        .from('task_logs')
                        .select('note')
                        .eq('client_id', clientId)
                        .ilike('note', '%[AUDIT_FOLLOWUP]%')
                        .order('timestamp', { ascending: false })
                        .limit(1);
                    if (followupLogs && followupLogs.length > 0) {
                        const match = followupLogs[0].note.match(/\[AUDIT_FOLLOWUP\] Date: (.*?)(?:\s*\||$)/);
                        if (match) {
                            client.followup_date = match[1];
                        }
                    }
                }
            }
            if (!client) throw new Error("Client not found in active list");

            const today = new Date(); today.setHours(0,0,0,0);
            const existingFollowup = client.followup_date || '';
            
            let isOverdue = true;
            if (existingFollowup) {
                const parts = existingFollowup.split('-');
                const fDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                fDate.setHours(0,0,0,0);
                isOverdue = fDate < today;
            }

            let newFollowupDate = '';
            let noteText = `[Acknowledged Today] Audit acknowledged.`;

            if (isOverdue || !existingFollowup) {
                const datePromptText = existingFollowup
                    ? `The follow-up date for "${client.display_name}" is overdue (was: ${new Date(existingFollowup).toLocaleDateString('en-IN')}).\n\nPlease enter a new follow-up date (YYYY-MM-DD) to acknowledge:`
                    : `There is no follow-up date configured for "${client.display_name}".\n\nPlease enter a follow-up date (YYYY-MM-DD) to acknowledge:`;

                const dateInput = prompt(datePromptText, '');
                if (dateInput === null) return; // User cancelled
                if (!dateInput.trim()) {
                    return showToast('Acknowledgement cancelled. A new follow-up date is mandatory.');
                }
                const parsedDate = new Date(dateInput.trim());
                if (isNaN(parsedDate.getTime())) {
                    return showToast('Invalid date format. Please use YYYY-MM-DD (e.g., 2026-06-15).');
                }
                if (parsedDate < today) {
                    return showToast('The follow-up date cannot be in the past. Acknowledgement cancelled.');
                }
                newFollowupDate = dateInput.trim();

                const remarkInput = prompt(`Please enter a remark (follow-up notes/action plan) for "${client.display_name}":`, '');
                if (remarkInput === null) return; // User cancelled
                if (!remarkInput.trim()) {
                    return showToast('Acknowledgement cancelled. A remark is required when updating the follow-up date.');
                }
                noteText = `[AUDIT_FOLLOWUP] Date: ${newFollowupDate} | Note: [Acknowledged Today] ${remarkInput.trim()}`;
            }

            // Insert log
            const { error } = await supabaseClient.from('task_logs').insert([{
                client_id: clientId,
                user_id: currentUser.id,
                note: noteText,
                timestamp: new Date().toISOString()
            }]);
            
            if (error) throw error;
            
            showToast("Audit acknowledged successfully!");
            globalRefresh();
        } catch (err) {
            showToast("Error: " + err.message);
        }
    }

    async function saveTaskDrawer() {
        const btn = document.getElementById('saveCtDrawerBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        
        const newStatus = document.getElementById('ctDrawStatus').value;
        const assignee = document.getElementById('ctDrawAssignee').value;
        const dDate = document.getElementById('ctDrawDueDate').value;
        const fee = document.getElementById('ctDrawFee').value;
        const note = document.getElementById('ctDrawNote').value.trim();

        // Calculate if task was overdue
        let isOverdue = false;
        if (activeTask.due_date) {
            const dDateObj = new Date(activeTask.due_date.split('T')[0]); dDateObj.setHours(0,0,0,0);
            const today = new Date(); today.setHours(0,0,0,0);
            if (dDateObj < today) {
                isOverdue = true;
            }
        }

        const origDueDate = activeTask.due_date ? activeTask.due_date.split('T')[0] : '';
        const newDueDate = dDate ? dDate.split('T')[0] : '';
        const isDateChanged = origDueDate !== newDueDate;

        if (isOverdue && newStatus !== 'Completed') {
            const hasComment = note.length > 0;
            const hasDateChanged = isDateChanged;
            if (!hasComment && !hasDateChanged) {
                showToast("This task is overdue. You must write a comment or update the due date to save.");
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Save Details & Log Note';
                return;
            }
        }

        const updates = { 
            assigned_to: assignee || null,
            due_date: dDate || null,
            estimated_fee: parseFloat(fee) || 0
        };

        const cleanName = activeTask.is_custom ? activeTask.custom_task_name.replace(/ \[Cancelled\]$/, '') : '';

        if (newStatus === 'Cancelled') {
            updates.status = 'Completed';
            if (activeTask.is_custom) {
                updates.custom_task_name = cleanName + ' [Cancelled]';
            }
        } else {
            updates.status = newStatus;
            if (activeTask.is_custom) {
                updates.custom_task_name = cleanName;
            }
        }
        
        const pkCol = activeTask.task_id !== undefined ? 'task_id' : 'id';
        const pkVal = activeTask[pkCol];

        if (!pkVal) {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Save Details & Log Note';
            return showToast("Error: Could not identify task ID.");
        }
        
        await supabaseClient.from('tasks').update(updates).eq(pkCol, pkVal);
        
        let logNote = note;
        if (isDateChanged) {
            const dateLogStr = `Due date updated from ${origDueDate || 'None'} to ${newDueDate || 'None'}`;
            logNote = note ? `${note} | ${dateLogStr}` : dateLogStr;
        }

        if (logNote || newStatus !== activeTask.status) {
            await supabaseClient.from('task_logs').insert([{
                task_id: pkVal,
                user_id: currentUser.id,
                note: logNote || `Status updated to ${newStatus}`,
                timestamp: new Date().toISOString()
            }]);
        }

        closeTaskDrawer();
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Save Details & Log Note';

        if (newStatus === 'Completed' && activeTask.status !== 'Completed') {
            activeTask.status = 'Completed';
            openAutoInvoiceModal(activeTask);
        } else {
            globalRefresh();
        }
    }
