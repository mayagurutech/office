    function renderAuditChecklist() {
        const { clientId, type, statusMap, masterList } = currentAuditChecklistState;
        const container = document.getElementById('auditChecklistContainer');
        const progressEl = document.getElementById('auditChecklistProgress');
        
        if (!container) return;
        
        container.innerHTML = '';
        let completedCount = 0;
        let isPreviousDone = true; // For sequential logic

        masterList.forEach((item, index) => {
            const stageName = item["Stage Name"] || item["stage"] || `Stage ${index + 1}`;
            const currentStageStatus = statusMap[stageName];
            const isDone = currentStageStatus === true;
            const isNil = currentStageStatus === 'NIL';
            const isDPT3Stage = stageName.toLowerCase().includes('dpt3');
            
            const selectedYear = document.getElementById("auditYearFilter")?.value || "FY_2025_26";
            const mapKey = `${type}|${selectedYear}`;
            let remarksMap = {};
            if (window.globalChecklistRemarksMap && window.globalChecklistRemarksMap[clientId]) {
                remarksMap = window.globalChecklistRemarksMap[clientId][mapKey] || {};
                if (Object.keys(remarksMap).length === 0 && selectedYear === "FY_2025_26") {
                    remarksMap = window.globalChecklistRemarksMap[clientId][type] || {};
                }
            }
            const remark = remarksMap[stageName] || "";

            let checkedByUserId = null;
            if (window.globalChecklistUsersMap && window.globalChecklistUsersMap[clientId]) {
                const uMap = window.globalChecklistUsersMap[clientId][mapKey] || {};
                checkedByUserId = uMap[stageName];
                if (!checkedByUserId && selectedYear === "FY_2025_26") {
                    const uMap2 = window.globalChecklistUsersMap[clientId][type] || {};
                    checkedByUserId = uMap2[stageName];
                }
            }
            
            let checkedByUserIsAdmin = false;
            if ((isDone || isNil) && checkedByUserId && window.globalTeamMembers) {
                const u = window.globalTeamMembers.find(member => member.id === checkedByUserId);
                if (u && (u.role === "Admin" || u.name === "Mayank")) {
                    checkedByUserIsAdmin = true;
                }
            }
            
            const needsAdminCheck = (isDone || isNil) && !checkedByUserIsAdmin;
            
            let isAdminDone = false;
            let adminUserId = null;
            if (needsAdminCheck) {
                if (window.globalChecklistAdminStatusMap && window.globalChecklistAdminStatusMap[clientId]) {
                    const adminStatusMap = window.globalChecklistAdminStatusMap[clientId][mapKey] || {};

    function downloadAuditChecklist(displayName) {
        try {
            let data = getAuditMasterChecklist(displayName);
            
            // Generate template if empty
            if (!data || data.length === 0) {
                data = [
                    { "Serial No": 1, "Stage Name": "Planning", "Requirement": "Mandatory" },
                    { "Serial No": 2, "Stage Name": "Execution", "Requirement": "Mandatory" },
                    { "Serial No": 3, "Stage Name": "Review", "Requirement": "Optional" }
                ];
            }

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            wb.Props = {
                Title: `${displayName} Checklist`,
                Subject: `AUDIT_CHECKLIST_${displayName.toUpperCase()}`,
                Author: "Office OS"
            };
            XLSX.utils.book_append_sheet(wb, ws, "Checklist");
            
            const fileName = `${displayName.replace(/[^a-z0-9]/gi, '_')}_Checklist.xlsx`;
            XLSX.writeFile(wb, fileName);
        } catch (err) {
            console.error("Download error:", err);
            showToast("Error generating download: " + err.message);
        }
    }

    function uploadAuditChecklist(displayName, event) {
        const file = event.target.files[0];
        if (!file) return;

        const cat = 'AUDIT_' + displayName;
        const expectedBase = displayName.replace(/[^a-z0-9]/gi, '_');
        const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const escapedBase = escapeRegExp(expectedBase);
        const expectedPattern = new RegExp(`^${escapedBase}_Checklist(?:\\s*\\(\\d+\\))?\\.xlsx$`, 'i');

        if (!expectedPattern.test(file.name)) {
            showToast(`Accidental Upload Blocked!\nYou are trying to upload a checklist for "${displayName}", but the file you selected ("${file.name}") does not match the expected filename structure (e.g., "${expectedBase}_Checklist.xlsx").\n\nPlease select the correct file downloaded from the "${displayName}" section.`);
            event.target.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                const fileSubject = workbook.Props ? workbook.Props.Subject : null;
                const fileTitle = workbook.Props ? workbook.Props.Title : null;
                if (fileSubject && fileSubject.toUpperCase() !== `AUDIT_CHECKLIST_${displayName.toUpperCase()}`) {
                    showToast(`Accidental Upload Blocked!\nThis file contains checklist data for "${fileTitle || fileSubject}", but you are trying to upload it to "${displayName}".\n\nPlease select the correct file.`);
                    event.target.value = '';
                    return;
                }

                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                if (jsonData.length === 0) return showToast("Excel sheet is empty!");

                // Normalize Requirement and Stage Name
                jsonData.forEach(item => {
                    let reqVal = item["Requirement"] || item["req"];
                    if (reqVal) {
                        const cleanReq = reqVal.toString().trim().toLowerCase();
                        if (cleanReq.startsWith('man') || cleanReq === 'm' || cleanReq.includes('yes') || cleanReq.includes('req')) {
                            item["Requirement"] = 'Mandatory';
                        } else {
                            item["Requirement"] = 'Optional';
                        }
                    } else {
                        item["Requirement"] = 'Optional';
                    }

                    if (item["Stage Name"] === undefined && item["stage"] !== undefined) item["Stage Name"] = item["stage"];
                    if (item["Serial No"] === undefined && item["sr"] !== undefined) item["Serial No"] = item["sr"];
                });

                const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
                
                const { error } = await supabaseClient
                    .from('subsidy_categories')
                    .update({ checklist: jsonData })
                    .eq('name', cat);

                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: `[AUDIT_GLOBAL_CONFIG] CHECKLIST_UPLOADED:${displayName}`
                }]);

                if (error) showToast("Error uploading checklist: " + error.message);
                else {
                    showToast("Audit Checklist updated successfully!");
                    if(typeof fetchSubsidySettings === 'function') await fetchSubsidySettings();
                    renderAuditCategoriesTable();
                }
            } catch (err) {
                console.error("Upload error:", err);
                showToast("Error processing upload: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }
