<script>
    // ==========================================
    // MODULE: INCOME TAX CENTER
    // ==========================================

    function safeSetSessionStorage(key, val) {
        try { sessionStorage.setItem(key, val); } catch (e) { console.warn(e); }
    }
    function safeGetSessionStorage(key) {
        try { return sessionStorage.getItem(key); } catch (e) { return null; }
    }

    window.itIsLoading = false;

    function setupITScrollListener() {
        const viewContainer = document.getElementById('view-income-tax');
        if (viewContainer && !viewContainer.dataset.scrollListenerAttached) {
            viewContainer.addEventListener('scroll', () => {
                if (window.itIsLoading) return;
                safeSetSessionStorage('it_scroll_top', viewContainer.scrollTop);
            });
            viewContainer.dataset.scrollListenerAttached = 'true';
        }
        const tableContainer = document.getElementById('it-table-container');
        if (tableContainer && !tableContainer.dataset.scrollListenerAttached) {
            tableContainer.addEventListener('scroll', () => {
                if (window.itIsLoading) return;
                safeSetSessionStorage('it_table_scroll_top', tableContainer.scrollTop);
            });
            tableContainer.dataset.scrollListenerAttached = 'true';
        }
    }

    let globalITClients = [];
    let globalITTrackingMap = {}; // Maps clientId_period -> {challanStatus, returnStatus, billStatus, filingDate, isCall, advance}
    let itSortCol = 'display_name';
    let itSortAsc = true;

    function populateITMonths() {
        const select = document.getElementById('itMonthFilter');
        if (!select || select.options.length > 0) return; 

        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth(); // 0-indexed, 3 = April

        // If today is on or after April 1st of year Y, the Assessment Year starts at Y.
        // If before April 1st of year Y, the Assessment Year starts at Y-1.
        let activeStartYear = (month >= 3) ? year : (year - 1);
        
        let optionsHtml = '';
        // Generate options starting from the active Assessment Year down to 2026
        for (let startYear = activeStartYear; startYear >= 2024; startYear--) {
            const endYearShort = (startYear + 1).toString().slice(-2);
            const val = `AY_${startYear}_${endYearShort}`;
            const display = `AY ${startYear}-${endYearShort}`;
            optionsHtml += `<option value="${val}">${display}</option>`;
        }
        select.innerHTML = optionsHtml;
    }

    async function fetchAllITLogs(selectedPeriod) {
        let allLogs = [];
        let from = 0;
        const step = 1000;
        let hasMore = true;

        while (hasMore) {
            const { data, error } = await supabaseClient
                .from('task_logs')
                .select('log_id, note, timestamp')
                .or(`note.ilike.%[IT_TRACKING]%,note.ilike.%[IT_LOG]%,note.ilike.%[IT_FOLLOWUP]%`)
                .order('timestamp', { ascending: true })
                .order('log_id', { ascending: true })
                .range(from, from + step - 1);

            if (error) throw error;
            if (data && data.length > 0) {
                allLogs = allLogs.concat(data);
                if (data.length < step) {
                    hasMore = false;
                } else {
                    from += step;
                }
            } else {
                hasMore = false;
            }
        }
        return allLogs;
    }

    async function loadITCenterData(forceRefresh = false) {
        setupITScrollListener();
        window.itIsLoading = true;
        window.lastITScrollPos = safeGetSessionStorage('it_scroll_top') ? parseInt(safeGetSessionStorage('it_scroll_top'), 10) : 0;
        window.lastITTableScrollPos = safeGetSessionStorage('it_table_scroll_top') ? parseInt(safeGetSessionStorage('it_table_scroll_top'), 10) : 0;

        const tbody = document.getElementById('it-table-body');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading Income Tax Data...</td></tr>';
        
        try {
            populateITMonths();
            
            const needsCacheRefresh = forceRefresh || !window.globalAllClientsList || window.globalAllClientsList.length === 0;
            if (needsCacheRefresh) {
                await Promise.all([
                    refreshGlobalCache(),
                    fetchTeamMembers()
                ]);
            } else {
                await fetchTeamMembers();
            }

            const selectEl = document.getElementById('itMonthFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';
            if (!selectedPeriod) throw new Error("Could not determine the selected period.");

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            
            // Execute all Income Tax database calls in a parallel thread!
            const [
                visSettingsRes,
                itRateLogsRes,
                itInvoicesRes,
                itLogs
            ] = await Promise.all([
                supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-income-tax').maybeSingle(),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('note').like('note', `[PAGE_RATE] view-income-tax%`).order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
                supabaseClient.from('invoices').select('client_id, service_name, status, amount').or('service_name.like.Income Tax Fees - %,service_name.like.Income Tax Return Consultancy - %'),
                fetchAllITLogs(selectedPeriod)
            ]);

            // 1. Set allowed services
            const visSettings = visSettingsRes.data;
            const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : [];
            window.globalITAllowedServices = allowedServices;

            // 2. Filter clients enrolled in those services
            globalITClients = globalClientsList.filter(c => {
                return allowedServices.some(as => window.isClientVisibleForPeriod(c, as, selectedPeriod, 'yearly'));
            });

            // 3. Process rates
            const itRateLogs = itRateLogsRes.data;
            window.globalITRatesMap = {};
            if (itRateLogs) {
                itRateLogs.forEach(log => {
                    const parts = log.note.split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[1];
                        const rate = parts[2];
                        if (window.globalITRatesMap[clientId] === undefined) {
                            window.globalITRatesMap[clientId] = rate;
                        }
                    }
                });
            }

            // 4. Process invoices
            const itInvoices = itInvoicesRes.data;
            window.globalITBilledMap = {};
            const selectedPeriodDisplay1 = selectedPeriod.replace('AY_', 'AY '); // e.g. "AY 2026_27"
            const selectedPeriodDisplay2 = selectedPeriod.replace('AY_', 'AY ').replace('_', '-'); // e.g. "AY 2026-27"
            if (itInvoices) {
                itInvoices.forEach(inv => {
                    if (inv.status === 'Cancelled') return;
                    if (inv.service_name && (inv.service_name.includes("Income Tax Fees - ") || inv.service_name.includes("Income Tax Return Consultancy - "))) {
                        if (inv.service_name.includes(selectedPeriodDisplay1) || inv.service_name.includes(selectedPeriodDisplay2)) {
                            window.globalITBilledMap[inv.client_id] = {
                                amount: inv.amount,
                                status: inv.status
                            };
                        }
                    }
                });
            }

            // 5. Process tracking logs
            globalITTrackingMap = {};
            window.globalITCommentsMap = {};
            window.globalITOriginalAmountsMap = {};
            window.globalITFollowupMap = {};
            const p1 = selectedPeriod; // e.g. "AY_2026_27"
            const p2 = selectedPeriod.replace('AY_', 'AY '); // e.g. "AY 2026_27"
            const p3 = selectedPeriod.replace('AY_', 'AY ').replace('_', '-'); // e.g. "AY 2026-27"

            if (itLogs) {
                itLogs.forEach(log => {
                    if (!log.note.includes(`|${p1}|`) && !log.note.includes(`|${p2}|`) && !log.note.includes(`|${p3}|`)) {
                        return;
                    }
                    if (log.note.startsWith('[IT_TRACKING]')) {
                        const payload = log.note.replace('[IT_TRACKING] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 6) {
                            const cId = parts[0];
                            const key = `${cId}_${selectedPeriod}`;
                            const isBilledInDb = window.globalITBilledMap && window.globalITBilledMap[cId];
                            globalITTrackingMap[key] = {
                                reference: parts[8] || '',
                                isCall: parts[6] || 'Pending',
                                billStatus: isBilledInDb ? 'Billed' : (parts[4] || 'Unbilled'),
                                mop: parts[9] || '',
                                recdBy: parts[10] || '',
                                challanStatus: parts[2] || 'Pending',
                                returnStatus: parts[3] || 'Pending',
                                filingDate: parts[5] || '',
                                advance: parts[7] || 'Pending'
                            };
                        }
                    } else if (log.note.startsWith('[IT_LOG]')) {
                        const payload = log.note.replace('[IT_LOG] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 4) {
                            const cId = parts[0];
                            const columnKey = parts[2];
                            const statusValue = parts[3];
                            const textRemark = parts[4] || '';
                            const filingDate = parts[5] || '';
                            const key = `${cId}_${selectedPeriod}`;
                            
                             if (statusValue === 'Filed') {
                                 window.globalITCommentsMap[key] = 'Filed';
                             } else if (columnKey === 'comment') {
                                 if (statusValue && statusValue !== 'Completed' && statusValue !== 'Reverted to Pending') {
                                     window.globalITCommentsMap[key] = statusValue;
                                 } else if (textRemark && textRemark !== 'Completed' && textRemark !== 'Reverted to Pending') {
                                     if (window.globalITCommentsMap[key] !== 'Filed') {
                                         window.globalITCommentsMap[key] = textRemark;
                                     }
                                 }
                             } else if (columnKey !== 'billStatus' && textRemark && textRemark !== 'Completed' && textRemark !== 'Reverted to Pending') {
                                 if (window.globalITCommentsMap[key] !== 'Filed') {
                                     window.globalITCommentsMap[key] = textRemark;
                                 }
                             }

                            if (columnKey === 'billStatus' && statusValue === 'Billed') {
                                let origAmt = null;
                                const amtMatch = textRemark.match(/Bill Prepared \(₹([\d.]+)\)/);
                                if (amtMatch) {
                                    origAmt = parseFloat(amtMatch[1]);
                                } else if (textRemark.includes('Marked as Free')) {
                                    origAmt = 0;
                                }
                                if (origAmt !== null) {
                                    window.globalITOriginalAmountsMap[key] = origAmt;
                                }
                            }
                            
                            const isBilledInDb = window.globalITBilledMap && window.globalITBilledMap[cId];
                            if (!globalITTrackingMap[key]) {
                                globalITTrackingMap[key] = {
                                    reference: '',
                                    isCall: 'Pending',
                                    billStatus: isBilledInDb ? 'Billed' : 'Unbilled',
                                    mop: '',
                                    recdBy: '',
                                    challanStatus: 'Pending',
                                    returnStatus: 'Pending',
                                    filingDate: '',
                                    advance: 'Pending'
                                };
                            }
                            globalITTrackingMap[key][columnKey] = statusValue;
                            if (isBilledInDb) {
                                globalITTrackingMap[key].billStatus = 'Billed';
                            }
                            if (filingDate && (columnKey === 'challanStatus' || columnKey === 'returnStatus' || columnKey === 'filingDate')) {
                                globalITTrackingMap[key].filingDate = filingDate;
                            }
                        }
                    } else if (log.note.startsWith('[IT_FOLLOWUP]')) {
                        const payload = log.note.replace('[IT_FOLLOWUP] ', '').trim();
                        const parts = payload.split('|');
                        if (parts.length >= 3) {
                            const cId = parts[0];
                            const fDate = parts[2];
                            const key = `${cId}_${selectedPeriod}`;
                            window.globalITFollowupMap[key] = fDate;
                        }
                    }
                });
            }

            // Dynamically populate Recd By filter
            const recdByFilter = document.getElementById('filter_it_recdBy');
            if (recdByFilter) {
                const currentVal = recdByFilter.value;
                recdByFilter.innerHTML = '<option value="all">All Recd. By</option><option value="none">None</option>';
                (window.globalTeamMembers || []).forEach(u => {
                    recdByFilter.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                });
                recdByFilter.innerHTML += '<option value="MF ICICI Account">MF ICICI Account</option>';
                recdByFilter.value = currentVal || 'all';
            }

            renderFilteredITTable();

        } catch (err) {
            window.itIsLoading = false;
            console.error("IT load error:", err);
            tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-rose-500 font-bold"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>Error: ${err.message}</td></tr>`;
        }
    }

    function renderFilteredITTable() {
        const tbody = document.getElementById('it-table-body');
        if (!tbody) return;

        try {
            const assignFilter = document.getElementById('itAssignFilter')?.value || 'all';
            if (assignFilter === 'all') window.itDueFilterStatus = 'all';
            const searchInput = document.getElementById('itSearchInput')?.value.trim().toLowerCase() || '';
            const selectEl = document.getElementById('itMonthFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';
            const archiveFilter = document.getElementById('itArchiveFilter')?.value || 'active';
            const filterFollowup = document.getElementById('filter_it_followup')?.value || 'all';

            // 1. Filter clients
            let filtered = globalITClients || [];

            if (assignFilter === 'mine') {
                const allowedServices = window.globalITAllowedServices || ['Income Tax Return'];
                const myClientIds = (window.globalAssignmentsList || [])
                    .filter(a => 
                        a.maker_id === currentUser.id &&
                        a.service_type &&
                        allowedServices.some(as => as && typeof as === 'string' && a.service_type.toLowerCase() === as.toLowerCase())
                    )
                    .map(a => a.client_id);
                filtered = filtered.filter(c => myClientIds.includes(c.client_id));
            }

            if (searchInput) {
                filtered = filtered.filter(c => (c.display_name || '').toLowerCase().includes(searchInput));
            }

            // 2. Prepare visual details for sorting
            const processedList = filtered.map(c => {
                const key = `${c.client_id}_${selectedPeriod}`;
                const track = globalITTrackingMap[key] || {
                    reference: '',
                    isCall: 'Pending',
                    billStatus: 'Unbilled',
                    mop: '',
                    recdBy: '',
                    challanStatus: 'Pending',
                    returnStatus: 'Pending',
                    filingDate: '',
                    advance: 'Pending'
                };

                // Get assignee maker id & name
                let assigneeId = '';
                let assigneeName = 'Unassigned';
                const allowedServices = window.globalITAllowedServices || ['Income Tax Return'];
                const assignment = (window.globalAssignmentsList || []).find(a => 
                    a.client_id === c.client_id && 
                    a.service_type && 
                    allowedServices.some(as => as && typeof as === 'string' && a.service_type && typeof a.service_type === 'string' && a.service_type.toLowerCase() === as.toLowerCase())
                );
                if (assignment && assignment.maker_id) {
                    assigneeId = assignment.maker_id;
                    const user = (window.globalTeamMembers || globalTeamMembers || []).find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }

                return {
                    client: c,
                    display_name: c.display_name || 'Unnamed Client',
                    reference: track.reference,
                    isCall: track.isCall,
                    billStatus: track.billStatus,
                    mop: track.mop,
                    recdBy: track.recdBy,
                    assigneeId: assigneeId,
                    assignee: assigneeName,
                    key: key,
                    followup_date: window.globalITFollowupMap && window.globalITFollowupMap[key] || ''
                };
            });

            // 3. Apply sorting and header filters
            const filterRef = document.getElementById('filter_it_reference')?.value || 'all';
            const filterCall = document.getElementById('filter_it_isCall')?.value || 'all';
            const filterComment = document.getElementById('filter_it_comment')?.value || 'all';
            const filterBill = document.getElementById('filter_it_billStatus')?.value || 'all';
            const filterMop = document.getElementById('filter_it_mop')?.value || 'all';
            const filterRecdBy = document.getElementById('filter_it_recdBy')?.value || 'all';

            let filteredProcessed = processedList.filter(item => {
                // Archive / Active / All filter
                const commentText = window.globalITCommentsMap && window.globalITCommentsMap[item.key] || '';
                const isArchived = (commentText === 'Filed' && item.billStatus === 'Billed');

                if (archiveFilter === 'active' && isArchived) return false;
                if (archiveFilter === 'archived' && !isArchived) return false;

                if (window.itDueFilterStatus === 'due') {
                    const commentText = window.globalITCommentsMap && window.globalITCommentsMap[item.key] || '';
                    if (commentText === 'Filed') return false;
                } else if (window.itDueFilterStatus === 'overdue') {
                    const todayObj = new Date(new Date().toISOString().split('T')[0]);
                    let isItOverdue = false;
                    if (selectedPeriod && selectedPeriod.includes('_')) {
                        const [ayPrefix, startYrStr, endYrStr] = selectedPeriod.split('_');
                        const startYear = parseInt(startYrStr);
                        const dueDate = new Date(startYear, 6, 31, 23, 59, 59);
                        isItOverdue = todayObj > dueDate;
                    }
                    if (!isItOverdue) return false;
                    const commentText = window.globalITCommentsMap && window.globalITCommentsMap[item.key] || '';
                    if (commentText === 'Filed') return false;
                }

                if (filterRef === 'has' && !item.reference) return false;
                if (filterRef === 'none' && item.reference) return false;
                if (filterCall !== 'all' && item.isCall !== filterCall) return false;

                if (filterComment === 'none' && commentText) return false;
                if (filterComment === 'custom') {
                    if (!commentText || ['Filed', 'Hold', 'Challan Pending', 'Details Pending'].includes(commentText)) return false;
                } else if (filterComment !== 'all' && filterComment !== 'none') {
                    if (commentText !== filterComment) return false;
                }

                if (filterBill !== 'all' && item.billStatus !== filterBill) return false;
                if (filterMop === 'none' && item.mop) return false;
                if (filterMop !== 'all' && filterMop !== 'none' && item.mop !== filterMop) return false;
                if (filterRecdBy === 'none' && item.recdBy) return false;
                if (filterRecdBy !== 'all' && filterRecdBy !== 'none' && item.recdBy !== filterRecdBy) return false;

                if (filterFollowup !== 'all') {
                    const fDate = item.followup_date;
                    if (filterFollowup === 'none') {
                        if (fDate) return false;
                    } else {
                        if (!fDate) return false;
                        const isOverdue = new Date(fDate) < new Date().setHours(0,0,0,0);
                        if (filterFollowup === 'overdue' && !isOverdue) return false;
                        if (filterFollowup === 'pending' && isOverdue) return false;
                    }
                }

                return true;
            });

            filteredProcessed.sort((a, b) => {
                let valA = a[itSortCol];
                let valB = b[itSortCol];

                if (itSortCol === 'followup_date') {
                    if (!valA) return 1;
                    if (!valB) return -1;
                    return itSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }

                if (typeof valA === 'string') {
                    return itSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return 0;
            });

            // 4. Compute metrics
            let totalCount = filteredProcessed.length;
            let callDone = 0;
            let billedCount = 0;
            let unbilledCount = 0;
            let filedCount = 0;
            let detailsPendingCount = 0;
            let holdCount = 0;
            let challanPendingCount = 0;
            let othersCount = 0;

            filteredProcessed.forEach(item => {
                if (item.isCall === 'Done') callDone++;
                if (item.billStatus === 'Billed') billedCount++;
                else unbilledCount++;

                const commentText = window.globalITCommentsMap && window.globalITCommentsMap[item.key] || '';
                if (commentText === 'Filed') {
                    filedCount++;
                } else if (commentText === 'Details Pending') {
                    detailsPendingCount++;
                } else if (commentText === 'Hold') {
                    holdCount++;
                } else if (commentText === 'Challan Pending') {
                    challanPendingCount++;
                } else if (commentText) {
                    othersCount++;
                }
            });

            const totalCountEl = document.getElementById('it-total-count');
            if (totalCountEl) totalCountEl.innerText = totalCount;
            const callDoneEl = document.getElementById('it-call-done-count');
            if (callDoneEl) callDoneEl.innerText = callDone;
            const billedCountEl = document.getElementById('it-billed-count');
            if (billedCountEl) billedCountEl.innerText = billedCount;
            const unbilledCountEl = document.getElementById('it-unbilled-count');
            if (unbilledCountEl) unbilledCountEl.innerText = unbilledCount;
            const filedCountEl = document.getElementById('it-filed-count');
            if (filedCountEl) filedCountEl.innerText = filedCount;
            const detailsPendingCountEl = document.getElementById('it-details-pending-count');
            if (detailsPendingCountEl) detailsPendingCountEl.innerText = detailsPendingCount;
            const holdCountEl = document.getElementById('it-hold-count');
            if (holdCountEl) holdCountEl.innerText = holdCount;
            const challanPendingCountEl = document.getElementById('it-challan-pending-count');
            if (challanPendingCountEl) challanPendingCountEl.innerText = challanPendingCount;
            const othersCountEl = document.getElementById('it-others-count');
            if (othersCountEl) othersCountEl.innerText = othersCount;

            // 5. Render HTML
            let htmlBuffer = '';
            if (filteredProcessed.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400 italic">No clients found matching the criteria.</td></tr>';
                window.itIsLoading = false;
                return;
            }

            filteredProcessed.forEach((item, index) => {
                const c = item.client;
                const displayName = item.display_name;
                const safeName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                const assigneeBadge = item.assignee !== 'Unassigned' ? 
                    `<div class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center leading-none"><i class="fa-solid fa-user-tie mr-1"></i>${item.assignee}</div>` : '';

                const refVal = item.reference || '';
                const referenceHtml = `<td class="px-2 py-3 text-center border-l border-gray-100">
                    <button onclick="openITDrawer('${c.client_id}', '${safeName}', 'reference', 'Client Reference', '${selectedPeriod}', ${refVal ? 'true' : 'false'})" class="w-full h-8 rounded hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 transition flex items-center justify-center border border-transparent text-xs font-bold font-mono">
                        ${refVal || '—'}
                    </button>
                </td>`;

                const callHtml = item.isCall === 'Done' ? 
                    `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openITDrawer('${c.client_id}', '${safeName}', 'isCall', 'Call / Contact', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200"><div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>` : 
                    `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openITDrawer('${c.client_id}', '${safeName}', 'isCall', 'Call / Contact', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;

                const commentText = window.globalITCommentsMap && window.globalITCommentsMap[item.key] || '';
                const commentHtml = `<td class="px-2 py-3 border-l border-gray-100 text-xs text-slate-500 font-medium max-w-[200px] truncate animate-fade-in" title="${commentText || 'No comment'}">
                    <button onclick="openITDrawer('${c.client_id}', '${safeName}', 'comment', 'Add Comment', '${selectedPeriod}', false)" class="w-full text-left truncate hover:text-indigo-600 transition">
                        ${commentText || '—'}
                    </button>
                </td>`;

                let billHtml = '';
                const isBilled = item.billStatus === 'Billed';
                if (isBilled) {
                    const invDetails = window.globalITBilledMap && window.globalITBilledMap[c.client_id];
                    const currentAmount = invDetails ? parseFloat(invDetails.amount) : 0;
                    const origAmount = window.globalITOriginalAmountsMap && window.globalITOriginalAmountsMap[item.key];
                    
                    let isEdited = false;
                    if (origAmount !== undefined && origAmount !== null) {
                        isEdited = (currentAmount !== origAmount);
                    } else {
                        const fixedRate = parseFloat(window.globalITRatesMap[c.client_id]) || 0;
                        isEdited = (currentAmount !== fixedRate);
                    }

                    const tickHtml = isEdited ? `<i class="fa-solid fa-check text-blue-500 font-black text-[11px] ml-1 animate-pulse" title="Amount edited (Original: ₹${origAmount !== undefined && origAmount !== null ? origAmount : 'N/A'})"></i>` : '';

                    billHtml = `<td class="px-1 py-2 text-center border-l border-gray-100 bg-emerald-50/5">
                        <div class="flex flex-col items-center justify-center gap-1">

    async function saveITStatus(clientId, period, field, value) {
        try {
            const key = `${clientId}_${period}`;
            const track = globalITTrackingMap[key] || {
                challanStatus: 'Pending',
                returnStatus: 'Pending',
                billStatus: 'Unbilled',
                filingDate: '',
                isCall: 'Pending',
                advance: 'Pending'
            };

            track[field] = value;
            globalITTrackingMap[key] = track;

            renderFilteredITTable();

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (!hostClientId) throw new Error("No active client found to save log.");

            const note = `[IT_TRACKING] ${clientId}|${period}|${track.challanStatus}|${track.returnStatus}|${track.billStatus}|${track.filingDate}|${track.isCall}|${track.advance}`;

            await supabaseClient.from('task_logs').insert([{
                client_id: hostClientId,
                user_id: currentUser.id,
                note: note
            }]);

        } catch (err) {
            console.error("Error saving IT status:", err);
            showToast("Failed to save changes: " + err.message);
        }
    }

    async function assignITClient(clientId, makerId) {
        try {
            let serviceType = 'Income Tax Return';
            const { data: visSettings } = await supabaseClient
                .from('page_visibility_settings')
                .select('enrolled_services')
                .eq('page_id', 'view-income-tax')
                .maybeSingle();

            const activeService = (visSettings && visSettings.enrolled_services && visSettings.enrolled_services[0]) || serviceType;

            const { error: delErr } = await supabaseClient
                .from('client_assignments')
                .delete()
                .eq('client_id', clientId)
                .eq('service_type', activeService);

            if (delErr) throw delErr;

            if (makerId) {
                const { error: insErr } = await supabaseClient
                    .from('client_assignments')
                    .insert([{
                        client_id: clientId,
                        service_type: activeService,
                        maker_id: makerId
                    }]);
                if (insErr) throw insErr;
            }

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            const assigneeName = makerId ? (globalTeamMembers.find(u => u.id === makerId)?.name || 'selected user') : 'Unassigned';
            if (hostClientId) {
                await supabaseClient.from('task_history').insert([{
                    client_id: clientId,
                    task_type: 'IT',
                    task_name: 'Income Tax Assignment',
                    user_id: currentUser.id,
                    note: `Workflow assigned to ${assigneeName}`,
                    timestamp: new Date().toISOString()
                }]);
            }

            showToast("Assignment updated successfully!");
            if (!window.globalAssignmentsList) window.globalAssignmentsList = [];
            window.globalAssignmentsList = window.globalAssignmentsList.filter(a => !(a.client_id === clientId && a.service_type === activeService));
            if (makerId) {
                window.globalAssignmentsList.push({
                    client_id: clientId,
                    service_type: activeService,
                    maker_id: makerId
                });
            }
            renderFilteredITTable();

        } catch (err) {
            console.error("Assignment error:", err);
            showToast("Failed to update assignment: " + err.message);
        }
    }

    async function openITDrawer(clientId, clientName, columnKey, taskName, period, isDone) {
        try {
            document.getElementById('itDrawerClientId').value = clientId;
            document.getElementById('itDrawerPeriod').value = period;
            document.getElementById('itDrawerColumn').value = columnKey;
            
            document.getElementById('itDrawerClientName').innerText = clientName;
            
            const displayPeriod = period.replace('AY_', 'AY ');
            const taskNameDisplay = `${taskName} - ${displayPeriod}`;
            
            document.getElementById('itDrawerTaskName').textContent = taskNameDisplay;
            document.getElementById('itDrawerNote').value = '';

            const transferSelect = document.getElementById('itTransferUserSelect');
            if (transferSelect) {
                transferSelect.innerHTML = '<option value="">-- No Transfer --</option>';
                (window.globalTeamMembers || []).forEach(u => {
                    transferSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`;
                });

                const allowedServices = window.globalITAllowedServices || ['Income Tax Return'];
                const assignment = (window.globalAssignmentsList || []).find(a => 
                    a.client_id === clientId && 
                    a.service_type && 
                    allowedServices.some(as => a.service_type.toLowerCase() === as.toLowerCase())
                );
                if (assignment && assignment.maker_id) {
                    transferSelect.value = assignment.maker_id;
                }
            }

            const dateDiv = document.getElementById('itDrawerFilingDateDiv');
            const refDiv = document.getElementById('itDrawerReferenceDiv');
            const mopDiv = document.getElementById('itDrawerMOPDiv');
            const recdByDiv = document.getElementById('itDrawerRecdByDiv');
            const commentDiv = document.getElementById('itDrawerCommentDiv');
            const customNoteDiv = document.getElementById('itDrawerCustomNoteDiv');

            if (dateDiv) dateDiv.classList.add('hidden');
            if (refDiv) refDiv.classList.add('hidden');
            if (mopDiv) mopDiv.classList.add('hidden');
            if (recdByDiv) recdByDiv.classList.add('hidden');
            if (commentDiv) commentDiv.classList.add('hidden');
            if (customNoteDiv) customNoteDiv.classList.remove('hidden'); // Show note input by default

            const key = `${clientId}_${period}`;
            const track = globalITTrackingMap[key] || {};

            if (columnKey === 'reference') {
                if (refDiv) {
                    refDiv.classList.remove('hidden');
                    document.getElementById('itDrawerReference').value = track.reference || '';
                }
            } else if (columnKey === 'mop') {
                if (mopDiv) {
                    mopDiv.classList.remove('hidden');
                    document.getElementById('itDrawerMOP').value = track.mop || '';
                }
            } else if (columnKey === 'recdBy') {
                if (recdByDiv) {
                    recdByDiv.classList.remove('hidden');
                    const recdBySelect = document.getElementById('itDrawerRecdBy');
                    if (recdBySelect) {
                        recdBySelect.innerHTML = '<option value="">-- Select Member --</option>';
                        (window.globalTeamMembers || []).forEach(u => {
                            recdBySelect.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                        });
                        recdBySelect.innerHTML += '<option value="MF ICICI Account">MF ICICI Account</option>';
                    }
                    document.getElementById('itDrawerRecdBy').value = track.recdBy || '';
                }
            } else if (columnKey === 'comment') {
                const commentSelect = document.getElementById('itDrawerCommentSelect');
                const commentText = window.globalITCommentsMap && window.globalITCommentsMap[key] || '';
                if (commentDiv && commentSelect) {
                    commentDiv.classList.remove('hidden');
                    if (['Filed', 'Hold', 'Challan Pending', 'Details Pending'].includes(commentText)) {
                        commentSelect.value = commentText;
                    } else if (commentText) {
                        commentSelect.value = 'Others';
                        document.getElementById('itDrawerNote').value = commentText;
                    } else {
                        commentSelect.value = '';
                    }
                    window.toggleITDrawerCommentCustom();
                }
            } else if (columnKey === 'filingDate') {
                if (dateDiv) {
                    dateDiv.classList.remove('hidden');
                    document.getElementById('itDrawerFilingDate').value = track.filingDate || new Date().toISOString().split('T')[0];
                }
            }

            // Load follow-up date
            const fDate = window.globalITFollowupMap && window.globalITFollowupMap[key] || '';
            document.getElementById('itDrawerFollowupDate').value = fDate;

            const btnNote = document.getElementById('itSaveNoteOnlyBtn');
            const btnDone = document.getElementById('itSaveTaskBtn');

            if (columnKey === 'reference' || columnKey === 'mop' || columnKey === 'recdBy' || columnKey === 'comment') {
                btnDone.className = 'flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2';
                btnDone.setAttribute('onclick', 'saveITTaskFromDrawer(false)');
                btnDone.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Changes`;
            } else {
                let doneText = 'Mark Completed';
                let revertText = 'Revert to Pending';
                if (columnKey === 'advance') {
                    doneText = 'Mark Received';
                    revertText = 'Revert to Pending';
                } else if (columnKey === 'billStatus') {
                    doneText = 'Mark Billed';
                    revertText = 'Revert to Unbilled';
                }

                if (isDone) {
                    btnDone.className = 'flex-1 bg-rose-500 hover:bg-rose-600 text-white px-4 py-3 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2';
                    btnDone.setAttribute('onclick', 'saveITTaskFromDrawer(true)');
                    btnDone.innerHTML = `<i class="fa-solid fa-rotate-left"></i> ${revertText}`;
                } else {
                    btnDone.className = 'flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2';
                    btnDone.setAttribute('onclick', 'saveITTaskFromDrawer(false)');
                    btnDone.innerHTML = `<i class="fa-solid fa-check-double"></i> ${doneText}`;
                }
            }

            btnNote.className = 'flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-3 rounded-xl font-bold transition shadow-sm flex justify-center items-center gap-2';

            document.getElementById('itTaskDrawer').classList.remove('hidden');

            const tl = document.getElementById('itDrawerHistoryTimeline');
            tl.innerHTML = '<div class="text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading specific history...</div>';
            
            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (hostClientId) {
                const { data: logs } = await supabaseClient
                    .from('task_logs')
                    .select('*, users(name)')
                    .or(`note.ilike.%[IT_LOG] ${clientId}|${period}|%,note.ilike.%[IT_TRACKING] ${clientId}|${period}|%,note.ilike.%[IT_REMARK] ${clientId}|${period}|%`)
                    .order('timestamp', { ascending: false });

                tl.innerHTML = '';
                
                let filteredLogs = [];
                if (logs) {
                    filteredLogs = logs.filter(log => {
                        if (log.note.startsWith('[IT_LOG]')) {
                            const payload = log.note.replace('[IT_LOG] ', '').trim();
                            const parts = payload.split('|');
                            return parts[2] === columnKey;
                        }
                        if (log.note.startsWith('[IT_TRACKING]')) {
                            const payload = log.note.replace('[IT_TRACKING] ', '').trim();
                            const parts = payload.split('|');
                            if (parts.length >= 8) {
                                const challanStatus = parts[2] || 'Pending';
                                const returnStatus = parts[3] || 'Pending';
                                const billStatus = parts[4] || 'Unbilled';
                                const isCall = parts[6] || 'Pending';
                                const advance = parts[7] || 'Pending';
                                
                                if (columnKey === 'challanStatus' && challanStatus === 'Done') return true;
                                if (columnKey === 'returnStatus' && returnStatus === 'Done') return true;
                                if (columnKey === 'billStatus' && billStatus === 'Billed') return true;
                                if (columnKey === 'isCall' && isCall === 'Done') return true;
                                if (columnKey === 'advance' && advance === 'Received') return true;
                            }
                            return false;
                        }
                        if (log.note.startsWith('[IT_REMARK]')) {
                            return true;
                        }
                        return false;
                    });
                }

                if (filteredLogs.length === 0) {
                    tl.innerHTML = '<div class="text-xs text-gray-400 italic py-2">No previous history for this task.</div>';
                } else {
                    filteredLogs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                        let msg = '';
                        
                        if (log.note.startsWith('[IT_LOG]')) {
                            const payload = log.note.replace('[IT_LOG] ', '').trim();
                            const parts = payload.split('|');
                            const statusVal = parts[3] || 'Pending';
                            const remarkText = parts[4] || '';
                            const fDate = parts[5] || '';
                            
                            msg = `Status updated to <strong>${statusVal}</strong>`;
                            if (remarkText) {
                                msg += `<br><span class="text-gray-600 italic">Remark: "${remarkText}"</span>`;
                            }
                            if (fDate) {
                                msg += `<br><span class="text-xs text-indigo-600 font-medium">Filing/Receipt Date: ${fDate}</span>`;
                            }
                        } else if (log.note.startsWith('[IT_REMARK]')) {
                            const payload = log.note.replace('[IT_REMARK] ', '').trim();
                            const parts = payload.split('|');
                            msg = `<span class="text-xs font-bold text-amber-600 bg-amber-50 px-1 rounded border border-amber-100">Legacy Remark</span>: "${parts[2] || ''}"`;
                        } else if (log.note.startsWith('[IT_TRACKING]')) {
                            const payload = log.note.replace('[IT_TRACKING] ', '').trim();
                            const parts = payload.split('|');
                            msg = `<span class="text-xs font-bold text-amber-600 bg-amber-50 px-1 rounded border border-amber-100">Legacy Snapshot</span>: Challan: ${parts[2] || 'Pending'}, Return: ${parts[3] || 'Pending'}, Bill: ${parts[4] || 'Unbilled'}, Call: ${parts[6] || 'Pending'}, Advance: ${parts[7] || 'Pending'}`;
                        }
                        
                        tl.innerHTML += `
                        <div class="bg-white rounded-xl border border-gray-200 mb-3 shadow-sm overflow-hidden border-l-4 border-l-indigo-400">
                            <div class="px-4 py-2 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                                <span class="text-xs font-bold text-gray-500 uppercase">${date}</span>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold text-indigo-600 uppercase">${log.users?.name || 'System'}</span>
                                    <button onclick="deleteITLog('${log.log_id}', '${clientId}', '${columnKey}', '${period}')" class="text-gray-400 hover:text-red-500 transition cursor-pointer p-1" title="Delete & Revert Status">
                                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="p-4"><p class="text-sm text-gray-700">${msg}</p></div>
                        </div>`;
                    });
                }
            }

        } catch (err) {
            console.error("Error opening IT drawer:", err);
        }
    }

            if (delErr) throw delErr;

            await loadITCenterData();

        } catch (err) {

            showToast("Error: " + err.message);
        }
    }

    async function saveITTaskFromDrawer(isRevert) {
        const btn = document.getElementById('itSaveTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        try {
            const clientId = document.getElementById('itDrawerClientId').value;
            const period = document.getElementById('itDrawerPeriod').value;
            const columnKey = document.getElementById('itDrawerColumn').value;
            const noteText = document.getElementById('itDrawerNote').value.trim();
            const transferTo = document.getElementById('itTransferUserSelect').value;
            const filingDateVal = document.getElementById('itDrawerFilingDate').value;

            // Validation: Person Assigned is mandatory
            if (!transferTo) {
                showToast("Person assigned is mandatory. Please select a team member.");
                btn.innerHTML = ogHtml;
                btn.disabled = false;
                return;
            }

            const key = `${clientId}_${period}`;
            const track = globalITTrackingMap[key] || {};
            let followupDate = document.getElementById('itDrawerFollowupDate').value;
            const origFollowupDate = window.globalITFollowupMap && window.globalITFollowupMap[key] || '';

            let statusValue = 'Pending';
            if (isRevert) {
                if (columnKey === 'billStatus') {
                    statusValue = 'Unbilled';
                } else if (columnKey === 'reference' || columnKey === 'mop' || columnKey === 'recdBy' || columnKey === 'comment') {
                    statusValue = '';
                } else {
                    statusValue = 'Pending';
                }
            } else {
                if (columnKey === 'challanStatus' || columnKey === 'returnStatus') {
                    statusValue = 'Done';
                } else if (columnKey === 'isCall') {
                    statusValue = 'Done';
                } else if (columnKey === 'advance') {
                    statusValue = 'Received';
                } else if (columnKey === 'billStatus') {
                    statusValue = 'Billed';
                } else if (columnKey === 'reference') {
                    statusValue = document.getElementById('itDrawerReference').value.trim();
                } else if (columnKey === 'mop') {
                    statusValue = document.getElementById('itDrawerMOP').value;
                } else if (columnKey === 'recdBy') {
                    statusValue = document.getElementById('itDrawerRecdBy').value;
                } else if (columnKey === 'comment') {
                    const commentSelect = document.getElementById('itDrawerCommentSelect');
                    if (commentSelect.value === 'Others') {
                        statusValue = document.getElementById('itDrawerNote').value.trim();
                    } else {
                        statusValue = commentSelect.value;
                    }
                }
            }

            const commentVal = (columnKey === 'comment') ? statusValue : (window.globalITCommentsMap && window.globalITCommentsMap[key] || '');
            const billVal = (columnKey === 'billStatus') ? statusValue : (track.billStatus || 'Unbilled');
            const isCompleting = (commentVal === 'Filed' && billVal === 'Billed');

            if (!isCompleting) {
                const hasNoOrigDate = !origFollowupDate;
                const isOrigDatePassed = origFollowupDate ? (new Date(origFollowupDate) < new Date().setHours(0,0,0,0)) : false;

                if (hasNoOrigDate || isOrigDatePassed) {
                    if (!followupDate) {
                        showToast("Follow-up date is mandatory because the case currently has no follow-up date or the date has passed.");
                        btn.innerHTML = ogHtml;
                        btn.disabled = false;
                        return;
                    }
                    const isNewDatePassed = new Date(followupDate) < new Date().setHours(0,0,0,0);
                    if (isNewDatePassed) {
                        showToast("The follow-up date cannot be in the past.");
                        btn.innerHTML = ogHtml;
                        btn.disabled = false;
                        return;
                    }
                }
            }

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (!hostClientId) throw new Error("No active client found to save.");

            const filingDate = isRevert ? '' : (filingDateVal || '');

            const logNote = `[IT_LOG] ${clientId}|${period}|${columnKey}|${statusValue}|${noteText || (isRevert ? 'Reverted to Pending' : 'Completed')}|${filingDate}`;

            await supabaseClient.from('task_logs').insert([{
                client_id: hostClientId,
                user_id: currentUser.id,
                note: logNote
            }]);

            if (isCompleting) {
                followupDate = '';
            }

            if (followupDate !== origFollowupDate) {
                const logFollowup = `[IT_FOLLOWUP] ${clientId}|${period}|${followupDate}|Follow-up date updated from ${origFollowupDate || 'None'} to ${followupDate || 'None'}`;
                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: logFollowup
                }]);
                if (!window.globalITFollowupMap) window.globalITFollowupMap = {};
                window.globalITFollowupMap[key] = followupDate;
            }

            if (transferTo) {
                const allowedServices = window.globalITAllowedServices || ['Income Tax Return'];
                const assignment = (window.globalAssignmentsList || []).find(a => 
                    a.client_id === clientId && 
                    a.service_type && 
                    allowedServices.some(as => a.service_type.toLowerCase() === as.toLowerCase())
                );
                if (!assignment || assignment.maker_id !== transferTo) {
                    await assignITClient(clientId, transferTo);
                }
            }

            // Update local memory state directly!
            if (!globalITTrackingMap[key]) {
                const isBilledInDb = window.globalITBilledMap && window.globalITBilledMap[clientId];
                globalITTrackingMap[key] = {
                    reference: '',
                    isCall: 'Pending',
                    billStatus: isBilledInDb ? 'Billed' : 'Unbilled',
                    mop: '',
                    recdBy: '',
                    challanStatus: 'Pending',
                    returnStatus: 'Pending',
                    filingDate: '',
                    advance: 'Pending'
                };
            }

            globalITTrackingMap[key][columnKey] = statusValue;
            if (filingDate && (columnKey === 'challanStatus' || columnKey === 'returnStatus' || columnKey === 'filingDate')) {
                globalITTrackingMap[key].filingDate = filingDate;
            }

            // Update comments map
            if (statusValue === 'Filed') {
                window.globalITCommentsMap[key] = 'Filed';
            } else if (columnKey !== 'billStatus' && columnKey !== 'comment' && noteText && noteText !== 'Completed' && noteText !== 'Reverted to Pending') {
                if (window.globalITCommentsMap[key] !== 'Filed') {
                    window.globalITCommentsMap[key] = noteText;
                }
            } else if (columnKey === 'comment' && statusValue && statusValue !== 'Completed' && statusValue !== 'Reverted to Pending') {
                window.globalITCommentsMap[key] = statusValue;
            } else if (columnKey === 'comment' && isRevert) {
                delete window.globalITCommentsMap[key];
            }

            // Update billed maps if billStatus changes
            if (columnKey === 'billStatus') {
                if (statusValue === 'Billed') {
                    globalITTrackingMap[key].billStatus = 'Billed';
                } else {
                    if (window.globalITBilledMap) delete window.globalITBilledMap[clientId];
                    if (window.globalITOriginalAmountsMap) delete window.globalITOriginalAmountsMap[key];
                    globalITTrackingMap[key].billStatus = 'Unbilled';
                }
            }

            renderFilteredITTable();
            closeITDrawer();

        } catch (err) {
            console.error("Error saving IT task from drawer:", err);
            showToast("Error: " + err.message);
        } finally {
            btn.innerHTML = ogHtml;
            btn.disabled = false;
        }
    }

    window.toggleITDrawerCommentCustom = function() {
        const select = document.getElementById('itDrawerCommentSelect');
        const customDiv = document.getElementById('itDrawerCustomNoteDiv');
        if (select && customDiv) {
            if (select.value === 'Others') {
                customDiv.classList.remove('hidden');
            } else {
                customDiv.classList.add('hidden');
            }
        }
    };

    async function saveITNoteOnlyFromDrawer() {
        const btn = document.getElementById('itSaveNoteOnlyBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Recording...';
        btn.disabled = true;

        try {
            const clientId = document.getElementById('itDrawerClientId').value;
            const period = document.getElementById('itDrawerPeriod').value;
            const columnKey = document.getElementById('itDrawerColumn').value;
            const noteText = document.getElementById('itDrawerNote').value.trim();
            const transferTo = document.getElementById('itTransferUserSelect').value;

            // Validation: Person Assigned is mandatory
            if (!transferTo) {
                showToast("Person assigned is mandatory. Please select a team member.");
                btn.innerHTML = ogHtml;
                btn.disabled = false;
                return;
            }

            const key = `${clientId}_${period}`;
            const track = globalITTrackingMap[key] || {
                challanStatus: 'Pending',
                returnStatus: 'Pending',
                billStatus: 'Unbilled',
                filingDate: '',
                isCall: 'Pending',
                advance: 'Pending'
            };

            // Followup date check
            let followupDate = document.getElementById('itDrawerFollowupDate').value;
            const origFollowupDate = window.globalITFollowupMap && window.globalITFollowupMap[key] || '';
            
            const commentSelect = document.getElementById('itDrawerCommentSelect');
            let commentVal = (window.globalITCommentsMap && window.globalITCommentsMap[key] || '');
            if (columnKey === 'comment' && commentSelect && commentSelect.value) {
                commentVal = (commentSelect.value === 'Others') ? noteText : commentSelect.value;
            }
            const billVal = (columnKey === 'billStatus') ? (track.billStatus || 'Unbilled') : (track.billStatus || 'Unbilled');
            const isCompleting = (commentVal === 'Filed' && billVal === 'Billed');

            if (!isCompleting) {
                const hasNoOrigDate = !origFollowupDate;
                const isOrigDatePassed = origFollowupDate ? (new Date(origFollowupDate) < new Date().setHours(0,0,0,0)) : false;

                if (hasNoOrigDate || isOrigDatePassed) {
                    if (!followupDate) {
                        showToast("Follow-up date is mandatory because the case currently has no follow-up date or the date has passed.");
                        btn.innerHTML = ogHtml;
                        btn.disabled = false;
                        return;
                    }
                    const isNewDatePassed = new Date(followupDate) < new Date().setHours(0,0,0,0);
                    if (isNewDatePassed) {
                        showToast("The follow-up date cannot be in the past.");
                        btn.innerHTML = ogHtml;
                        btn.disabled = false;
                        return;
                    }
                }
            }

            if (!noteText && !transferTo && !(columnKey === 'comment' && commentSelect && commentSelect.value)) {
                btn.innerHTML = ogHtml;
                btn.disabled = false;
                return showToast("Please enter a remark or select a user to transfer to.");
            }

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (!hostClientId) throw new Error("No active client found.");

            if (columnKey === 'comment' && commentSelect && commentSelect.value) {
                const statusVal = (commentSelect.value === 'Others') ? noteText : commentSelect.value;
                const logNote = `[IT_LOG] ${clientId}|${period}|comment|${statusVal}|${noteText}|`;
                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: logNote
                }]);
                if (!window.globalITCommentsMap) window.globalITCommentsMap = {};
                window.globalITCommentsMap[key] = statusVal;
                if (!globalITTrackingMap[key]) globalITTrackingMap[key] = {};
                globalITTrackingMap[key].comment = statusVal;
            } else if (noteText) {
                const currentStatus = track[columnKey] || 'Pending';
                const logNote = `[IT_LOG] ${clientId}|${period}|${columnKey}|${currentStatus}|${noteText}|`;
                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: logNote
                }]);
                if (columnKey !== 'billStatus') {
                    if (window.globalITCommentsMap[key] !== 'Filed') {
                        window.globalITCommentsMap[key] = noteText;
                    }
                }
            }
            renderFilteredITTable();
            closeITDrawer();

        } catch (err) {
            console.error("Error saving IT remark:", err);
            showToast("Error: " + err.message);
        } finally {
            btn.innerHTML = ogHtml;
            btn.disabled = false;
        }
    }

    function closeITDrawer() {
        document.getElementById('itDrawerFollowupDate').value = '';
        document.getElementById('itTaskDrawer').classList.add('hidden');
    }

    function sortItTable(field) {
        if (itSortCol === field) {
            itSortAsc = !itSortAsc;
        } else {
            itSortCol = field;
            itSortAsc = true;
        }

        const columns = ['display_name', 'followup_date', 'reference', 'isCall', 'comment', 'billStatus', 'mop', 'recdBy'];
        columns.forEach(col => {
            const icon = document.getElementById(`sort_icon_it_${col}`);
            if (icon) {
                icon.className = 'fa-solid fa-sort text-xs text-gray-300';
            }
        });

        const activeIcon = document.getElementById(`sort_icon_it_${field}`);
        if (activeIcon) {
            activeIcon.className = itSortAsc ? 'fa-solid fa-sort-up text-xs text-indigo-600' : 'fa-solid fa-sort-down text-xs text-indigo-600';
        }

        renderFilteredITTable();
    }

    window.openITBulkBillModal = function() {
        const modal = document.getElementById('itBulkBillModal');
        if (!modal) return;

        const selectEl = document.getElementById('itMonthFilter');
        const selectedPeriod = selectEl ? selectEl.value : '';
        if (!selectedPeriod) return showToast("Please select a period first!");

        const periodStr = selectedPeriod.replace('AY_', 'AY ');

        document.getElementById('itBulkBillModalPeriod').innerText = `Period: ${periodStr}`;

        const tbody = document.getElementById('itBulkBillModalTableBody');
        tbody.innerHTML = '';

        let totalClients = 0;
        let totalAmount = 0;
        window.itBulkBillClientsList = [];

        globalITClients.forEach(client => {
            const key = `${client.client_id}_${selectedPeriod}`;
            const track = globalITTrackingMap[key] || {
                challanStatus: 'Pending',
                returnStatus: 'Pending',
                billStatus: 'Unbilled',
                filingDate: '',
                isCall: 'Pending',
                advance: 'Pending'
            };
            
            const commentText = window.globalITCommentsMap && window.globalITCommentsMap[key] || '';

            const isBilled = track.billStatus === 'Billed';
            if (!isBilled && commentText === 'Filed') {
                const rate = parseFloat(window.globalITRatesMap[client.client_id]) || 0;
                totalClients++;
                totalAmount += rate;

                window.itBulkBillClientsList.push({
                    client_id: client.client_id,
                    display_name: client.display_name,
                    rate: rate
                });

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="px-4 py-3 font-semibold text-slate-800">${client.display_name}</td>
                        <td class="px-4 py-3 text-right font-mono text-slate-600">₹${rate.toFixed(2)}</td>
                    </tr>
                `;
            }
        });

        document.getElementById('itBulkBillModalTotalClients').innerText = totalClients;
        document.getElementById('itBulkBillModalTotalAmount').innerText = `₹${totalAmount.toFixed(2)}`;

        if (totalClients === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center py-6 text-slate-400 italic">No unbilled clients with completed Return Status found for this period.</td></tr>`;
        }

        modal.classList.remove('hidden');
    };

    window.closeITBulkBillModal = function() {
        const modal = document.getElementById('itBulkBillModal');
        if (modal) modal.classList.add('hidden');
    };

    window.generateITBulkBills = async function() {
        if (!window.itBulkBillClientsList || window.itBulkBillClientsList.length === 0) {
            return showToast("No clients to bill!");
        }

        const selectEl = document.getElementById('itMonthFilter');
        const selectedPeriod = selectEl ? selectEl.value : '';
        const periodStr = selectedPeriod.replace('AY_', 'AY ');

        if (!confirm(`Are you sure you want to generate Income Tax bills for ${window.itBulkBillClientsList.length} clients?`)) return;

        closeITBulkBillModal();
        
        const tbody = document.getElementById('it-table-body');
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400 italic"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-600"></i><br>Generating Bulk Bills...</td></tr>';

        try {
            let successCount = 0;
            let firmId = null;
            
            const { data: setting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_it_firm').maybeSingle();
            
            if (setting) {
                firmId = setting.setting_value;
            } else {
                const { data: gstSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
                if (gstSetting) firmId = gstSetting.setting_value;
            }

            for (const client of window.itBulkBillClientsList) {
                try {
                    const billNo = await window.getNextInvoiceNumber(firmId);
                    const invoiceData = { 
                        client_id: client.client_id, 
                        service_name: `Income Tax Return Consultancy - ${periodStr}`, 
                        amount: client.rate, 
                        status: 'Unpaid', 
                        bill_number: billNo, 
                        generated_date: new Date().toISOString() 
                    };
                    if (firmId) invoiceData.firm_id = firmId;
                    const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                    if (error) throw error;

                    const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
                    if (hostClientId) {
                        const logNote = `[IT_LOG] ${client.client_id}|${selectedPeriod}|billStatus|Billed|Bill Prepared (₹${client.rate}) [BillNo: ${billNo}]|`;
                        await supabaseClient.from('task_logs').insert([{
                            client_id: hostClientId,
                            user_id: currentUser.id,
                            note: logNote
                        }]);
                    }

                    successCount++;
                } catch (err) {
                    console.error(`Error billing client ${client.display_name}:`, err);
                }
            }
            showToast(`Successfully generated ${successCount} Income Tax bills!`);
            await loadITCenterData();
        } catch (err) {
            showToast("Error in bulk billing process: " + err.message);
            await loadITCenterData();
        }
    };

    window.prepareITBill = async function(clientId, clientName, period) {
        const rate = window.globalITRatesMap[clientId] || 0;
        const confirmedRate = prompt(`Confirm Income Tax billing rate for ${clientName} (${period.replace('AY_', 'AY ')}):`, rate);
        if (confirmedRate === null) return;
        
        const amount = parseFloat(confirmedRate);
        if (isNaN(amount)) return showToast("Invalid amount!");

        try {
            const periodStr = period.replace('AY_', 'AY ');

            if (amount === 0) {
                const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
                if (hostClientId) {
                    const logNote = `[IT_LOG] ${clientId}|${period}|billStatus|Billed|Marked as Free (0 Rate)|`;
                    await supabaseClient.from('task_logs').insert([{
                        client_id: hostClientId,
                        user_id: currentUser.id,
                        note: logNote
                    }]);
                }
                showToast("Task marked as completed with 0 rate (Free).");
            } else {
                let firmId = null;
                const { data: setting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_it_firm').maybeSingle();
                if (setting) {
                    firmId = setting.setting_value;
                } else {
                    const { data: gstSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
                    if (gstSetting) firmId = gstSetting.setting_value;
                }

                const billNo = await window.getNextInvoiceNumber(firmId);
                const invoiceData = { 
                    client_id: clientId, 
                    service_name: `Income Tax Return Consultancy - ${periodStr}`, 
                    amount: amount, 
                    status: 'Unpaid', 
                    bill_number: billNo, 
                    generated_date: new Date().toISOString() 
                };
                if (firmId) invoiceData.firm_id = firmId;
                const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                if (error) throw error;

                const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
                if (hostClientId) {
                    const logNote = `[IT_LOG] ${clientId}|${period}|billStatus|Billed|Bill Prepared (₹${amount}) [BillNo: ${billNo}]|`;
                    await supabaseClient.from('task_logs').insert([{
                        client_id: hostClientId,
                        user_id: currentUser.id,
                        note: logNote
                    }]);
                }

                showToast("Income Tax bill prepared successfully!");
            }
            
            await loadITCenterData();
        } catch (err) { 
            showToast("Error preparing bill: " + err.message); 
        }
    };

    window.promptCancelITBill = async function(clientId, clientName, period) {
        if (!confirm(`Are you sure you want to cancel the Income Tax billing status for ${clientName} (Period: ${period.replace('AY_', 'AY ')})?\n\nThis will mark the bill as Cancelled and let you generate a new bill.`)) {
            return;
        }

        const reason = prompt("Please enter the reason for cancellation (required):");
        if (reason === null) return;
        if (!reason.trim()) {
            showToast("A reason is required to cancel the billing status.");
            return;
        }

        try {
            const { data: invoices } = await supabaseClient.from('invoices')
                .select('*')
                .eq('client_id', clientId)
                .neq('status', 'Cancelled');
            
            if (invoices && invoices.length > 0) {
                const periodStr = period.replace('AY_', 'AY ');
                const matchingInvoices = invoices.filter(inv => {
                    return inv.service_name && (inv.service_name.includes(`Income Tax Fees - ${periodStr}`) || inv.service_name.includes(`Income Tax Return Consultancy - ${periodStr}`));
                });

                if (matchingInvoices.length > 0) {
                    const pkColumn = (invoices[0].invoice_id !== undefined) ? 'invoice_id' : 'id';
                    const idsToCancel = matchingInvoices.map(inv => inv[pkColumn]);
                    
                    const { error: invErr } = await supabaseClient.from('invoices')
                        .update({ status: 'Cancelled' })
                        .in(pkColumn, idsToCancel);
                    
                    if (invErr) throw invErr;
                }
            }

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            if (hostClientId) {
                const logNote = `[IT_LOG] ${clientId}|${period}|billStatus|Unbilled|Billing Cancelled. Reason: ${reason}|`;
                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: logNote
                }]);
            }

            showToast("Billing status cancelled and logged successfully.");
            await loadITCenterData();
        } catch (err) {
            showToast("Error cancelling bill: " + err.message);
        }
    };

    window.openITDrawer = openITDrawer;
    window.saveITTaskFromDrawer = saveITTaskFromDrawer;
    window.deleteITLog = deleteITLog;

    window.filterITByTile = function(type) {
        const refEl = document.getElementById('filter_it_reference');
        const callEl = document.getElementById('filter_it_isCall');
        const commentEl = document.getElementById('filter_it_comment');
        const billEl = document.getElementById('filter_it_billStatus');
        const mopEl = document.getElementById('filter_it_mop');
        const recdByEl = document.getElementById('filter_it_recdBy');

        if (refEl) refEl.value = 'all';
        if (callEl) callEl.value = 'all';
        if (commentEl) commentEl.value = 'all';
        if (billEl) billEl.value = 'all';
        if (mopEl) mopEl.value = 'all';
        if (recdByEl) recdByEl.value = 'all';

        if (type === 'call') {
            if (callEl) callEl.value = 'Done';
        } else if (type === 'billed') {
            if (billEl) billEl.value = 'Billed';
        } else if (type === 'unbilled') {
            if (billEl) billEl.value = 'Unbilled';
        } else if (type === 'filed') {
            if (commentEl) commentEl.value = 'Filed';
        } else if (type === 'details') {
            if (commentEl) commentEl.value = 'Details Pending';
        } else if (type === 'hold') {
            if (commentEl) commentEl.value = 'Hold';
        } else if (type === 'challan') {
            if (commentEl) commentEl.value = 'Challan Pending';
        } else if (type === 'others') {
            if (commentEl) commentEl.value = 'custom';
        }

        renderFilteredITTable();
    };
</script>
