<script>

    function getDeterministicShortPeriod(period) {
        if (!period || typeof period !== 'string' || !period.includes('-')) return '';
        const [y, m] = period.split('-');
        const shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const idx = parseInt(m, 10) - 1;
        if (idx < 0 || idx > 11) return '';
        return `${shortMonths[idx]} ${y}`;
    }

    function getDeterministicLongPeriod(period) {
        if (!period || typeof period !== 'string' || !period.includes('-')) return '';
        const [y, m] = period.split('-');
        const longMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const idx = parseInt(m, 10) - 1;
        if (idx < 0 || idx > 11) return '';
        return `${longMonths[idx]} ${y}`;
    }

    // True only for a GST *return* bill (GST Return [Fees] / GSTR-1 / GSTR-3B) that names the given period (YYYY-MM).
    // Other GST services (Registration, Amendment, Refund, Annual Return, 9/9C...) never count as monthly return billing.
    function isGstReturnInvoiceForPeriod(inv, period) {
        if (!inv || !inv.service_name || inv.status === 'Cancelled') return false;
        const name = inv.service_name;
        if (!/GST\s*Return|GSTR[\s-]*(1|3B)(?![0-9A-Z])/i.test(name)) return false;
        const longPeriod = getDeterministicLongPeriod(period);
        if (!longPeriod) return false;
        const [monthName, y] = longPeriod.split(' ');
        const monthRe = new RegExp(`\\b(${monthName}|${monthName.slice(0, 3)})[a-z]*[\\s,'-]*${y}\\b`, 'i');
        return monthRe.test(name);
    }

    function isLogMatchingTask(logNote, taskName, displayPeriod) {
        if (!logNote || !taskName || !displayPeriod) return false;
        
        const cleanStr = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

        // Which GST column a task label belongs to (GSTR-1 and IFF share one column)
        const gstColumnOf = (label) => {
            const c = cleanStr(label);
            if (c.includes('gstr3b') || c.includes('gst3b')) return 'gstr3b';
            if (c.includes('gstr1') || c.includes('gst1') || c.includes('iff') || c.includes('filedsuccessfully')) return 'gstr1';
            if (c.includes('sent2b') || c.includes('send2b')) return 'send2b';
            if (c.includes('2b')) return '2b';
            if (c.includes('excel') || c.includes('tally')) return 'excel';
            if (c.includes('data')) return 'data';
            if (c.includes('call') || c.includes('whatsapp')) return 'call';
            if (c.includes('bill')) return 'bill';
            if (c.includes('generalremark')) return 'remark';
            return null;
        };

        // Only the leading "[Task Name - Mon YYYY]" tag identifies the task; the note body
        // is free text and must not be searched (words like "data" or "2B" in a remark
        // would otherwise pull the log into other tasks' history).
        let tag = null;
        const tagMatch = String(logNote).match(/^\s*\[([^\]]+)\]/);
        if (tagMatch) {
            tag = tagMatch[1];
        } else {
            // Legacy format: "GST Action Completed: FILED SUCCESSFULLY - DEC 2024 ..." / "GST Action [FILED SUCCESSFULLY - DEC 2024]: ..."
            const legacy = String(logNote).match(/^GST\s+Action(?:\s+Completed)?\s*:?\s*\[?([^\]:(]+)/i);
            if (legacy) tag = legacy[1];
        }
        if (!tag) return false;

        // The period must match, and must be inside the tag
        if (!cleanStr(tag).includes(cleanStr(displayPeriod))) return false;

        const taskCol = gstColumnOf(taskName);
        if (taskCol) return gstColumnOf(tag) === taskCol;

        const taskPart = tag.replace(/\s*-\s*[A-Za-z]{3,9}\s+\d{4}\s*$/, '');
        return cleanStr(taskPart) === cleanStr(taskName);
    }

    console.log("CRM Module loaded - version with deterministic periods 2026-05-20.06");
    let currentActiveClientProfile = null;

    window.acknowledgeGstToday = async function(clientId, period, event) {
        if (event) event.stopPropagation();
        const displayPeriod = getDeterministicShortPeriod(period);
        try {
            const { error } = await supabaseClient.from('task_logs').insert([{
                client_id: clientId,
                user_id: currentUser.id,
                note: `[Acknowledged Today] GST acknowledged for period: ${displayPeriod}`,
                timestamp: new Date().toISOString()
            }]);
            
            if (error) throw error;
            
            showToast("GST acknowledged successfully!");
            if (typeof globalRefresh === 'function') globalRefresh();
            else loadGSTCenterData();
        } catch (err) {
            showToast("Error: " + err.message);
        }
    };

    window.acknowledgeTdsToday = async function(clientId, period, event) {
        if (event) event.stopPropagation();
        try {
            const { error } = await supabaseClient.from('task_history').insert([{
                client_id: clientId,
                task_type: 'TDS',
                task_name: 'TDS Return Filing',
                user_id: currentUser.id,
                note: `[Acknowledged Today] TDS return acknowledged for period: ${period} — all pending tasks reviewed`,
                timestamp: new Date().toISOString()
            }]);
            
            if (error) throw error;
            
            // Update local map for instant UI change
            if (!window.globalTdsUpdatedTodayMap) window.globalTdsUpdatedTodayMap = {};
            window.globalTdsUpdatedTodayMap[clientId] = true;
            if (typeof renderFilteredTDSTable === 'function') renderFilteredTDSTable();
        } catch (err) {
            showToast("Error: " + err.message);
        }
    };

    window.acknowledgeSubsidyToday = async function(clientId, subsidyType, event) {
        if (event) event.stopPropagation();
        try {
            // Check if existing followup date is overdue
            const key = makeStartupSubsidyKey(clientId, subsidyType);
            const latestData = (window.globalStartupsSubsidyLatestMap || {})[key] || {};
            let existingFollowup = latestData.next_followup_date || '';
            let finalSubsidyId = latestData.id;
            let finalRate = latestData.rate || '';
            let finalFeesReceived = latestData.fees_received || '';
            let finalStatus = latestData.status || 'Pending';
            let finalRemark = latestData.remark || '';

            // If we are on the dashboard and globalStartupsSubsidyLatestMap is empty, fetch the client_subsidy record directly
            if (!finalSubsidyId) {
                const { data: subRec } = await supabaseClient.from('client_subsidies')
                    .select('*')
                    .eq('client_id', clientId)
                    .eq('subsidy_name', subsidyType)
                    .maybeSingle();
                if (subRec) {
                    finalSubsidyId = subRec.id;
                    existingFollowup = subRec.next_followup_date || '';
                    finalRate = subRec.rate || '';
                    finalFeesReceived = subRec.fees_received || '';
                    finalStatus = subRec.status || 'Pending';
                    finalRemark = subRec.remark || '';
                }
            }

            const today = new Date(); today.setHours(0,0,0,0);
            const isOverdue = existingFollowup ? (new Date(existingFollowup) < today) : true;

            let newFollowupDate = '';
            if (isOverdue) {
                // Prompt for a new followup date
                const dateInput = prompt(
                    `The follow-up date for "${subsidyType}" is ${existingFollowup ? 'overdue (was: ' + new Date(existingFollowup).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ')' : 'not set'}.\n\nPlease enter a new follow-up date (YYYY-MM-DD) to acknowledge this case:`,
                    ''
                );
                if (!dateInput || !dateInput.trim()) {
                    return showToast('Acknowledgement cancelled. A new follow-up date is mandatory when the existing date is overdue.');
                }
                const parsedDate = new Date(dateInput.trim());
                if (isNaN(parsedDate.getTime())) {
                    return showToast('Invalid date entered. Please use YYYY-MM-DD format (e.g., 2026-06-15).');
                }
                if (parsedDate < today) {
                    return showToast('The new follow-up date cannot be in the past. Acknowledgement cancelled.');
                }
                newFollowupDate = dateInput.trim();
            }

            const dbOps = [];

            // Insert acknowledge log
            dbOps.push(supabaseClient.from('task_logs').insert([{
                client_id: clientId,
                user_id: currentUser.id,
                note: `[Acknowledged Today] Subsidy type: ${subsidyType} acknowledged.`,
                timestamp: new Date().toISOString()
            }]));

            // If a new followup date was provided, update the subsidy record
            if (newFollowupDate && finalSubsidyId) {
                dbOps.push(supabaseClient.from('client_subsidies').update({
                    next_followup_date: newFollowupDate
                }).eq('id', finalSubsidyId));

                // Also log the followup date change
                const updPayload = JSON.stringify({
                    rate: finalRate,
                    fees_received: finalFeesReceived,
                    status: finalStatus,
                    remark: finalRemark,
                    next_followup_date: newFollowupDate
                });
                dbOps.push(supabaseClient.from('task_logs').insert([{
                    client_id: clientId,
                    user_id: currentUser.id,
                    note: `${getStartupSubsidyUpdateTag(subsidyType)} ${updPayload}`
                }]));
            }

            const results = await Promise.all(dbOps);
            for (const res of results) {
                if (res && res.error) throw res.error;
            }

            // Update local cache immediately
            if (newFollowupDate && window.globalStartupsSubsidyLatestMap && window.globalStartupsSubsidyLatestMap[key]) {
                window.globalStartupsSubsidyLatestMap[key].next_followup_date = newFollowupDate;
            }

            showToast("Startup/Subsidy case acknowledged successfully!");
            if (typeof globalRefresh === 'function') globalRefresh();
            else if (typeof loadStartupsSubsidyData === 'function') loadStartupsSubsidyData();
            else if (typeof renderStartupsSubsidyTable === 'function') renderStartupsSubsidyTable();
        } catch (err) {
            showToast("Error: " + err.message);
        }
    };

    async function loadClientsData() {
        const tbody = document.getElementById('client-table-body');
        if (!tbody) return;

        // If client cache is already populated in memory, render immediately with zero delay
        if (window.globalAllClientsList && window.globalAllClientsList.length > 0) {
            renderClientsStatsAndTable();
            return;
        }

        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-20 text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin text-2xl mb-4"></i><br>Gathering directory records...</td></tr>';
        await refreshGlobalCache();
        renderClientsStatsAndTable();
    }

    function renderClientsStatsAndTable() {
        const sourceList = window.globalAllClientsList || globalClientsList || [];
        
        // Calculate Stats
        const total = sourceList.length;
        const archived = sourceList.filter(c => c.is_active === false).length;
        const active = total - archived;
        
        // Count total unique services across all clients
        let serviceCount = 0;
        sourceList.forEach(c => {
            if (c.standard_services) {
                const validServiceNames = (globalServicesList || []).map(s => s.service_type.toLowerCase().trim());
                serviceCount += c.standard_services.split(',')
                    .map(s => s.trim())
                    .filter(s => {
                        const sLower = s.toLowerCase();
                        return sLower !== 'audit status' && validServiceNames.includes(sLower);
                    }).length;
            }
        });

        // New in 30 days
        const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
        const newOnboarding = sourceList.filter(c => c.created_at && new Date(c.created_at) > thirtyDaysAgo).length;

        const statTotal = document.getElementById('crm-stat-total');
        if (statTotal) statTotal.innerText = active;
        const statServices = document.getElementById('crm-stat-services');
        if (statServices) statServices.innerText = serviceCount;
        const statNew = document.getElementById('crm-stat-new');
        if (statNew) statNew.innerText = newOnboarding;

        // Auto-populate the Service Filter dropdown
        const filterSelect = document.getElementById('clientServiceFilter');
        if (filterSelect && globalServicesList) {
            const currentValue = filterSelect.value;
            filterSelect.innerHTML = '<option value="">(All Types)</option>';
            globalServicesList.forEach(s => {
                if (s.service_type.toLowerCase() !== 'audit status') {
                    filterSelect.innerHTML += `<option value="${s.service_type}">${s.service_type}</option>`;
                }
            });
            filterSelect.value = currentValue;
        }

        filterClients(); 
    }

    function renderClientsTable(clientsToRender) {
        const tbody = document.getElementById('client-table-body');
        if (!tbody) return;
        
        if (!clientsToRender || clientsToRender.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-20 bg-white"><div class="flex flex-col items-center"><div class="h-16 w-16 bg-slate-50 text-slate-300 flex items-center justify-center rounded-full mb-4 text-2xl"><i class="fa-solid fa-folder-open"></i></div><p class="text-slate-400 font-bold tracking-tight">No directory records found.</p></div></td></tr>';
            return;
        }

        let html = '';
        clientsToRender.forEach(client => {
            const validServiceNames = (globalServicesList || []).map(s => s.service_type.toLowerCase().trim());
            const filteredServices = client.standard_services ? client.standard_services.split(',')
                .map(s => s.trim())
                .filter(s => {
                    const sLower = s.toLowerCase();
                    return sLower !== 'audit status' && validServiceNames.includes(sLower);
                }) : [];
            const services = filteredServices.length > 0 ? filteredServices.map(s => `<span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg text-[10px] font-black border border-indigo-100 uppercase tracking-widest">${s}</span>`).join(' ') : '<span class="text-slate-300 text-[10px] font-black uppercase italic tracking-widest">Unenrolled</span>';
            
            const isActive = client.is_active !== false;
            const statusBadge = isActive ? '' : '<span class="ml-3 px-3 py-1 bg-red-50 text-red-600 border border-red-100 rounded-full text-[10px] uppercase tracking-widest font-black">Archived</span>';
            
            const archiveBtn = isActive ? 
                `<button onclick="event.stopPropagation(); toggleClientStatus('${client.client_id}', false)" class="h-9 w-9 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all" title="Archive Client"><i class="fa-solid fa-box-archive text-xs"></i></button>` : 
                `<button onclick="event.stopPropagation(); toggleClientStatus('${client.client_id}', true)" class="h-9 w-9 flex items-center justify-center text-emerald-500 hover:text-white hover:bg-emerald-500 rounded-xl transition-all" title="Reactivate Client"><i class="fa-solid fa-rotate-left text-xs"></i></button>`;

            html += `
            <tr class="group hover:bg-indigo-50/10 transition-all cursor-pointer bg-white shadow-sm hover:shadow-md" onclick="openUniversalClientProfile('${client.client_id}')">
                <td class="px-5 py-5 border-t border-b border-l border-slate-100 rounded-l-2xl">
                    <div class="flex items-center gap-4">
                        <div class="h-12 w-12 flex-shrink-0 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-indigo-600 group-hover:text-white transition-all font-black text-sm uppercase border border-slate-100 shadow-inner">
                            ${client.display_name.substring(0,2)}
                        </div>
                        <div>
                            <div class="font-black text-slate-800 text-base tracking-tight group-hover:text-indigo-600 transition-colors flex items-center">
                                ${client.display_name}
                                ${statusBadge}
                            </div>
                            ${client.client_code ? `<span class="text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded border border-slate-200 mt-1 inline-block uppercase tracking-wider">${client.client_code}</span>` : ''}
                        </div>
                    </div>
                </td>
                <td class="px-5 py-5 border-t border-b border-slate-100">
                    <div class="flex flex-wrap gap-2">${services}</div>
                </td>
                <td class="px-5 py-5 border-t border-b border-slate-100">
                    <div class="flex flex-col">
                        <span class="text-slate-800 font-black text-xs tracking-widest uppercase">${client.pan_number || '-'}</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mt-1">${client.gstin ? 'GST: ' + client.gstin : 'PAN Only'}</span>
                    </div>
                </td>
                <td class="px-5 py-5 border-t border-b border-slate-100">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 py-1 bg-slate-50 rounded-lg border border-slate-100">
                        ${client.entity_type || 'Unknown'}
                    </span>
                </td>
                <td class="px-5 py-5 border-t border-b border-r border-slate-100 rounded-r-2xl text-right">
                    <div class="flex justify-end items-center gap-2">
                        <button onclick="event.stopPropagation(); openTeamAllocation('${client.client_id}', '${client.display_name.replace(/'/g, "\\'")}')" class="h-10 w-10 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" title="Assign Team">
                            <i class="fa-solid fa-users-gear text-sm"></i>
                        </button>
                        ${archiveBtn}
                        <button class="h-10 w-10 rounded-2xl bg-slate-50 border border-slate-100 text-slate-400 group-hover:bg-indigo-600 group-hover:text-white group-hover:border-indigo-600 transition-all shadow-sm flex items-center justify-center active:scale-90 ml-2">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    let clientSearchTimeout = null;
    function debouncedFilterClients() {
        if (clientSearchTimeout) clearTimeout(clientSearchTimeout);
        clientSearchTimeout = setTimeout(() => {
            filterClients();
        }, 150);
    }

    function filterClients() {
        const searchInput = document.getElementById('clientSearchInput');
        const serviceFilter = document.getElementById('clientServiceFilter');
        const statusFilter = document.getElementById('clientStatusFilter');
        
        const query = searchInput ? searchInput.value.toLowerCase() : '';
        const selectedService = serviceFilter ? serviceFilter.value : '';
        const selectedStatus = statusFilter ? statusFilter.value : 'active';

        const sourceList = window.globalAllClientsList || globalClientsList;

        const filtered = (sourceList || []).filter(client => {
            const matchesSearch = client.display_name.toLowerCase().includes(query) || 
                                  (client.pan_number && client.pan_number.toLowerCase().includes(query)) ||
                                  (client.gstin && client.gstin.toLowerCase().includes(query)) ||
                                  (client.client_code && client.client_code.toLowerCase().includes(query));
            
            let matchesService = true;
            if (selectedService) {
                matchesService = client.standard_services && client.standard_services.split(',').map(s => s.trim().toLowerCase()).includes(selectedService.toLowerCase());
            }
            
            const isActive = client.is_active !== false;
            let matchesStatus = true;
            if (selectedStatus === 'active') matchesStatus = isActive;
            if (selectedStatus === 'archived') matchesStatus = !isActive;

            return matchesSearch && matchesService && matchesStatus;
        });

        renderClientsTable(filtered);
    }

    async function toggleClientStatus(clientId, makeActive) {
        if(!confirm(makeActive ? "Reactivate this client? They will instantly return to your active tracking boards." : "Archive this client? They will be hidden from the GST Center, Dashboards, and Task Boards, but their history will be saved.")) return;
        
        const { error } = await supabaseClient.from('clients').update({ is_active: makeActive }).eq('client_id', clientId);
        if(error) return showToast("Error: " + error.message);
        
        await refreshGlobalCache();
        filterClients(); 
        
        if(typeof loadDashboardData === 'function' && !document.getElementById('view-dashboard').classList.contains('hidden')) {
            loadDashboardData(); 
        }

        // Refresh client profile drawer if it's currently visible
        const profileDrawer = document.getElementById('universalClientProfileDrawer');
        if (profileDrawer && !profileDrawer.classList.contains('hidden')) {
            openUniversalClientProfile(clientId);
        }
    }
    window.toggleClientStatus = toggleClientStatus;

    window.archiveOrRestoreCurrentClient = async function() {
        if (!currentActiveClientProfile) return;
        const clientId = currentActiveClientProfile.client_id;
        const isActive = currentActiveClientProfile.is_active !== false;
        await toggleClientStatus(clientId, !isActive);
    }

    let globalStartupsSubsidyRows = [];
    let globalStartupsSubsidyLatestMap = {};
    let globalStartupsSubsidyHistoryMap = {};
    let activeStartupSubsidyContext = null;
    let globalTeamUsers = [];
    let tdsSortCol = 'display_name';
    let tdsSortAsc = true;
    let globalTdsComments = {}; // Map of clientId -> latest comment

    async function ensureTransferUsersLoaded() {
        const { data: users } = await supabaseClient.from('users').select('id, name').eq('is_archived', false).order('name');
        globalTeamUsers = users || [];
    }

    async function setTransferDropdownOptions(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        await ensureTransferUsersLoaded();
        select.innerHTML = '<option value="">-- Keep Current Owner --</option>';
        globalTeamUsers.forEach(u => {
            select.innerHTML += `<option value="${u.id}">${u.name}</option>`;

    async function transferClientWorkflow(clientId, serviceType, userId) {
        if (!clientId || !serviceType || !userId) return;
        await supabaseClient.from('client_assignments')
            .delete()
            .eq('client_id', clientId)
            .eq('service_type', serviceType);
        await supabaseClient.from('client_assignments').insert([{
            client_id: clientId,
            service_type: serviceType,
            maker_id: userId,
            checker_id: null
        }]);
    }

    function makeStartupSubsidyKey(clientId, subsidyType) {
        return `${clientId}__${(subsidyType || '').trim().toLowerCase()}`;
    }

    function getStartupSubsidyUpdateTag(subsidyType) {
        return `[StartupSubsidyUpdate::${subsidyType}]`;
    }

    function getStartupSubsidyTypeEventTag() {
        return '[StartupSubsidyTypeEvent]';
    }

    function parseStartupSubsidyUpdateLog(note) {
        const tag = '[StartupSubsidyUpdate::';
        if (!note || !note.includes(tag)) return null;
        try {
            const tagIndex = note.indexOf(tag);
            const closingBracketIndex = note.indexOf(']', tagIndex);
            if (closingBracketIndex === -1) return null;
            
            const type = note.substring(tagIndex + tag.length, closingBracketIndex).trim();
            const jsonPart = note.substring(closingBracketIndex + 1).trim();
            
            return { subsidyType: type, payload: JSON.parse(jsonPart) };
        } catch (e) {
            return null;
        }
    }

    function parseStartupSubsidyTypeEventLog(note) {
        if (!note || !note.startsWith(getStartupSubsidyTypeEventTag())) return null;
        try {
            const jsonPart = note.replace(getStartupSubsidyTypeEventTag(), '').trim();
            return JSON.parse(jsonPart);
        } catch (e) {
            return null;
        }
    }

    function moveStartupSubsidyDataBetweenTypes(clientId, fromType, toType) {
        const fromKey = makeStartupSubsidyKey(clientId, fromType);
        const toKey = makeStartupSubsidyKey(clientId, toType);
        if (fromKey === toKey) return;

        if (globalStartupsSubsidyLatestMap[fromKey]) {
            if (!globalStartupsSubsidyLatestMap[toKey] || (globalStartupsSubsidyLatestMap[fromKey].timestamp || '') > (globalStartupsSubsidyLatestMap[toKey].timestamp || '')) {
                globalStartupsSubsidyLatestMap[toKey] = { ...globalStartupsSubsidyLatestMap[fromKey] };
            }
            delete globalStartupsSubsidyLatestMap[fromKey];
        }

        if (globalStartupsSubsidyHistoryMap[fromKey]) {
            const existing = globalStartupsSubsidyHistoryMap[toKey] || [];
            globalStartupsSubsidyHistoryMap[toKey] = [...globalStartupsSubsidyHistoryMap[fromKey], ...existing]
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            delete globalStartupsSubsidyHistoryMap[fromKey];
        }
    }

    function parseAmountToNumber(value) {
        if (value === null || value === undefined) return 0;
        const n = parseFloat(String(value).replace(/[^0-9.-]+/g, ''));
        return Number.isFinite(n) ? n : 0;
    }

    async function loadStartupsSubsidyData() {
        const container = document.getElementById('startup-subsidy-cards-container');
        if (!container) return;

        container.innerHTML = '<div class="text-center py-12 text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Fetching subsidy records...</div>';

        await refreshGlobalCache();
        await loadSubsidyCategories(); // Ensure checklists are loaded

        const sourceList = window.globalAllClientsList || globalClientsList || [];
        // Filter clients based on Page Visibility Settings
        const { data: visSettings } = await supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-startups-subsidy').single();
        const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : ['Startup', 'Subsidy'];
        
        const eligibleClients = sourceList.filter(c => {
            if (c.is_active === false) return false;
            if (!c.standard_services) return false;
            const clientServices = c.standard_services.split(',').map(s => s.trim().toLowerCase());
            
            // Force include if service is 'startup' or 'subsidy' as per user request
            if (clientServices.includes('startup') || clientServices.includes('subsidy')) return true;
            
            return allowedServices.some(as => clientServices.includes(as.toLowerCase()));
        });

        await fetchSubsidySettings();



        // Cleanup "General Subsidy" cases (not needed/useful)
        await supabaseClient
            .from('client_subsidies')
            .delete()
            .ilike('subsidy_name', 'General Subsidy');

        const { data: subsidiesData } = await supabaseClient
            .from('client_subsidies')
            .select('*');

        const { data: subsidyLogs } = await fetchAllRows((from, to) => supabaseClient
            .from('task_logs')
            .select('client_id, note, timestamp, users(name)')
            .is('task_id', null)
            .or('note.ilike.%[StartupSubsidyUpdate::%,note.ilike.%[STARTUP_REFERENCE]%')
            .order('timestamp', { ascending: false })
            .order('log_id', { ascending: false })
            .range(from, to));
        console.log(`[CRM Debug] Loaded ${subsidyLogs ? subsidyLogs.length : 0} logs and ${subsidiesData ? subsidiesData.length : 0} subsidies`);

        // Note: window.globalChecklistStatusMap and window.globalChecklistRemarksMap
        // are loaded and parsed globally in refreshGlobalCache() inside Logic_Core.html

        window.globalStartupReferencesMap = {};
        (subsidyLogs || []).forEach(log => {
            if (log.note && log.note.startsWith('[STARTUP_REFERENCE] ')) {
                const refText = log.note.replace('[STARTUP_REFERENCE] ', '').trim();
                if (window.globalStartupReferencesMap[log.client_id] === undefined) {
                    window.globalStartupReferencesMap[log.client_id] = refText;
                }
            }
        });

        globalStartupsSubsidyRows = [];
        globalStartupsSubsidyLatestMap = {};
        globalStartupsSubsidyHistoryMap = {};

        const subsidiesByClient = {};
        (subsidiesData || []).forEach(sub => {
            if (!subsidiesByClient[sub.client_id]) subsidiesByClient[sub.client_id] = [];
            subsidiesByClient[sub.client_id].push(sub);
        });

        const logsByClient = {};
        (subsidyLogs || []).forEach(log => {
            if (!logsByClient[log.client_id]) logsByClient[log.client_id] = [];
            logsByClient[log.client_id].push(log);
        });

        eligibleClients.forEach(client => {
            const clientSubsidies = subsidiesByClient[client.client_id] || [];
            const clientLogs = logsByClient[client.client_id] || [];

            clientSubsidies.forEach(sub => {
                const key = makeStartupSubsidyKey(client.client_id, sub.subsidy_name);
                
                globalStartupsSubsidyLatestMap[key] = {
                    id: sub.id, // Store ID for updates
                    rate: sub.rate || '',
                    fees_received: sub.fees_received || '',
                    status: sub.status || 'Pending',
                    remark: sub.remark || '',
                    next_followup_date: sub.next_followup_date || '',
                    timestamp: sub.updated_at || sub.created_at || null
                };

                globalStartupsSubsidyRows.push({
                    client_id: client.client_id,
                    display_name: client.display_name,
                    subsidy_type: sub.subsidy_name
                });

                // Populate history from logs for this specific subsidy type
                if (!globalStartupsSubsidyHistoryMap[key]) globalStartupsSubsidyHistoryMap[key] = [];
                
                clientLogs.forEach(log => {
                    const upd = parseStartupSubsidyUpdateLog(log.note);
                    if (upd && upd.subsidyType.toLowerCase() === sub.subsidy_name.toLowerCase()) {
                        globalStartupsSubsidyHistoryMap[key].push({
                            rate: upd.payload.rate || '',
                            fees_received: upd.payload.fees_received || '',
                            status: upd.payload.status || 'Pending',
                            remark: upd.payload.remark || '',
                            next_followup_date: upd.payload.next_followup_date || '',
                            timestamp: log.timestamp || null,
                            user_name: log.users?.name || 'System'
                        });
                    }
                });
                
                // Sort history descending by timestamp
                globalStartupsSubsidyHistoryMap[key].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            });


            if (clientSubsidies.length === 0) {
                globalStartupsSubsidyRows.push({
                    client_id: client.client_id,
                    display_name: client.display_name,
                    subsidy_type: ''
                });
            }
        });

        const catFilter = document.getElementById('subsidyCategoryFilter');
        if (catFilter) {
            const currentVal = catFilter.value;
            catFilter.innerHTML = '<option value="all">All Categories</option>';
            globalSubsidyCategoriesCache.forEach(cat => {
                catFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            if (currentVal && Array.from(catFilter.options).some(o => o.value === currentVal)) {
                catFilter.value = currentVal;
            }
        }

        // Fetch today's subsidy activity (any update or acknowledge)
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);
        const { data: subsidyAckLogs } = await supabaseClient
            .from('task_logs')
            .select('client_id, note')
            .eq('user_id', currentUser.id)
            .gte('timestamp', todayStart.toISOString());

        window.globalSubsidyAckTodayMap = {};
        if (subsidyAckLogs) {
            subsidyAckLogs.forEach(l => {
                if (!l.note) return;
                // Explicit acknowledge
                const ackMatch = l.note.match(/\[Acknowledged Today\] Subsidy type: (.*?) acknowledged/);
                if (ackMatch) {
                    window.globalSubsidyAckTodayMap[`${l.client_id}:${ackMatch[1]}`] = true;
                    return;
                }
                // Any subsidy update log: [StartupSubsidyUpdate::TYPENAME] {...}
                const updateMatch = l.note.match(/^\[StartupSubsidyUpdate::(.+?)\]/);
                if (updateMatch) {
                    const subsidyType = updateMatch[1].trim();
                    window.globalSubsidyAckTodayMap[`${l.client_id}:${subsidyType}`] = true;
                }
            });
        }

        // Fetch active subsidy invoices dynamically
        const { data: subsidyInvoices } = await supabaseClient
            .from('invoices')
            .select('*')
            .ilike('service_name', 'Subsidy Fees - %');

        window.globalSubsidyInvoicesMap = {};
        if (subsidyInvoices) {
            subsidyInvoices.forEach(inv => {
                if (inv.status !== 'Cancelled') {
                    const subsidyType = inv.service_name.replace('Subsidy Fees - ', '').trim();
                    const key = makeStartupSubsidyKey(inv.client_id, subsidyType);
                    window.globalSubsidyInvoicesMap[key] = inv;
                }
            });
        }

        renderStartupsSubsidyTable();
    }

    function renderStartupsSubsidyTable() {
        const container = document.getElementById('startup-subsidy-cards-container');
        if (!container) return;

        const searchEl = document.getElementById('startupSubsidySearchInput');
        const query = searchEl ? searchEl.value.toLowerCase().trim() : '';

        const assignFilterEl = document.getElementById('subsidyAssignFilter');
        const assignFilter = assignFilterEl ? assignFilterEl.value : 'all';

        // Find which clients are assigned to the logged-in user for Startup/Subsidy
        const mySubsidyClients = (window.globalAssignmentsList || [])
            .filter(a => {
                if (!a.service_type || a.maker_id !== currentUser?.id) return false;
                const lowerSvc = a.service_type.toLowerCase();
                const isGeneric = lowerSvc.includes('startup') || lowerSvc.includes('subsidy');
                const isSpecific = window.globalSubsidyCategoriesCache && window.globalSubsidyCategoriesCache.some(cat => cat.toLowerCase() === lowerSvc);
                return isGeneric || isSpecific;
            })
            .map(a => a.client_id);

        let filtered = globalStartupsSubsidyRows || [];
        
        if (assignFilter === 'all') {
            window.startupDueFilterStatus = 'all';
        }
        
        // Apply Assignment Filter
        if (assignFilter === 'mine') {
            filtered = filtered.filter(row => mySubsidyClients.includes(row.client_id));
        }

        // Apply Due/Overdue filters
        if (window.startupDueFilterStatus === 'due') {
            filtered = filtered.filter(row => {
                if (!row.subsidy_type) return false;
                const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
                const latest = globalStartupsSubsidyLatestMap[key] || {};
                const status = latest.status || 'Pending';
                const isCompleted = status === 'Approved';
                return !isCompleted;
            });
        } else if (window.startupDueFilterStatus === 'overdue') {
            filtered = filtered.filter(row => {
                if (!row.subsidy_type) return false;
                const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
                const latest = globalStartupsSubsidyLatestMap[key] || {};
                const status = latest.status || 'Pending';
                const isCompleted = status === 'Approved';
                const isOverdue = latest.next_followup_date ? (new Date(latest.next_followup_date) < new Date().setHours(0,0,0,0)) : false;
                return !isCompleted && isOverdue;
            });
        }

        if (query) {
            filtered = filtered.filter(row =>
                (row.display_name || '').toLowerCase().includes(query) ||
                (row.subsidy_type || '').toLowerCase().includes(query)
            );
        }

        const statusFilterEl = document.getElementById('subsidyStatusFilter');
        const statusFilter = statusFilterEl ? statusFilterEl.value : 'active';

        const categoryFilterEl = document.getElementById('subsidyCategoryFilter');
        const categoryFilter = categoryFilterEl ? categoryFilterEl.value : 'all';

        // Apply Status Filter
        if (statusFilter !== 'all') {
            filtered = filtered.filter(row => {
                if (!row.subsidy_type) return false; // Hide empty rows if specific status requested
                const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
                const latest = globalStartupsSubsidyLatestMap[key] || {};
                const status = latest.status || 'Pending';
                
                const activeInvoice = window.globalSubsidyInvoicesMap && window.globalSubsidyInvoicesMap[key];
                const isBilled = !!activeInvoice;
                const isArchived = (status === 'Approved' && isBilled) || status === 'Rejected';

                if (statusFilter === 'active') {
                    return !isArchived;
                }
                if (statusFilter === 'Approved') {
                    return status === 'Approved' && isBilled;
                }
                return status === statusFilter;
            });
        }

        // Apply Category Filter
        if (categoryFilter !== 'all') {
            filtered = filtered.filter(row => row.subsidy_type === categoryFilter);
        }
        // Update Summary Cards
        const totalCountEl = document.getElementById('subsidy-total-count');
        const pendingCountEl = document.getElementById('subsidy-pending-count');
        const pulseGradeEl = document.getElementById('subsidy-pulse-grade');

        if (totalCountEl) totalCountEl.innerText = filtered.length;
        
        let pendingCount = 0;
        filtered.forEach(row => {
            if (!row.subsidy_type) return; // Skip empty rows (placeholder for clients with no cases)
            const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
            const latest = globalStartupsSubsidyLatestMap[key] || {};
            const status = latest.status || 'Pending';
            if (status !== 'Approved' && status !== 'Filed' && status !== 'Rejected') {
                pendingCount++;
            }
        });
        if (pendingCountEl) pendingCountEl.innerText = pendingCount;

        const completionRate = filtered.length > 0 ? ((filtered.length - pendingCount) / filtered.length) * 100 : 100;
        let grade = 'Z';
        if (completionRate >= 80) grade = 'A+';
        else if (completionRate >= 50) grade = 'A';
        else if (completionRate >= 20) grade = 'B';
        
        if (pulseGradeEl) {
            pulseGradeEl.innerText = grade;
            if (grade.startsWith('A')) pulseGradeEl.className = 'text-xl font-black text-emerald-600';
            else if (grade === 'B') pulseGradeEl.className = 'text-xl font-black text-blue-600';
            else pulseGradeEl.className = 'text-xl font-black text-slate-400';
        }

        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center py-12 text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200">No enrolled clients found matching your search.</div>';
            return;
        }

        const grouped = {};
        filtered.forEach(row => {
            if (!grouped[row.client_id]) grouped[row.client_id] = [];
            grouped[row.client_id].push(row);
        });

        const sortFilter = document.getElementById('subsidySortFilter')?.value || 'name';
        let clientIds = Object.keys(grouped);

        function getEarliestFollowup(rows) {
            let earliest = null;
            rows.forEach(row => {
                const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
                const latest = globalStartupsSubsidyLatestMap[key] || {};
                const statusText = latest.status || 'Pending';
                const rateNum = parseAmountToNumber(latest.rate);
                const feesNum = parseAmountToNumber(latest.fees_received);
                const activeInvoice = window.globalSubsidyInvoicesMap && window.globalSubsidyInvoicesMap[key];
                const isWorkDone = statusText === 'Approved' && rateNum > 0 && feesNum >= rateNum && activeInvoice;
                
                if (!isWorkDone && latest.next_followup_date) {
                    const d = new Date(latest.next_followup_date);
                    if (!earliest || d < earliest) earliest = d;
                }
            });
            return earliest;
        }

        if (sortFilter === 'name') {
            clientIds.sort((a, b) => {
                const nameA = grouped[a][0].display_name || '';
                const nameB = grouped[b][0].display_name || '';
                return nameA.localeCompare(nameB);
            });
        } else if (sortFilter === 'date') {
            clientIds.sort((a, b) => {
                const dateA = getEarliestFollowup(grouped[a]);
                const dateB = getEarliestFollowup(grouped[b]);
                if (!dateA && !dateB) return 0;
                if (!dateA) return 1;
                if (!dateB) return -1;
                return dateA - dateB;
            });
        }

        clientIds.forEach(clientId => {
            const rows = grouped[clientId];
            
            if (sortFilter === 'date') {
                rows.sort((a, b) => {
                    const keyA = makeStartupSubsidyKey(a.client_id, a.subsidy_type);
                    const keyB = makeStartupSubsidyKey(b.client_id, b.subsidy_type);
                    const dateA = globalStartupsSubsidyLatestMap[keyA]?.next_followup_date ? new Date(globalStartupsSubsidyLatestMap[keyA].next_followup_date) : null;
                    const dateB = globalStartupsSubsidyLatestMap[keyB]?.next_followup_date ? new Date(globalStartupsSubsidyLatestMap[keyB].next_followup_date) : null;
                    if (!dateA && !dateB) return 0;
                    if (!dateA) return 1;
                    if (!dateB) return -1;
                    return dateA - dateB;
                });
            }
            const clientName = rows[0].display_name || '-';
            const safeClientName = clientName.replace(/'/g, "\\'");

            let cardHtml = `
            <div class="bg-white rounded-2xl border border-blue-100 shadow-sm overflow-hidden transition-all hover:shadow-md hover:border-blue-200">
                <!-- CLIENT HEADER -->
                <div class="px-8 py-5 bg-blue-50/30 border-b border-blue-50 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div onclick="openUniversalClientProfile('${clientId}')" class="text-base font-black text-slate-800 hover:text-indigo-600 hover:underline cursor-pointer transition-all">
                            <i class="fa-solid fa-building-user mr-2 text-blue-400"></i>${clientName}
                        </div>
                        <div class="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-xl border border-slate-200/80 shadow-sm transition-all hover:border-indigo-300 focus-within:border-indigo-500 focus-within:ring-1 focus-within:ring-indigo-100" onclick="event.stopPropagation()">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Ref</span>
                            <input type="text" 
                                   value="${window.globalStartupReferencesMap[clientId] || ''}" 
                                   onchange="saveStartupReference('${clientId}', this.value)" 
                                   class="px-1.5 py-0 text-xs border-0 outline-none focus:ring-0 bg-transparent font-black text-slate-700 w-28 placeholder:text-slate-300 placeholder:font-normal" 
                                   placeholder="Add Reference..."
                                   onclick="event.stopPropagation()">
                        </div>
                        <button onclick="addStartupSubsidyType('${clientId}', '${safeClientName}')" class="h-7 w-7 flex items-center justify-center bg-white border border-blue-100 text-blue-500 rounded-lg hover:bg-blue-500 hover:text-white transition-all shadow-sm" title="Add another subsidy">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                    <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest bg-white px-3 py-1 rounded-full border border-blue-50">
                        ${rows.filter(r => r.subsidy_type).length} ${rows.filter(r => r.subsidy_type).length === 1 ? 'Case' : 'Cases'}
                    </span>
                </div>

                <!-- CASES LIST -->
                <div class="divide-y divide-slate-100">`;

            rows.forEach(row => {
                if (!row.subsidy_type) {
                    cardHtml += `
                    <div class="px-8 py-4 bg-slate-50/50 flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-400">No subsidy cases added yet. Click + to add one.</span>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-white px-2 py-0.5 rounded border border-slate-100">Action Required</span>
                    </div>`;
                    return;
                }
                const key = makeStartupSubsidyKey(row.client_id, row.subsidy_type);
                const latest = globalStartupsSubsidyLatestMap[key] || {};
                console.log(`[CRM Debug] Client: ${row.display_name}, Type: ${row.subsidy_type}, Key: ${key}, Latest:`, latest);
                const rateText = latest.rate || '-';
                const feesText = latest.fees_received || '-';
                const statusText = latest.status || 'Pending';
                const remarkText = latest.remark || '-';
                const nextFollowup = latest.next_followup_date ? new Date(latest.next_followup_date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
                
                const rateNum = parseAmountToNumber(latest.rate);
                const feesNum = parseAmountToNumber(latest.fees_received);
                const activeInvoice = window.globalSubsidyInvoicesMap && window.globalSubsidyInvoicesMap[key];
                const isWorkDone = statusText === 'Approved' && rateNum > 0 && feesNum >= rateNum && activeInvoice;
                
                const isFollowupOverdue = (!isWorkDone && latest.next_followup_date) ? (new Date(latest.next_followup_date) < new Date().setHours(0,0,0,0)) : false;
                const safeType = row.subsidy_type.replace(/'/g, "\\'");
                const safeRemarkTitle = remarkText === '-' ? 'No remark yet' : remarkText.replace(/"/g, '&quot;');

                let feeClass = 'bg-red-50 text-red-700 border-red-100';
                if (feesNum > 0 && rateNum > 0 && feesNum >= rateNum) feeClass = 'bg-emerald-50 text-emerald-700 border-emerald-100';
                else if (feesNum > 0) feeClass = 'bg-amber-50 text-amber-700 border-amber-100';

                // Pending calculation
                const master = globalSubsidyChecklistsCache[(row.subsidy_type || '').toUpperCase()] || [];
                const cMap = (window.globalChecklistStatusMap?.[row.client_id] || {})[row.subsidy_type] || {};
                let pending = 0;
                master.forEach(m => {
                    const r = (m["Requirement"] || m["req"] || "Optional").toLowerCase();
                    const d = m["Document Name"] || m["doc"];
                    if (r === 'mandatory' && cMap[d] !== true) pending++;
                });

                let docsBadge = '';
                if (master.length === 0) docsBadge = '<span class="text-slate-300 text-xs font-bold italic">No Checklist</span>';
                else if (pending === 0) docsBadge = '<span class="text-emerald-600 font-black text-xs"><i class="fa-solid fa-check-double mr-1"></i> Clear</span>';
                else docsBadge = `<span class="text-red-500 font-black text-xs"><i class="fa-solid fa-circle-exclamation mr-1"></i> ${pending}</span>`;

                // User Badge Logic
                let assignment = (window.globalAssignmentsList || []).find(a => a.client_id === row.client_id && a.service_type === row.subsidy_type);
                if (!assignment) {
                    assignment = (window.globalAssignmentsList || []).find(a => a.client_id === row.client_id && (a.service_type === 'Startup' || a.service_type === 'Subsidy'));
                }
                let userBadge = '';
                if (assignment && assignment.maker_id) {
                    const user = (window.globalTeamMembers || []).find(u => u.id === assignment.maker_id);
                    if (user) {
                        const firstName = user.name.split(' ')[0];
                        userBadge = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight shadow-sm ml-2" title="${user.name}">
                            <i class="fa-solid fa-user-check mr-1 opacity-70"></i>${firstName}
                        </span>`;
                    }
                }

                let ackSubsidyHtml = '';
                // Show Acknowledge for any non-Approved case (for productivity pulse tracking)
                if (statusText !== 'Approved' && statusText !== 'Rejected') {
                    const isAckedToday = window.globalSubsidyAckTodayMap && !!window.globalSubsidyAckTodayMap[`${row.client_id}:${row.subsidy_type}`];
                    if (isAckedToday) {
                        ackSubsidyHtml = `<span onclick="event.stopPropagation()" class="mt-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-square-check scale-75"></i>Checked</span>`;
                    } else {
                        ackSubsidyHtml = `<button onclick="acknowledgeSubsidyToday('${row.client_id}', '${safeType}', event)" class="mt-1 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition"><i class="fa-regular fa-square scale-75"></i>Acknowledge</button>`;
                    }
                }

                // Billing check
                let billingHtml = '';
                if (activeInvoice) {
                    billingHtml = `
                    <div onclick="event.stopPropagation(); cancelSubsidyBill('${row.client_id}', '${safeType}')" 
                         class="flex flex-col items-center justify-center cursor-pointer transition-all hover:scale-110 ml-2" 
                         title="Bill Prepared: Click to cancel bill">
                        <i class="fa-solid fa-circle-check text-blue-600 text-base"></i>
                        <span class="text-[9px] font-black text-slate-500 leading-none mt-0.5">₹${parseFloat(activeInvoice.amount).toLocaleString('en-IN')}</span>
                    </div>`;
                } else {
                    const defaultRate = latest.rate || '';
                    billingHtml = `
                    <button onclick="event.stopPropagation(); prepareSubsidyBill('${row.client_id}', '${safeClientName}', '${safeType}', '${defaultRate}')" 
                            class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-0.5 rounded text-[10px] font-bold transition shadow-sm ml-2" 
                            title="Prepare Bill">
                        Bill
                    </button>`;
                }

                cardHtml += `
                <div onclick="openStartupSubsidyDrawer('${row.client_id}', '${safeClientName}', '${safeType}')" class="px-8 py-6 grid grid-cols-12 gap-4 items-center hover:bg-slate-50 transition-all cursor-pointer group">
                    <div class="col-span-3 flex items-center flex-wrap gap-1">
                        <div class="text-indigo-700 font-black bg-indigo-50 border border-indigo-100 px-3 py-2 rounded-xl text-xs inline-block uppercase tracking-tight shadow-sm">
                            ${row.subsidy_type}
                        </div>
                        ${userBadge}
                        ${ackSubsidyHtml}
                    </div>
                    <div class="col-span-1 text-base font-black text-slate-700">${rateText}</div>
                    <div class="col-span-1">
                        <span class="px-2 py-1 rounded-lg text-[10px] font-black border ${feeClass} uppercase">
                            ${feesText}
                        </span>
                    </div>
                    <div class="col-span-1">${docsBadge}</div>
                    <div class="col-span-2 flex items-center gap-1.5">
                        <span class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-indigo-700 text-[10px] font-black uppercase border border-slate-200">
                            ${statusText}
                        </span>
                        ${billingHtml}

    async function saveStartupSubsidyUpdate() {
        if (!activeStartupSubsidyContext) {
            return;
        }

        const btn = document.getElementById('saveStartupSubsidyBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        const oldSubsidyType = activeStartupSubsidyContext.subsidyType;
        const key = makeStartupSubsidyKey(activeStartupSubsidyContext.clientId, oldSubsidyType);
        const latestData = globalStartupsSubsidyLatestMap[key] || {};

        const rate = document.getElementById('startupSubsidyRateInput').value.trim();
        const feesReceived = document.getElementById('startupSubsidyFeesReceivedInput').value.trim();
        const status = document.getElementById('startupSubsidyStatusInput').value;
        const nextFollowupDate = document.getElementById('startupSubsidyFollowupInput').value;
        const remarkInput = document.getElementById('startupSubsidyRemarkInput').value.trim();
        const remark = remarkInput !== '' ? remarkInput : (latestData.remark || '');
        const transferTo = document.getElementById('startupSubsidyTransferUserSelect') ? document.getElementById('startupSubsidyTransferUserSelect').value : '';
        const typedSubsidyType = (document.getElementById('startupSubsidyTypeInput').value || '').trim().replace(/\.+$/, '').toUpperCase();

        if (!typedSubsidyType) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            return showToast('Subsidy type is required.');
        }

        // 1. COMPULSORY USER ASSIGNMENT: Ensure an owner exists or is being assigned
        const allowedServices = [typedSubsidyType, 'Startup', 'Subsidy'];
        const existingAssignment = (window.globalAssignmentsList || []).find(a => 
            a.client_id === activeStartupSubsidyContext.clientId && 
            a.service_type &&
            allowedServices.some(as => a.service_type.toLowerCase() === as.toLowerCase())
        );
        const hasCurrentOwner = existingAssignment && existingAssignment.maker_id;

        if (!hasCurrentOwner && !transferTo) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            return showToast('This case does not have an assigned team member. Please select a team member in the "Transfer This Subsidy Case To" dropdown to assign this case.');
        }

        // 2. MANDATORY FUTURE FOLLOW-UP DATE: Active cases must have a future followup date
        const isCompletedStatus = status === 'Approved' || status === 'Rejected';
        if (!isCompletedStatus) {
            if (!nextFollowupDate) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                return showToast('A follow-up date is mandatory for active subsidy cases. Please select a date.');
            }

            const chosenDate = new Date(nextFollowupDate);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (chosenDate < today) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                return showToast('The follow-up date cannot be in the past. Please select today or a future date.');
            }
        }

        if (!rate && !feesReceived && !remarkInput && status === 'Pending' && !nextFollowupDate) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            return showToast('Please enter at least one update (rate, fees, status, follow-up, or remark).');
        }

        // Overdue constraint: if follow-up date has passed, a new FUTURE follow-up date is mandatory
        const origFollowupDate = latestData.next_followup_date || '';
        const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
        const isSubsidyOverdue = origFollowupDate ? (new Date(origFollowupDate) < todayMidnight) : false;
        const isDateChanged = origFollowupDate !== nextFollowupDate;

        if (isSubsidyOverdue && !isCompletedStatus) {
            if (!isDateChanged || !nextFollowupDate || new Date(nextFollowupDate) < todayMidnight) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                return showToast("This case's follow-up date is overdue. You must set a new future follow-up date to save any update.");
            }
        }



        const payload = JSON.stringify({
            rate: rate || '',
            fees_received: feesReceived || '',
            status: status || 'Pending',
            remark: remark || '',
            next_followup_date: nextFollowupDate || ''
        });
        const note = `${getStartupSubsidyUpdateTag(typedSubsidyType)} ${payload}`;

        const rowId = latestData.id;

        const dbPromises = [];

        // 1. Client Subsidies Upsert
        dbPromises.push(supabaseClient.from('client_subsidies').upsert({
            id: rowId,
            client_id: activeStartupSubsidyContext.clientId,
            subsidy_name: typedSubsidyType,
            rate: rate ? parseFloat(rate) : 0,
            fees_received: feesReceived ? parseFloat(feesReceived) : 0,
            status: status,
            remark: remark,
            next_followup_date: nextFollowupDate || null
        }));

        // 2. Task log insert
        dbPromises.push(supabaseClient.from('task_logs').insert([{
            client_id: activeStartupSubsidyContext.clientId,
            user_id: currentUser.id,
            note
        }]));

        // 3. Workflow transfer
        if (transferTo) {
            dbPromises.push(transferClientWorkflow(activeStartupSubsidyContext.clientId, typedSubsidyType, transferTo));
            dbPromises.push(supabaseClient.from('task_logs').insert([{
                client_id: activeStartupSubsidyContext.clientId,
                user_id: currentUser.id,
                note: `[${typedSubsidyType}] Case transferred to ${globalTeamUsers.find(u => u.id === transferTo)?.name || 'selected user'}`
            }]));
        }

        // Wait for all DB updates in parallel!
        const dbResults = await Promise.all(dbPromises);
        
        btn.innerHTML = originalText;
        btn.disabled = false;

        // Check for any errors
        for (const res of dbResults) {
            if (res && res.error) {
                return showToast('Database update error: ' + res.error.message);
            }
        }

        // Close drawer and show alert instantly
        closeStartupSubsidyDrawer();
        showToast('Update saved successfully!');

        // Run full cache load quietly in the background with scroll preservation
        if (typeof globalRefresh === 'function') globalRefresh();
        else loadStartupsSubsidyData();
    }

    // CRM helpers (downloadClientSample, processClientExcel, etc.) follow below...

    // --- CRM HELPERS ---
    function downloadClientSample() {
        if (typeof ExcelJS === 'undefined') {
            showToast("Excel library is still loading. Please wait a moment and try again.");
            return;
        }

        function getColLetter(colIdx) {
            let temp, letter = '';
            while (colIdx > 0) {
                temp = (colIdx - 1) % 26;
                letter = String.fromCharCode(65 + temp) + letter;
                colIdx = (colIdx - temp - 1) / 26;
            }
            return letter;
        }

        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet('Clients');

        // Configure Columns & Widths dynamically based on globalServicesList
        const columns = [
            { header: 'Client Code', key: 'code', width: 15 },
            { header: 'Client Name', key: 'name', width: 28 },
            { header: 'PAN Number', key: 'pan', width: 16 },
            { header: 'GSTIN', key: 'gstin', width: 22 },
            { header: 'Entity Type', key: 'entity', width: 20 },
            { header: 'GST Filing Frequency', key: 'frequency', width: 22 }
        ];

        const services = globalServicesList || [];
        services.forEach(s => {
            columns.push({
                header: `Service: ${s.service_type}`,
                key: `svc_${s.service_type.replace(/[^a-zA-Z0-9]/g, '_')}`,
                width: Math.max(20, s.service_type.length + 12)
            });
        });

        worksheet.columns = columns;

        // Header Styling (Premium Indigo Theme)
        const headerRow = worksheet.getRow(1);
        headerRow.height = 28;
        headerRow.eachCell((cell) => {
            cell.font = { name: 'Segoe UI', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } }; // Indigo Fill
            cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
            cell.border = {
                top: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                left: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                bottom: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                right: { style: 'thin', color: { argb: 'FFDDDDDD' } }
            };
        });

        // Populate with existing clients if available
        const clients = (window.globalAllClientsList || window.globalClientsList || []).filter(c => c.is_active !== false);
        if (clients.length > 0) {
            clients.forEach(c => {
                const clientEnrolledServices = c.standard_services ? c.standard_services.split(',').map(s => s.trim()) : [];
                const rowData = {
                    code: c.client_code || '',
                    name: c.display_name || '',
                    pan: c.pan_number || '',
                    gstin: c.gstin || '',
                    entity: c.entity_type || '',
                    frequency: c.gst_frequency || ''
                };
                
                services.forEach(s => {
                    let enrolled = clientEnrolledServices.includes(s.service_type);
                    if (s.service_type === 'GST Return' && clientEnrolledServices.includes('GST')) enrolled = true;
                    if (s.service_type === 'PT' && clientEnrolledServices.includes('Professional Tax')) enrolled = true;
                    
                    const key = `svc_${s.service_type.replace(/[^a-zA-Z0-9]/g, '_')}`;
                    rowData[key] = enrolled ? 'Yes' : 'No';
                });
                
                worksheet.addRow(rowData);
            });
        } else {
            // Placeholder samples if database is empty
            const sample1 = { code: "", name: "Acme Corporation Pvt Ltd", pan: "AAACA1234A", gstin: "27AAACA1234A1Z5", entity: "Private Limited", frequency: "Monthly" };
            const sample2 = { code: "", name: "John Doe", pan: "AAAAA1111A", gstin: "", entity: "Individual", frequency: "Quarterly" };
            services.forEach(s => {
                const key = `svc_${s.service_type.replace(/[^a-zA-Z0-9]/g, '_')}`;
                sample1[key] = "Yes";
                sample2[key] = "No";
            });
            worksheet.addRow(sample1);
            worksheet.addRow(sample2);
        }

        // Add 100 extra blank rows for easy client addition with validations
        for (let i = 0; i < 100; i++) {
            const blankRow = { name: "", pan: "", gstin: "", entity: "", frequency: "" };
            services.forEach(s => {
                const key = `svc_${s.service_type.replace(/[^a-zA-Z0-9]/g, '_')}`;
                blankRow[key] = "";
            });
            worksheet.addRow(blankRow);
        }

        // Body Cells Styling & Formatting
        worksheet.eachRow((row, rowNumber) => {
            if (rowNumber === 1) return; // Skip header
            row.height = 20;
            row.eachCell((cell, colNumber) => {
                cell.font = { name: 'Segoe UI', size: 10 };
                cell.border = {
                    top: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                    left: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                    bottom: { style: 'thin', color: { argb: 'FFDDDDDD' } },
                    right: { style: 'thin', color: { argb: 'FFDDDDDD' } }
                };
                if (colNumber >= 4) {
                    cell.alignment = { horizontal: 'center', vertical: 'middle' };
                } else {
                    cell.alignment = { horizontal: 'left', vertical: 'middle' };
                }
            });
        });

        // 1. Entity Type Dropdown (Column D)
        worksheet.dataValidations.add('D2:D500', {
            type: 'list',
            allowBlank: true,
            formulae: ['"Individual,Proprietorship,Partnership Firm,LLP,Private Limited,Public Limited,HUF,Trust,Society,AOP,BOI"'],
            showErrorMessage: true,
            errorTitle: 'Invalid Entity Type',
            error: 'Please select an entity type from the dropdown list.'
        });

        // 2. GST Filing Frequency Dropdown (Column E)
        worksheet.dataValidations.add('E2:E500', {
            type: 'list',
            allowBlank: true,
            formulae: ['"Monthly,Quarterly"'],
            showErrorMessage: true,
            errorTitle: 'Invalid Frequency',
            error: 'Please select Monthly or Quarterly.'
        });

        // 3. Service Dropdowns (Yes / No) dynamically sized
        if (services.length > 0) {
            const endColLetter = getColLetter(5 + services.length);
            worksheet.dataValidations.add(`F2:${endColLetter}500`, {
                type: 'list',
                allowBlank: true,
                formulae: ['"Yes,No"'],
                showErrorMessage: true,
                errorTitle: 'Invalid Value',
                error: 'Please select Yes or No.'
            });
        }

        // Generate and trigger download
        workbook.xlsx.writeBuffer().then(buffer => {
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "client_bulk_import_template.xlsx";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch(err => {
            console.error("ExcelJS write error:", err);
            showToast("Failed to export Excel template.");
        });
    }
