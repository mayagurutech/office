    // --- SORTING ENGINE ---
    function sortGstTable(col) {
        if (gstSortCol === col) {
            gstSortAsc = !gstSortAsc; // Toggle direction if clicking same column
        } else {
            gstSortCol = col;
            gstSortAsc = true; // Default to Ascending when switching columns
        }
        renderFilteredGSTTable();
    }

    function updateGstSortIcons() {
        const icons = document.querySelectorAll('[id^="sort_icon_"]');
        icons.forEach(i => i.className = "fa-solid fa-sort text-xs text-gray-300 transition-colors");
        
        const activeIcon = document.getElementById('sort_icon_' + gstSortCol);
        if (activeIcon) {
            activeIcon.className = gstSortAsc ? "fa-solid fa-sort-up text-xs text-indigo-600" : "fa-solid fa-sort-down text-xs text-indigo-600";
        }
    }

    function getQuarterMonthIndex(periodStr) {
        if (!periodStr) return 0;
        const [y, mStr] = periodStr.split('-');
        const month = parseInt(mStr);
        const rem = month % 3;
        if (rem === 1) return 1; // Month 1 of Quarter (Apr, Jul, Oct, Jan)
        if (rem === 2) return 2; // Month 2 of Quarter (May, Aug, Nov, Feb)
        return 3; // Month 3 of Quarter (Jun, Sep, Dec, Mar)
    }

    function checkColumnFilter(filterVal, isCompleted, isStuck) {
        if (isStuck) {
            if (filterVal === 'stuck') return true;
            if (filterVal === 'all') return true;
            return false;
        } else {
            if (filterVal === 'stuck') return false;
            if (filterVal === 'done' && !isCompleted) return false;
            if (filterVal === 'pending' && isCompleted) return false;
            return true;
        }
    }

    function renderFilteredGSTTable() {
        // 1. Get Values from Text Search
        const searchEl = document.getElementById('gstSearchInput');
        const query = searchEl ? searchEl.value.toLowerCase() : '';

        const selectedPeriod = document.getElementById('gstMonthFilter') ? document.getElementById('gstMonthFilter').value : '';
        const qMonthIdx = getQuarterMonthIndex(selectedPeriod);

        // 2. Get Values from Dropdown Filters
        const safeVal = (id) => document.getElementById(id) ? document.getElementById(id).value : 'all';
        const fR1Upto = safeVal('filter_gstr1_upto');
        const fR3bUpto = safeVal('filter_gstr3b_upto');
        const fCall = safeVal('filter_is_call');
        const fData = safeVal('filter_is_data');
        const fExcel = safeVal('filter_is_excel');
        const fGstr1 = safeVal('filter_is_gstr1');
        const f2b = safeVal('filter_is_2b');
        const fSend2b = safeVal('filter_is_send_2b');
        const fGstr3b = safeVal('filter_is_gstr3b');
        const fRemark = safeVal('filter_remark');
        const fBillPrepared = safeVal('filter_is_bill_prepared');
        
        // NEW: Get the Assignment Filter
        const assignFilter = document.getElementById('gstAssignFilter') ? document.getElementById('gstAssignFilter').value : 'all';
        if (assignFilter === 'all') window.gstDueFilterStatus = 'all';
        
        // NEW: Get the Filing Frequency Filter
        const fFreq = document.getElementById('gstFrequencyFilter') ? document.getElementById('gstFrequencyFilter').value : 'all';

        let filteredClients = globalGstClients;

        // NEW: Find which clients are assigned to the logged-in user for GST
        const myGstClients = (window.globalAssignmentsList || [])
            .filter(a => a.service_type && a.service_type.toLowerCase().includes('gst') && a.maker_id === currentUser.id)
            .map(a => a.client_id);

        // 3. APPLY FILTERS
        filteredClients = filteredClients.filter(client => {
            const isStuck = !!(window.globalGstStuckMap && window.globalGstStuckMap[client.client_id]);

            // Kick out clients that aren't yours if "My Clients" is selected
            if (assignFilter === 'mine' && !myGstClients.includes(client.client_id)) return false;

            // Apply Filing Frequency Filter
            const freq = client.gst_frequency || 'Monthly';
            if (fFreq !== 'all' && freq !== fFreq) return false;

            if (query && !client.display_name.toLowerCase().includes(query) && (!client.client_code || !client.client_code.toLowerCase().includes(query))) return false;

            const t = globalGstTrackingData.find(row => row.client_id === client.client_id) || {};
            const isQuarterly = freq === 'Quarterly';
            const dataPending = !t.is_data && (!isQuarterly || qMonthIdx === 3);
            const gstr1Pending = !t.is_gstr1 && (!isQuarterly || qMonthIdx === 3);
            const gstr3bPending = !t.is_gstr3b && (!isQuarterly || qMonthIdx === 3);
            const hasPending = dataPending || gstr1Pending || gstr3bPending;

            if (window.gstDueFilterStatus === 'due') {
                if (!hasPending) return false;
            } else if (window.gstDueFilterStatus === 'overdue') {
                const isOverdue = window.isGstPeriodOverdue(selectedPeriod) && (!isQuarterly || qMonthIdx === 3);
                if (!isOverdue) return false;
                if (!hasPending) return false;
            }

            if (fR1Upto === 'has' && !globalGstr1UptoMap[client.client_id]) return false;
            if (fR1Upto === 'none' && globalGstr1UptoMap[client.client_id]) return false;

            if (fR3bUpto === 'has' && !globalGstr3bUptoMap[client.client_id]) return false;
            if (fR3bUpto === 'none' && globalGstr3bUptoMap[client.client_id]) return false;

            // Call Filter
            if (!checkColumnFilter(fCall, !!t.is_call, isStuck)) return false;

            // Data Filter
            if (!checkColumnFilter(fData, !!t.is_data, isStuck)) return false;

            // Excel Filter
            if (!checkColumnFilter(fExcel, !!t.is_excel, isStuck)) return false;

            // GSTR1 Filter
            if (isStuck) {
                if (fGstr1 === 'pending' || fGstr1 === 'done') return false;
                if (fGstr1 === 'stuck') { /* keep */ }
            } else {
                if (fGstr1 === 'stuck') return false;
                if (fGstr1 === 'done' && !t.is_gstr1) return false;
                if (fGstr1 === 'pending') {
                    if (t.is_gstr1) return false;
                    
                    // If it's a Quarterly (QRMP) client, and selected month is Month 1 or Month 2 of the Quarter:
                    // If the due date of 13th of the next month has passed, do not show IFF in pending filter
                    if (freq === 'Quarterly' && (qMonthIdx === 1 || qMonthIdx === 2)) {
                        if (selectedPeriod) {
                            const [yStr, mStr] = selectedPeriod.split('-');
                            const yVal = parseInt(yStr);
                            const mVal = parseInt(mStr);
                            const nextMonth = mVal === 12 ? 1 : mVal + 1;
                            const nextYear = mVal === 12 ? yVal + 1 : yVal;
                            const dueDate = new Date(nextYear, nextMonth - 1, 13, 23, 59, 59);
                            if (new Date() > dueDate) {
                                return false;
                            }
                        }
                    }
                }
            }

            // Checked 2B Filter
            if (!checkColumnFilter(f2b, !!t.is_2b, isStuck)) return false;

            // Send 2B Filter
            if (!checkColumnFilter(fSend2b, !!t.is_send_2b, isStuck)) return false;

            // GSTR3B Filter
            if (!checkColumnFilter(fGstr3b, !!t.is_gstr3b, isStuck)) return false;

            const hasRemark = !!globalLatestRemarksMap[client.client_id];
            if (fRemark === 'has' && !hasRemark) return false;
            if (fRemark === 'none' && hasRemark) return false;

            const isBilled = !!((window.globalGstBilledMap && window.globalGstBilledMap[client.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id]));
            if (!checkColumnFilter(fBillPrepared, isBilled, isStuck)) return false;

            return true;
        });

        // 4. APPLY SORTING
        filteredClients.sort((a, b) => {
            let valA, valB;
            const tA = globalGstTrackingData.find(row => row.client_id === a.client_id) || {};
            const tB = globalGstTrackingData.find(row => row.client_id === b.client_id) || {};

            if (gstSortCol === 'display_name') {
                valA = a.display_name.toLowerCase(); valB = b.display_name.toLowerCase();
            } else if (gstSortCol === 'gstr1_upto') {
                valA = globalGstr1UptoMap[a.client_id] || ''; valB = globalGstr1UptoMap[b.client_id] || '';
            } else if (gstSortCol === 'gstr3b_upto') {
                valA = globalGstr3bUptoMap[a.client_id] || ''; valB = globalGstr3bUptoMap[b.client_id] || '';
            } else if (['is_call', 'is_data', 'is_excel', 'is_gstr1', 'is_2b', 'is_send_2b', 'is_gstr3b', 'is_bill_prepared'].includes(gstSortCol)) {
                if (gstSortCol === 'is_bill_prepared') {
                    const billedA = !!((window.globalGstBilledMap && window.globalGstBilledMap[a.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[a.client_id]));
                    const billedB = !!((window.globalGstBilledMap && window.globalGstBilledMap[b.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[b.client_id]));
                    valA = billedA ? 1 : 0; valB = billedB ? 1 : 0;
                } else {
                    valA = tA[gstSortCol] ? 1 : 0; valB = tB[gstSortCol] ? 1 : 0;
                }
            } else if (gstSortCol === 'remark') {
                valA = globalLatestRemarksMap[a.client_id] ? 1 : 0; valB = globalLatestRemarksMap[b.client_id] ? 1 : 0;
            }

            if (valA < valB) return gstSortAsc ? -1 : 1;
            if (valA > valB) return gstSortAsc ? 1 : -1;
            return 0;
        });

        updateGstSortIcons();

        // 5. RENDER TABLE
        const tbody = document.getElementById('gst-table-body');
        tbody.innerHTML = '';

        if (filteredClients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-500">No GST clients match the current filters.</td></tr>';
            return;
        }


        
        let pendingData = 0;
        let pendingGst1 = 0;
        let pendingGst3b = 0;
        let totalActiveCount = 0;

        const formatUpto = (periodStr) => {
            if (!periodStr) return '<span class="text-gray-300 text-xs font-bold uppercase">-</span>';
            const [y, m] = periodStr.split('-');
            const d = new Date(y, parseInt(m) - 1, 1);
            return `<span class="text-indigo-700 font-bold text-xs bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100 whitespace-nowrap">${d.toLocaleDateString('en-IN', {month:'short', year:'2-digit'})}</span>`;
        };

        filteredClients.forEach((client, index) => {
            const trackRecord = globalGstTrackingData.find(t => t.client_id === client.client_id) || {};
            const freq = client.gst_frequency || 'Monthly';
            const isQuarterly = freq === 'Quarterly';
            const isStuck = !!(window.globalGstStuckMap && window.globalGstStuckMap[client.client_id]);

            if (!isStuck) {
                totalActiveCount++;
                if (!trackRecord.is_data && (!isQuarterly || qMonthIdx === 3)) pendingData++;
                
                // Increment GSTR-1 pending count if Monthly, or if Month 3 of Quarter for Quarterly clients
                if (!trackRecord.is_gstr1) {
                    if (!isQuarterly || qMonthIdx === 3) {
                        pendingGst1++;
                    }
                }
                
                // Increment GSTR-3B pending count if Monthly, or if Month 3 of Quarter for Quarterly clients
                if (!trackRecord.is_gstr3b) {
                    if (!isQuarterly || qMonthIdx === 3) {
                        pendingGst3b++;
                    }
                }
            }

            const gstr1Display = formatUpto(globalGstr1UptoMap[client.client_id]);
            const gstr3bDisplay = formatUpto(globalGstr3bUptoMap[client.client_id]);
            
            // Find assignee
            let assigneeName = 'Unassigned';
            if (window.globalAssignmentsList) {
                const assignment = window.globalAssignmentsList.find(a => a.client_id === client.client_id && a.service_type && a.service_type.toLowerCase().includes('gst'));
                if (assignment && assignment.maker_id) {
                    const user = globalTeamMembers.find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }
            }
            const assigneeBadge = assigneeName !== 'Unassigned' ? `<div class="mt-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${assigneeName}</div>` : '';
            
            const freqBadge = freq === 'Quarterly' ? 
                `<div class="mt-1 ml-1.5 px-1.5 py-0.5 bg-purple-50 text-purple-700 border border-purple-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-arrows-spin scale-75"></i>QRMP</div>` : 
                `<div class="mt-1 ml-1.5 px-1.5 py-0.5 bg-blue-50 text-blue-700 border border-blue-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-calendar-day scale-75"></i>Monthly</div>`;

            const stuckBadge = isStuck 
                ? `<div class="mt-1 ml-1.5 px-1.5 py-0.5 bg-rose-50 text-rose-700 border border-rose-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-circle-exclamation scale-75"></i>STUCK</div>`
                : '';

            const safeName = client.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            const getCell = (isDone, type, name) => {
                if (isDone) {
                    return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openGSTDrawer('${client.client_id}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200"><div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>`;
                } else {
                    return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openGSTDrawer('${client.client_id}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;
                }
            };

            // Custom GSTR-1 cell for IFF optional filing support
            let gstr1Cell = '';
            if (isQuarterly && (qMonthIdx === 1 || qMonthIdx === 2)) {
                if (trackRecord.is_gstr1) {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed IFF', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-100 transition cursor-pointer border border-emerald-200 bg-emerald-50 shadow-sm mx-auto max-w-[85px]">
                            <span class="text-[9px] font-black text-emerald-600 px-1 py-0.5 rounded flex items-center gap-0.5"><i class="fa-solid fa-circle-check"></i> IFF Filed</span>
                        </button>
                    </td>`;
                } else {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed IFF (Optional)', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-indigo-500 hover:text-indigo-700 transition flex items-center justify-center border border-dashed border-indigo-200 bg-indigo-50/30 cursor-pointer shadow-sm mx-auto max-w-[85px]" title="Optional Invoice Furnishing Facility (IFF) for B2B invoices">
                            <span class="text-[9px] font-bold tracking-tight">IFF (Optional)</span>
                        </button>
                    </td>`;
                }
            } else {
                const qLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-bold text-indigo-500 uppercase tracking-widest block scale-90 -mt-1 leading-none">Qtr Due</span>' : '';
                const qDoneLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-widest block scale-90 -mt-0.5 leading-none">Qtr</span>' : '';
                
                if (trackRecord.is_gstr1) {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed GSTR-1', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>
                            ${qDoneLabel}
                        </button>
                    </td>`;
                } else {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed GSTR-1', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex flex-col items-center justify-center border border-transparent hover:border-indigo-200 cursor-pointer">
                            <i class="fa-solid fa-check text-sm"></i>
                            ${qLabel}
                        </button>
                    </td>`;
                }
            }

            // Custom GSTR-3B cell for QRMP support
            let gstr3bCell = '';
            if (isQuarterly && (qMonthIdx === 1 || qMonthIdx === 2)) {
                gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-slate-50/50">
                    <div class="w-full h-8 flex items-center justify-center">
                        <span class="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/80 cursor-not-allowed select-none whitespace-nowrap tracking-wide leading-none" title="Quarterly taxpayer: GSTR-3B is not due in Month 1 & Month 2 of standard quarters.">QRMP (N/A)</span>
                    </div>
                </td>`;
            } else {
                const qLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-bold text-indigo-500 uppercase tracking-widest block scale-90 -mt-1 leading-none">Qtr Due</span>' : '';
                const qDoneLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-widest block scale-90 -mt-0.5 leading-none">Qtr</span>' : '';

                if (trackRecord.is_gstr3b) {
                    gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr3b', 'Filed GSTR-3B', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>
                            ${qDoneLabel}
                        </button>
                    </td>`;
                } else {
                    gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr3b', 'Filed GSTR-3B', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex flex-col items-center justify-center border border-transparent hover:border-indigo-200 cursor-pointer">
                            <i class="fa-solid fa-check text-sm"></i>
                            ${qLabel}
                        </button>
                    </td>`;
                }
            }

            const latestRemarkText = globalLatestRemarksMap[client.client_id];
            let remarkHtml = '';
            
            if (latestRemarkText) {
                const safeRemark = latestRemarkText.replace(/"/g, '&quot;');
                remarkHtml = `<td class="px-2 py-2 border-l border-gray-100 bg-gray-50/50 align-top">
                                <div onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'general_remark', 'General Remarks', '${selectedPeriod}', false)" class="w-full min-h-[32px] text-xs font-medium text-gray-600 text-left p-1.5 rounded hover:bg-white cursor-pointer border border-transparent hover:border-gray-300 shadow-sm leading-tight line-clamp-2 transition" title="${safeRemark}">${latestRemarkText}</div>
                              </td>`;
            } else {
                remarkHtml = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-gray-50/50 align-top">
                                <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'general_remark', 'General Remarks', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-white text-gray-400 hover:text-indigo-600 transition flex items-center justify-center border border-transparent hover:border-gray-300 shadow-sm"><i class="fa-regular fa-comment-dots text-sm"></i></button>
                              </td>`;
            }

            let ackCheckboxHtml = '';
            const isGstOverdue = window.isGstPeriodOverdue(selectedPeriod) && (!isQuarterly || qMonthIdx === 3);
            // Show Acknowledge for any client where GST work is still pending (3B not filed or billing not done)
            const gstBilledDone = trackRecord.billed_status === 'Done' || trackRecord.billed_status === 'NIL';
            const gstPendingWork = (!isQuarterly || qMonthIdx === 3) && (!trackRecord.is_gstr3b || !gstBilledDone);
            if (gstPendingWork && !isGstOverdue && !isStuck) {
                const isUpdatedToday = !!window.globalGstUpdatedTodayMap[client.client_id];
                if (isUpdatedToday) {
                    ackCheckboxHtml = `
                        <span onclick="event.stopPropagation()" class="mt-1 ml-1.5 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-square-check scale-75"></i>Checked</span>
                    `;
                } else {
                    ackCheckboxHtml = `
                        <button onclick="acknowledgeGstToday('${client.client_id}', '${selectedPeriod}', event)" class="mt-1 ml-1.5 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition"><i class="fa-regular fa-square scale-75"></i>Acknowledge</button>
                    `;
                }
            }

            const rowClass = isStuck 
                ? "border-b border-gray-100 bg-rose-50/10 hover:bg-rose-50/20 transition opacity-65" 
                : "border-b border-gray-100 hover:bg-gray-50 transition";

            tbody.innerHTML += `
            <tr class="${rowClass}">
                <td class="px-2 py-3 text-center text-xs text-gray-400 font-mono">${index + 1}</td>
                <td onclick="openUniversalClientProfile('${client.client_id}')" class="px-3 py-3 font-bold text-gray-800 text-[13px] leading-tight cursor-pointer hover:text-indigo-600 transition group">
                    <span class="border-b border-transparent group-hover:border-indigo-300">${client.display_name}</span> 
                    ${assigneeBadge}
                    ${freqBadge}
                    ${stuckBadge}
                    ${ackCheckboxHtml}
                    <br><input type="text" class="text-[12px] font-normal text-gray-600 border border-gray-200 rounded p-1 w-full mt-1 focus:ring-2 focus:ring-indigo-500 outline-none" value="${window.globalClientRemarksMap[client.client_id] || ''}" onblur="saveClientRemark('${client.client_id}', this.value)" onclick="event.stopPropagation()" placeholder="Add remark...">
                    <br><span class="text-[9px] font-normal text-gray-400 uppercase tracking-wider">${client.client_code ? client.client_code + ' • ' : ''}${client.entity_type || ''}</span>
                </td>
                <td class="px-2 py-3 text-center bg-indigo-50/20 w-[1%] whitespace-nowrap border-r border-white">${gstr1Display}</td>
                <td class="px-2 py-3 text-center bg-indigo-50/20 w-[1%] whitespace-nowrap">${gstr3bDisplay}</td>
                ${getCell(trackRecord.is_call, 'is_call', 'Call / WhatsApp')}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_data ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_data', 'Data Received', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 whitespace-nowrap">${globalDataReceivedMap[client.client_id] || 'DONE'}</span>
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_data', 'Data Received', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_excel ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_excel', 'Excel / Tally', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            ${globalNilReturnMap[client.client_id + '_is_excel'] ? 
                                  `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span>` : 
                                `<div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>`
                            }
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_excel', 'Excel / Tally', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                ${gstr1Cell}
                ${getCell(trackRecord.is_send_2b, 'is_send_2b', 'Sent 2B')}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_2b ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_2b', 'Checked 2B', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            ${globalNilReturnMap[client.client_id + '_is_2b'] ? 
                                `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span>` : 
                                `<div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>`
                            }
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_2b', 'Checked 2B', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                ${gstr3bCell}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${(window.globalGstBilledMap && window.globalGstBilledMap[client.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id]) ? 
                        (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id] ?
                            `<button onclick="promptCancelGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center gap-1.5 rounded hover:bg-red-50 text-blue-600 hover:text-red-600 transition" title="Click to cancel free billing"><div class="w-6 h-6 rounded-full bg-blue-100 text-current flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-[10px]"></i></div><span class="text-[9px] font-black text-blue-600 uppercase tracking-wider">Nil</span></button>` :
                            `<button onclick="promptCancelGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}', false)" class="w-full h-8 flex items-center justify-center rounded hover:bg-red-50 text-blue-600 hover:text-red-600 transition" title="Click to cancel billing"><div class="w-6 h-6 rounded-full bg-blue-100 text-current flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-xs"></i></div></button>`
                        ) : 
                        (trackRecord.is_gstr3b ? 
                            `<button onclick="prepareGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-1 rounded text-xs font-bold transition shadow-sm">Bill</button>` : 
                            `<div class="w-full h-8"></div>`
                        )
                    }
                </td>
                ${remarkHtml}
            </tr>`;
        });

        // Update Summary Cards
        const totalCountEl = document.getElementById('gst-total-count');
        const pendingDataCountEl = document.getElementById('gst-pending-data-count');
        const pendingGst1CountEl = document.getElementById('gst-pending-gst1-count');
        const pendingGst3bCountEl = document.getElementById('gst-pending-gst3b-count');

        if (totalCountEl) totalCountEl.innerText = totalActiveCount;
        if (pendingDataCountEl) pendingDataCountEl.innerText = pendingData;
        if (pendingGst1CountEl) pendingGst1CountEl.innerText = pendingGst1;
        if (pendingGst3bCountEl) pendingGst3bCountEl.innerText = pendingGst3b;

        const viewContainer = document.getElementById('view-gst-center');
        const tableContainer = document.getElementById('gst-table-container');
        if (viewContainer || tableContainer) {
            const scrollPos = window.lastGstScrollPos || 0;
            const tableScrollPos = window.lastGstTableScrollPos || 0;
            setTimeout(() => {
                if (viewContainer) viewContainer.scrollTop = scrollPos;
                if (tableContainer) tableContainer.scrollTop = tableScrollPos;
                setTimeout(() => { window.gstIsLoading = false; }, 100);
            }, 50);
        } else {
            window.gstIsLoading = false;
        }
    }

    async function openGSTDrawer(clientId, clientName, columnKey, taskName, period, isDone) {
        try {
            document.getElementById('gstDrawerClientId').value = clientId;
            document.getElementById('gstDrawerPeriod').value = period;
            document.getElementById('gstDrawerColumn').value = columnKey;
            currentGstTaskIsDone = isDone;

            if (document.getElementById('gstDrawerFrequencySelect')) {
                const clientObj = (window.globalAllClientsList || globalClientsList || []).find(c => c.client_id === clientId);
                const currentFreq = clientObj ? clientObj.gst_frequency || 'Monthly' : 'Monthly';
                document.getElementById('gstDrawerFrequencySelect').value = currentFreq;
            }

            document.getElementById('gstDrawerClientName').innerText = clientName;
            
            const displayPeriod = getDeterministicShortPeriod(period);
            const taskNameDisplay = `${taskName} - ${displayPeriod}`;
            
            document.getElementById('gstDrawerTaskName').textContent = taskNameDisplay;
            document.getElementById('gstDrawerNote').value = '';
            await setTransferDropdownOptions('gstTransferUserSelect');

            const dateDiv = document.getElementById('gstDrawerFilingDateDiv');
            const dateLabel = document.getElementById('gstDrawerFilingDateLabel');
            const nilDiv = document.getElementById('gstDrawerNilReturnDiv');
            const nilCheck = document.getElementById('gstDrawerNilReturn');

            if (nilCheck) nilCheck.checked = false;

            if ((columnKey === 'is_gstr1' || columnKey === 'is_gstr3b' || columnKey === 'is_data') && !isDone) {
                dateDiv.classList.remove('hidden');
                if (columnKey === 'is_data') {
                    dateLabel.innerHTML = '<i class="fa-solid fa-calendar-check mr-1"></i> Date Data Received *';
                } else {
                    dateLabel.innerHTML = '<i class="fa-solid fa-calendar-day mr-1"></i> Date of Filing *';
                }
                document.getElementById('gstDrawerFilingDate').value = new Date().toISOString().split('T')[0]; 
            } else {
                dateDiv.classList.add('hidden');
            }

            if ((columnKey === 'is_excel' || columnKey === 'is_2b') && !isDone) {
                if (nilDiv) nilDiv.classList.remove('hidden');
            } else {
                if (nilDiv) nilDiv.classList.add('hidden');
            }

            const btnNote = document.getElementById('saveNoteOnlyBtn');
            const btnDone = document.getElementById('saveGstTaskBtn');
            const btnStuck = document.getElementById('saveGstStuckBtn');

            const isClientStuck = !!(window.globalGstStuckMap && window.globalGstStuckMap[clientId]);
            if (btnStuck) {
                if (isClientStuck) {
                    btnStuck.innerHTML = '<i class="fa-solid fa-circle-check"></i> Unstuck';
                    btnStuck.className = "flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 px-4 py-3 rounded-xl font-bold transition shadow-sm flex justify-center items-center gap-2 border border-amber-200";
                } else {
                    btnStuck.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Stuck';
                    btnStuck.className = "flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 px-4 py-3 rounded-xl font-bold transition shadow-sm flex justify-center items-center gap-2 border border-rose-200";
                }
            }

            if (columnKey === 'general_remark' || isDone) {
                btnDone.classList.add('hidden');
                if (btnStuck) btnStuck.classList.add('hidden');
                btnNote.classList.remove('sm:w-1/2', 'flex-1');
                btnNote.classList.add('w-full');
            } else {
                btnDone.classList.remove('hidden');
                if (btnStuck) btnStuck.classList.remove('hidden');
                btnNote.classList.remove('w-full');
                btnNote.classList.add('flex-1');
            }

            document.getElementById('gstTaskDrawer').classList.remove('hidden');

            const tl = document.getElementById('gstDrawerHistoryTimeline');
            tl.innerHTML = '<div class="text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading specific history...</div>';
            
            console.log("openGSTDrawer called for client:", clientId, "period:", period, "displayPeriod:", displayPeriod, "taskNameDisplay:", taskNameDisplay);

            const { data: logs, error: queryErr } = await fetchAllRows((from, to) => supabaseClient
                .from('task_logs')
                .select('*, users(name)')
                .eq('client_id', clientId)
                .is('task_id', null)
                .order('timestamp', { ascending: false })
                .order('log_id', { ascending: false })
                .range(from, to));

            if (queryErr) {
                console.error("Error fetching task_logs:", queryErr);
                showToast("Error loading history: " + queryErr.message);
            }
            
            console.log("Fetched logs:", logs);

            tl.innerHTML = '';
            
            const specificLogs = logs ? logs.filter(log => isLogMatchingTask(log.note, taskName, displayPeriod)) : [];
            
            if (specificLogs.length > 0) {
                let htmlStr = '';
                specificLogs.forEach(log => {
                    const d = new Date(log.timestamp).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                    
                    let cleanNote = log.note || '';
                    cleanNote = cleanNote.replace(/^GST\s+Action\s+Completed:\s*/i, '');
                    cleanNote = cleanNote.replace(/^GST\s+Action\s*/i, '');
                    cleanNote = cleanNote.replace(/^\[[^\]]+\]\s*/, '');
                    cleanNote = cleanNote.replace(/^:\s*/, '');
                    
                    htmlStr += `
                    <div class="bg-white rounded-xl border border-gray-200 mb-3 shadow-sm overflow-hidden border-l-4 border-l-indigo-400">
                        <div class="px-4 py-2 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                            <span class="text-xs font-bold text-gray-500 uppercase">${d}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-indigo-600 uppercase">${log.users?.name || 'System'}</span>
                                <button onclick="deleteGSTLog('${log.log_id}', '${clientId}', '${columnKey}', '${period}')" class="text-gray-400 hover:text-red-500 transition cursor-pointer p-1" title="Delete & Revert Status">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                        <div class="p-4"><p class="text-sm text-gray-700">${cleanNote}</p></div>
                    </div>`;
                });
                tl.innerHTML = htmlStr;
            } else {
                tl.innerHTML = '<div class="text-sm text-gray-400 py-2">No history logged for this specific task yet.</div>';
            }
        } catch (err) {
            console.error("Open Drawer Error:", err);
            showToast("System Error: Could not open the drawer. Please refresh the page and try again. (" + err.message + ")");
        }
    }

    window.toggleGSTStuck = async function() {
        const clientId = document.getElementById('gstDrawerClientId').value;
        const period = document.getElementById('gstDrawerPeriod').value;
        const btn = document.getElementById('saveGstStuckBtn');
        if (!btn) return;
        
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        try {
            const isCurrentlyStuck = !!(window.globalGstStuckMap && window.globalGstStuckMap[clientId]);
            const displayPeriod = getDeterministicShortPeriod(period);
            const historyNote = isCurrentlyStuck 
                ? `[GST Unstuck - ${displayPeriod}] Unstuck: Client marked as active again.`
                : `[GST Stuck - ${displayPeriod}] Stuck: Client marked as stuck / unresponsive.`;

            const { error: logErr } = await supabaseClient.from('task_logs').insert([{
                client_id: clientId,
                user_id: currentUser.id,
                note: historyNote
            }]);

            if (logErr) throw logErr;

            closeGSTDrawer();
            btn.innerHTML = ogHtml;
            loadGSTCenterData();
        } catch (err) {
            console.error("Toggle Stuck Error:", err);
            showToast("Error toggling stuck state: " + err.message);
            btn.innerHTML = ogHtml;
        }

    async function deleteGSTLog(logId, clientId, columnKey, period) {
        if (!confirm("Are you want to delete this log? If this was a completion record, the task status will be reverted to PENDING.")) return;
        
        try {
            // 1. Delete the log
            const { error: delErr } = await supabaseClient.from('task_logs').delete().eq('log_id', logId);
            if (delErr) throw delErr;

            // 2. Revert the status in gst_tracking (only if it's a specific task column)
            if (columnKey !== 'general_remark') {
                let updatePayload = {};
                updatePayload[columnKey] = false;
                await supabaseClient.from('gst_tracking').update(updatePayload).eq('client_id', clientId).eq('period', period);
            }

            // 3. Refresh
            closeGSTDrawer();
            loadGSTCenterData(); // Refresh the main table

        } catch (err) {
            console.error("Delete Log Error:", err);
            showToast("Error: " + err.message);
        }
    }

    async function saveGSTTask() {
        const clientId = document.getElementById('gstDrawerClientId').value;
        const period = document.getElementById('gstDrawerPeriod').value;
        const columnKey = document.getElementById('gstDrawerColumn').value;
        const note = document.getElementById('gstDrawerNote').value.trim();
        const taskNameDisplay = document.getElementById('gstDrawerTaskName').textContent;
        const transferTo = document.getElementById('gstTransferUserSelect') ? document.getElementById('gstTransferUserSelect').value : '';

        const btn = document.getElementById('saveGstTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        const clientObj = globalGstClients.find(c => c.client_id === clientId);
        const freq = clientObj ? (clientObj.gst_frequency || 'Monthly') : 'Monthly';
        const isQuarterly = freq === 'Quarterly';
        const qMonthIdx = getQuarterMonthIndex(period);
        const isGstOverdue = window.isGstPeriodOverdue(period) && (!isQuarterly || qMonthIdx === 3);
        if (isGstOverdue) {
            if (columnKey !== 'is_gstr3b' && !note) {
                showToast("This GST period is overdue. You must write a comment/note to save.");
                btn.innerHTML = ogHtml;
                return;
            }
        }

        try {
            let filingDateStr = "";
            if (columnKey === 'is_gstr1' || columnKey === 'is_gstr3b' || columnKey === 'is_data') {
                const fDate = document.getElementById('gstDrawerFilingDate').value;
                if (!fDate) throw new Error("Please select the date.");
                const prefix = columnKey === 'is_data' ? 'Received' : 'Filed';
                filingDateStr = ` (${prefix} on: ${new Date(fDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})})`;
            }

            if (columnKey === 'is_excel' || columnKey === 'is_2b') {
                const isNil = document.getElementById('gstDrawerNilReturn').checked;
                if (isNil) filingDateStr += " [NIL]";
            }

            const { data: existingRow, error: fetchErr } = await supabaseClient.from('gst_tracking').select('client_id').eq('client_id', clientId).eq('period', period).maybeSingle();
            if (fetchErr) throw fetchErr;
            
            let updatePayload = {};
            updatePayload[columnKey] = true;

            if (existingRow) {
                const { error: updErr } = await supabaseClient.from('gst_tracking').update(updatePayload).eq('client_id', clientId).eq('period', period);
                if (updErr) throw updErr;
            } else {
                updatePayload['client_id'] = clientId;
                updatePayload['period'] = period;
                const { error: insErr } = await supabaseClient.from('gst_tracking').insert([updatePayload]);
                if (insErr) throw insErr;
            }

            let historyNote = "";
            if (currentGstTaskIsDone) {
                historyNote = note ? `[${taskNameDisplay}] Additional Note: ${note}${filingDateStr}` : `[${taskNameDisplay}] Task reviewed${filingDateStr}`;
            } else {
                historyNote = note ? `[${taskNameDisplay}] ${note}${filingDateStr}` : `[${taskNameDisplay}] Marked as completed${filingDateStr}`;
            }
            
            await supabaseClient.from('task_logs').insert([{ client_id: clientId, user_id: currentUser.id, note: historyNote }]);
            
            const isCurrentlyStuck = !!(window.globalGstStuckMap && window.globalGstStuckMap[clientId]);
            if (isCurrentlyStuck) {
                const displayPeriod = getDeterministicShortPeriod(period);
                await supabaseClient.from('task_logs').insert([{
                    client_id: clientId,
                    user_id: currentUser.id,
                    note: `[GST Unstuck - ${displayPeriod}] Unstuck: Automatically activated due to task completion.`
                }]);
            }
            if (transferTo) {
                await transferClientWorkflow(clientId, 'GST', transferTo);
                await supabaseClient.from('task_logs').insert([{
                    client_id: clientId,
                    user_id: currentUser.id,
                    note: `[GST] Workflow transferred to ${globalTeamUsers.find(u => u.id === transferTo)?.name || 'selected user'}`
                }]);
            }

            closeGSTDrawer();
            btn.innerHTML = ogHtml;
            loadGSTCenterData();

        } catch (err) {
            console.error("Save Task Error:", err);
            showToast("Error saving data: " + err.message);
            btn.innerHTML = ogHtml;
        }
    }

    let globalTeamUsersAllocation = [];

    async function openTeamAllocation(clientId, clientName) {
        document.getElementById('allocationClientId').value = clientId;
        document.getElementById('allocationClientName').innerText = clientName;
        document.getElementById('teamAllocationDrawer').classList.remove('hidden');

        const container = document.getElementById('allocationServicesList');
        container.innerHTML = '<div class="text-center py-8 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading team and services...</div>';

        try {
            const { data: users, error: uErr } = await supabaseClient.from('users').select('id, name').eq('is_archived', false).order('name');
            if (uErr) throw uErr;
            globalTeamUsersAllocation = users || [];

            const client = globalClientsList.find(c => c.client_id === clientId);
            
            // 1. Get standard services, but don't crash if they have none. Exclude generic Startup and Subsidy.
            let enrolledServices = [];
            if (client && client.standard_services) {
                enrolledServices = client.standard_services.split(',')
                    .map(s => s.trim())
                    .filter(s => s !== 'Startup' && s !== 'Subsidy');
            }

            // 2. ALWAYS append Debtor Recovery so you can assign someone to collect money!
            if (!enrolledServices.includes('Debtor Recovery')) {
                enrolledServices.push('Debtor Recovery');
            }

            // Fetch assignments and active client subsidies in parallel
            const [assignmentsRes, subsidiesRes] = await Promise.all([
                supabaseClient.from('client_assignments').select('*').eq('client_id', clientId),
                supabaseClient.from('client_subsidies').select('subsidy_name, status').eq('client_id', clientId)
            ]);
            
            if (assignmentsRes.error) throw assignmentsRes.error;
            if (subsidiesRes.error) throw subsidiesRes.error;

            const assignments = assignmentsRes.data || [];
            const subsidies = (subsidiesRes.data || []).filter(sub => sub.status !== 'Approved');

            // Add specific active subsidy names to enrolledServices
            subsidies.forEach(sub => {
                if (sub.subsidy_name && !enrolledServices.includes(sub.subsidy_name)) {
                    enrolledServices.push(sub.subsidy_name);
                }
            });

            let html = '';
            let userOptions = `<option value="">-- Unassigned --</option>`;
            globalTeamUsersAllocation.forEach(u => {
                userOptions += `<option value="${u.id}">${u.name}</option>`;
            });

            enrolledServices.forEach(svc => {
                const safeSvcId = svc.replace(/[^a-zA-Z0-9]/g, '_');
                
                // Highlight Debtor Recovery differently to distinguish it from standard services
                const iconColor = svc === 'Debtor Recovery' ? 'text-red-500' : 'text-indigo-400';
                const iconType = svc === 'Debtor Recovery' ? 'fa-indian-rupee-sign' : 'fa-cube';

                html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition-shadow">
                    <h4 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid ${iconType} ${iconColor}"></i> ${svc}</h4>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs shadow-inner"><i class="fa-solid fa-user-pen"></i></div>
                            <div class="flex-1">
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Maker (Follow-up Exec)</label>
                                <select id="maker_${safeSvcId}" class="w-full text-sm p-2 rounded-xl bg-slate-50 border-none ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-slate-700">
                                    ${userOptions}
                                </select>
                            </div>
                        </div>

                        <button onclick="saveSpecificAllocation('${clientId}', '${svc}', 'maker_${safeSvcId}')" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-save"></i> Save ${svc} Allocation
                        </button>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;

            enrolledServices.forEach(svc => {
                let assignedRow = (assignments || []).find(a => a.service_type === svc);
                
                // Fallback for Audit assignments created from the Audit module which saves as 'Audit Status'
                if (!assignedRow && svc.toLowerCase().includes('audit')) {
                    assignedRow = (assignments || []).find(a => a.service_type === 'Audit Status');
                }

                // Fallback for generic Startup/Subsidy matching specific subsidy assignments
                if (!assignedRow && (svc.toLowerCase() === 'startup' || svc.toLowerCase() === 'subsidy')) {
                    const subsidyNames = subsidies.map(s => (s.subsidy_name || '').toLowerCase());
                    assignedRow = (assignments || []).find(a => {
                        const lowerA = (a.service_type || '').toLowerCase();
                        return lowerA.includes('startup') || lowerA.includes('subsidy') || subsidyNames.includes(lowerA);
                    });
                }

                // Fallback for specific subsidy case matching generic Startup/Subsidy assignments
                const isSpecificSubsidy = subsidies.some(sub => sub.subsidy_name === svc);
                if (!assignedRow && isSpecificSubsidy) {
                    assignedRow = (assignments || []).find(a => a.service_type === 'Startup' || a.service_type === 'Subsidy');
                }
                
                assignedRow = assignedRow || {};
                const safeSvcId = svc.replace(/[^a-zA-Z0-9]/g, '_');
                
                if (assignedRow.maker_id) {
                    const el = document.getElementById(`maker_${safeSvcId}`);
                    if (el) el.value = assignedRow.maker_id;
                }
            });

        } catch (err) {
            console.error("Allocation Load Error:", err);
            container.innerHTML = `<div class="text-center py-8 text-red-500">Error loading data: ${err.message}</div>`;
        }
    }

            window.globalSubsidyCategoriesCache = globalSubsidyCategoriesCache;

        if (!list) return;

                        ${statusLabel}
                        <div class="flex items-center gap-2">
                            <button onclick="downloadSubsidyChecklist('${safeCat}')" class="text-[10px] font-black text-indigo-600 hover:underline uppercase tracking-widest">
                                <i class="fa-solid fa-download"></i> Download
                            </button>
                            <span class="text-slate-200">|</span>
                            <label class="text-[10px] font-black text-emerald-600 hover:underline uppercase tracking-widest cursor-pointer">
                                <i class="fa-solid fa-upload"></i> Upload
                                <input type="file" class="hidden" onchange="uploadSubsidyChecklist('${safeCat}', event)" accept=".xlsx, .xls">
                            </label>
                        </div>
                    </div>
                </td>
                <td class="px-5 py-4 text-right">
                    <button onclick="editSubsidyCategory('${safeCat}')" class="h-9 w-9 text-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all mr-2">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button onclick="deleteSubsidyCategory('${safeCat}')" class="h-9 w-9 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            </tr>`;
        });
        if (displayedCount === 0) {
            list.innerHTML = '<tr><td colspan="3" class="text-center py-8 text-slate-400">No subsidy categories added yet.</td></tr>';
        }

        if (typeof renderAuditCategoriesTable === 'function') {
            renderAuditCategoriesTable();
        }
    }

    async function addSubsidyCategory() {
        const input = document.getElementById('newSubsidyCategoryName');
        const cat = input.value.trim();
        if (!cat) return;

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) return showToast("Error: No active client found to save configuration.");

        const note = `[SUBSIDY_GLOBAL_CONFIG] CAT_ADD:${cat}`;

        const { error: catErr } = await supabaseClient
            .from('subsidy_categories')
            .insert([{ name: cat, checklist: [] }]);

        if (catErr) return showToast("Error adding category to table: " + catErr.message);

        const { error } = await supabaseClient.from('task_logs').insert([{
            client_id: hostClientId,
            user_id: currentUser.id,
            note
        }]);

        if (error) return showToast("Error adding category: " + error.message);
        input.value = '';
        await loadSubsidyCategories();
    }

    async function deleteSubsidyCategory(cat) {
        if (!confirm(`Delete category "${cat}" and its checklist?`)) return;

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) return;

        const note = `[SUBSIDY_GLOBAL_CONFIG] CAT_DEL:${cat}`;

        const { error: catErr } = await supabaseClient
            .from('subsidy_categories')
            .delete()
            .eq('name', cat);

        if (catErr) return showToast("Error deleting category from table: " + catErr.message);

        await supabaseClient.from('task_logs').insert([{
            client_id: hostClientId,
            user_id: currentUser.id,
            note
        }]);

        await loadSubsidyCategories();
    }

    async function editSubsidyCategory(oldName) {
        const newName = prompt(`Enter new name for category "${oldName}":`, oldName);
        if (!newName || newName.trim() === oldName) return;
        
        const cat = newName.trim().toUpperCase(); // Force uppercase
        if (globalSubsidyCategoriesCache.includes(cat)) {
            return showToast("A category with this name already exists.");
        }

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) return showToast("Error: No active client found to save configuration.");

        const existingChecklist = globalSubsidyChecklistsCache[oldName.toUpperCase()];

        // Update client_subsidies table to rename the category in all client cases
        const { error: tableUpdateErr } = await supabaseClient
            .from('client_subsidies')
            .update({ subsidy_name: cat })
            .ilike('subsidy_name', oldName);

        if (tableUpdateErr) return showToast("Error updating client cases: " + tableUpdateErr.message);

        // Update subsidy_categories table
        const { error: catUpdateErr } = await supabaseClient
            .from('subsidy_categories')
            .update({ name: cat })
            .eq('name', oldName);

        if (catUpdateErr) return showToast("Error updating subsidy_categories: " + catUpdateErr.message);

        const { error } = await supabaseClient.from('task_logs').insert([
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_DEL:${oldName.toUpperCase()}` },
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_ADD:${cat}` },
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_RENAME:${oldName.toUpperCase()}->${cat}` },
            ...(existingChecklist ? [{ client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CHECKLIST:${cat}|${JSON.stringify(existingChecklist)}` }] : [])
        ]);

        if (error) return showToast("Error editing category: " + error.message);

        await loadSubsidyCategories();
    }

    function downloadSubsidyChecklist(cat) {
        try {
            let data = globalSubsidyChecklistsCache[cat.toUpperCase()] || [];
            if (!data || data.length === 0) {
                data = [
                    { "Serial No": 1, "Document Name": "Sample Document (e.g. PAN Card)", "Requirement": "Mandatory" },
                    { "Serial No": 2, "Document Name": "Sample Document (e.g. Rent Agreement)", "Requirement": "Optional" }
                ];
            }

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            wb.Props = {
                Title: `${cat} Checklist`,
                Subject: `SUBSIDY_CHECKLIST_${cat.toUpperCase()}`,
                Author: "Office OS"
            };
            XLSX.utils.book_append_sheet(wb, ws, "Checklist");
            
            const fileName = `${cat.replace(/[^a-z0-9]/gi, '_')}_Checklist.xlsx`;
            XLSX.writeFile(wb, fileName);
        } catch (err) {
            console.error("Download error:", err);
            showToast("Error generating download: " + err.message);
        }
    }

    function uploadSubsidyChecklist(cat, event) {
        const file = event.target.files[0];
        if (!file) return;

        const expectedBase = cat.replace(/[^a-z0-9]/gi, '_');
        const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const escapedBase = escapeRegExp(expectedBase);
        const expectedPattern = new RegExp(`^${escapedBase}_Checklist(?:\\s*\\(\\d+\\))?\\.xlsx$`, 'i');

        if (!expectedPattern.test(file.name)) {
            showToast(`Accidental Upload Blocked!\nYou are trying to upload a checklist for "${cat}", but the file you selected ("${file.name}") does not match the expected filename structure (e.g., "${expectedBase}_Checklist.xlsx").\n\nPlease select the correct file downloaded from the "${cat}" section.`);
            event.target.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                // Safeguard 2: Internal Metadata validation (Bulletproof check)
                const fileSubject = workbook.Props ? workbook.Props.Subject : null;
                const fileTitle = workbook.Props ? workbook.Props.Title : null;
                if (fileSubject && fileSubject.toUpperCase() !== `SUBSIDY_CHECKLIST_${cat.toUpperCase()}`) {
                    showToast(`Accidental Upload Blocked!\nThis file contains checklist data for "${fileTitle || fileSubject}", but you are trying to upload it to "${cat}".\n\nPlease select the correct file.`);
                    event.target.value = '';
                    return;
                }

                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                if (jsonData.length === 0) return showToast("Excel sheet is empty!");

                // Clean and normalize Requirement values to avoid spelling mistakes
                jsonData.forEach(item => {
                    if (item["Requirement"]) {
                        const cleanReq = item["Requirement"].toString().trim().toLowerCase();
                        if (cleanReq.startsWith('man') || cleanReq === 'm' || cleanReq.includes('yes') || cleanReq.includes('req')) {
                            item["Requirement"] = 'Mandatory';
                        } else {
                            item["Requirement"] = 'Optional';
                        }
                    } else if (item["req"]) {
                        const cleanReq = item["req"].toString().trim().toLowerCase();
                        if (cleanReq.startsWith('man') || cleanReq === 'm' || cleanReq.includes('yes') || cleanReq.includes('req')) {
                            item["Requirement"] = 'Mandatory';
                        } else {
                            item["Requirement"] = 'Optional';
                        }
                    } else {
                        item["Requirement"] = 'Optional';
                    }

                    // Standardize headers
                    if (item["doc"] && !item["Document Name"]) {
                        item["Document Name"] = item["doc"];
                    }
                    if (item["Serial No"] === undefined && item["sr"] !== undefined) {
                        item["Serial No"] = item["sr"];
                    }
                });

                const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
                // Update the checklist in subsidy_categories table
                const { error } = await supabaseClient
                    .from('subsidy_categories')
                    .update({ checklist: jsonData })
                    .eq('name', cat);

                // Also log the action in task_logs for history
                await supabaseClient.from('task_logs').insert([{
                    client_id: hostClientId,
                    user_id: currentUser.id,
                    note: `[SUBSIDY_GLOBAL_CONFIG] CHECKLIST_UPLOADED:${cat}`
                }]);

                if (error) showToast("Error uploading checklist: " + error.message);
                else {
                    showToast("Checklist updated successfully!");
                    await loadSubsidyCategories();
                }
            } catch (err) {
                console.error("Upload error:", err);
                showToast("Error processing upload: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function renderStartupSubsidyChecklist(clientId, catName) {
        const container = document.getElementById('startupSubsidyChecklistContainer');
        const progressEl = document.getElementById('subsidyChecklistProgress');
        if (!container) return;

        // 1. Get the global checklist for this category
        const masterList = globalSubsidyChecklistsCache[catName.toUpperCase()] || [];
        if (masterList.length === 0) {
            container.innerHTML = '<div class="text-center py-4 text-slate-300 italic text-xs">No documents configured for this category.</div>';
            progressEl.innerText = '0/0 Collected';
            return;
        }

        // 2. Use the in-memory cache directly! No database call needed, saving hundreds of ms on every toggle!
        const statusMap = (window.globalChecklistStatusMap?.[clientId]?.[catName]) || {};

        let completedCount = 0;
        container.innerHTML = '';

        masterList.forEach(item => {
            const docName = item["Document Name"] || item["doc"] || "Unnamed Document";
            const req = item["Requirement"] || item["req"] || "Optional";
            const isDone = statusMap[docName] === true;
            if (isDone) completedCount++;

            const id = `chk-${clientId}-${catName}-${docName}`.replace(/\s+/g, '-');
            const reqClass = req.toLowerCase() === 'mandatory' ? 'text-red-500 bg-red-50 border-red-100' : 'text-slate-400 bg-slate-50 border-slate-100';
            const safeDocName = docName.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            container.innerHTML += `
            <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl hover:border-indigo-200 transition group cursor-pointer" onclick="toggleSubsidyChecklistItem('${clientId}', '${catName}', '${safeDocName}', !${isDone})">
                <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${isDone ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 group-hover:border-indigo-300'}">
                    ${isDone ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                </div>
                <div class="flex-1 flex items-center justify-between gap-3 overflow-hidden">
                    <div class="text-[13px] font-black ${isDone ? 'text-slate-400 line-through' : 'text-slate-700'} truncate" title="${docName}">${docName}</div>
                    <span class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full border ${reqClass} whitespace-nowrap shrink-0 shadow-sm">${req}</span>
                </div>
            </div>`;
        });

        progressEl.innerText = `${completedCount}/${masterList.length} Collected`;
    }

    async function toggleSubsidyChecklistItem(clientId, catName, docName, newStatus) {
        const note = `[SUBSIDY_CHECKLIST_STATUS] CAT:${catName}|DOC:${docName}|STATUS:${newStatus}`;
        
        // Optimistic UI update
        const progressEl = document.getElementById('subsidyChecklistProgress');
        const [current, total] = progressEl.innerText.split(' ')[0].split('/');
        const nextCount = newStatus ? parseInt(current) + 1 : parseInt(current) - 1;
        progressEl.innerText = `${nextCount}/${total} Collected`;
        
        // Optimistically update cache to give instant visual feedback!
        if (!window.globalChecklistStatusMap) window.globalChecklistStatusMap = {};
        if (!window.globalChecklistStatusMap[clientId]) window.globalChecklistStatusMap[clientId] = {};
        if (!window.globalChecklistStatusMap[clientId][catName]) window.globalChecklistStatusMap[clientId][catName] = {};
        window.globalChecklistStatusMap[clientId][catName][docName] = newStatus;
        
        // Instantly render checklist with the updated local state!
        renderStartupSubsidyChecklist(clientId, catName);
        
        // Perform the database write in the background
        const { error } = await supabaseClient.from('task_logs').insert([{
            client_id: clientId,
            user_id: currentUser.id,
            note
        }]);

        if (error) {
            showToast("Error saving status: " + error.message);
            // Revert cache on error
            window.globalChecklistStatusMap[clientId][catName][docName] = !newStatus;
            renderStartupSubsidyChecklist(clientId, catName); // Revert Drawer UI
        } else {
            renderStartupsSubsidyTable(); // Refresh Main Page Table UI
        }
    }

    window.checkAllMandatoryDocs = async function() {
        if (!activeStartupSubsidyContext) return;
        const { clientId, subsidyType } = activeStartupSubsidyContext;
        const masterList = globalSubsidyChecklistsCache[subsidyType.toUpperCase()] || [];
        const statusMap = (window.globalChecklistStatusMap?.[clientId]?.[subsidyType]) || {};
        
        // Find all mandatory items that are not checked yet
        const mandatoryToChange = [];
        masterList.forEach(item => {
            const docName = item["Document Name"] || item["doc"] || "Unnamed Document";
            const req = item["Requirement"] || item["req"] || "Optional";
            const isDone = statusMap[docName] === true;
            if (req.toLowerCase() === 'mandatory' && !isDone) {
                mandatoryToChange.push(docName);
            }
        });
        
        if (mandatoryToChange.length === 0) {
            return showToast("All mandatory documents are already checked!");
        }
        
        // Optimistically update local cache
        if (!window.globalChecklistStatusMap) window.globalChecklistStatusMap = {};
        if (!window.globalChecklistStatusMap[clientId]) window.globalChecklistStatusMap[clientId] = {};
        if (!window.globalChecklistStatusMap[clientId][subsidyType]) window.globalChecklistStatusMap[clientId][subsidyType] = {};
        
        mandatoryToChange.forEach(docName => {
            window.globalChecklistStatusMap[clientId][subsidyType][docName] = true;
        });
        
        // Instantly re-render the checklist for instant feedback
        renderStartupSubsidyChecklist(clientId, subsidyType);
        
        // Prepare database logs
        const logsToInsert = mandatoryToChange.map(docName => ({
            client_id: clientId,
            user_id: currentUser.id,
            note: `[SUBSIDY_CHECKLIST_STATUS] CAT:${subsidyType}|DOC:${docName}|STATUS:true`
        }));
        
        const { error } = await supabaseClient.from('task_logs').insert(logsToInsert);
        if (error) {
            showToast("Error checking mandatory documents: " + error.message);
            // Revert cache on error
            mandatoryToChange.forEach(docName => {
                window.globalChecklistStatusMap[clientId][subsidyType][docName] = false;
            });
            renderStartupSubsidyChecklist(clientId, subsidyType);
        } else {
            renderStartupsSubsidyTable(); // Refresh table counts/badges
        }
    };

    window.saveGstFrequencyFromDrawer = async function() {
        const clientId = document.getElementById('gstDrawerClientId').value;
        const frequency = document.getElementById('gstDrawerFrequencySelect').value;
        if (!clientId) return;
        
        try {
            const { error } = await supabaseClient.from('clients').update({ gst_frequency: frequency }).eq('client_id', clientId);
            if (error) throw error;
            
            // Update local cache
            const clientObj = (window.globalAllClientsList || globalClientsList || []).find(c => c.client_id === clientId);
            if (clientObj) clientObj.gst_frequency = frequency;
            
            showToast("GST filing frequency updated successfully!");
            renderFilteredGSTTable(); // Redraw the table
        } catch (err) {
            console.error("Error saving frequency from drawer:", err);
            showToast("Error: " + err.message);
        }
    };
</script>
