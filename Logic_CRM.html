    function populateGSTMonths() {
        const select = document.getElementById('gstMonthFilter');
        if (!select || select.options.length > 0) return; 

        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() - 1; 
        if (month < 0) { month = 11; year--; }

        let optionsHtml = '';
        for (let i = 0; i < 24; i++) {
            const monthStr = (month + 1).toString().padStart(2, '0');
            const val = `${year}-${monthStr}`;

            const dateObj = new Date(year, month, 1);
            const display = dateObj.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });

            optionsHtml += `<option value="${val}">${display}</option>`;

            month--;
            if (month < 0) { month = 11; year--; }
        }
        select.innerHTML = optionsHtml;
    }

    function populateTDSQuarters() {
        const select = document.getElementById('tdsQuarterFilter');
        if (!select || (select && select.options.length > 0)) return;

        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() - 3; 
        if (month < 0) { month += 12; year--; }

        let optionsHtml = '';
        for (let i = 0; i < 8; i++) {
            let fyStart, fyEnd, quarter;
            if (month >= 3) {
                fyStart = year;
                fyEnd = year + 1;
                quarter = Math.floor((month - 3) / 3) + 1;
            } else {
                fyStart = year - 1;
                fyEnd = year;
                quarter = 4;
            }
            const fyStr = `FY ${fyStart}-${fyEnd.toString().slice(-2)}`;
            const val = `${fyStr} Q${quarter}`;
            optionsHtml += `<option value="${val}">${val}</option>`;
            
            month -= 3;
            if (month < 0) { month = 9; year--; }
        }
        select.innerHTML = optionsHtml;
    }

    async function loadTDSCenterData() {
        const tbody = document.getElementById('tds-table-body');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading TDS Data...</td></tr>';
        try {
            populateTDSQuarters();
            await refreshGlobalCache();
            await fetchTeamMembers();
            
            const selectEl = document.getElementById('tdsQuarterFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';

            if (!selectedPeriod) throw new Error("Could not determine the selected quarter.");

            const { data: quarterlyData, error: err1 } = await supabaseClient.from('tds_tracking').select('*').eq('period', selectedPeriod);
            if (err1) throw err1;
            globalTdsTrackingData = quarterlyData || [];

            // Fetch comments for this quarter
            globalTdsComments = {};
            const { data: comments, error: cErr } = await supabaseClient
                .from('task_history')
                .select('*')
                .eq('task_type', 'TDS')
                .ilike('note', `%[TDS Comment - ${selectedPeriod}]%`)
                .order('timestamp', { ascending: false });
            
            if (!cErr && comments) {
                comments.forEach(c => {
                    // Since it's ordered by timestamp desc, the first one we see for a client is the latest!
                    if (!globalTdsComments[c.client_id]) {
                        const noteText = c.note.split(`[TDS Comment - ${selectedPeriod}]`)[1] || c.note;
                        globalTdsComments[c.client_id] = {
                            text: noteText.trim(),
                            id: c.id
                        };
                    }
                });
            }

            // Fetch rates for view-tds-center
            const { data: rateLogs } = await supabaseClient.from('task_logs')
                .select('note')
                .ilike('note', `[PAGE_RATE] view-tds-center%`)
                .order('timestamp', { ascending: false });
            window.globalTdsRatesMap = {};
            if (rateLogs) {
                rateLogs.forEach(log => {
                    const parts = log.note.split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[1];
                        const rate = parts[2];
                        if (window.globalTdsRatesMap[clientId] === undefined) window.globalTdsRatesMap[clientId] = rate;
                    }
                });
            }

            // Filter clients based on Page Visibility Settings
            const { data: visSettings } = await supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-tds-center').single();
            const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : ['TDS Return'];
            
            globalTdsClients = globalClientsList.filter(c => {
                if (!c.standard_services) return false;
                const clientServices = c.standard_services.split(',').map(s => s.trim().toLowerCase());
                return allowedServices.some(as => clientServices.includes(as.toLowerCase()));
            });

            // Fetch today's TDS logs to identify updated clients
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const { data: todayTdsLogs } = await supabaseClient
                .from('task_history')
                .select('client_id, note')
                .eq('user_id', currentUser.id)
                .gte('timestamp', todayStart.toISOString())
                .eq('task_type', 'TDS');

            window.globalTdsUpdatedTodayMap = {};
            if (todayTdsLogs) {
                todayTdsLogs.forEach(l => {
                    // Any TDS activity today = acknowledged
                    window.globalTdsUpdatedTodayMap[l.client_id] = true;
                });
            }

            renderFilteredTDSTable();
        } catch (error) {
            console.error("Error in loadTDSCenterData:", error);
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-500"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>Error loading data: ${error.message}</td></tr>`;
        }
    }

    function sortTdsTable(col) {
        if (tdsSortCol === col) {
            tdsSortAsc = !tdsSortAsc;
        } else {
            tdsSortCol = col;
            tdsSortAsc = true;
        }
        renderFilteredTDSTable();
    }

    function updateTdsSortIcons() {
        const icon = document.getElementById('sort_icon_remark_tds');
        if (icon) {
            if (tdsSortCol === 'remark') {
                icon.className = tdsSortAsc ? "fa-solid fa-sort-up text-xs text-indigo-600" : "fa-solid fa-sort-down text-xs text-indigo-600";
            } else {
                icon.className = "fa-solid fa-sort text-xs text-gray-300 transition-colors";
            }
        }
    }

    function renderFilteredTDSTable() {
        const searchEl = document.getElementById('tdsSearchInput');
        const query = searchEl ? searchEl.value.toLowerCase() : '';

        const assignFilter = document.getElementById('tdsAssignFilter') ? document.getElementById('tdsAssignFilter').value : 'all';
        const filterRemark = document.getElementById('filter_remark_tds') ? document.getElementById('filter_remark_tds').value : 'all';
        
        const filterM1 = document.getElementById('filter_m1_tds')?.value || 'all';
        const filterM2 = document.getElementById('filter_m2_tds')?.value || 'all';
        const filterM3 = document.getElementById('filter_m3_tds')?.value || 'all';
        const filterReturn = document.getElementById('filter_return_tds')?.value || 'all';
        const filterForm16 = document.getElementById('filter_form16_tds')?.value || 'all';
        const filterBilled = document.getElementById('filter_billed_tds')?.value || 'all';

        let filteredClients = globalTdsClients;

        const myTdsClients = (window.globalAssignmentsList || [])
            .filter(a => a.service_type && a.service_type.toLowerCase().includes('tds return') && 
                (a.maker_id && currentUser && currentUser.id && a.maker_id.toLowerCase() === currentUser.id.toLowerCase()))
            .map(a => a.client_id);

        filteredClients = filteredClients.filter(client => {
            if (assignFilter === 'mine' && !myTdsClients.includes(client.client_id)) return false;
            if (query && !client.display_name.toLowerCase().includes(query)) return false;
            
            const hasComment = !!globalTdsComments[client.client_id];
            if (filterRemark === 'has' && !hasComment) return false;
            if (filterRemark === 'none' && hasComment) return false;
            
            const trackRecord = globalTdsTrackingData.find(t => t.client_id === client.client_id) || {};
            
            const m1Status = trackRecord.month_1_status || 'Pending';
            const m2Status = trackRecord.month_2_status || 'Pending';
            const m3Status = trackRecord.month_3_status || 'Pending';
            const returnStatus = trackRecord.return_filed_status || 'Pending';
            const form16Status = returnStatus === 'NIL' ? 'NIL' : (trackRecord.form_16_status || 'Pending');
            const billedStatus = returnStatus === 'NIL' ? 'NIL' : (trackRecord.billed_status || 'Pending');

            if (filterM1 !== 'all' && m1Status !== filterM1) return false;
            if (filterM2 !== 'all' && m2Status !== filterM2) return false;
            if (filterM3 !== 'all' && m3Status !== filterM3) return false;
            if (filterReturn !== 'all' && returnStatus !== filterReturn) return false;
            if (filterForm16 !== 'all' && form16Status !== filterForm16) return false;
            if (filterBilled !== 'all' && billedStatus !== filterBilled) return false;
            
            return true;
        });

        // Sorting
        filteredClients.sort((a, b) => {
            let valA = '';
            let valB = '';
            
            if (tdsSortCol === 'display_name') {
                valA = a.display_name.toLowerCase();
                valB = b.display_name.toLowerCase();
            } else if (tdsSortCol === 'remark') {
                valA = globalTdsComments[a.client_id]?.text.toLowerCase() || '';
                valB = globalTdsComments[b.client_id]?.text.toLowerCase() || '';
            }
            
            if (valA < valB) return tdsSortAsc ? -1 : 1;
            if (valA > valB) return tdsSortAsc ? 1 : -1;
            return 0;
        });

        updateTdsSortIcons();

        // Update Summary Cards
        const totalCountEl = document.getElementById('tds-total-count');
        const filingPendingCountEl = document.getElementById('tds-filing-pending-count');
        const form16PendingCountEl = document.getElementById('tds-form16-pending-count');
        const billPendingCountEl = document.getElementById('tds-bill-pending-count');
        const scoreEl = document.getElementById('tds-score');

        if (totalCountEl) totalCountEl.innerText = filteredClients.length;

        let filingPending = 0;
        let form16Pending = 0;
        let billPending = 0;
        
        let totalTasks = filteredClients.length * 6;
        let completedTasks = 0;

        filteredClients.forEach(client => {
            const trackRecord = globalTdsTrackingData.find(t => t.client_id === client.client_id) || {};
            
            const returnStatus = trackRecord.return_filed_status || 'Pending';
            const form16Status = returnStatus === 'NIL' ? 'NIL' : (trackRecord.form_16_status || 'Pending');
            const billedStatus = returnStatus === 'NIL' ? 'NIL' : (trackRecord.billed_status || 'Pending');

            const statuses = [
                trackRecord.month_1_status || 'Pending',
                trackRecord.month_2_status || 'Pending',
                trackRecord.month_3_status || 'Pending',
                returnStatus,
                form16Status,
                billedStatus
            ];

            // Filing Pending: except NIL and completed
            if (returnStatus !== 'Done' && returnStatus !== 'NIL') {
                filingPending++;
            }

            // Form 16 Pending: exclude NIL
            if (form16Status !== 'Done' && form16Status !== 'NIL') {
                form16Pending++;
            }

            // Bill Pending: exclude NIL
            if (billedStatus !== 'Done' && billedStatus !== 'NIL') {
                billPending++;
            }

            statuses.forEach(s => {
                if (s === 'Done' || s === 'NIL') {
                    completedTasks++;
                }
            });
        });

        if (filingPendingCountEl) filingPendingCountEl.innerText = filingPending;
        if (form16PendingCountEl) form16PendingCountEl.innerText = form16Pending;
        if (billPendingCountEl) billPendingCountEl.innerText = billPending;

        const score = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 100;
        if (scoreEl) scoreEl.innerText = `${score}%`;

        const tbody = document.getElementById('tds-table-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (filteredClients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-500">No TDS clients match the current filters.</td></tr>';
            return;
        }

        const selectedPeriod = document.getElementById('tdsQuarterFilter').value;

        const getCell = (status, type, name, clientId, safeName) => {
            if (status === 'Done') {
                return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', 'Done')" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200"><div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>`;
            } else if (status === 'NIL') {
                return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', 'NIL')" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200"><span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span></button></td>`;
            } else {
                return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', 'Pending')" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;
            }
        };

        const getCommentCell = (clientId, safeName, period) => {
            const comment = globalTdsComments[clientId];
            if (comment) {
                const safeRemark = comment.text.replace(/"/g, '&quot;');
                return `<td class="px-2 py-2 border-l border-gray-100 bg-gray-50/50 align-top">
                            <div onclick="openTDSDrawer('${clientId}', '${safeName}', 'Comment', 'Comment', '${period}', false)" class="w-full min-h-[32px] text-xs font-medium text-gray-600 text-left p-1.5 rounded hover:bg-white cursor-pointer border border-transparent hover:border-gray-300 shadow-sm leading-tight line-clamp-2 transition" title="${safeRemark}">${comment.text}</div>
                        </td>`;
            } else {
                return `<td class="px-1 py-3 text-center border-l border-gray-100 bg-gray-50/50 align-top">
                            <button onclick="openTDSDrawer('${clientId}', '${safeName}', 'Comment', 'Comment', '${period}', false)" class="w-full h-8 rounded hover:bg-white text-gray-400 hover:text-indigo-600 transition flex items-center justify-center border border-transparent hover:border-gray-300 shadow-sm"><i class="fa-regular fa-comment-dots text-sm"></i></button>
                        </td>`;
            }
        };

        filteredClients.forEach((client, index) => {
            const trackRecord = globalTdsTrackingData.find(t => t.client_id === client.client_id) || {};
            const safeName = client.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            // Find assignee
            let assigneeName = 'Unassigned';
            if (window.globalAssignmentsList) {
                const assignment = window.globalAssignmentsList.find(a => a.client_id === client.client_id && a.service_type && a.service_type.toLowerCase().includes('tds return'));
                if (assignment && assignment.maker_id) {
                    const user = (window.globalTeamMembers || []).find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }
            }
            const assigneeBadge = assigneeName !== 'Unassigned' ? `<div class="mt-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${assigneeName}</div>` : '';

            const isTdsOverdue = window.isTdsPeriodOverdue(selectedPeriod);
            // Show Acknowledge for any client where work is still pending (billing not done, and not a NIL return)
            const tdsBilledDone = trackRecord.billed_status === 'Done' || trackRecord.billed_status === 'NIL';
            const tdsNilReturn = trackRecord.return_filed_status === 'NIL';
            const tdsPendingWork = !tdsBilledDone && !tdsNilReturn;
            let ackCheckboxHtml = '';
            if (tdsPendingWork && !isTdsOverdue) {
                const isUpdatedToday = !!window.globalTdsUpdatedTodayMap[client.client_id];
                if (isUpdatedToday) {
                    ackCheckboxHtml = `<span onclick="event.stopPropagation()" class="mt-1 ml-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-square-check scale-75"></i>Checked</span>`;
                } else {
                    ackCheckboxHtml = `<button onclick="acknowledgeTdsToday('${client.client_id}', '${selectedPeriod}', event)" class="mt-1 ml-1 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition"><i class="fa-regular fa-square scale-75"></i>Acknowledge</button>`;
                }
            }

            tbody.innerHTML += `
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                <td class="px-2 py-3 text-center text-xs text-gray-400 font-mono">${index + 1}</td>
                <td onclick="openUniversalClientProfile('${client.client_id}')" class="px-3 py-3 font-bold text-gray-800 text-[13px] leading-tight cursor-pointer hover:text-indigo-600 transition group">
                    <span class="border-b border-transparent group-hover:border-indigo-300">${client.display_name}</span> 
                    ${assigneeBadge}
                    ${ackCheckboxHtml}
                    <br><span class="text-[9px] font-normal text-gray-400 uppercase tracking-wider">${client.entity_type || ''}</span>
                </td>
                ${getCell(trackRecord.month_1_status, 'month_1_status', 'Month 1 Chalan', client.client_id, safeName)}
                ${getCell(trackRecord.month_2_status, 'month_2_status', 'Month 2 Chalan', client.client_id, safeName)}
                ${getCell(trackRecord.month_3_status, 'month_3_status', 'Month 3 Chalan', client.client_id, safeName)}
                ${getCell(trackRecord.return_filed_status, 'return_filed_status', 'Return Filed', client.client_id, safeName)}
                ${getCell(trackRecord.return_filed_status === 'NIL' ? 'NIL' : trackRecord.form_16_status, 'form_16_status', 'Form 16', client.client_id, safeName)}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.billed_status === 'Done' ? 
                        `<div class="w-full h-8 flex items-center justify-center"><div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-xs"></i></div></div>` : 
                        (trackRecord.return_filed_status === 'NIL' ? 
                            `<div class="w-full h-8 flex items-center justify-center"><span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span></div>` :
                            (trackRecord.billed_status === 'NIL' ? 
                                `<div class="w-full h-8 flex items-center justify-center"><div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shadow-sm border border-blue-200 text-[10px] font-bold">NIL</div></div>` :
                                (trackRecord.form_16_status === 'Done' ? 
                                    `<button onclick="prepareTdsBill('${client.client_id}', '${safeName}', '${selectedPeriod}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-1 rounded text-xs font-bold transition shadow-sm">Bill</button>` : 
                                    `<div class="w-full h-8"></div>`
                                )
                            )
                        )
                    }
                </td>
                ${getCommentCell(client.client_id, safeName, selectedPeriod)}
            </tr>`;
        });
    }

    let currentTdsDrawerData = null;

    async function openTDSDrawer(clientId, clientName, columnKey, taskName, period, currentStatus) {
        try {
            currentTdsDrawerData = { clientId, clientName, columnKey, taskName, period, currentStatus };

            document.getElementById('tdsDrawerClientId').value = clientId;
            document.getElementById('tdsDrawerPeriod').value = period;
            document.getElementById('tdsDrawerColumn').value = columnKey;

            document.getElementById('tdsDrawerClientName').innerText = clientName;
            document.getElementById('tdsDrawerTaskName').textContent = `${taskName} - ${period}`;
            document.getElementById('tdsDrawerNote').value = '';
            
            await setTransferDropdownOptions('tdsTransferUserSelect');

            const nilDiv = document.getElementById('tdsDrawerNilReturnDiv');
            const nilCheck = document.getElementById('tdsDrawerNilReturn');

            if (nilCheck) {
                nilCheck.checked = (currentStatus === 'NIL');
            }

            if (nilDiv) {
                nilDiv.classList.remove('hidden');
            }

            const historyTimeline = document.getElementById('tdsDrawerHistoryTimeline');
            if (historyTimeline) {
                historyTimeline.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Loading history...</div>';

                const { data: logs, error } = await supabaseClient
                    .from('task_history')
                    .select('*, users(name)')
                    .eq('client_id', clientId)
                    .eq('task_type', 'TDS')
                    .eq('task_name', taskName)
                    .order('timestamp', { ascending: false });

                if (error) throw error;

                historyTimeline.innerHTML = '';
                if (!logs || logs.length === 0) {
                    historyTimeline.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">No history found for this task.</div>';
                } else {
                    logs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleString('en-IN');
                        historyTimeline.innerHTML += `
                        <div class="bg-white p-3 rounded-lg border border-gray-100 shadow-sm relative">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-gray-700">${log.users?.name || 'System'}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-gray-400">${date}</span>
                                    <button onclick="deleteTDSLog('${log.id}')" class="text-rose-400 hover:text-rose-600 transition text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <p class="text-xs text-gray-600">${log.note}</p>
                        </div>`;
                    });
                }
            }

            const drawer = document.getElementById('tdsTaskDrawer');
            if (drawer) {
                drawer.classList.remove('hidden');
                setTimeout(() => drawer.classList.remove('opacity-0'), 10);
            }

        } catch (error) {
            console.error("Error in openTDSDrawer:", error);
            alert("Error opening drawer: " + error.message);
        }
    }

    function closeTDSDrawer() {
        const drawer = document.getElementById('tdsTaskDrawer');
        if (drawer) {
            drawer.classList.add('opacity-0');
            setTimeout(() => drawer.classList.add('hidden'), 300);
        }
    }

    async function deleteTDSLog(logId) {
        if (!confirm("Are you sure you want to delete this log?")) return;
        
        const { error } = await supabaseClient.from('task_history').delete().eq('id', logId);
        if (error) {
            alert("Error deleting log: " + error.message);
        } else {
            alert("Log deleted successfully.");
            
            if (currentTdsDrawerData) {
                const { clientId, clientName, columnKey, taskName, period } = currentTdsDrawerData;
                
                // Fetch remaining logs to determine new status
                const { data: remainingLogs } = await supabaseClient
                    .from('task_history')
                    .select('*')
                    .eq('client_id', clientId)
                    .eq('task_type', 'TDS')
                    .eq('task_name', taskName)
                    .order('timestamp', { ascending: false });
                    
                let newStatus = 'Pending';
                if (remainingLogs && remainingLogs.length > 0) {
                    const latestLog = remainingLogs[0];
                    const match = latestLog.note.match(/Marked as (.*?)(?:\.|$)/);
                    if (match) {
                        newStatus = match[1];
                    }
                }
                
                // Update tds_tracking with the new status
                const updateData = {};
                updateData[columnKey] = newStatus;
                await supabaseClient.from('tds_tracking').update(updateData).eq('client_id', clientId).eq('period', period);
                
                // Refresh table and drawer
                await loadTDSCenterData();
                openTDSDrawer(clientId, clientName, columnKey, taskName, period, newStatus);
            }
        }
    }

    async function saveTDSTask() {
        const clientId = document.getElementById('tdsDrawerClientId').value;
        const period = document.getElementById('tdsDrawerPeriod').value;
        const columnKey = document.getElementById('tdsDrawerColumn').value;
        const note = document.getElementById('tdsDrawerNote').value.trim();
        const taskNameDisplay = document.getElementById('tdsDrawerTaskName').textContent;
        const transferTo = document.getElementById('tdsTransferUserSelect') ? document.getElementById('tdsTransferUserSelect').value : '';

        const btn = document.getElementById('saveTdsTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        const isTdsOverdue = window.isTdsPeriodOverdue(period);
        if (isTdsOverdue && columnKey !== 'return_filed_status' && !note) {
            alert("This TDS period is overdue. You must write a comment/note to save.");
            btn.innerHTML = ogHtml;
            return;
        }

        try {
            if (columnKey === 'Comment') {
                const taskName = taskNameDisplay.split(' - ')[0];
                let logNote = `[${taskNameDisplay}] ${note}`;
                if (taskName === "Comment") {
                    logNote = `[TDS Comment - ${period}] ${note}`;
                }

                const { error: logErr } = await supabaseClient.from('task_history').insert([{
                    client_id: clientId,
                    task_type: 'TDS',
                    task_name: taskName,
                    user_id: currentUser.id,
                    note: logNote,
                    timestamp: new Date().toISOString()
                }]);
                
                if (logErr) throw logErr;

                if (transferTo) {
                    await transferClientWorkflow(clientId, 'TDS Return', transferTo);
                    await supabaseClient.from('task_history').insert([{
                        client_id: clientId,
                        task_type: 'TDS',
                        task_name: taskName,
                        user_id: currentUser.id,
                        note: `[${taskNameDisplay}] Workflow transferred to ${globalTeamMembers.find(u => u.id === transferTo)?.name || 'selected user'}`,
                        timestamp: new Date().toISOString()
                    }]);
                }

                closeTDSDrawer();
                await loadTDSCenterData();
                return;
            }

            const isNil = document.getElementById('tdsDrawerNilReturn').checked;
            const newStatus = isNil ? 'NIL' : 'Done';

            const { data: existingRow, error: fetchErr } = await supabaseClient
                .from('tds_tracking')
                .select('client_id')
                .eq('client_id', clientId)
                .eq('period', period)
                .maybeSingle();
                
            if (fetchErr) throw fetchErr;

            let query;
            if (existingRow) {
                const updateData = {};
                updateData[columnKey] = newStatus;
                
                if (columnKey === 'return_filed_status' && newStatus === 'NIL') {
                    updateData['form_16_status'] = 'NIL';
                    updateData['billed_status'] = 'NIL';
                }
                
                query = supabaseClient.from('tds_tracking').update(updateData).eq('client_id', clientId).eq('period', period);
            } else {
                const insertData = { client_id: clientId, period: period };
                insertData[columnKey] = newStatus;
                
                if (columnKey === 'return_filed_status' && newStatus === 'NIL') {
                    insertData['form_16_status'] = 'NIL';
                    insertData['billed_status'] = 'NIL';
                }
                
                query = supabaseClient.from('tds_tracking').insert([insertData]);
            }

            const { error: saveErr } = await query;
            if (saveErr) throw saveErr;

            let logNote = `[${taskNameDisplay}] Marked as ${newStatus}.`;
            if (note) logNote += ` Remark: ${note}`;
            
            const taskName = taskNameDisplay.split(' - ')[0];
            const { error: logErr } = await supabaseClient.from('task_history').insert([{
                client_id: clientId,
                task_type: 'TDS',
                task_name: taskName,
                user_id: currentUser.id,
                note: logNote,
                timestamp: new Date().toISOString()
            }]);
            
            if (logErr) console.error("Error creating log:", logErr);

            if (transferTo) {
                await transferClientWorkflow(clientId, 'TDS Return', transferTo);
                await supabaseClient.from('task_history').insert([{
                    client_id: clientId,
                    task_type: 'TDS',
                    task_name: taskName,
                    user_id: currentUser.id,
                    note: `[${taskNameDisplay}] Workflow transferred to ${globalTeamMembers.find(u => u.id === transferTo)?.name || 'selected user'}`,
                    timestamp: new Date().toISOString()
                }]);
            }

            closeTDSDrawer();
            await loadTDSCenterData();

        } catch (error) {
            console.error("Error in saveTDSTask:", error);
            alert("Error saving task: " + error.message);
        } finally {
            btn.innerHTML = ogHtml;
        }
    }

    window.prepareTdsBill = async function(clientId, clientName, period) {
        const rate = window.globalTdsRatesMap[clientId] || 0;
        const confirmedRate = prompt(`Confirm rate for ${clientName} (Period: ${period}):`, rate);
        if (confirmedRate === null) return; // User cancelled
        
        const amount = parseFloat(confirmedRate);
        if (isNaN(amount)) return alert("Invalid amount!");

        try {
            if (amount === 0) {
                // Skip invoice generation
                const { error: updateErr } = await supabaseClient
                    .from('tds_tracking')
                    .update({ billed_status: 'NIL' })
                    .eq('client_id', clientId)
                    .eq('period', period);
                    
                if (updateErr) throw updateErr;
                alert("Task marked as completed with 0 rate (Free).");
            } else {
                const billNo = await window.getNextInvoiceNumber();
                const periodStr = period; 

                const { error } = await supabaseClient.from('invoices').insert([{ 
                    client_id: clientId, 
                    service_name: `TDS Return Fees - ${periodStr}`, 
                    amount: amount, 
                    status: 'Unpaid', 
                    bill_number: billNo, 
                    generated_date: new Date().toISOString() 
                }]);
                
                if (error) throw error;
                alert("Bill prepared successfully!");
                
                const { error: updateErr } = await supabaseClient
                    .from('tds_tracking')
                    .update({ billed_status: 'Done' })
                    .eq('client_id', clientId)
                    .eq('period', period);

    async function loadGSTCenterData() {
        const tbody = document.getElementById('gst-table-body');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading GST Data...</td></tr>';
        try {
            populateGSTMonths();
            await refreshGlobalCache();
            await fetchTeamMembers();
            
            const selectEl = document.getElementById('gstMonthFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';

            if (!selectedPeriod) throw new Error("Could not determine the selected month.");

            const { data: monthlyData, error: err1 } = await supabaseClient.from('gst_tracking').select('*').eq('period', selectedPeriod);
            if (err1) throw err1;
            globalGstTrackingData = monthlyData || [];

            const { data: r1Data } = await supabaseClient.from('gst_tracking').select('client_id, period').eq('is_gstr1', true);
            globalGstr1UptoMap = {};
            if (r1Data) {
                r1Data.forEach(row => {
                    if (!globalGstr1UptoMap[row.client_id] || row.period > globalGstr1UptoMap[row.client_id]) {
                        globalGstr1UptoMap[row.client_id] = row.period;
                    }
                });
            }

            const { data: r3bData } = await supabaseClient.from('gst_tracking').select('client_id, period').eq('is_gstr3b', true);
            globalGstr3bUptoMap = {};
            if (r3bData) {
                r3bData.forEach(row => {
                    if (!globalGstr3bUptoMap[row.client_id] || row.period > globalGstr3bUptoMap[row.client_id]) {
                        globalGstr3bUptoMap[row.client_id] = row.period;
                    }
                });
            }

            // Fetch free bills for GST
            window.globalGstFreeMap = {};
            const { data: freeLogs } = await supabaseClient
                .from('task_history')
                .select('client_id')
                .eq('task_type', 'GST')
                .ilike('note', `%[GST Free - ${selectedPeriod}]%`);
            
            if (freeLogs) {
                freeLogs.forEach(log => {
                    window.globalGstFreeMap[log.client_id] = true;
                });
            }

            const [y, m] = selectedPeriod.split('-');
            const displayPeriod = getDeterministicShortPeriod(selectedPeriod);
            const remarkTag = `[General Remarks - ${displayPeriod}]`;

            const { data: remarkLogs } = await supabaseClient
                .from('task_logs')
                .select('client_id, note')
                .or(`note.ilike.%${remarkTag}%,note.ilike.%[Data Received - ${displayPeriod}]%,note.ilike.%[Excel / Tally - ${displayPeriod}]%,note.ilike.%[Checked 2B - ${displayPeriod}]%`)
                .order('timestamp', { ascending: false });
            
            globalLatestRemarksMap = {};
            globalDataReceivedMap = {}; 
            globalNilReturnMap = {}; // New Map

            if (remarkLogs) {
                remarkLogs.forEach(log => {
                    const cleanNote = log.note.substring(log.note.indexOf(']') + 1).trim();
                    if (log.note.includes('[General Remarks')) {
                        if (!globalLatestRemarksMap[log.client_id]) {
                            let noteText = cleanNote.replace(/^(Note:|Additional Note:)\s*/i, '');
                            globalLatestRemarksMap[log.client_id] = noteText;
                        }
                    } else if (log.note.includes('[Data Received')) {
                        if (!globalDataReceivedMap[log.client_id]) {
                            const dateMatch = cleanNote.match(/\(Received on: (.*?)\)/);
                            if (dateMatch) {
                                globalDataReceivedMap[log.client_id] = dateMatch[1];
                            }
                        }
                    } else if (log.note.includes('[Excel / Tally') && log.note.includes('[NIL]')) {
                        globalNilReturnMap[log.client_id + '_is_excel'] = true;
                    } else if (log.note.includes('[Checked 2B') && log.note.includes('[NIL]')) {
                        globalNilReturnMap[log.client_id + '_is_2b'] = true;
                    }
                });
            }

            // Fetch persistent client remarks
            const { data: clientRemarks } = await supabaseClient
                .from('task_logs')
                .select('client_id, note')
                .ilike('note', '[GST Client Remark]%')
                .order('timestamp', { ascending: false });

            window.globalClientRemarksMap = {};
            if (clientRemarks) {
                clientRemarks.forEach(log => {
                    if (!window.globalClientRemarksMap[log.client_id]) {
                        const cleanNote = log.note.replace('[GST Client Remark]', '').trim();
                        window.globalClientRemarksMap[log.client_id] = cleanNote;
                    }
                });
            }

            // Filter clients based on Page Visibility Settings
            const { data: visSettings } = await supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-gst-center').single();
            const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : ['GST'];
            
            globalGstClients = globalClientsList.filter(c => {
                if (!c.standard_services) return false;
                const clientServices = c.standard_services.split(',').map(s => s.trim().toLowerCase());
                return allowedServices.some(as => clientServices.includes(as.toLowerCase()));
            });

            // Fetch invoices to check if bill prepared
            const { data: invoices } = await supabaseClient.from('invoices').select('client_id, generated_date, service_name, status').ilike('service_name', '%GST%');
            window.globalGstBilledMap = {};
            
            const currentMonth = parseInt(m);
            const currentYear = parseInt(y);
            
            const nextMonth = currentMonth === 12 ? 1 : currentMonth + 1;
            const nextYear = currentMonth === 12 ? currentYear + 1 : currentYear;
            const nextPeriodStr = `${nextYear}-${nextMonth.toString().padStart(2, '0')}`;

            // Format selectedPeriod to "Month YYYY" for description check
            const selectedPeriodFormatted = getDeterministicLongPeriod(selectedPeriod);

            if (invoices) {
                invoices.forEach(inv => {
                    if (inv.status === 'Cancelled') return; // Skip Cancelled invoices
                    if (inv.service_name && inv.service_name.includes("GST Return Fees - ")) {
                        // New format bill! Strict check on description!
                        if (inv.service_name.includes(selectedPeriodFormatted)) {
                            window.globalGstBilledMap[inv.client_id] = true;
                        }
                    } else {
                        // Older bills or manual bills
                        if (inv.service_name && inv.service_name.includes(selectedPeriodFormatted)) {
                            window.globalGstBilledMap[inv.client_id] = true;
                        } else if (inv.generated_date) {
                            const invDate = new Date(inv.generated_date);
                            const invMonthStr = `${invDate.getFullYear()}-${(invDate.getMonth() + 1).toString().padStart(2, '0')}`;
                            
                            if (invMonthStr === selectedPeriod || invMonthStr === nextPeriodStr) {
                                window.globalGstBilledMap[inv.client_id] = true;
                            }
                        }
                    }
                });
            }

            // Fetch rates for view-gst-center
            const { data: rateLogs } = await supabaseClient.from('task_logs')
                .select('note')
                .ilike('note', `[PAGE_RATE] view-gst-center%`)
                .order('timestamp', { ascending: false });
            window.globalGstRatesMap = {};
            if (rateLogs) {
                rateLogs.forEach(log => {
                    const parts = log.note.split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[1];
                        const rate = parts[2];
                        if (window.globalGstRatesMap[clientId] === undefined) window.globalGstRatesMap[clientId] = rate;
                    }
                });
            }

            // Fetch today's updates to check for acknowledgement status
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const { data: todayLogs } = await supabaseClient
                .from('task_logs')
                .select('client_id, note')
                .eq('user_id', currentUser.id)
                .gte('timestamp', todayStart.toISOString());
            
            window.globalGstUpdatedTodayMap = {};
            if (todayLogs) {
                todayLogs.forEach(l => {
                    // Any GST activity today (comment, update, acknowledge) = acknowledged
                    window.globalGstUpdatedTodayMap[l.client_id] = true;
                });
            }

            renderFilteredGSTTable();

        } catch (error) {
            console.error("GST Load Error:", error);
            tbody.innerHTML = `<tr><td colspan="12" class="text-center py-8 text-red-500 font-bold bg-red-50 border border-red-200 rounded-lg">Error loading data: ${error.message}</td></tr>`;
        }
    }

    window.promptCancelGstBill = async function(clientId, clientName, period, isFree) {
        if (!confirm(`Are you sure you want to cancel the billing status for ${clientName} (Period: ${period})?\n\nThis will mark the bill as Cancelled and let you generate a new bill if needed.`)) {
            return;
        }

        const reason = prompt("Please enter the reason for cancellation (required):");
        if (reason === null) return; // User cancelled
        if (!reason.trim()) {
            alert("A reason is required to cancel the billing status.");
            return;
        }

        try {
            if (isFree) {
                // Remove free billing log from task_history
                const { error: delErr } = await supabaseClient.from('task_history')
                    .delete()
                    .eq('client_id', clientId)
                    .eq('task_type', 'GST')
                    .ilike('note', `%[GST Free - ${period}]%`);
                
                if (delErr) throw delErr;
            } else {
                // Find and cancel matching active invoices
                const { data: invoices } = await supabaseClient.from('invoices')
                    .select('*')
                    .eq('client_id', clientId)
                    .neq('status', 'Cancelled');
                
                if (invoices && invoices.length > 0) {
                    const selectedPeriodFormatted = getDeterministicLongPeriod(period);
                    const [yStr, mStr] = period.split('-');
                    const mVal = parseInt(mStr);
                    const yVal = parseInt(yStr);
                    const nextMonth = mVal === 12 ? 1 : mVal + 1;
                    const nextYear = mVal === 12 ? yVal + 1 : yVal;
                    const nextPeriodStr = `${nextYear}-${nextMonth.toString().padStart(2, '0')}`;

                    const matchingInvoices = invoices.filter(inv => {
                        if (inv.service_name && inv.service_name.includes("GST Return Fees - ")) {
                            return inv.service_name.includes(selectedPeriodFormatted);
                        } else {
                            if (inv.service_name && inv.service_name.includes(selectedPeriodFormatted)) {
                                return true;
                            } else if (inv.generated_date) {
                                const invDate = new Date(inv.generated_date);
                                const invMonthStr = `${invDate.getFullYear()}-${(invDate.getMonth() + 1).toString().padStart(2, '0')}`;
                                return invMonthStr === period || invMonthStr === nextPeriodStr;
                            }
                        }
                        return false;
                    });

                    if (matchingInvoices.length > 0) {
                        const pkColumn = (invoices[0].invoice_id !== undefined) ? 'invoice_id' : 'id';
                        const idsToCancel = matchingInvoices.map(inv => inv[pkColumn]);
                        
                        const { error: invErr } = await supabaseClient.from('invoices')
                            .update({ status: 'Cancelled' })
                            .in(pkColumn, idsToCancel);
                        
                        if (invErr) throw invErr;
                    }
                }
            }

            // Record log in task_history
            const { error: logErr } = await supabaseClient.from('task_history').insert([{
                client_id: clientId,
                task_type: 'GST',
                task_name: 'Billing Cancelled',
                user_id: currentUser.id,
                note: `[GST Billing Cancelled - ${period}] Reason: ${reason}`,
                timestamp: new Date().toISOString()
            }]);
            
            if (logErr) throw logErr;

            alert("Billing status cancelled and logged successfully.");
            loadGSTCenterData(); // Refresh GST Center view
        } catch (err) {
            alert("Error cancelling bill: " + err.message);
        }
    }

    function getQuarterMonthIndex(periodStr) {
        if (!periodStr) return 0;
        const [y, mStr] = periodStr.split('-');
        const month = parseInt(mStr);
        const rem = month % 3;
        if (rem === 1) return 1; // Month 1 of Quarter (Apr, Jul, Oct, Jan)
        if (rem === 2) return 2; // Month 2 of Quarter (May, Aug, Nov, Feb)
        return 3; // Month 3 of Quarter (Jun, Sep, Dec, Mar)
    }

    function renderFilteredGSTTable() {
        // 1. Get Values from Text Search
        const searchEl = document.getElementById('gstSearchInput');
        const query = searchEl ? searchEl.value.toLowerCase() : '';

        // 2. Get Values from Dropdown Filters
        const safeVal = (id) => document.getElementById(id) ? document.getElementById(id).value : 'all';
        const fR1Upto = safeVal('filter_gstr1_upto');
        const fR3bUpto = safeVal('filter_gstr3b_upto');
        const fCall = safeVal('filter_is_call');
        const fData = safeVal('filter_is_data');
        const fExcel = safeVal('filter_is_excel');
        const fGstr1 = safeVal('filter_is_gstr1');
        const f2b = safeVal('filter_is_2b');
        const fSend2b = safeVal('filter_is_send_2b');
        const fGstr3b = safeVal('filter_is_gstr3b');
        const fRemark = safeVal('filter_remark');
        const fBillPrepared = safeVal('filter_is_bill_prepared');
        
        // NEW: Get the Assignment Filter
        const assignFilter = document.getElementById('gstAssignFilter') ? document.getElementById('gstAssignFilter').value : 'all';
        // NEW: Get the Filing Frequency Filter
        const fFreq = document.getElementById('gstFrequencyFilter') ? document.getElementById('gstFrequencyFilter').value : 'all';

        let filteredClients = globalGstClients;

        // NEW: Find which clients are assigned to the logged-in user for GST
        const myGstClients = (window.globalAssignmentsList || [])
            .filter(a => a.service_type && a.service_type.toLowerCase().includes('gst') && a.maker_id === currentUser.id)
            .map(a => a.client_id);

        // 3. APPLY FILTERS
        filteredClients = filteredClients.filter(client => {
            // Kick out clients that aren't yours if "My Clients" is selected
            if (assignFilter === 'mine' && !myGstClients.includes(client.client_id)) return false;

            // Apply Filing Frequency Filter
            const freq = client.gst_frequency || 'Monthly';
            if (fFreq !== 'all' && freq !== fFreq) return false;

            if (query && !client.display_name.toLowerCase().includes(query)) return false;

            const t = globalGstTrackingData.find(row => row.client_id === client.client_id) || {};

            if (fR1Upto === 'has' && !globalGstr1UptoMap[client.client_id]) return false;
            if (fR1Upto === 'none' && globalGstr1UptoMap[client.client_id]) return false;

            if (fR3bUpto === 'has' && !globalGstr3bUptoMap[client.client_id]) return false;
            if (fR3bUpto === 'none' && globalGstr3bUptoMap[client.client_id]) return false;

            if (fCall === 'done' && !t.is_call) return false;
            if (fCall === 'pending' && t.is_call) return false;

            if (fData === 'done' && !t.is_data) return false;
            if (fData === 'pending' && t.is_data) return false;

            if (fExcel === 'done' && !t.is_excel) return false;
            if (fExcel === 'pending' && t.is_excel) return false;

            if (fGstr1 === 'done' && !t.is_gstr1) return false;
            if (fGstr1 === 'pending' && t.is_gstr1) return false;

            if (f2b === 'done' && !t.is_2b) return false;
            if (f2b === 'pending' && t.is_2b) return false;

            if (fSend2b === 'done' && !t.is_send_2b) return false;
            if (fSend2b === 'pending' && t.is_send_2b) return false;

            if (fGstr3b === 'done' && !t.is_gstr3b) return false;
            if (fGstr3b === 'pending' && t.is_gstr3b) return false;

            const hasRemark = !!globalLatestRemarksMap[client.client_id];
            if (fRemark === 'has' && !hasRemark) return false;
            if (fRemark === 'none' && hasRemark) return false;

            const isBilled = !!((window.globalGstBilledMap && window.globalGstBilledMap[client.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id]));
            if (fBillPrepared === 'done' && !isBilled) return false;
            if (fBillPrepared === 'pending' && isBilled) return false;

            return true;
        });

        // 4. APPLY SORTING
        filteredClients.sort((a, b) => {
            let valA, valB;
            const tA = globalGstTrackingData.find(row => row.client_id === a.client_id) || {};
            const tB = globalGstTrackingData.find(row => row.client_id === b.client_id) || {};

            if (gstSortCol === 'display_name') {
                valA = a.display_name.toLowerCase(); valB = b.display_name.toLowerCase();
            } else if (gstSortCol === 'gstr1_upto') {
                valA = globalGstr1UptoMap[a.client_id] || ''; valB = globalGstr1UptoMap[b.client_id] || '';
            } else if (gstSortCol === 'gstr3b_upto') {
                valA = globalGstr3bUptoMap[a.client_id] || ''; valB = globalGstr3bUptoMap[b.client_id] || '';
            } else if (['is_call', 'is_data', 'is_excel', 'is_gstr1', 'is_2b', 'is_send_2b', 'is_gstr3b', 'is_bill_prepared'].includes(gstSortCol)) {
                if (gstSortCol === 'is_bill_prepared') {
                    const billedA = !!((window.globalGstBilledMap && window.globalGstBilledMap[a.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[a.client_id]));
                    const billedB = !!((window.globalGstBilledMap && window.globalGstBilledMap[b.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[b.client_id]));
                    valA = billedA ? 1 : 0; valB = billedB ? 1 : 0;
                } else {
                    valA = tA[gstSortCol] ? 1 : 0; valB = tB[gstSortCol] ? 1 : 0;
                }
            } else if (gstSortCol === 'remark') {
                valA = globalLatestRemarksMap[a.client_id] ? 1 : 0; valB = globalLatestRemarksMap[b.client_id] ? 1 : 0;
            }

            if (valA < valB) return gstSortAsc ? -1 : 1;
            if (valA > valB) return gstSortAsc ? 1 : -1;
            return 0;
        });

        updateGstSortIcons();

        // 5. RENDER TABLE
        const tbody = document.getElementById('gst-table-body');
        tbody.innerHTML = '';

        if (filteredClients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-500">No GST clients match the current filters.</td></tr>';
            return;
        }

        const selectedPeriod = document.getElementById('gstMonthFilter').value;
        const qMonthIdx = getQuarterMonthIndex(selectedPeriod);
        
        let pendingData = 0;
        let pendingGst1 = 0;
        let pendingGst3b = 0;

        const formatUpto = (periodStr) => {
            if (!periodStr) return '<span class="text-gray-300 text-xs font-bold uppercase">-</span>';
            const [y, m] = periodStr.split('-');
            const d = new Date(y, parseInt(m) - 1, 1);
            return `<span class="text-indigo-700 font-bold text-xs bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100 whitespace-nowrap">${d.toLocaleDateString('en-IN', {month:'short', year:'2-digit'})}</span>`;
        };

        filteredClients.forEach((client, index) => {
            const trackRecord = globalGstTrackingData.find(t => t.client_id === client.client_id) || {};
            const freq = client.gst_frequency || 'Monthly';
            const isQuarterly = freq === 'Quarterly';
            
            if (!trackRecord.is_data) pendingData++;
            
            // Increment GSTR-1 pending count if Monthly, or if Month 3 of Quarter for Quarterly clients
            if (!trackRecord.is_gstr1) {
                if (!isQuarterly || qMonthIdx === 3) {
                    pendingGst1++;
                }
            }
            
            // Increment GSTR-3B pending count if Monthly, or if Month 3 of Quarter for Quarterly clients
            if (!trackRecord.is_gstr3b) {
                if (!isQuarterly || qMonthIdx === 3) {
                    pendingGst3b++;
                }
            }

            const gstr1Display = formatUpto(globalGstr1UptoMap[client.client_id]);
            const gstr3bDisplay = formatUpto(globalGstr3bUptoMap[client.client_id]);
            
            // Find assignee
            let assigneeName = 'Unassigned';
            if (window.globalAssignmentsList) {
                const assignment = window.globalAssignmentsList.find(a => a.client_id === client.client_id && a.service_type && a.service_type.toLowerCase().includes('gst'));
                if (assignment && assignment.maker_id) {
                    const user = globalTeamMembers.find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }
            }
            const assigneeBadge = assigneeName !== 'Unassigned' ? `<div class="mt-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${assigneeName}</div>` : '';
            
            const freqBadge = freq === 'Quarterly' ? 
                `<div class="mt-1 ml-1.5 px-1.5 py-0.5 bg-purple-50 text-purple-700 border border-purple-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-arrows-spin scale-75"></i>QRMP</div>` : 
                `<div class="mt-1 ml-1.5 px-1.5 py-0.5 bg-blue-50 text-blue-700 border border-blue-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-calendar-day scale-75"></i>Monthly</div>`;

            const safeName = client.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            const getCell = (isDone, type, name) => {
                if (isDone) {
                    return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openGSTDrawer('${client.client_id}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200"><div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div></button></td>`;
                } else {
                    return `<td class="px-1 py-3 text-center border-l border-gray-100"><button onclick="openGSTDrawer('${client.client_id}', '${safeName}', '${type}', '${name}', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;
                }
            };

            // Custom GSTR-1 cell for IFF optional filing support
            let gstr1Cell = '';
            if (isQuarterly && (qMonthIdx === 1 || qMonthIdx === 2)) {
                if (trackRecord.is_gstr1) {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed IFF', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-emerald-100 transition cursor-pointer border border-emerald-200 bg-emerald-50 shadow-sm mx-auto max-w-[85px]">
                            <span class="text-[9px] font-black text-emerald-600 px-1 py-0.5 rounded flex items-center gap-0.5"><i class="fa-solid fa-circle-check"></i> IFF Filed</span>
                        </button>
                    </td>`;
                } else {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed IFF (Optional)', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-indigo-500 hover:text-indigo-700 transition flex items-center justify-center border border-dashed border-indigo-200 bg-indigo-50/30 cursor-pointer shadow-sm mx-auto max-w-[85px]" title="Optional Invoice Furnishing Facility (IFF) for B2B invoices">
                            <span class="text-[9px] font-bold tracking-tight">IFF (Optional)</span>
                        </button>
                    </td>`;
                }
            } else {
                const qLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-bold text-indigo-500 uppercase tracking-widest block scale-90 -mt-1 leading-none">Qtr Due</span>' : '';
                const qDoneLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-widest block scale-90 -mt-0.5 leading-none">Qtr</span>' : '';
                
                if (trackRecord.is_gstr1) {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed GSTR-1', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>
                            ${qDoneLabel}
                        </button>
                    </td>`;
                } else {
                    gstr1Cell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr1', 'Filed GSTR-1', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex flex-col items-center justify-center border border-transparent hover:border-indigo-200 cursor-pointer">
                            <i class="fa-solid fa-check text-sm"></i>
                            ${qLabel}
                        </button>
                    </td>`;
                }
            }

            // Custom GSTR-3B cell for QRMP support
            let gstr3bCell = '';
            if (isQuarterly && (qMonthIdx === 1 || qMonthIdx === 2)) {
                gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-slate-50/50">
                    <div class="w-full h-8 flex items-center justify-center">
                        <span class="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/80 cursor-not-allowed select-none whitespace-nowrap tracking-wide leading-none" title="Quarterly taxpayer: GSTR-3B is not due in Month 1 & Month 2 of standard quarters.">QRMP (N/A)</span>
                    </div>
                </td>`;
            } else {
                const qLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-bold text-indigo-500 uppercase tracking-widest block scale-90 -mt-1 leading-none">Qtr Due</span>' : '';
                const qDoneLabel = (isQuarterly && qMonthIdx === 3) ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-widest block scale-90 -mt-0.5 leading-none">Qtr</span>' : '';

                if (trackRecord.is_gstr3b) {
                    gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-emerald-50/20">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr3b', 'Filed GSTR-3B', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>
                            ${qDoneLabel}
                        </button>
                    </td>`;
                } else {
                    gstr3bCell = `<td class="px-1 py-3 text-center border-l border-gray-100">
                        <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_gstr3b', 'Filed GSTR-3B', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex flex-col items-center justify-center border border-transparent hover:border-indigo-200 cursor-pointer">
                            <i class="fa-solid fa-check text-sm"></i>
                            ${qLabel}
                        </button>
                    </td>`;
                }
            }

            const latestRemarkText = globalLatestRemarksMap[client.client_id];
            let remarkHtml = '';
            
            if (latestRemarkText) {
                const safeRemark = latestRemarkText.replace(/"/g, '&quot;');
                remarkHtml = `<td class="px-2 py-2 border-l border-gray-100 bg-gray-50/50 align-top">
                                <div onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'general_remark', 'General Remarks', '${selectedPeriod}', false)" class="w-full min-h-[32px] text-xs font-medium text-gray-600 text-left p-1.5 rounded hover:bg-white cursor-pointer border border-transparent hover:border-gray-300 shadow-sm leading-tight line-clamp-2 transition" title="${safeRemark}">${latestRemarkText}</div>
                              </td>`;
            } else {
                remarkHtml = `<td class="px-1 py-3 text-center border-l border-gray-100 bg-gray-50/50 align-top">
                                <button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'general_remark', 'General Remarks', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-white text-gray-400 hover:text-indigo-600 transition flex items-center justify-center border border-transparent hover:border-gray-300 shadow-sm"><i class="fa-regular fa-comment-dots text-sm"></i></button>
                              </td>`;
            }

            let ackCheckboxHtml = '';
            const isGstOverdue = window.isGstPeriodOverdue(selectedPeriod);
            // Show Acknowledge for any client where GST work is still pending (3B not filed or billing not done)
            const gstBilledDone = trackRecord.billed_status === 'Done' || trackRecord.billed_status === 'NIL';
            const gstPendingWork = !trackRecord.is_gstr3b || !gstBilledDone;
            if (gstPendingWork && !isGstOverdue) {
                const isUpdatedToday = !!window.globalGstUpdatedTodayMap[client.client_id];
                if (isUpdatedToday) {
                    ackCheckboxHtml = `
                        <span onclick="event.stopPropagation()" class="mt-1 ml-1.5 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-square-check scale-75"></i>Checked</span>
                    `;
                } else {
                    ackCheckboxHtml = `
                        <button onclick="acknowledgeGstToday('${client.client_id}', '${selectedPeriod}', event)" class="mt-1 ml-1.5 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition"><i class="fa-regular fa-square scale-75"></i>Acknowledge</button>
                    `;
                }
            }

            tbody.innerHTML += `
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                <td class="px-2 py-3 text-center text-xs text-gray-400 font-mono">${index + 1}</td>
                <td onclick="openUniversalClientProfile('${client.client_id}')" class="px-3 py-3 font-bold text-gray-800 text-[13px] leading-tight cursor-pointer hover:text-indigo-600 transition group">
                    <span class="border-b border-transparent group-hover:border-indigo-300">${client.display_name}</span> 
                    ${assigneeBadge}
                    ${freqBadge}
                    ${ackCheckboxHtml}
                    <br><input type="text" class="text-[12px] font-normal text-gray-600 border border-gray-200 rounded p-1 w-full mt-1 focus:ring-2 focus:ring-indigo-500 outline-none" value="${window.globalClientRemarksMap[client.client_id] || ''}" onblur="saveClientRemark('${client.client_id}', this.value)" onclick="event.stopPropagation()" placeholder="Add remark...">
                    <br><span class="text-[9px] font-normal text-gray-400 uppercase tracking-wider">${client.entity_type || ''}</span>
                </td>
                <td class="px-2 py-3 text-center bg-indigo-50/20 w-[1%] whitespace-nowrap border-r border-white">${gstr1Display}</td>
                <td class="px-2 py-3 text-center bg-indigo-50/20 w-[1%] whitespace-nowrap">${gstr3bDisplay}</td>
                ${getCell(trackRecord.is_call, 'is_call', 'Call / WhatsApp')}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_data ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_data', 'Data Received', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 whitespace-nowrap">${globalDataReceivedMap[client.client_id] || 'DONE'}</span>
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_data', 'Data Received', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_excel ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_excel', 'Excel / Tally', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            ${globalNilReturnMap[client.client_id + '_is_excel'] ? 
                                  `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span>` : 
                                `<div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>`
                            }
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_excel', 'Excel / Tally', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                ${gstr1Cell}
                ${getCell(trackRecord.is_send_2b, 'is_send_2b', 'Sent 2B')}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${trackRecord.is_2b ? 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_2b', 'Checked 2B', '${selectedPeriod}', true)" class="w-full h-8 flex flex-col items-center justify-center rounded hover:bg-emerald-50 transition cursor-pointer border border-transparent hover:border-emerald-200">
                            ${globalNilReturnMap[client.client_id + '_is_2b'] ? 
                                `<span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span>` : 
                                `<div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-xs"></i></div>`
                            }
                         </button>` : 
                        `<button onclick="openGSTDrawer('${client.client_id}', '${safeName}', 'is_2b', 'Checked 2B', '${selectedPeriod}', false)" class="w-full h-8 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200">
                            <i class="fa-solid fa-check text-sm"></i>
                         </button>`
                    }
                </td>
                ${gstr3bCell}
                <td class="px-1 py-3 text-center border-l border-gray-100">
                    ${(window.globalGstBilledMap && window.globalGstBilledMap[client.client_id]) || (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id]) ? 
                        (window.globalGstFreeMap && window.globalGstFreeMap[client.client_id] ?
                            `<button onclick="promptCancelGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}', true)" class="w-full h-8 flex items-center justify-center rounded hover:bg-red-50 text-blue-600 hover:text-red-600 transition" title="Click to cancel free billing"><div class="w-6 h-6 rounded-full bg-blue-100 text-current flex items-center justify-center shadow-sm border border-blue-200 text-[10px] font-bold">NIL</div></button>` :
                            `<button onclick="promptCancelGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}', false)" class="w-full h-8 flex items-center justify-center rounded hover:bg-red-50 text-blue-600 hover:text-red-600 transition" title="Click to cancel billing"><div class="w-6 h-6 rounded-full bg-blue-100 text-current flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-xs"></i></div></button>`
                        ) : 
                        (trackRecord.is_gstr3b ? 
                            `<button onclick="prepareGstBill('${client.client_id}', '${safeName}', '${selectedPeriod}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-1 rounded text-xs font-bold transition shadow-sm">Bill</button>` : 
                            `<div class="w-full h-8"></div>`
                        )
                    }
                </td>
                ${remarkHtml}
            </tr>`;
