    async function openGSTDrawer(clientId, clientName, columnKey, taskName, period, isDone) {
        try {
            document.getElementById('gstDrawerClientId').value = clientId;
            document.getElementById('gstDrawerPeriod').value = period;
            document.getElementById('gstDrawerColumn').value = columnKey;
            currentGstTaskIsDone = isDone;

            if (document.getElementById('gstDrawerFrequencySelect')) {
                const clientObj = (window.globalAllClientsList || globalClientsList || []).find(c => c.client_id === clientId);
                const currentFreq = clientObj ? clientObj.gst_frequency || 'Monthly' : 'Monthly';
                document.getElementById('gstDrawerFrequencySelect').value = currentFreq;
            }

            document.getElementById('gstDrawerClientName').innerText = clientName;
            
            const displayPeriod = getDeterministicShortPeriod(period);
            const taskNameDisplay = `${taskName} - ${displayPeriod}`;
            
            document.getElementById('gstDrawerTaskName').textContent = taskNameDisplay;
            document.getElementById('gstDrawerNote').value = '';
            await setTransferDropdownOptions('gstTransferUserSelect');

            const dateDiv = document.getElementById('gstDrawerFilingDateDiv');
            const dateLabel = document.getElementById('gstDrawerFilingDateLabel');
            const nilDiv = document.getElementById('gstDrawerNilReturnDiv');
            const nilCheck = document.getElementById('gstDrawerNilReturn');

            if (nilCheck) nilCheck.checked = false;

            if ((columnKey === 'is_gstr1' || columnKey === 'is_gstr3b' || columnKey === 'is_data') && !isDone) {
                dateDiv.classList.remove('hidden');
                if (columnKey === 'is_data') {
                    dateLabel.innerHTML = '<i class="fa-solid fa-calendar-check mr-1"></i> Date Data Received *';
                } else {
                    dateLabel.innerHTML = '<i class="fa-solid fa-calendar-day mr-1"></i> Date of Filing *';
                }
                document.getElementById('gstDrawerFilingDate').value = new Date().toISOString().split('T')[0]; 
            } else {
                dateDiv.classList.add('hidden');
            }

            if ((columnKey === 'is_excel' || columnKey === 'is_2b') && !isDone) {
                if (nilDiv) nilDiv.classList.remove('hidden');
            } else {
                if (nilDiv) nilDiv.classList.add('hidden');
            }

            const btnNote = document.getElementById('saveNoteOnlyBtn');
            const btnDone = document.getElementById('saveGstTaskBtn');

            if (columnKey === 'general_remark' || isDone) {
                btnDone.classList.add('hidden');
                btnNote.classList.remove('sm:w-1/2', 'flex-1');
                btnNote.classList.add('w-full');
            } else {
                btnDone.classList.remove('hidden');
                btnNote.classList.remove('w-full');
                btnNote.classList.add('flex-1');
            }

            document.getElementById('gstTaskDrawer').classList.remove('hidden');

            const tl = document.getElementById('gstDrawerHistoryTimeline');
            tl.innerHTML = '<div class="text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading specific history...</div>';
            
            console.log("openGSTDrawer called for client:", clientId, "period:", period, "displayPeriod:", displayPeriod, "taskNameDisplay:", taskNameDisplay);

            const { data: logs, error: queryErr } = await supabaseClient
                .from('task_logs')
                .select('*, users(name)')
                .eq('client_id', clientId)
                .is('task_id', null)
                .order('timestamp', { ascending: false });

            if (queryErr) {
                console.error("Error fetching task_logs:", queryErr);
                alert("Error loading history: " + queryErr.message);
            }
            
            console.log("Fetched logs:", logs);

            tl.innerHTML = '';
            
            const specificLogs = logs ? logs.filter(log => isLogMatchingTask(log.note, taskName, displayPeriod)) : [];
            
            if (specificLogs.length > 0) {
                let htmlStr = '';
                specificLogs.forEach(log => {
                    const d = new Date(log.timestamp).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                    
                    let cleanNote = log.note || '';
                    cleanNote = cleanNote.replace(/^GST\s+Action\s+Completed:\s*/i, '');
                    cleanNote = cleanNote.replace(/^GST\s+Action\s*/i, '');
                    cleanNote = cleanNote.replace(/^\[[^\]]+\]\s*/, '');
                    cleanNote = cleanNote.replace(/^:\s*/, '');
                    
                    htmlStr += `
                    <div class="bg-white rounded-xl border border-gray-200 mb-3 shadow-sm overflow-hidden border-l-4 border-l-indigo-400">
                        <div class="px-4 py-2 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                            <span class="text-xs font-bold text-gray-500 uppercase">${d}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-indigo-600 uppercase">${log.users?.name || 'System'}</span>
                                <button onclick="deleteGSTLog('${log.log_id}', '${clientId}', '${columnKey}', '${period}')" class="text-gray-400 hover:text-red-500 transition cursor-pointer p-1" title="Delete & Revert Status">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                        <div class="p-4"><p class="text-sm text-gray-700">${cleanNote}</p></div>
                    </div>`;
                });
                tl.innerHTML = htmlStr;
            } else {
                tl.innerHTML = '<div class="text-sm text-gray-400 py-2">No history logged for this specific task yet.</div>';
            }
        } catch (err) {
            console.error("Open Drawer Error:", err);
            alert("System Error: Could not open the drawer. Please refresh the page and try again. (" + err.message + ")");
        }
    }

    async function deleteGSTLog(logId, clientId, columnKey, period) {
        if (!confirm("Are you sure you want to delete this log? If this was a completion record, the task status will be reverted to PENDING.")) return;
        
        try {
            // 1. Delete the log
            const { error: delErr } = await supabaseClient.from('task_logs').delete().eq('log_id', logId);
            if (delErr) throw delErr;

            // 2. Revert the status in gst_tracking (only if it's a specific task column)
            if (columnKey !== 'general_remark') {
                let updatePayload = {};
                updatePayload[columnKey] = false;
                await supabaseClient.from('gst_tracking').update(updatePayload).eq('client_id', clientId).eq('period', period);
            }

            // 3. Refresh
            // We need the client name for the drawer re-open
            const clientName = document.getElementById('gstDrawerClientName').innerText;
            const taskName = document.getElementById('gstDrawerTaskName').textContent.split(' - ')[0];
            
            closeGSTDrawer();
            openGSTDrawer(clientId, clientName, columnKey, taskName, period, false); 
            loadGSTCenterData(); // Refresh the main table

        } catch (err) {
            console.error("Delete Log Error:", err);
            alert("Error: " + err.message);
        }
    }

    async function saveGSTTask() {
        const clientId = document.getElementById('gstDrawerClientId').value;
        const period = document.getElementById('gstDrawerPeriod').value;
        const columnKey = document.getElementById('gstDrawerColumn').value;
        const note = document.getElementById('gstDrawerNote').value.trim();
        const taskNameDisplay = document.getElementById('gstDrawerTaskName').textContent;
        const transferTo = document.getElementById('gstTransferUserSelect') ? document.getElementById('gstTransferUserSelect').value : '';

        const btn = document.getElementById('saveGstTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        const isGstOverdue = window.isGstPeriodOverdue(period);
        if (isGstOverdue) {
            if (columnKey !== 'is_gstr3b' && !note) {
                alert("This GST period is overdue. You must write a comment/note to save.");
                btn.innerHTML = ogHtml;
                return;
            }
        }

        try {
            let filingDateStr = "";
            if (columnKey === 'is_gstr1' || columnKey === 'is_gstr3b' || columnKey === 'is_data') {
                const fDate = document.getElementById('gstDrawerFilingDate').value;
                if (!fDate) throw new Error("Please select the date.");
                const prefix = columnKey === 'is_data' ? 'Received' : 'Filed';
                filingDateStr = ` (${prefix} on: ${new Date(fDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})})`;
            }

            if (columnKey === 'is_excel' || columnKey === 'is_2b') {
                const isNil = document.getElementById('gstDrawerNilReturn').checked;
                if (isNil) filingDateStr += " [NIL]";
            }

            const { data: existingRow, error: fetchErr } = await supabaseClient.from('gst_tracking').select('client_id').eq('client_id', clientId).eq('period', period).maybeSingle();
            if (fetchErr) throw fetchErr;
            
            let updatePayload = {};
            updatePayload[columnKey] = true;

            if (existingRow) {
                const { error: updErr } = await supabaseClient.from('gst_tracking').update(updatePayload).eq('client_id', clientId).eq('period', period);
                if (updErr) throw updErr;
            } else {
                updatePayload['client_id'] = clientId;
                updatePayload['period'] = period;
                const { error: insErr } = await supabaseClient.from('gst_tracking').insert([updatePayload]);
                if (insErr) throw insErr;
            }

            let historyNote = "";
            if (currentGstTaskIsDone) {
                historyNote = note ? `[${taskNameDisplay}] Additional Note: ${note}${filingDateStr}` : `[${taskNameDisplay}] Task reviewed${filingDateStr}`;
            } else {
                historyNote = note ? `[${taskNameDisplay}] ${note}${filingDateStr}` : `[${taskNameDisplay}] Marked as completed${filingDateStr}`;
            }
            
            await supabaseClient.from('task_logs').insert([{ client_id: clientId, user_id: currentUser.id, note: historyNote }]);
            if (transferTo) {
                await transferClientWorkflow(clientId, 'GST', transferTo);
                await supabaseClient.from('task_logs').insert([{
                    client_id: clientId,
                    user_id: currentUser.id,
                    note: `[GST] Workflow transferred to ${globalTeamUsers.find(u => u.id === transferTo)?.name || 'selected user'}`
                }]);
            }

            closeGSTDrawer();
            btn.innerHTML = ogHtml;
            loadGSTCenterData();

        } catch (err) {
            console.error("Save Task Error:", err);
            alert("Error saving data: " + err.message);
            btn.innerHTML = ogHtml;
        }
    }

    let globalTeamUsersAllocation = [];

    async function openTeamAllocation(clientId, clientName) {
        document.getElementById('allocationClientId').value = clientId;
        document.getElementById('allocationClientName').innerText = clientName;
        document.getElementById('teamAllocationDrawer').classList.remove('hidden');

        const container = document.getElementById('allocationServicesList');
        container.innerHTML = '<div class="text-center py-8 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading team and services...</div>';

        try {
            const { data: users, error: uErr } = await supabaseClient.from('users').select('id, name').eq('is_archived', false).order('name');
            if (uErr) throw uErr;
            globalTeamUsersAllocation = users || [];

            const client = globalClientsList.find(c => c.client_id === clientId);
            
            // 1. Get standard services, but don't crash if they have none. Exclude generic Startup and Subsidy.
            let enrolledServices = [];
            if (client && client.standard_services) {
                enrolledServices = client.standard_services.split(',')
                    .map(s => s.trim())
                    .filter(s => s !== 'Startup' && s !== 'Subsidy');
            }

            // 2. ALWAYS append Debtor Recovery so you can assign someone to collect money!
            if (!enrolledServices.includes('Debtor Recovery')) {
                enrolledServices.push('Debtor Recovery');
            }

            // Fetch assignments and active client subsidies in parallel
            const [assignmentsRes, subsidiesRes] = await Promise.all([
                supabaseClient.from('client_assignments').select('*').eq('client_id', clientId),
                supabaseClient.from('client_subsidies').select('subsidy_name, status').eq('client_id', clientId)
            ]);
            
            if (assignmentsRes.error) throw assignmentsRes.error;
            if (subsidiesRes.error) throw subsidiesRes.error;

            const assignments = assignmentsRes.data || [];
            const subsidies = (subsidiesRes.data || []).filter(sub => sub.status !== 'Approved');

            // Add specific active subsidy names to enrolledServices
            subsidies.forEach(sub => {
                if (sub.subsidy_name && !enrolledServices.includes(sub.subsidy_name)) {
                    enrolledServices.push(sub.subsidy_name);
                }
            });

            let html = '';
            let userOptions = `<option value="">-- Unassigned --</option>`;
            globalTeamUsersAllocation.forEach(u => {
                userOptions += `<option value="${u.id}">${u.name}</option>`;
            });

            enrolledServices.forEach(svc => {
                const safeSvcId = svc.replace(/[^a-zA-Z0-9]/g, '_');
                
                // Highlight Debtor Recovery differently to distinguish it from standard services
                const iconColor = svc === 'Debtor Recovery' ? 'text-red-500' : 'text-indigo-400';
                const iconType = svc === 'Debtor Recovery' ? 'fa-indian-rupee-sign' : 'fa-cube';

                html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition-shadow">
                    <h4 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid ${iconType} ${iconColor}"></i> ${svc}</h4>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs shadow-inner"><i class="fa-solid fa-user-pen"></i></div>
                            <div class="flex-1">
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Maker (Follow-up Exec)</label>
                                <select id="maker_${safeSvcId}" class="w-full text-sm p-2 rounded-xl bg-slate-50 border-none ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-slate-700">
                                    ${userOptions}
                                </select>
                            </div>
                        </div>

                        <button onclick="saveSpecificAllocation('${clientId}', '${svc}', 'maker_${safeSvcId}')" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-save"></i> Save ${svc} Allocation
                        </button>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;

            enrolledServices.forEach(svc => {
                let assignedRow = (assignments || []).find(a => a.service_type === svc);
                
                // Fallback for Audit assignments created from the Audit module which saves as 'Audit Status'
                if (!assignedRow && svc.toLowerCase().includes('audit')) {
                    assignedRow = (assignments || []).find(a => a.service_type === 'Audit Status');
                }

                // Fallback for generic Startup/Subsidy matching specific subsidy assignments
                if (!assignedRow && (svc.toLowerCase() === 'startup' || svc.toLowerCase() === 'subsidy')) {
                    const subsidyNames = subsidies.map(s => (s.subsidy_name || '').toLowerCase());
                    assignedRow = (assignments || []).find(a => {
                        const lowerA = (a.service_type || '').toLowerCase();
                        return lowerA.includes('startup') || lowerA.includes('subsidy') || subsidyNames.includes(lowerA);
                    });
                }

                // Fallback for specific subsidy case matching generic Startup/Subsidy assignments
                const isSpecificSubsidy = subsidies.some(sub => sub.subsidy_name === svc);
                if (!assignedRow && isSpecificSubsidy) {
                    assignedRow = (assignments || []).find(a => a.service_type === 'Startup' || a.service_type === 'Subsidy');
                }
                
                assignedRow = assignedRow || {};
                const safeSvcId = svc.replace(/[^a-zA-Z0-9]/g, '_');
                
                if (assignedRow.maker_id) {
                    const el = document.getElementById(`maker_${safeSvcId}`);
                    if (el) el.value = assignedRow.maker_id;
                }
            });

        } catch (err) {
            console.error("Allocation Load Error:", err);
            container.innerHTML = `<div class="text-center py-8 text-red-500">Error loading data: ${err.message}</div>`;
        }
    }

            .from('subsidy_categories')
            .insert([{ name: cat, checklist: [] }]);

        if (catErr) return alert("Error adding category to table: " + catErr.message);

        const { error } = await supabaseClient.from('task_logs').insert([{
            client_id: hostClientId,
            user_id: currentUser.id,
            note
        }]);

        if (error) return alert("Error adding category: " + error.message);
        input.value = '';
        await loadSubsidyCategories();
    }

    async function deleteSubsidyCategory(cat) {
        if (!confirm(`Delete category "${cat}" and its checklist?`)) return;

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) return;

        const note = `[SUBSIDY_GLOBAL_CONFIG] CAT_DEL:${cat}`;

        const { error: catErr } = await supabaseClient
            .from('subsidy_categories')
            .delete()
            .eq('name', cat);

        if (catErr) return alert("Error deleting category from table: " + catErr.message);

        await supabaseClient.from('task_logs').insert([{
            client_id: hostClientId,
            user_id: currentUser.id,
            note
        }]);

        await loadSubsidyCategories();
    }

    async function editSubsidyCategory(oldName) {
        const newName = prompt(`Enter new name for category "${oldName}":`, oldName);
        if (!newName || newName.trim() === oldName) return;
        
        const cat = newName.trim().toUpperCase(); // Force uppercase
        if (globalSubsidyCategoriesCache.includes(cat)) {
            return alert("A category with this name already exists.");
        }

        const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
        if (!hostClientId) return alert("Error: No active client found to save configuration.");

        const existingChecklist = globalSubsidyChecklistsCache[oldName.toUpperCase()];

        // Update client_subsidies table to rename the category in all client cases
        const { error: tableUpdateErr } = await supabaseClient
            .from('client_subsidies')
            .update({ subsidy_name: cat })
            .ilike('subsidy_name', oldName);

        if (tableUpdateErr) return alert("Error updating client cases: " + tableUpdateErr.message);

        // Update subsidy_categories table
        const { error: catUpdateErr } = await supabaseClient
            .from('subsidy_categories')
            .update({ name: cat })
            .eq('name', oldName);

        if (catUpdateErr) return alert("Error updating subsidy_categories: " + catUpdateErr.message);

        const { error } = await supabaseClient.from('task_logs').insert([
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_DEL:${oldName.toUpperCase()}` },
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_ADD:${cat}` },
            { client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CAT_RENAME:${oldName.toUpperCase()}->${cat}` },
            ...(existingChecklist ? [{ client_id: hostClientId, user_id: currentUser.id, note: `[SUBSIDY_GLOBAL_CONFIG] CHECKLIST:${cat}|${JSON.stringify(existingChecklist)}` }] : [])
        ]);

        if (error) return alert("Error editing category: " + error.message);

        await loadSubsidyCategories();
    }

    function downloadSubsidyChecklist(cat) {
        try {
            const data = globalSubsidyChecklistsCache[cat] || [
                { "Serial No": 1, "Document Name": "Sample Document", "Requirement": "Mandatory" }
            ];

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Checklist");
            
            const fileName = `${cat.replace(/[^a-z0-9]/gi, '_')}_Checklist.xlsx`;
            XLSX.writeFile(wb, fileName);
        } catch (err) {
            console.error("Download error:", err);
            alert("Error generating download: " + err.message);
        }
    }

    function uploadSubsidyChecklist(cat, event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            if (jsonData.length === 0) return alert("Excel sheet is empty!");

            const hostClientId = globalClientsList.find(c => c.is_active !== false)?.client_id;
            // Update the checklist in subsidy_categories table
            const { error } = await supabaseClient
                .from('subsidy_categories')
                .update({ checklist: jsonData })
                .eq('name', cat);

            // Also log the action in task_logs for history
            await supabaseClient.from('task_logs').insert([{
                client_id: hostClientId,
                user_id: currentUser.id,
                note: `[SUBSIDY_GLOBAL_CONFIG] CHECKLIST_UPLOADED:${cat}`
            }]);

            if (error) alert("Error uploading checklist: " + error.message);
            else {
                alert("Checklist updated successfully!");
                await loadSubsidyCategories();
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function renderStartupSubsidyChecklist(clientId, catName) {
        const container = document.getElementById('startupSubsidyChecklistContainer');
        const progressEl = document.getElementById('subsidyChecklistProgress');
        if (!container) return;

        container.innerHTML = '<div class="text-center py-4 text-slate-400 italic text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading documents...</div>';

        // 1. Get the global checklist for this category
        const masterList = globalSubsidyChecklistsCache[catName.toUpperCase()] || [];
        if (masterList.length === 0) {
            container.innerHTML = '<div class="text-center py-4 text-slate-300 italic text-xs">No documents configured for this category.</div>';
            progressEl.innerText = '0/0 Collected';
            return;
        }

        // 2. Fetch the client's specific checklist status from task_logs
        // Tag format: [SUBSIDY_CHECKLIST_STATUS] CAT:catName|DOC:docName|STATUS:true/false
        const { data: statusLogs } = await supabaseClient.from('task_logs')
            .select('note')
            .eq('client_id', clientId)
            .ilike('note', `[SUBSIDY_CHECKLIST_STATUS] CAT:${catName}%`)
            .order('timestamp', { ascending: false });

        const statusMap = {};
        (statusLogs || []).forEach(log => {
            const parts = log.note.split('|');
            const docPart = parts.find(p => p.startsWith('DOC:'));
            const statusPart = parts.find(p => p.startsWith('STATUS:'));
            if (docPart && statusPart) {
                const docName = docPart.replace('DOC:', '');
                const status = statusPart.replace('STATUS:', '') === 'true';
                if (statusMap[docName] === undefined) statusMap[docName] = status;
            }
        });

        let completedCount = 0;
        container.innerHTML = '';

        masterList.forEach(item => {
            const docName = item["Document Name"] || item["doc"] || "Unnamed Document";
            const req = item["Requirement"] || item["req"] || "Optional";
            const isDone = statusMap[docName] === true;
            if (isDone) completedCount++;

            const id = `chk-${clientId}-${catName}-${docName}`.replace(/\s+/g, '-');
            const reqClass = req.toLowerCase() === 'mandatory' ? 'text-red-500 bg-red-50 border-red-100' : 'text-slate-400 bg-slate-50 border-slate-100';

            container.innerHTML += `
            <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl hover:border-indigo-200 transition group cursor-pointer" onclick="toggleSubsidyChecklistItem('${clientId}', '${catName}', '${docName}', !${isDone})">
                <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${isDone ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 group-hover:border-indigo-300'}">
                    ${isDone ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                </div>
                <div class="flex-1 flex items-center justify-between gap-3 overflow-hidden">
                    <div class="text-[13px] font-black ${isDone ? 'text-slate-400 line-through' : 'text-slate-700'} truncate" title="${docName}">${docName}</div>
                    <span class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full border ${reqClass} whitespace-nowrap shrink-0 shadow-sm">${req}</span>
                </div>
            </div>`;
        });

        progressEl.innerText = `${completedCount}/${masterList.length} Collected`;
    }

    async function toggleSubsidyChecklistItem(clientId, catName, docName, newStatus) {
        const note = `[SUBSIDY_CHECKLIST_STATUS] CAT:${catName}|DOC:${docName}|STATUS:${newStatus}`;
        
        // Optimistic UI update
        const progressEl = document.getElementById('subsidyChecklistProgress');
        const [current, total] = progressEl.innerText.split(' ')[0].split('/');
        const nextCount = newStatus ? parseInt(current) + 1 : parseInt(current) - 1;
        progressEl.innerText = `${nextCount}/${total} Collected`;
        
        const { error } = await supabaseClient.from('task_logs').insert([{
            client_id: clientId,
            user_id: currentUser.id,
            note
        }]);

        if (error) {
            alert("Error saving status: " + error.message);
            renderStartupSubsidyChecklist(clientId, catName); // Revert on error
        } else {
            // Update global map for main table sync
            if (!window.globalChecklistStatusMap) window.globalChecklistStatusMap = {};
            if (!window.globalChecklistStatusMap[clientId]) window.globalChecklistStatusMap[clientId] = {};
            if (!window.globalChecklistStatusMap[clientId][catName]) window.globalChecklistStatusMap[clientId][catName] = {};
            window.globalChecklistStatusMap[clientId][catName][docName] = newStatus;

            renderStartupSubsidyChecklist(clientId, catName); // Refresh Drawer UI
            renderStartupsSubsidyTable(); // Refresh Main Page Table UI
        }
    }

    window.saveGstFrequencyFromDrawer = async function() {
        const clientId = document.getElementById('gstDrawerClientId').value;
        const frequency = document.getElementById('gstDrawerFrequencySelect').value;
        if (!clientId) return;
        
        try {
            const { error } = await supabaseClient.from('clients').update({ gst_frequency: frequency }).eq('client_id', clientId);
            if (error) throw error;
            
            // Update local cache
            const clientObj = (window.globalAllClientsList || globalClientsList || []).find(c => c.client_id === clientId);
            if (clientObj) clientObj.gst_frequency = frequency;
            
            alert("GST filing frequency updated successfully!");
            renderFilteredGSTTable(); // Redraw the table
        } catch (err) {
            console.error("Error saving frequency from drawer:", err);
            alert("Error: " + err.message);
        }
    };
</script>
