    async function processClientExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const loader = document.getElementById('excelLoadingModal');
        if (loader) loader.classList.remove('hidden');

        // Save file event target for reference/resetting
        window.globalProposedImportChanges = {
            inserts: [],
            updates: [],
            unchanged: [],
            invalid: [],
            fileEventTarget: event.target
        };

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                if (rows.length <= 1) {
                    if (loader) loader.classList.add('hidden');
                    event.target.value = '';
                    showToast("The uploaded sheet is empty.");
                    return;
                }
                
                const headers = rows[0].map(h => (h || '').toString().trim());
                const colIndices = {
                    code: headers.indexOf("Client Code") !== -1 ? headers.indexOf("Client Code") : headers.indexOf("Client ID"),
                    name: headers.indexOf("Client Name"),
                    pan: headers.indexOf("PAN Number"),
                    gstin: headers.indexOf("GSTIN"),
                    entity: headers.indexOf("Entity Type"),
                    frequency: headers.indexOf("GST Filing Frequency")
                };

                const services = globalServicesList || [];
                const svcColIndices = {};
                services.forEach(s => {
                    const headerName = `Service: ${s.service_type}`;
                    let idx = headers.indexOf(headerName);
                    if (idx === -1 && s.service_type === 'GST Return') idx = headers.indexOf("Service: GST");
                    if (idx === -1 && s.service_type === 'PT') idx = headers.indexOf("Service: Professional Tax");
                    svcColIndices[s.service_type] = idx;
                });

                if (colIndices.name === -1) {
                    if (loader) loader.classList.add('hidden');
                    event.target.value = '';
                    showToast("Error: 'Client Name' column not found in the uploaded Excel template.");
                    return;
                }

                const activeClients = (window.globalAllClientsList || []).filter(c => c.is_active !== false);
                const seenClientsList = [];

                // 1. Group rows by target client
                const groups = {}; // client_id -> { targetClientId, targetClientName, rowsInGroup, existingClientRecord }
                const newInserts = {}; // name.toLowerCase() -> { display_name, rowsInGroup }

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const name = (row[colIndices.name] || '').toString().trim();
                    if (!name) continue; // Skip empty rows

                    const code = colIndices.code !== -1 ? (row[colIndices.code] || '').toString().trim().toUpperCase() : '';
                    const pan = colIndices.pan !== -1 ? (row[colIndices.pan] || '').toString().trim().toUpperCase() : '';
                    const gstin = colIndices.gstin !== -1 ? (row[colIndices.gstin] || '').toString().trim().toUpperCase() : '';
                    const entity = colIndices.entity !== -1 ? (row[colIndices.entity] || '').toString().trim() : '';
                    const frequency = colIndices.frequency !== -1 ? (row[colIndices.frequency] || '').toString().trim() : '';

                    const servicesList = [];
                    services.forEach(s => {
                        const colIdx = svcColIndices[s.service_type];
                        if (colIdx !== -1 && (row[colIdx] || '').toString().trim().toLowerCase() === 'yes') {
                            servicesList.push(s.service_type);
                        }
                    });

                    // Resolve to database client
                    let existing = null;
                    let onlyUpdateServices = false;

                    if (code) {
                        existing = activeClients.find(c => 
                            (c.client_code && c.client_code.trim().toUpperCase() === code) || 
                            (c.client_id && c.client_id.trim().toUpperCase() === code)
                        );
                    }
                    if (!existing && name) {
                        existing = activeClients.find(c => 
                            c.display_name && c.display_name.trim().toLowerCase() === name.toLowerCase()
                        );
                    }
                    if (!existing && pan) {
                        existing = activeClients.find(c => 
                            c.pan_number && c.pan_number.trim().toUpperCase() === pan
                        );
                        if (existing) {
                            onlyUpdateServices = true;
                        }
                    }

                    const parsedRow = {
                        rowIndex: i,
                        code,
                        name,
                        pan,
                        gstin,
                        entity,
                        frequency,
                        servicesList,
                        onlyUpdateServices
                    };

                    if (existing) {
                        const groupKey = existing.client_id;
                        if (!groups[groupKey]) {
                            groups[groupKey] = {
                                targetClientId: existing.client_id,
                                targetClientName: existing.display_name,
                                existingClientRecord: existing,
                                rowsInGroup: []
                            };
                        }
                        groups[groupKey].rowsInGroup.push(parsedRow);
                    } else {
                        const groupKey = name.toLowerCase();
                        if (!newInserts[groupKey]) {
                            newInserts[groupKey] = {
                                display_name: name,
                                rowsInGroup: []
                            };
                        }
                        newInserts[groupKey].rowsInGroup.push(parsedRow);
                    }
                }

                // 2. Validate and process update groups (existing database clients)
                for (const groupKey in groups) {
                    const group = groups[groupKey];
                    const existing = group.existingClientRecord;
                    const rowsInGroup = group.rowsInGroup;

                    // Check for conflicts within the Excel rows targeting this client
                    const pans = rowsInGroup.map(r => r.pan).filter(Boolean);
                    const gstins = rowsInGroup.map(r => r.gstin).filter(Boolean);
                    const entities = rowsInGroup.map(r => r.entity).filter(Boolean);
                    const frequencies = rowsInGroup.map(r => r.frequency).filter(Boolean);

                    const isConflict = 
                        new Set(pans).size > 1 ||
                        new Set(gstins).size > 1 ||
                        new Set(entities).size > 1 ||
                        new Set(frequencies).size > 1;

                    if (isConflict) {
                        rowsInGroup.forEach(r => {
                            window.globalProposedImportChanges.invalid.push({
                                display_name: r.name,
                                pan_number: r.pan,
                                gstin: r.gstin,
                                entity_type: r.entity,
                                gst_frequency: r.frequency,
                                reason: "Cross-row Conflict",
                                details: `Excel contains conflicting details across rows for this client: PANs (${Array.from(new Set(pans)).join(', ')}), Entities (${Array.from(new Set(entities)).join(', ')}), Frequencies (${Array.from(new Set(frequencies)).join(', ')})`
                            });
                        });
                        continue;
                    }

                    // Identify the "official/existing" row for this client in Excel (if any)
                    const officialRow = rowsInGroup.find(r => !r.onlyUpdateServices);

                    let targetPan = existing.pan_number || '';
                    let targetGst = existing.gstin || '';
                    let targetEntity = existing.entity_type || '';
                    let targetFreq = existing.gst_frequency || '';
                    let targetName = existing.display_name;

                    if (officialRow) {
                        targetPan = (officialRow.pan || '').trim().toUpperCase() || existing.pan_number || '';
                        targetGst = (officialRow.gstin || '').trim().toUpperCase() || existing.gstin || '';
                        targetEntity = (officialRow.entity || '').trim() || existing.entity_type || '';
                        targetFreq = (officialRow.frequency || '').trim() || existing.gst_frequency || '';
                        targetName = officialRow.name || existing.display_name;
                    }

                    // Validate PAN and GSTIN formats
                    const panValid = targetPan ? window.validatePan(targetPan) : true;
                    const gstValid = targetGst ? window.validateGst(targetGst) : true;

                    // Check if the proposed PAN/GSTIN introduces a duplicate conflict against OTHER clients
                    const isDup = window.checkDuplicateConflict(existing.client_id, targetPan, targetGst, activeClients, seenClientsList);

                    if (!panValid || !gstValid || isDup) {
                        let reason = "Format Error";
                        let details = "";
                        if (!panValid) {
                            reason = "Invalid PAN";
                            details = `PAN "${targetPan}" is not in valid Indian PAN format.`;
                        } else if (!gstValid) {
                            reason = "Invalid GST";
                            details = `GSTIN "${targetGst}" is not in valid Indian GSTIN format.`;
                        } else if (isDup) {
                            reason = "Duplicate Conflict";
                            details = `PAN/GSTIN duplicate conflict against an existing active client or another Excel row.`;
                        }

                        rowsInGroup.forEach(r => {
                            window.globalProposedImportChanges.invalid.push({
                                display_name: r.name,
                                pan_number: r.pan,
                                gstin: r.gstin,
                                entity_type: r.entity,
                                gst_frequency: r.frequency,
                                reason: reason,
                                details: details
                            });
                        });
                        continue;
                    }

                    // Merge standard services: union of db services and servicesList from ALL rows in the group
                    const dbServices = (existing.standard_services || '').split(',').map(s => s.trim()).filter(Boolean);
                    const mergedServicesSet = new Set(dbServices);
                    rowsInGroup.forEach(r => {
                        r.servicesList.forEach(s => mergedServicesSet.add(s));
                    });
                    const standardServices = Array.from(mergedServicesSet).join(', ');

                    const existingPan = (existing.pan_number || '').trim().toUpperCase();
                    const existingGst = (existing.gstin || '').trim().toUpperCase();
                    const existingEntity = (existing.entity_type || '').trim();
                    const existingFreq = (existing.gst_frequency || '').trim();
                    const existingName = (existing.display_name || '').trim();
                    
                    const existingServicesSorted = [...dbServices].sort().join(', ');
                    const mergedServicesSorted = Array.from(mergedServicesSet).sort().join(', ');

                    const hasChanges = 
                        existingName !== targetName ||
                        existingPan !== targetPan ||
                        existingGst !== targetGst ||
                        existingEntity !== targetEntity ||
                        existingFreq !== targetFreq ||
                        existingServicesSorted !== mergedServicesSorted ||
                        existing.is_active !== true;

                    if (hasChanges) {
                        const changes = [];
                        if (existingName !== targetName) changes.push({ field: 'Client Name', oldVal: existingName, newVal: targetName });
                        if (existingPan !== targetPan) changes.push({ field: 'PAN Number', oldVal: existingPan || '[None]', newVal: targetPan || '[None]' });
                        if (existingGst !== targetGst) changes.push({ field: 'GSTIN', oldVal: existingGst || '[None]', newVal: targetGst || '[None]' });
                        if (existingEntity !== targetEntity) changes.push({ field: 'Entity Type', oldVal: existingEntity || '[None]', newVal: targetEntity || '[None]' });
                        if (existingFreq !== targetFreq) changes.push({ field: 'GST Filing Frequency', oldVal: existingFreq || '[None]', newVal: targetFreq || '[None]' });
                        if (existingServicesSorted !== mergedServicesSorted) {
                            changes.push({ 
                                field: 'Enrolled Services', 
                                oldVal: dbServices.join(', ') || '[None]', 
                                newVal: Array.from(mergedServicesSet).join(', ') || '[None]' 
                            });
                        }
                        if (existing.is_active !== true) changes.push({ field: 'Status', oldVal: 'Archived', newVal: 'Active' });

                        window.globalProposedImportChanges.updates.push({
                            client_id: existing.client_id,
                            display_name: targetName,
                            payload: {
                                display_name: targetName,
                                pan_number: targetPan || null,
                                gstin: targetGst || null,
                                entity_type: targetEntity || null,
                                gst_frequency: targetFreq || null,
                                standard_services: standardServices,
                                is_active: true
                            },
                            changes: changes
                        });
                    } else {
                        rowsInGroup.forEach(r => {
                            window.globalProposedImportChanges.unchanged.push({
                                display_name: r.name,
                                pan_number: targetPan,
                                gstin: targetGst,
                                entity_type: targetEntity,
                                gst_frequency: targetFreq,
                                standard_services: standardServices
                            });
                        });
                    }

                    // Record as seen
                    seenClientsList.push({
                        client_id: existing.client_id,
                        pan_number: targetPan,
                        gstin: targetGst
                    });
                }

                // 3. Validate and process inserts (brand new clients)
                for (const groupKey in newInserts) {
                    const group = newInserts[groupKey];
                    const rowsInGroup = group.rowsInGroup;

                    // Check for conflicts within the Excel rows targeting this new client
                    const pans = rowsInGroup.map(r => r.pan).filter(Boolean);
                    const gstins = rowsInGroup.map(r => r.gstin).filter(Boolean);
                    const entities = rowsInGroup.map(r => r.entity).filter(Boolean);
                    const frequencies = rowsInGroup.map(r => r.frequency).filter(Boolean);

                    const isConflict = 
                        new Set(pans).size > 1 ||
                        new Set(gstins).size > 1 ||
                        new Set(entities).size > 1 ||
                        new Set(frequencies).size > 1;

                    if (isConflict) {
                        rowsInGroup.forEach(r => {
                            window.globalProposedImportChanges.invalid.push({
                                display_name: r.name,
                                pan_number: r.pan,
                                gstin: r.gstin,
                                entity_type: r.entity,
                                gst_frequency: r.frequency,
                                reason: "Cross-row Conflict",
                                details: `Excel contains conflicting details across rows for this new client.`
                            });
                        });
                        continue;
                    }

                    const targetPan = pans[0] || '';
                    const targetGst = gstins[0] || '';
                    const targetEntity = entities[0] || '';
                    const targetFreq = frequencies[0] || '';
                    const targetName = group.display_name;

                    // Validate formats
                    const panValid = targetPan ? window.validatePan(targetPan) : true;
                    const gstValid = targetGst ? window.validateGst(targetGst) : true;

                    // Check duplicate conflict against database and other Excel clients
                    const isDup = window.checkDuplicateConflict(null, targetPan, targetGst, activeClients, seenClientsList);

                    if (!panValid || !gstValid || isDup) {
                        let reason = "Format Error";
                        let details = "";
                        if (!panValid) {
                            reason = "Invalid PAN";
                            details = `PAN "${targetPan}" is not in valid Indian PAN format.`;
                        } else if (!gstValid) {
                            reason = "Invalid GST";
                            details = `GSTIN "${targetGst}" is not in valid Indian GSTIN format.`;
                        } else if (isDup) {
                            reason = "Duplicate Conflict";
                            details = `PAN/GSTIN duplicate conflict against an existing active client or another Excel row.`;
                        }

                        rowsInGroup.forEach(r => {
                            window.globalProposedImportChanges.invalid.push({
                                display_name: r.name,
                                pan_number: r.pan,
                                gstin: r.gstin,
                                entity_type: r.entity,
                                gst_frequency: r.frequency,
                                reason: reason,
                                details: details
                            });
                        });
                        continue;
                    }

                    // Merge standard services across all rows in this group
                    const mergedServicesSet = new Set();
                    rowsInGroup.forEach(r => {
                        r.servicesList.forEach(s => mergedServicesSet.add(s));
                    });
                    const standardServices = Array.from(mergedServicesSet).join(', ');

                    window.globalProposedImportChanges.inserts.push({
                        display_name: targetName,
                        pan_number: targetPan || null,
                        gstin: targetGst || null,
                        entity_type: targetEntity || null,
                        gst_frequency: targetFreq || null,
                        standard_services: standardServices,
                        is_active: true
                    });

                    // Record as seen
                    seenClientsList.push({
                        client_id: null,
                        pan_number: targetPan,
                        gstin: targetGst
                    });
                }

                if (loader) loader.classList.add('hidden');

                // Show summary modal
                document.getElementById('summary-insert-count').innerText = window.globalProposedImportChanges.inserts.length;
                document.getElementById('summary-update-count').innerText = window.globalProposedImportChanges.updates.length;
                document.getElementById('summary-unchanged-count').innerText = window.globalProposedImportChanges.unchanged.length;
                
                const summaryInvalidCountEl = document.getElementById('summary-invalid-count');
                if (summaryInvalidCountEl) {
                    summaryInvalidCountEl.innerText = window.globalProposedImportChanges.invalid.length;
                }

                document.getElementById('excelImportSummaryModal').classList.remove('hidden');

            } catch (parseErr) {
                if (loader) loader.classList.add('hidden');
                event.target.value = '';
                console.error("Error parsing Excel:", parseErr);
                showToast("Failed to parse Excel file. Please ensure it is a valid .xlsx file generated from the template.");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    window.currentImportFilter = 'all';
    window.currentImportSubFilter = 'all';

    window.filterImportPreview = function(filterType) {
        window.currentImportFilter = filterType;
        
        // Update tab button styles
        const tabs = ['all', 'insert', 'update', 'unchanged', 'invalid'];
        tabs.forEach(t => {
            const btn = document.getElementById(`importTab-${t}`);
            if (btn) {
                if (t === filterType) {
                    btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-slate-800 text-white hover:bg-slate-900 transition-all border border-slate-800 shadow-md ring-2 ring-slate-800 ring-offset-1';
                } else {
                    if (t === 'insert') btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition-all border border-emerald-100';
                    else if (t === 'update') btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-blue-50 text-blue-700 hover:bg-blue-100 transition-all border border-blue-100';
                    else if (t === 'unchanged') btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-slate-50 text-slate-500 hover:bg-slate-100 transition-all border border-slate-100';
                    else if (t === 'invalid') btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-rose-50 text-rose-700 hover:bg-rose-100 transition-all border border-rose-100';
                    else btn.className = 'px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-slate-100 text-slate-800 hover:bg-slate-200 transition-all border border-slate-200';
                }
            }
        });

        // Show/hide sub-filter container
        const subFilterContainer = document.getElementById('importSubFilterContainer');
        if (subFilterContainer) {
            if (filterType === 'invalid') {
                subFilterContainer.classList.remove('hidden');
            } else {
                subFilterContainer.classList.add('hidden');
            }
        }

        window.renderImportPreviewTable();
    };

    window.applyImportSubFilter = function() {
        const select = document.getElementById('importErrorSubFilter');
        if (select) {
            window.currentImportSubFilter = select.value;
        }
        window.renderImportPreviewTable();
    };

    window.renderImportPreviewTable = function() {
        const tbody = document.getElementById('excel-preview-table-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        const inserts = window.globalProposedImportChanges.inserts || [];
        const updates = window.globalProposedImportChanges.updates || [];
        const unchanged = window.globalProposedImportChanges.unchanged || [];
        const invalid = window.globalProposedImportChanges.invalid || [];

        // Build combined list
        let items = [];
        inserts.forEach(x => items.push({ type: 'insert', data: x, name: x.display_name }));
        updates.forEach(x => items.push({ type: 'update', data: x, name: x.display_name }));
        unchanged.forEach(x => items.push({ type: 'unchanged', data: x, name: x.display_name }));
        invalid.forEach(x => items.push({ type: 'invalid', data: x, name: x.display_name }));

        // Sort items by name
        items.sort((a, b) => a.name.localeCompare(b.name));

        // Filter by main tab
        if (window.currentImportFilter !== 'all') {
            items = items.filter(item => item.type === window.currentImportFilter);
        }

        // Filter by sub-filter if main is invalid
        if (window.currentImportFilter === 'invalid' && window.currentImportSubFilter !== 'all') {
            items = items.filter(item => {
                const reason = item.data.reason;
                if (window.currentImportSubFilter === 'invalid_pan') return reason === 'Invalid PAN';
                if (window.currentImportSubFilter === 'invalid_gst') return reason === 'Invalid GST';
                if (window.currentImportSubFilter === 'duplicate') return reason === 'Duplicate Conflict';
                if (window.currentImportSubFilter === 'conflict') return reason === 'Cross-row Conflict';
                return true;
            });
        }

        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-slate-400 bg-slate-50/50 rounded-xl font-bold">No rows found matching the selected filter.</td></tr>`;

        items.forEach(item => {

                const changesHtml = `
                <div class="space-y-1 py-1 font-medium text-slate-600">
                    <div class="flex items-center gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">PAN:</span> <span class="text-emerald-600 font-bold">${x.pan_number || '[None]'}</span></div>
                    <div class="flex items-center gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">GSTIN:</span> <span class="text-emerald-600 font-bold">${x.gstin || '[None]'}</span></div>
                    <div class="flex items-center gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">Entity:</span> <span class="text-emerald-600 font-bold">${x.entity_type || '<span class="text-slate-300 italic">[None]</span>'}</span></div>
                    <div class="flex items-center gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">Frequency:</span> <span class="text-emerald-600 font-bold">${x.gst_frequency || '<span class="text-slate-300 italic">[None]</span>'}</span></div>
                    <div class="flex items-start gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider mt-0.5">Services:</span> ${svcDesc || '<span class="text-slate-300 italic">[None]</span>'}</div>
                </div>`;
                rowHtml = `
                <tr class="bg-white hover:bg-slate-50/50 transition shadow-sm rounded-xl">
                    <td class="px-4 py-3 font-black text-slate-800 rounded-l-xl">${x.display_name}</td>
                    <td class="px-4 py-3"><span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-lg font-black uppercase text-[9px] tracking-wider">New Client</span></td>
                    <td class="px-4 py-3 rounded-r-xl">${changesHtml}</td>
                </tr>`;
            } else if (item.type === 'update') {
                const x = item.data;
                let changesHtml = `<div class="space-y-1.5 py-1">`;
                x.changes.forEach(ch => {
                    let oldValDisp = ch.oldVal;
                    let newValDisp = ch.newVal;
                    if (ch.field === 'Enrolled Services') {
                        const oldSvcs = ch.oldVal !== '[None]' ? ch.oldVal.split(',').map(s => `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[9px] font-bold border border-slate-200 uppercase tracking-widest">${s.trim()}</span>`).join(' ') : '[None]';
                        const newSvcs = ch.newVal !== '[None]' ? ch.newVal.split(',').map(s => `<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[9px] font-bold border border-blue-100 uppercase tracking-widest">${s.trim()}</span>`).join(' ') : '[None]';
                        changesHtml += `
                        <div class="flex items-start gap-2">
                            <span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider mt-0.5">${ch.field}:</span>
                            <div class="flex-1 flex flex-wrap items-center gap-1.5">
                                <div class="flex flex-wrap gap-1">${oldSvcs}</div>
                                <i class="fa-solid fa-arrow-right text-slate-400 text-[10px]"></i>
                                <div class="flex flex-wrap gap-1">${newSvcs}</div>
                            </div>
                        </div>`;
                    } else {
                        changesHtml += `
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">${ch.field}:</span>
                            <span class="text-rose-500 line-through font-medium">${oldValDisp}</span>
                            <i class="fa-solid fa-arrow-right text-slate-400 text-[10px]"></i>
                            <span class="text-emerald-600 font-bold">${newValDisp}</span>
                        </div>`;
                    }
                });
                changesHtml += `</div>`;
                rowHtml = `
                <tr class="bg-white hover:bg-slate-50/50 transition shadow-sm rounded-xl">
                    <td class="px-4 py-3 font-black text-slate-800 rounded-l-xl">${x.display_name}</td>
                    <td class="px-4 py-3"><span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-100 rounded-lg font-black uppercase text-[9px] tracking-wider">Update</span></td>
                    <td class="px-4 py-3 rounded-r-xl">${changesHtml}</td>
                </tr>`;
            } else if (item.type === 'unchanged') {
                const x = item.data;
                const svcDesc = x.standard_services ? `<div class="mt-1 flex flex-wrap gap-1">${x.standard_services.split(',').map(s => `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[9px] font-bold border border-slate-200 uppercase tracking-widest">${s.trim()}</span>`).join(' ')}</div>` : '';
                const detailsHtml = `
                <div class="space-y-1 py-1 font-medium text-slate-500">
                    <div class="flex items-center gap-1.5"><span class="font-bold text-slate-400 uppercase text-[9px] w-20 tracking-wider">PAN:</span> <span>${x.pan_number || '[None]'}</span></div>

    async function confirmExcelImport() {
        const inserts = window.globalProposedImportChanges.inserts;
        const updates = window.globalProposedImportChanges.updates;
        const total = inserts.length + updates.length;

        if (total === 0) {
            showToast("No changes to import.");
            denyExcelImport();
            return;
        }

        const confirmBtnSummary = document.getElementById('summaryConfirmBtn');
        const confirmBtnTop = document.getElementById('previewConfirmBtnTop');
        const confirmBtnBottom = document.getElementById('previewConfirmBtnBottom');

        const buttons = [confirmBtnSummary, confirmBtnTop, confirmBtnBottom];
        buttons.forEach(btn => {
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...';
            }
        });

        const loader = document.getElementById('excelLoadingModal');
        if (loader) {
            loader.classList.remove('hidden');
            const statusText = loader.querySelector('span');
            if (statusText) statusText.innerText = 'Writing records...';
        }

        let insertCount = 0;
        let updateCount = 0;
        let errorCount = 0;

        try {
            // 1. Process inserts in batches
            if (inserts.length > 0) {
                let nextNum = await getNextClientCodeNum();
                inserts.forEach(item => {
                    item.client_code = 'CL-' + String(nextNum).padStart(4, '0');
                    nextNum++;
                });

                const { error } = await supabaseClient.from('clients').insert(inserts);
                if (error) {
                    console.error("Error inserting clients:", error);
                    errorCount += inserts.length;
                } else {
                    insertCount += inserts.length;
                }
            }

            // 2. Process updates sequentially
            for (const item of updates) {
                const { error } = await supabaseClient.from('clients').update(item.payload).eq('client_id', item.client_id);
                if (error) {
                    console.error(`Error updating client ${item.display_name}:`, error);
                    errorCount++;
                } else {
                    updateCount++;
                }
            }

            showToast(`Import Completed Successfully!\n- Created: ${insertCount} clients\n- Updated: ${updateCount} clients\n- Failed: ${errorCount} clients`);

        } catch (err) {
            console.error("Database error during import:", err);
            showToast("An error occurred during database writes: " + err.message);
        } finally {
            if (loader) loader.classList.add('hidden');
            
            // Close modal
            document.getElementById('excelImportSummaryModal').classList.add('hidden');

            // Reset buttons
            buttons.forEach(btn => {
                if (btn) {
                    btn.disabled = false;
                    if (btn.id === 'summaryConfirmBtn') btn.innerText = 'Confirm';
                    else btn.innerHTML = 'Confirm & Save <i class="fa-solid fa-check ml-2"></i>';
                }
            });

            // Reset file input
            const input = window.globalProposedImportChanges.fileEventTarget;
            if (input) input.value = '';

            // Clean up state
            window.globalProposedImportChanges = { inserts: [], updates: [], unchanged: [], invalid: [], fileEventTarget: null };

            // Return to clients view and refresh
            switchView('view-clients');
            globalRefresh();
        }
    }

    // Highest CL-#### number currently in the database, plus one.
    // Codes are zero-padded to 4 digits, so text ordering matches numeric ordering.
    async function getNextClientCodeNum() {
        const { data, error } = await supabaseClient
            .from('clients')
            .select('client_code')
            .like('client_code', 'CL-%')
            .order('client_code', { ascending: false })
            .limit(1);
        if (error) throw error;
        let nextNum = 1;
        const match = data && data[0] && data[0].client_code.match(/CL-(\d+)/);
        if (match) nextNum = parseInt(match[1], 10) + 1;
        // Also respect the cached list, in case it somehow holds a higher number
        (window.globalAllClientsList || []).forEach(c => {
            const m = c.client_code && c.client_code.match(/CL-(\d+)/);
            if (m && parseInt(m[1], 10) >= nextNum) nextNum = parseInt(m[1], 10) + 1;
        });
        return nextNum;
    }

    async function executeSaveClient(name, pan, gst, entity, services, freq, btn, originalText) {
        try {
            if (currentEditingClientId) {
                // UPDATE EXISTING CLIENT
                const { error } = await supabaseClient.from('clients').update({
                    display_name: name, pan_number: pan, gstin: gst, entity_type: entity, standard_services: services, gst_frequency: freq
                }).eq('client_id', currentEditingClientId);
                
                if (error) throw error;
                await refreshGlobalCache();
                // If the profile drawer is open, refresh it
                if (document.getElementById('universalClientProfileDrawer').classList.contains('hidden') === false) {
                    await openUniversalClientProfile(currentEditingClientId);
                }
            } else {
                // CREATE NEW CLIENT
                // Next code comes from the database, not the cached list, so clients
                // added by others since this page loaded don't cause a duplicate code.
                // Retry on a code collision (two people saving at the same moment).
                let lastError = null;
                for (let attempt = 0; attempt < 3; attempt++) {
                    const nextCode = 'CL-' + String(await getNextClientCodeNum()).padStart(4, '0');
                    const { error } = await supabaseClient.from('clients').insert([{
                        display_name: name, pan_number: pan, gstin: gst, entity_type: entity, standard_services: services, gst_frequency: freq, client_code: nextCode
                    }]);
                    lastError = error;
                    if (!error) break;
                    const isCodeClash = error.code === '23505' && String(error.message || '').includes('client_code');
                    if (!isCodeClash) break;
                }
                if (lastError) throw lastError;
            }
            
            closeEditClient();
            globalRefresh();
        } catch (error) {
            showToast("Error saving client: " + error.message);
        } finally {
            btn.innerHTML = originalText;
        }
    }

    async function saveClientEdit() {
        const name = document.getElementById('editClientName').value.trim();
        const pan = document.getElementById('editClientPan').value.trim().toUpperCase();
        const gst = document.getElementById('editClientGst').value.trim().toUpperCase();
        const entity = document.getElementById('editClientEntity').value;
        
        if(!name) return showToast("Client Name is required.");
        if(!pan) return showToast("PAN Number is mandatory.");

        if (!window.validatePan(pan)) {
            return showToast("Invalid PAN Format. PAN must be a 10-character alphanumeric string following the format (5 letters, 4 digits, 1 letter), e.g. ABCDE1234F.");
        }

        if (gst && !window.validateGst(gst)) {
            return showToast("Invalid GSTIN Format. GSTIN must be a 15-character alphanumeric string, e.g. 24ABCDE1234F1Z9.");
        }

        const checkedBoxes = document.querySelectorAll('.client-service-cb:checked');
        const services = Array.from(checkedBoxes).map(cb => cb.value).join(', ');

        const btn = document.getElementById('saveClientBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        const freq = document.getElementById('editClientGstFrequency') ? document.getElementById('editClientGstFrequency').value : 'Monthly';

        try {
            const activeClients = (window.globalAllClientsList || globalClientsList || []).filter(c => c.is_active !== false);
            
            // 1. Global GSTIN duplicate check (cannot add if GST already exists)
            if (gst) {
                const sameGstClientAnywhere = activeClients.find(c => 
                    c.gstin === gst && c.client_id !== currentEditingClientId
                );
                if (sameGstClientAnywhere) {
                    showToast(`Cannot add client: A client with the same GSTIN (${gst}) already exists under the name "${sameGstClientAnywhere.display_name}".`);
                    btn.innerHTML = originalText;
                    return;
                }
            }

            // 2. PAN duplicate check
            const pVal = (pan || '').trim().toUpperCase();
            const isWhitelisted = window.globalIgnoredDuplicatePans && window.globalIgnoredDuplicatePans.includes(pVal);
            
            const samePanClients = isWhitelisted ? [] : activeClients.filter(c => 
                c.pan_number === pan && c.client_id !== currentEditingClientId
            );
            
            if (samePanClients.length > 0) {
                // If same GST was already there, block it (actually handled by global GST check above, but here as a secondary safeguard)
                const sameGstClient = samePanClients.find(c => c.gstin === gst);
                if (sameGstClient) {
                    showToast(`Cannot add client: A client with the same PAN (${pan}) and GSTIN (${gst || 'Empty'}) already exists under the name "${sameGstClient.display_name}".`);
                    btn.innerHTML = originalText;
                    return;
                }

                // Show the warning modal for duplicate PAN with different GST
                document.getElementById('warning-modal-pan').innerText = pan;
                document.getElementById('warning-modal-names').innerText = samePanClients.map(c => c.display_name).join(', ');
                
                const proceedBtn = document.getElementById('warning-proceed-btn');
                proceedBtn.onclick = async function() {
                    closeClientWarningModal();
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
                    await executeSaveClient(name, pan, gst, entity, services, freq, btn, originalText);
                };
                
                document.getElementById('clientWarningModal').classList.remove('hidden');
                btn.innerHTML = originalText;
                return;
            }

            // 3. Save directly if no duplicates
            await executeSaveClient(name, pan, gst, entity, services, freq, btn, originalText);
        } catch (error) {
            showToast("Error: " + error.message);
            btn.innerHTML = originalText;
        }
    }

                    phone: phone,

    async function deleteClient() {
        const clientId = currentActiveClientProfile.client_id;
        
        try {
            // 1. Check pending tasks
            const { data: tasks, error: tasksErr } = await supabaseClient
                .from('tasks')
                .select('status')
                .eq('client_id', clientId);
            if (tasksErr) throw tasksErr;
            const pendingTasks = (tasks || []).filter(t => t.status !== 'Completed');

            // 2. Check pending cases (subsidies)
            const { data: subsidies, error: casesErr } = await supabaseClient
                .from('client_subsidies')
                .select('status')
                .eq('client_id', clientId);
            if (casesErr) throw casesErr;
            const pendingCases = (subsidies || []).filter(s => s.status !== 'Approved' && s.status !== 'Rejected');

            // 3. Check pending bills (invoices)
            const { data: invoices, error: billsErr } = await supabaseClient
                .from('invoices')
                .select('status')
                .eq('client_id', clientId);
            if (billsErr) throw billsErr;
            const pendingBills = (invoices || []).filter(inv => inv.status !== 'Paid' && inv.status !== 'Cancelled');

            const hasPendingTasks = pendingTasks.length > 0;
            const hasPendingCases = pendingCases.length > 0;
            const hasPendingBills = pendingBills.length > 0;

            if (hasPendingTasks || hasPendingCases || hasPendingBills) {
                let reason = "This client cannot be permanently deleted because they have active items:\n";
                if (hasPendingTasks) reason += `- ${pendingTasks.length} pending task(s)\n`;
                if (hasPendingCases) reason += `- ${pendingCases.length} active subsidy case(s)\n`;
                if (hasPendingBills) reason += `- ${pendingBills.length} unpaid/partially paid bill(s)\n`;
                reason += "\nPlease complete these items first, or archive this client instead.";
                showToast(reason);
                return;
            }
        } catch (checkErr) {
            console.error("Error checking pending client items:", checkErr);
            showToast("Error verifying client status: " + checkErr.message);
            return;
        }

        if(!confirm("Are you ABSOLUTELY sure you want to permanently delete this client? All tasks, bills, and history will be lost.")) return;
        
        const btn = document.querySelector('button[onclick="deleteClient()"]');
        const originalText = btn ? btn.innerHTML : '';
        if (btn) {
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Deleting...';
            btn.disabled = true;
        }

        try {
            const clientId = currentActiveClientProfile.client_id;
            
            // Delete from all referencing tables to prevent foreign key constraint violations
            await supabaseClient.from('client_assignments').delete().eq('client_id', clientId);
            await supabaseClient.from('client_contacts').delete().eq('client_id', clientId);
            await supabaseClient.from('client_subsidies').delete().eq('client_id', clientId);
            await supabaseClient.from('task_logs').delete().eq('client_id', clientId);
            await supabaseClient.from('task_history').delete().eq('client_id', clientId);
            await supabaseClient.from('tasks').delete().eq('client_id', clientId);
            await supabaseClient.from('invoices').delete().eq('client_id', clientId);
            await supabaseClient.from('gst_tracking').delete().eq('client_id', clientId);
            await supabaseClient.from('tds_tracking').delete().eq('client_id', clientId);
            await supabaseClient.from('pt_tracking').delete().eq('client_id', clientId);
            await supabaseClient.from('it_tracking').delete().eq('client_id', clientId);
            await supabaseClient.from('pf_tracking').delete().eq('client_id', clientId);
            
            // Delete from ledger/payments/follow_up tables
            await supabaseClient.from('payments').delete().eq('ledger_id', clientId);
            await supabaseClient.from('follow_up_logs').delete().eq('ledger_id', clientId);
            await supabaseClient.from('tally_ledgers').delete().eq('ledger_id', clientId);

            // Finally, delete the client record itself
            const { error } = await supabaseClient.from('clients').delete().eq('client_id', clientId);
            if (error) throw error;
            
            showToast("Client deleted successfully!");
            closeUniversalClientProfile(); 
            globalRefresh();
        } catch (err) {
            console.error("Error deleting client:", err);
            showToast("Database Error: " + err.message);
        } finally {
            if (btn) {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    }

    function populateGSTMonths() {
        const select = document.getElementById('gstMonthFilter');
        if (!select || select.options.length > 0) return; 

        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() - 1; 
        if (month < 0) { month = 11; year--; }

        let optionsHtml = '';
        for (let i = 0; i < 24; i++) {
            const monthStr = (month + 1).toString().padStart(2, '0');
            const val = `${year}-${monthStr}`;

            const dateObj = new Date(year, month, 1);
            const display = dateObj.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });

            optionsHtml += `<option value="${val}">${display}</option>`;

            month--;
            if (month < 0) { month = 11; year--; }
        }
        select.innerHTML = optionsHtml;
    }

    function populateTDSQuarters() {
        const select = document.getElementById('tdsQuarterFilter');
        if (!select || (select && select.options.length > 0)) return;

        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() - 3; 
        if (month < 0) { month += 12; year--; }

        let optionsHtml = '';
        for (let i = 0; i < 8; i++) {
            let fyStart, fyEnd, quarter;
            if (month >= 3) {
                fyStart = year;
                fyEnd = year + 1;
                quarter = Math.floor((month - 3) / 3) + 1;
            } else {
                fyStart = year - 1;
                fyEnd = year;
                quarter = 4;
            }
            const fyStr = `FY ${fyStart}-${fyEnd.toString().slice(-2)}`;
            const val = `${fyStr} Q${quarter}`;
            optionsHtml += `<option value="${val}">${val}</option>`;
            
            month -= 3;
            if (month < 0) { month = 9; year--; }
        }
        select.innerHTML = optionsHtml;
    }

        window.tdsIsLoading = true;

        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading TDS Data...</td></tr>';
        try {
            populateTDSQuarters();
            await Promise.all([
                refreshGlobalCache(),
                fetchTeamMembers()
            ]);
            
            const selectEl = document.getElementById('tdsQuarterFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';

            if (!selectedPeriod) throw new Error("Could not determine the selected quarter.");

            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);

            // Fetch all TDS-specific resources in parallel!
            const [
                trackingRes,
                commentsRes,
                ratesRes,
                visSettingsRes,
                todayLogsRes
            ] = await Promise.all([
                supabaseClient.from('tds_tracking').select('*').eq('period', selectedPeriod),
                supabaseClient.from('task_history').select('*').eq('task_type', 'TDS').ilike('note', `%[TDS Comment - ${selectedPeriod}%`).order('timestamp', { ascending: false }),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('note').ilike('note', `[PAGE_RATE] view-tds-center%`).order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
