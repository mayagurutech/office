                supabaseClient.from('task_history').select('client_id, note').eq('user_id', currentUser.id).gte('timestamp', todayStart.toISOString()).eq('task_type', 'TDS')
            ]);

            if (trackingRes.error) throw trackingRes.error;
            globalTdsTrackingData = trackingRes.data || [];

            // Comments keyed by clientId_tdsType
            // Supports both formats:
            //   Old: [TDS Comment - Q1-2025-26] remark text
            //   New: [TDS Comment - Q1-2025-26|26Q] remark text
            globalTdsComments = {};
            const comments = commentsRes.data;
            if (comments) {
                comments.forEach(c => {
                    const newFmt = c.note.match(/\[TDS Comment - [^|\]]+\|([^\]]+)\](.*)/);
                    const oldFmt = c.note.match(/\[TDS Comment - [^\]]+\](.*)/);
                    let tType = '26Q';
                    let noteText = c.note;
                    if (newFmt) {
                        tType = newFmt[1].trim();
                        noteText = newFmt[2].trim();
                    } else if (oldFmt) {
                        tType = '26Q';
                        noteText = oldFmt[1].trim();
                    }
                    const key = `${c.client_id}_${tType}`;
                    if (!globalTdsComments[key]) {
                        globalTdsComments[key] = { text: noteText, id: c.id, tdsType: tType };
                    }
                });
            }

            // Fetch rates for view-tds-center
            const rateLogs = ratesRes.data;
            window.globalTdsRatesMap = {};
            if (rateLogs) {
                rateLogs.forEach(log => {
                    const parts = log.note.split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[1];
                        const rate = parts[2];
                        if (window.globalTdsRatesMap[clientId] === undefined) window.globalTdsRatesMap[clientId] = rate;
                    }
                });
            }

            // Filter clients based on Page Visibility Settings
            const visSettings = visSettingsRes.data;
            const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : [];
            
            globalTdsClients = globalClientsList.filter(c => {
                return allowedServices.some(as => window.isClientVisibleForPeriod(c, as, selectedPeriod, 'quarterly'));
            });

            // Fetch today's TDS logs to identify updated clients
            window.globalTdsUpdatedTodayMap = {};
            const todayTdsLogs = todayLogsRes.data;
            if (todayTdsLogs) {
                todayTdsLogs.forEach(l => {
                    // Any TDS activity today = acknowledged
                    window.globalTdsUpdatedTodayMap[l.client_id] = true;
                });
            }

            renderFilteredTDSTable();
        } catch (error) {
            window.tdsIsLoading = false;
            console.error("Error in loadTDSCenterData:", error);
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-500"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>Error loading data: ${error.message}</td></tr>`;
        }
    }

    function sortTdsTable(col) {
        if (tdsSortCol === col) {
            tdsSortAsc = !tdsSortAsc;
        } else {
            tdsSortCol = col;
            tdsSortAsc = true;
        }
        renderFilteredTDSTable();
    }

    function updateTdsSortIcons() {
        const icon = document.getElementById('sort_icon_remark_tds');
        if (icon) {
            if (tdsSortCol === 'remark') {
                icon.className = tdsSortAsc ? "fa-solid fa-sort-up text-xs text-indigo-600" : "fa-solid fa-sort-down text-xs text-indigo-600";
            } else {
                icon.className = "fa-solid fa-sort text-xs text-gray-300 transition-colors";
            }
        }
    }

    function renderFilteredTDSTable() {
        const viewContainer = document.getElementById('view-tds-center');
        const tableContainer = document.getElementById('tds-table-container');
        setupTdsScrollListener();
        window.tdsIsLoading = true;
        const scrollPos = safeGetSessionStorage('tds_scroll_top') ? parseInt(safeGetSessionStorage('tds_scroll_top'), 10) : 0;
        const tableScrollPos = safeGetSessionStorage('tds_table_scroll_top') ? parseInt(safeGetSessionStorage('tds_table_scroll_top'), 10) : 0;

        const searchEl = document.getElementById('tdsSearchInput');
        const query = searchEl ? searchEl.value.toLowerCase() : '';

        const assignFilter = document.getElementById('tdsAssignFilter') ? document.getElementById('tdsAssignFilter').value : 'all';
        if (assignFilter === 'all') window.tdsDueFilterStatus = 'all';
        const filterRemark = document.getElementById('filter_remark_tds') ? document.getElementById('filter_remark_tds').value : 'all';
        
        const filterM1 = document.getElementById('filter_m1_tds')?.value || 'all';
        const filterM2 = document.getElementById('filter_m2_tds')?.value || 'all';
        const filterM3 = document.getElementById('filter_m3_tds')?.value || 'all';
        const filterReturn = document.getElementById('filter_return_tds')?.value || 'all';
        const filterForm16 = document.getElementById('filter_form16_tds')?.value || 'all';
        const filterBilled = document.getElementById('filter_billed_tds')?.value || 'all';

        let filteredClients = globalTdsClients;

        const myTdsClients = (window.globalAssignmentsList || [])
            .filter(a => a.service_type && a.service_type.toLowerCase().includes('tds return') && 
                (a.maker_id && currentUser && currentUser.id && a.maker_id.toLowerCase() === currentUser.id.toLowerCase()))
            .map(a => a.client_id);

        filteredClients = filteredClients.filter(client => {
            if (assignFilter === 'mine' && !myTdsClients.includes(client.client_id)) return false;
            if (query && !client.display_name.toLowerCase().includes(query) && (!client.client_code || !client.client_code.toLowerCase().includes(query))) return false;

            if (window.tdsDueFilterStatus !== 'all') {
                const clientRows = globalTdsTrackingData.filter(t => t.client_id === client.client_id);
                const hasPendingWork = clientRows.length === 0 || clientRows.some(r => {
                    const returnStatus = r.return_filed_status || 'Pending';
                    if (returnStatus === 'NIL') return false;
                    const filingPending = returnStatus !== 'Done';
                    const form16Status = r.form_16_status || 'Pending';
                    const form16Pending = form16Status !== 'Done' && form16Status !== 'NIL';
                    const billedStatus = r.billed_status || 'Pending';
                    const billingPending = billedStatus !== 'Done' && billedStatus !== 'NIL';
                    return filingPending || form16Pending || billingPending;
                });
                
                if (window.tdsDueFilterStatus === 'due') {
                    if (!hasPendingWork) return false;
                } else if (window.tdsDueFilterStatus === 'overdue') {
                    const currentPeriod = window.getCurrentTdsPeriod ? window.getCurrentTdsPeriod() : '';
                    const isOverdue = window.isTdsPeriodOverdue(currentPeriod);
                    if (!isOverdue) return false;
                    if (!hasPendingWork) return false;
                }
            }

            // Per-row filters: pass if ANY row for this client matches
            const clientRows = globalTdsTrackingData.filter(t => t.client_id === client.client_id);
            if (clientRows.length === 0) {
                // No rows yet — treat as all Pending
                if (filterM1 !== 'all' && filterM1 !== 'Pending') return false;
                if (filterM2 !== 'all' && filterM2 !== 'Pending') return false;
                if (filterM3 !== 'all' && filterM3 !== 'Pending') return false;
                if (filterReturn !== 'all' && filterReturn !== 'Pending') return false;
                if (filterForm16 !== 'all' && filterForm16 !== 'Pending') return false;
                if (filterBilled !== 'all' && filterBilled !== 'Pending') return false;
                if (filterRemark === 'has') return false;
                return true;
            }

            const hasComment = clientRows.some(r => !!globalTdsComments[`${client.client_id}_${r.tds_type || '26Q'}`]);
            if (filterRemark === 'has' && !hasComment) return false;
            if (filterRemark === 'none' && hasComment) return false;

            const rowMatches = clientRows.some(r => {
                const returnStatus = r.return_filed_status || 'Pending';
                const form16Status = returnStatus === 'NIL' ? 'NIL' : (r.form_16_status || 'Pending');
                const billedStatus = returnStatus === 'NIL' ? 'NIL' : (r.billed_status || 'Pending');
                if (filterM1 !== 'all' && (r.month_1_status || 'Pending') !== filterM1) return false;
                if (filterM2 !== 'all' && (r.month_2_status || 'Pending') !== filterM2) return false;
                if (filterM3 !== 'all' && (r.month_3_status || 'Pending') !== filterM3) return false;
                if (filterReturn !== 'all' && returnStatus !== filterReturn) return false;
                if (filterForm16 !== 'all' && form16Status !== filterForm16) return false;
                if (filterBilled !== 'all' && billedStatus !== filterBilled) return false;
                return true;
            });
            return rowMatches;
        });

        // Sorting
        filteredClients.sort((a, b) => {
            let valA = '';
            let valB = '';
            
            if (tdsSortCol === 'display_name') {
                valA = a.display_name.toLowerCase();
                valB = b.display_name.toLowerCase();
            } else if (tdsSortCol === 'remark') {
                valA = globalTdsComments[a.client_id]?.text.toLowerCase() || '';
                valB = globalTdsComments[b.client_id]?.text.toLowerCase() || '';
            }
            
            if (valA < valB) return tdsSortAsc ? -1 : 1;
            if (valA > valB) return tdsSortAsc ? 1 : -1;
            return 0;
        });

        updateTdsSortIcons();

        // Update Summary Cards
        const totalCountEl = document.getElementById('tds-total-count');
        const filingPendingCountEl = document.getElementById('tds-filing-pending-count');
        const form16PendingCountEl = document.getElementById('tds-form16-pending-count');
        const billPendingCountEl = document.getElementById('tds-bill-pending-count');
        const scoreEl = document.getElementById('tds-score');

        if (totalCountEl) totalCountEl.innerText = filteredClients.length;

        let filingPending = 0;
        let form16Pending = 0;
        let billPending = 0;

        // Count by ROWS (each return type row counts separately)
        let allRows = [];
        filteredClients.forEach(client => {
            const rows = globalTdsTrackingData.filter(t => t.client_id === client.client_id);
            if (rows.length === 0) allRows.push({ client_id: client.client_id, _virtual: true });
            else rows.forEach(r => allRows.push(r));
        });

        let totalTasks = allRows.length * 6;
        let completedTasks = 0;

        allRows.forEach(r => {
            const returnStatus = r.return_filed_status || 'Pending';
            const form16Status = returnStatus === 'NIL' ? 'NIL' : (r.form_16_status || 'Pending');
            const billedStatus = returnStatus === 'NIL' ? 'NIL' : (r.billed_status || 'Pending');
            const statuses = [
                r.month_1_status || 'Pending', r.month_2_status || 'Pending',
                r.month_3_status || 'Pending', returnStatus, form16Status, billedStatus
            ];
            if (returnStatus !== 'Done' && returnStatus !== 'NIL') filingPending++;
            if (form16Status !== 'Done' && form16Status !== 'NIL') form16Pending++;
            if (billedStatus !== 'Done' && billedStatus !== 'NIL') billPending++;
            statuses.forEach(s => { if (s === 'Done' || s === 'NIL') completedTasks++; });
        });

        if (filingPendingCountEl) filingPendingCountEl.innerText = filingPending;
        if (form16PendingCountEl) form16PendingCountEl.innerText = form16Pending;
        if (billPendingCountEl) billPendingCountEl.innerText = billPending;

        const score = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 100;
        if (scoreEl) scoreEl.innerText = `${score}%`;

        const tbody = document.getElementById('tds-table-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (filteredClients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-500">No TDS clients match the current filters.</td></tr>';
            return;
        }

        const selectedPeriod = document.getElementById('tdsQuarterFilter').value;

        const getCell = (status, type, name, clientId, safeName, tdsType) => {
            const t = encodeURIComponent(tdsType || '26Q');
            if (status === 'Done') {
                return `<td class="px-1 py-2 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}','${safeName}','${type}','${name}','${selectedPeriod}','Done','${t}')" class="w-full h-7 flex items-center justify-center rounded hover:bg-emerald-50 transition border border-transparent hover:border-emerald-200"><div class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm border border-emerald-200"><i class="fa-solid fa-check text-[10px]"></i></div></button></td>`;
            } else if (status === 'NIL') {
                return `<td class="px-1 py-2 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}','${safeName}','${type}','${name}','${selectedPeriod}','NIL','${t}')" class="w-full h-7 flex items-center justify-center rounded hover:bg-emerald-50 transition border border-transparent hover:border-emerald-200"><span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span></button></td>`;
            } else {
                return `<td class="px-1 py-2 text-center border-l border-gray-100"><button onclick="openTDSDrawer('${clientId}','${safeName}','${type}','${name}','${selectedPeriod}','Pending','${t}')" class="w-full h-7 rounded hover:bg-indigo-50 text-gray-300 hover:text-indigo-400 transition flex items-center justify-center border border-transparent hover:border-indigo-200"><i class="fa-solid fa-check text-sm"></i></button></td>`;
            }
        };

        const getCommentCell = (clientId, safeName, period, tdsType) => {
            const t = encodeURIComponent(tdsType || '26Q');
            const comment = globalTdsComments[`${clientId}_${tdsType}`];
            if (comment) {
                const safeRemark = comment.text.replace(/"/g, '&quot;');
                return `<td class="px-2 py-2 border-l border-gray-100 bg-gray-50/50 align-top max-w-[160px]">
                            <div onclick="openTDSDrawer('${clientId}','${safeName}','Comment','Comment','${period}','false','${t}')" class="w-full min-h-[28px] text-xs font-medium text-gray-600 text-left p-1.5 rounded hover:bg-white cursor-pointer border border-transparent hover:border-gray-300 shadow-sm leading-tight line-clamp-2 transition" title="${safeRemark}">${comment.text}</div>
                        </td>`;
} else {
                return `<td class="px-1 py-2 text-center border-l border-gray-100 bg-gray-50/50 align-top">
                            <button onclick="openTDSDrawer('${clientId}','${safeName}','Comment','Comment','${period}','false','${t}')" class="w-full h-7 rounded hover:bg-white text-gray-400 hover:text-indigo-600 transition flex items-center justify-center border border-transparent hover:border-gray-300 shadow-sm"><i class="fa-regular fa-comment-dots text-sm"></i></button>
                        </td>`;
            }
        };

        filteredClients.forEach((client, index) => {
            const safeName = client.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const clientRows = globalTdsTrackingData.filter(t => t.client_id === client.client_id);
            const rowsToRender = clientRows.length > 0 ? clientRows : [{ client_id: client.client_id, tds_type: '26Q', _virtual: true }];

            // Find assignee
            let assigneeName = 'Unassigned';
            if (window.globalAssignmentsList) {
                const assignment = window.globalAssignmentsList.find(a => a.client_id === client.client_id && a.service_type && a.service_type.toLowerCase().includes('tds return'));
                if (assignment && assignment.maker_id) {
                    const user = (window.globalTeamMembers || []).find(u => u.id === assignment.maker_id);
                    if (user) assigneeName = user.name;
                }
            }
            const assigneeBadge = assigneeName !== 'Unassigned' ? `<div class="mt-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase tracking-wider inline-flex items-center"><i class="fa-solid fa-user-tie mr-1"></i>${assigneeName}</div>` : '';

            const isTdsOverdue = window.isTdsPeriodOverdue(selectedPeriod);
            const allBilledOrNil = rowsToRender.every(r => r.billed_status === 'Done' || r.return_filed_status === 'NIL' || r._virtual);
            const isUpdatedToday = !!window.globalTdsUpdatedTodayMap[client.client_id];
            let ackCheckboxHtml = '';
            if (!allBilledOrNil && !isTdsOverdue) {
                ackCheckboxHtml = isUpdatedToday
                    ? `<span onclick="event.stopPropagation()" class="mt-1 ml-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5"><i class="fa-solid fa-square-check scale-75"></i>Checked</span>`
                    : `<button onclick="acknowledgeTdsToday('${client.client_id}', '${selectedPeriod}', event)" class="mt-1 ml-1 px-1.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition"><i class="fa-regular fa-square scale-75"></i>Acknowledge</button>`;
            }

            // One flat row per tds_type — old clean style
            rowsToRender.forEach((trackRecord, rowIdx) => {
                const tdsType = trackRecord.tds_type || '26Q';
                const isFirst = rowIdx === 0;
                const isLast = rowIdx === rowsToRender.length - 1;
                const canRemove = !trackRecord._virtual && rowsToRender.length > 1;

                const typeBadge = `<span class="px-1.5 py-0.5 bg-indigo-600 text-white rounded text-[9px] font-black tracking-wider">${tdsType}</span>`;
                const removeBtn = canRemove
                    ? `<button onclick="removeTDSReturnType('${client.client_id}','${safeName}','${selectedPeriod}','${tdsType}')" class="text-slate-300 hover:text-rose-500 transition ml-0.5" title="Remove ${tdsType}"><i class="fa-solid fa-xmark text-[10px]"></i></button>`
                    : '';
                const addBtn = isLast
                    ? `<button onclick="openTDSAddTypeModal('${client.client_id}','${safeName}','${selectedPeriod}')" class="text-slate-300 hover:text-indigo-500 transition ml-0.5" title="Add return type"><i class="fa-solid fa-plus text-[10px]"></i></button>`
                    : '';

                const isAllNil = trackRecord.month_1_status === 'NIL' &&
                    trackRecord.month_2_status === 'NIL' &&
                    trackRecord.month_3_status === 'NIL' &&
                    trackRecord.return_filed_status === 'NIL';

                const markNilBtn = `<button onclick="markAllTdsNil('${client.client_id}','${safeName}','${selectedPeriod}','${tdsType}', event)" class="px-1.5 py-0.5 ${isAllNil ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white hover:border-emerald-600'} border rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center gap-0.5 transition shadow-2xs ml-1" title="Mark all columns as NIL for ${tdsType}">
                    <i class="fa-solid fa-ban text-[8px]"></i>${isAllNil ? 'All Nil' : 'Mark Nil'}
                </button>`;

                let nameCell;
                if (isFirst) {
                    nameCell = `<td onclick="openUniversalClientProfile('${client.client_id}')" class="px-3 py-3 font-bold text-gray-800 text-[13px] leading-tight cursor-pointer hover:text-indigo-600 transition group">
                        <span class="border-b border-transparent group-hover:border-indigo-300">${client.display_name}</span>
                        ${assigneeBadge}
                        ${ackCheckboxHtml}
                        <br><span class="text-[9px] font-normal text-gray-400 uppercase tracking-wider">${client.client_code ? client.client_code + ' • ' : ''}${client.entity_type || ''}</span>
                        <div class="flex items-center gap-1 mt-1">${typeBadge}${removeBtn}${addBtn}${markNilBtn}</div>
                    </td>`;
                } else {
                    nameCell = `<td class="px-3 py-2 border-t border-dashed border-gray-100">
                        <div class="flex items-center gap-1">${typeBadge}${removeBtn}${addBtn}${markNilBtn}</div>
                    </td>`;
                }

                tbody.innerHTML += `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="px-2 py-3 text-center text-xs text-gray-400 font-mono">${isFirst ? index + 1 : ''}</td>
                    ${nameCell}
                    ${getCell(trackRecord.month_1_status, 'month_1_status', 'Month 1 Chalan', client.client_id, safeName, tdsType)}
                    ${getCell(trackRecord.month_2_status, 'month_2_status', 'Month 2 Chalan', client.client_id, safeName, tdsType)}
                    ${getCell(trackRecord.month_3_status, 'month_3_status', 'Month 3 Chalan', client.client_id, safeName, tdsType)}
                    ${getCell(trackRecord.return_filed_status, 'return_filed_status', 'Return Filed', client.client_id, safeName, tdsType)}
                    ${getCell(trackRecord.return_filed_status === 'NIL' ? 'NIL' : trackRecord.form_16_status, 'form_16_status', 'Form 16', client.client_id, safeName, tdsType)}
                    <td class="px-1 py-3 text-center border-l border-gray-100">
                        ${trackRecord.billed_status === 'Done'
                            ? `<div class="w-full h-8 flex items-center justify-center"><div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-xs"></i></div></div>`
                            : trackRecord.return_filed_status === 'NIL'
                                ? `<div class="w-full h-8 flex items-center justify-center"><span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">NIL</span></div>`
                                : trackRecord.billed_status === 'NIL'
                                    ? `<div class="w-full h-8 flex items-center justify-center gap-1.5"><div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shadow-sm border border-blue-200"><i class="fa-solid fa-check text-[10px]"></i></div><span class="text-[9px] font-black text-blue-600 uppercase tracking-wider">Nil</span></div>`
                                    : trackRecord.form_16_status === 'Done'
                                        ? `<button onclick="prepareTdsBill('${client.client_id}', '${safeName}', '${selectedPeriod}', '${tdsType}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-2 py-1 rounded text-xs font-bold transition shadow-sm">Bill</button>`
                                        : `<div class="w-full h-8"></div>`
                        }
                    </td>
                    ${getCommentCell(client.client_id, safeName, selectedPeriod, tdsType)}
                </tr>`;
            });
        });

        if (viewContainer || tableContainer) {
            setTimeout(() => { 
                if (viewContainer) viewContainer.scrollTop = scrollPos; 
                if (tableContainer) tableContainer.scrollTop = tableScrollPos;
                setTimeout(() => { window.tdsIsLoading = false; }, 100);
            }, 50);
        } else {
            window.tdsIsLoading = false;
        }
    }

    let currentTdsDrawerData = null;

    async function openTDSDrawer(clientId, clientName, columnKey, taskName, period, currentStatus, tdsTypeEncoded) {
        try {
            const tdsType = tdsTypeEncoded ? decodeURIComponent(tdsTypeEncoded) : '26Q';
            currentTdsDrawerData = { clientId, clientName, columnKey, taskName, period, currentStatus, tdsType };

            document.getElementById('tdsDrawerClientId').value = clientId;
            document.getElementById('tdsDrawerPeriod').value = period;
            document.getElementById('tdsDrawerColumn').value = columnKey;
            document.getElementById('tdsDrawerTdsType').value = tdsType;

            document.getElementById('tdsDrawerClientName').innerText = clientName;
            document.getElementById('tdsDrawerTaskName').textContent = `${taskName} [${tdsType}] - ${period}`;
            document.getElementById('tdsDrawerNote').value = '';
            
            await setTransferDropdownOptions('tdsTransferUserSelect');

            const nilDiv = document.getElementById('tdsDrawerNilReturnDiv');
            const nilCheck = document.getElementById('tdsDrawerNilReturn');

            if (nilCheck) {
                nilCheck.checked = (currentStatus === 'NIL');
            }

            if (nilDiv) {
                nilDiv.classList.remove('hidden');
            }

            const historyTimeline = document.getElementById('tdsDrawerHistoryTimeline');
            if (historyTimeline) {
                historyTimeline.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Loading history...</div>';

                const { data: logs, error } = await supabaseClient
                    .from('task_history')
                    .select('*, users(name)')
                    .eq('client_id', clientId)
                    .eq('task_type', 'TDS')
                    .eq('task_name', taskName)
                    .order('timestamp', { ascending: false });

                if (error) throw error;

                let filteredLogs = [];
                if (columnKey === 'Comment') {
                    filteredLogs = (logs || []).filter(log => {
                        if (!log.note.includes(`[TDS Comment - ${period}`)) return false;
                        if (log.note.includes('|')) {
                            return log.note.includes(`|${tdsType}]`);
                        }
                        return true;
                    });
                } else {
                    filteredLogs = (logs || []).filter(log => {
                        const otherType = (tdsType === '26Q') ? '24Q' : '26Q';
                        if (log.note.includes(`[${otherType}]`)) return false;
                        return log.note.includes(`[${tdsType}]`) || (!log.note.includes(`[24Q]`) && !log.note.includes(`[26Q]`));
                    });
                }

                historyTimeline.innerHTML = '';
                if (filteredLogs.length === 0) {
                    historyTimeline.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">No history found for this task.</div>';
                } else {
                    filteredLogs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleString('en-IN');
                        let displayNote = log.note;
                        if (columnKey === 'Comment') {
                            const newFmt = log.note.match(/\[TDS Comment - [^|\]]+\|([^\]]+)\](.*)/);
                            const oldFmt = log.note.match(/\[TDS Comment - [^\]]+\](.*)/);
                            if (newFmt) {
                                displayNote = newFmt[2].trim();
                            } else if (oldFmt) {
                                displayNote = oldFmt[1].trim();
                            }
                        }
                        historyTimeline.innerHTML += `
                        <div class="bg-white p-3 rounded-lg border border-gray-100 shadow-sm relative">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-gray-700">${log.users?.name || 'System'}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-gray-400">${date}</span>
                                    <button onclick="deleteTDSLog('${log.id}')" class="text-rose-400 hover:text-rose-600 transition text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <p class="text-xs text-gray-600">${displayNote}</p>
                        </div>`;
                    });
                }
            }

            const drawer = document.getElementById('tdsTaskDrawer');
            if (drawer) {
                drawer.classList.remove('hidden');
                setTimeout(() => drawer.classList.remove('opacity-0'), 10);
            }

        } catch (error) {
            console.error("Error in openTDSDrawer:", error);
            showToast("Error opening drawer: " + error.message);
        }

    async function deleteTDSLog(logId) {
        if (!confirm("Are you sure you want to delete this log?")) return;
        
        const { error } = await supabaseClient.from('task_history').delete().eq('id', logId);
        if (error) {
            showToast("Error deleting log: " + error.message);
        } else {
            showToast("Log deleted successfully.");
            
            if (currentTdsDrawerData) {
                const { clientId, clientName, columnKey, taskName, period, tdsType } = currentTdsDrawerData;
                
                if (columnKey === 'Comment') {
                    closeTDSDrawer();
                    await loadTDSCenterData();
                    return;
                }

                const { data: remainingLogs } = await supabaseClient
                    .from('task_history')
                    .select('*')
                    .eq('client_id', clientId)
                    .eq('task_type', 'TDS')
                    .eq('task_name', taskName)
                    .order('timestamp', { ascending: false });
                const filteredRemaining = (remainingLogs || []).filter(log => {
                    const otherType = (tdsType === '26Q') ? '24Q' : '26Q';
                    if (log.note.includes(`[${otherType}]`)) return false;
                    return log.note.includes(`[${tdsType}]`) || (!log.note.includes(`[24Q]`) && !log.note.includes(`[26Q]`));
                });

                let newStatus = 'Pending';
                if (filteredRemaining && filteredRemaining.length > 0) {
                    const match = filteredRemaining[0].note.match(/Marked as (.*?)(?:\.|$)/);
                    if (match) newStatus = match[1];
                }
                
                const updateData = {};
                updateData[columnKey] = newStatus;
                await supabaseClient.from('tds_tracking').update(updateData)
                    .eq('client_id', clientId).eq('period', period).eq('tds_type', tdsType || '26Q');
                
                closeTDSDrawer();
                await loadTDSCenterData();
            }
        }
    }

    async function saveTDSTask() {
        const clientId = document.getElementById('tdsDrawerClientId').value;
        const period = document.getElementById('tdsDrawerPeriod').value;
        const columnKey = document.getElementById('tdsDrawerColumn').value;
        const tdsType = document.getElementById('tdsDrawerTdsType').value || '26Q';
        const note = document.getElementById('tdsDrawerNote').value.trim();
        const taskNameDisplay = document.getElementById('tdsDrawerTaskName').textContent;
        const transferTo = document.getElementById('tdsTransferUserSelect') ? document.getElementById('tdsTransferUserSelect').value : '';

        const btn = document.getElementById('saveTdsTaskBtn');
        const ogHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        const isTdsOverdue = window.isTdsPeriodOverdue(period);
        if (isTdsOverdue && columnKey !== 'return_filed_status' && !note) {
            showToast("This TDS period is overdue. You must write a comment/note to save.");
            btn.innerHTML = ogHtml;
            return;
        }

        // Mandatory workflow assignment check if no one is assigned yet
        const existingAssignment = (window.globalAssignmentsList || []).find(a => 
            a.client_id === clientId && 
            a.service_type && 
            a.service_type.toLowerCase().includes('tds return')
        );
        const isAssigned = existingAssignment && existingAssignment.maker_id;

        if (!isAssigned && !transferTo) {
            showToast("No team member is assigned to this TDS workflow yet. You must select a user in 'Transfer TDS Workflow To' to assign them.");
            btn.innerHTML = ogHtml;
            return;
        }

        try {
            if (columnKey === 'Comment') {
                const tType = tdsType || '26Q';
                // New comment format includes tds_type: [TDS Comment - Q1-2025-26|26Q]
                const logNote = `[TDS Comment - ${period}|${tType}] ${note}`;

                const { error: logErr } = await supabaseClient.from('task_history').insert([{
                    client_id: clientId, task_type: 'TDS', task_name: 'Comment',
                    user_id: currentUser.id, note: logNote, timestamp: new Date().toISOString()
                }]);
                if (logErr) throw logErr;
                if (transferTo) await transferClientWorkflow(clientId, 'TDS Return', transferTo);
                closeTDSDrawer();
                await loadTDSCenterData();
                return;
            }

            const isNil = document.getElementById('tdsDrawerNilReturn').checked;
            const newStatus = isNil ? 'NIL' : 'Done';

            const tType = tdsType || '26Q';
            const { data: existingRow, error: fetchErr } = await supabaseClient
                .from('tds_tracking').select('client_id')
                .eq('client_id', clientId).eq('period', period).eq('tds_type', tType).maybeSingle();
            if (fetchErr) throw fetchErr;

            let query;
            if (existingRow) {
                const updateData = {};
                updateData[columnKey] = newStatus;
                if (columnKey === 'return_filed_status' && newStatus === 'NIL') {
                    updateData['form_16_status'] = 'NIL'; updateData['billed_status'] = 'NIL';
                }
                query = supabaseClient.from('tds_tracking').update(updateData)
                    .eq('client_id', clientId).eq('period', period).eq('tds_type', tType);
            } else {
                const insertData = { client_id: clientId, period, tds_type: tType };
                insertData[columnKey] = newStatus;
                if (columnKey === 'return_filed_status' && newStatus === 'NIL') {
                    insertData['form_16_status'] = 'NIL'; insertData['billed_status'] = 'NIL';
                }
                query = supabaseClient.from('tds_tracking').insert([insertData]);
            }

            const { error: saveErr } = await query;
            if (saveErr) throw saveErr;

            const tType2 = tdsType || '26Q';
            const taskName = taskNameDisplay.replace(/ \[[^\]]+\]/, '').split(' - ')[0];
            let logNote = `[${tType2}] [${taskName} - ${period}] Marked as ${newStatus}.`;
            if (note) logNote += ` Remark: ${note}`;

            const { error: logErr } = await supabaseClient.from('task_history').insert([{
                client_id: clientId, task_type: 'TDS', task_name: taskName,
                user_id: currentUser.id, note: logNote, timestamp: new Date().toISOString()
            }]);
            if (logErr) console.error("Error creating log:", logErr);
            if (transferTo) await transferClientWorkflow(clientId, 'TDS Return', transferTo);

            closeTDSDrawer();
            await loadTDSCenterData();

        } catch (error) {
            console.error("Error in saveTDSTask:", error);
            showToast("Error saving task: " + error.message);
        } finally {
            btn.innerHTML = ogHtml;
        }
    }

    window.cancelSubsidyBill = async function(clientId, subsidyType) {
        if (!confirm(`Are you sure you want to cancel the bill for "${subsidyType}"?\n\nThis will mark the bill as Cancelled and let you generate a new bill if needed.`)) {
            return;
        }

        try {
            const { data: invoices, error: fetchErr } = await supabaseClient
                .from('invoices')
                .select('*')
                .eq('client_id', clientId)
                .eq('service_name', `Subsidy Fees - ${subsidyType}`)
                .neq('status', 'Cancelled');

            if (fetchErr) throw fetchErr;

            if (!invoices || invoices.length === 0) {
                showToast("No active bill found for this subsidy case to cancel.");
                return;
            }

            const pkColumn = invoices[0].invoice_id !== undefined ? 'invoice_id' : 'id';
            const idsToCancel = invoices.map(inv => inv[pkColumn]);

            const { error: updateErr } = await supabaseClient
                .from('invoices')
                .update({ status: 'Cancelled' })
                .in(pkColumn, idsToCancel);

            if (updateErr) throw updateErr;

            showToast("Bill cancelled successfully!");
            if (typeof globalRefresh === 'function') await globalRefresh();
            else await loadStartupsSubsidyData(); // Refresh page data
        } catch (err) {
            showToast("Error: " + err.message);
        }
    }

    window.prepareTdsBill = async function(clientId, clientName, period, tdsType) {
        const tType = tdsType || '26Q';
        const rate = window.globalTdsRatesMap[clientId] || 0;
        const confirmedRate = prompt(`Confirm rate for ${clientName} [${tType}] (Period: ${period}):`, rate);
        if (confirmedRate === null) return;
        const amount = parseFloat(confirmedRate);
        if (isNaN(amount)) return showToast('Invalid amount!');
        try {
            if (amount === 0) {
                await supabaseClient.from('tds_tracking').update({ billed_status: 'NIL' })
                    .eq('client_id', clientId).eq('period', period).eq('tds_type', tType);
                showToast('Task marked as completed with 0 rate (Free).');
            } else {
                let firmId = null;
                const { data: tdsSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_tds_firm').maybeSingle();
                if (tdsSetting) firmId = tdsSetting.setting_value;
                const billNo = await window.getNextInvoiceNumber(firmId);
                const invoiceData = { client_id: clientId, service_name: `TDS Return Fees [${tType}] - ${period}`, amount, status: 'Unpaid', bill_number: billNo, generated_date: new Date().toISOString() };
                if (firmId) invoiceData.firm_id = firmId;
                const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                if (error) throw error;
                await supabaseClient.from('tds_tracking').update({ billed_status: 'Done' })
                    .eq('client_id', clientId).eq('period', period).eq('tds_type', tType);
                showToast('Bill prepared successfully!');

        } catch (err) { showToast('Error: ' + err.message); }

        let totalAmount = 0;

        globalTdsClients.forEach(client => {
            const rows = globalTdsTrackingData.filter(t => t.client_id === client.client_id);

                if (r.form_16_status === 'Done' && r.billed_status !== 'Done' && r.return_filed_status !== 'NIL') {

                    tbody.innerHTML += `<tr class="border-b border-gray-100 hover:bg-gray-50">

        const genBtn = modal.querySelector('button[onclick^="generateBulkBills"]');

    window.generateTdsBulkBills = async function() {
        if (!window.bulkBillClientsList || window.bulkBillClientsList.length === 0) {
            return showToast("No clients to bill!");
        }

        if (!confirm(`Are you sure you want to generate bills for ${window.bulkBillClientsList.length} clients?`)) return;

        const modal = document.getElementById('bulkBillModal');
        if (modal) modal.classList.add('hidden');
        
        const tbody = document.getElementById('tds-table-body');
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Generating Bulk Bills...</td></tr>';

        try {
            let successCount = 0;
            let firmId = null;
            const { data: tdsSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_tds_firm').single();
            if (tdsSetting) firmId = tdsSetting.setting_value;

            for (const client of window.bulkBillClientsList) {
                try {
                    if (parseFloat(client.rate) === 0) {
                        await supabaseClient.from('tds_tracking').update({ billed_status: 'NIL' })
                            .eq('client_id', client.client_id).eq('period', client.period).eq('tds_type', client.tds_type || '26Q');
                        successCount++;
                    } else {
                        const billNo = await window.getNextInvoiceNumber(firmId);
                        const invoiceData = { 
                            client_id: client.client_id, 
                            service_name: `TDS Return Fees - ${client.period}`, 
                            amount: client.rate, 
                            status: 'Unpaid', 
                            bill_number: billNo, 
                            generated_date: new Date().toISOString() 
                        };
                        if (firmId) invoiceData.firm_id = firmId;
                        
                        const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                        if (error) throw error;
                        
                        await supabaseClient.from('tds_tracking').update({ billed_status: 'Done' })
                            .eq('client_id', client.client_id).eq('period', client.period).eq('tds_type', client.tds_type || '26Q');
                        successCount++;
                    }
                } catch (err) {
                    console.error(`Error billing client ${client.display_name}:`, err);
                }
            }
            showToast(`Successfully generated ${successCount} bills!`);
            loadTDSCenterData(); // Refresh table
        } catch (err) {
            showToast("Error in bulk billing process: " + err.message);
            loadTDSCenterData(); // Refresh table anyway
        }
    };

            trackRecord.month_1_status === 'Done' ||

            trackRecord.form_16_status === 'Done' ||

        );

        const hasRemark = globalTdsComments && globalTdsComments[commentKey] && globalTdsComments[commentKey].text && globalTdsComments[commentKey].text.trim().length > 0;

                .from('tds_tracking').select('client_id')
                .eq('client_id', clientId).eq('period', period).eq('tds_type', tType).maybeSingle();

    async function loadGSTCenterData() {
        const tbody = document.getElementById('gst-table-body');
        if (!tbody) return;
        
        setupGstScrollListener();
        window.gstIsLoading = true;
        window.lastGstScrollPos = safeGetSessionStorage('gst_scroll_top') ? parseInt(safeGetSessionStorage('gst_scroll_top'), 10) : 0;
        window.lastGstTableScrollPos = safeGetSessionStorage('gst_table_scroll_top') ? parseInt(safeGetSessionStorage('gst_table_scroll_top'), 10) : 0;

        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading GST Data...</td></tr>';
        try {
            populateGSTMonths();
            
            // 1. Fetch global caches and team members in parallel
            await Promise.all([
                refreshGlobalCache(),
                fetchTeamMembers()
            ]);
            
            const selectEl = document.getElementById('gstMonthFilter');
            const selectedPeriod = selectEl ? selectEl.value : '';

            if (!selectedPeriod) throw new Error("Could not determine the selected month.");

            const [y, m] = selectedPeriod.split('-');
            const displayPeriod = getDeterministicShortPeriod(selectedPeriod);
            const remarkTag = `[General Remarks - ${displayPeriod}]`;
            
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);

            // 2. Fetch all other required data in a single parallel thread using Promise.all!
            const [
                monthlyDataRes,
                r1DataRes,
                r3bDataRes,
                freeLogsRes,
                remarkLogsRes,
                clientRemarksRes,
                visSettingsRes,
                invoicesRes,
                rateLogsRes,
                todayLogsRes
            ] = await Promise.all([
                supabaseClient.from('gst_tracking').select('*').eq('period', selectedPeriod),
                supabaseClient.from('gst_tracking').select('client_id, period').eq('is_gstr1', true),
                supabaseClient.from('gst_tracking').select('client_id, period').eq('is_gstr3b', true),
                supabaseClient.from('task_history').select('client_id').eq('task_type', 'GST').ilike('note', `%[GST Free - ${selectedPeriod}]%`),
                supabaseClient.from('task_logs').select('client_id, note').or(`note.ilike.%${remarkTag}%,note.ilike.%[Data Received - ${displayPeriod}]%,note.ilike.%[Excel / Tally - ${displayPeriod}]%,note.ilike.%[Checked 2B - ${displayPeriod}]%,note.ilike.%[GST Stuck - ${displayPeriod}]%,note.ilike.%[GST Unstuck - ${displayPeriod}]%`).order('timestamp', { ascending: false }),
                supabaseClient.from('task_logs').select('client_id, note').ilike('note', '[GST Client Remark]%').order('timestamp', { ascending: false }),
                supabaseClient.from('page_visibility_settings').select('enrolled_services').eq('page_id', 'view-gst-center').maybeSingle(),
                supabaseClient.from('invoices').select('client_id, generated_date, service_name, status').ilike('service_name', '%GST%'),
                fetchAllRows((from, to) => supabaseClient.from('task_logs').select('note').ilike('note', `[PAGE_RATE] view-gst-center%`).order('timestamp', { ascending: false }).order('log_id', { ascending: false }).range(from, to)),
                supabaseClient.from('task_logs').select('client_id, note').eq('user_id', currentUser.id).gte('timestamp', todayStart.toISOString())
            ]);

            // Unpack results and handle errors
            if (monthlyDataRes.error) throw monthlyDataRes.error;
            globalGstTrackingData = monthlyDataRes.data || [];

            const r1Data = r1DataRes.data;
            globalGstr1UptoMap = {};
            if (r1Data) {
                r1Data.forEach(row => {
                    if (!globalGstr1UptoMap[row.client_id] || row.period > globalGstr1UptoMap[row.client_id]) {
                        globalGstr1UptoMap[row.client_id] = row.period;
                    }
                });
            }

            const r3bData = r3bDataRes.data;
            globalGstr3bUptoMap = {};
            if (r3bData) {
                r3bData.forEach(row => {
                    if (!globalGstr3bUptoMap[row.client_id] || row.period > globalGstr3bUptoMap[row.client_id]) {
                        globalGstr3bUptoMap[row.client_id] = row.period;
                    }
                });
            }

            window.globalGstFreeMap = {};
            const freeLogs = freeLogsRes.data;
            if (freeLogs) {
                freeLogs.forEach(log => {
                    window.globalGstFreeMap[log.client_id] = true;
                });
            }

            const remarkLogs = remarkLogsRes.data;
            globalLatestRemarksMap = {};
            globalDataReceivedMap = {}; 
            globalNilReturnMap = {};
            window.globalGstStuckMap = {};

            if (remarkLogs) {
                remarkLogs.forEach(log => {
                    const cleanNote = log.note.substring(log.note.indexOf(']') + 1).trim();
                    if (log.note.includes('[General Remarks')) {
                        if (!globalLatestRemarksMap[log.client_id]) {
                            let noteText = cleanNote.replace(/^(Note:|Additional Note:)\s*/i, '');
                            globalLatestRemarksMap[log.client_id] = noteText;
                        }
                    } else if (log.note.includes('[Data Received')) {
                        if (!globalDataReceivedMap[log.client_id]) {
                            const dateMatch = cleanNote.match(/\(Received on: (.*?)\)/);
                            if (dateMatch) {
                                globalDataReceivedMap[log.client_id] = dateMatch[1];
                            }
                        }
                    } else if (log.note.includes('[Excel / Tally') && log.note.includes('[NIL]')) {
                        globalNilReturnMap[log.client_id + '_is_excel'] = true;
                    } else if (log.note.includes('[Checked 2B') && log.note.includes('[NIL]')) {
                        globalNilReturnMap[log.client_id + '_is_2b'] = true;
                    } else if (log.note.includes(`[GST Stuck - ${displayPeriod}]`)) {
                        if (window.globalGstStuckMap[log.client_id] === undefined) {
                            window.globalGstStuckMap[log.client_id] = true;
                        }
                    } else if (log.note.includes(`[GST Unstuck - ${displayPeriod}]`)) {
                        if (window.globalGstStuckMap[log.client_id] === undefined) {
                            window.globalGstStuckMap[log.client_id] = false;
                        }
                    }
                });
            }

            const clientRemarks = clientRemarksRes.data;
            window.globalClientRemarksMap = {};
            if (clientRemarks) {
                clientRemarks.forEach(log => {
                    if (!window.globalClientRemarksMap[log.client_id]) {
                        const cleanNote = log.note.replace('[GST Client Remark]', '').trim();
                        window.globalClientRemarksMap[log.client_id] = cleanNote;
                    }
                });
            }

            const visSettings = visSettingsRes.data;
            const allowedServices = (visSettings && visSettings.enrolled_services) ? visSettings.enrolled_services : [];
            
            globalGstClients = globalClientsList.filter(c => {
                return allowedServices.some(as => window.isClientVisibleForPeriod(c, as, selectedPeriod, 'monthly'));
            });

            const invoices = invoicesRes.data;
            window.globalGstBilledMap = {};

            if (invoices) {
                invoices.forEach(inv => {
                    if (isGstReturnInvoiceForPeriod(inv, selectedPeriod)) {
                        window.globalGstBilledMap[inv.client_id] = true;
                    }
                });
            }

            const rateLogs = rateLogsRes.data;
            window.globalGstRatesMap = {};
            if (rateLogs) {
                rateLogs.forEach(log => {
                    const parts = log.note.split('|');
                    if (parts.length >= 3) {
                        const clientId = parts[1];
                        const rate = parts[2];
                        if (window.globalGstRatesMap[clientId] === undefined) window.globalGstRatesMap[clientId] = rate;
                    }
                });
            }

            const todayLogs = todayLogsRes.data;
            window.globalGstUpdatedTodayMap = {};
            if (todayLogs) {
                todayLogs.forEach(l => {
                    window.globalGstUpdatedTodayMap[l.client_id] = true;
                });
            }

            renderFilteredGSTTable();

        } catch (error) {
            console.error("GST Load Error:", error);
            tbody.innerHTML = `<tr><td colspan="12" class="text-center py-8 text-red-500 font-bold bg-red-50 border border-red-200 rounded-lg">Error loading data: ${error.message}</td></tr>`;
        }
    }

    window.prepareGstBill = async function(clientId, clientName, period) {
        const rate = window.globalGstRatesMap[clientId] || 0;
        const confirmedRate = prompt(`Confirm rate for ${clientName} (Period: ${period}):`, rate);
        if (confirmedRate === null) return; // User cancelled
        
        const amount = parseFloat(confirmedRate);
        if (isNaN(amount)) return showToast("Invalid amount!");

        try {
            if (amount === 0) {
                // Insert log to mark as free
                const { error: logErr } = await supabaseClient.from('task_history').insert([{
                    client_id: clientId,
                    task_type: 'GST',
                    task_name: 'Billing',
                    user_id: currentUser.id,
                    note: `[GST Free - ${period}] Marked as Free (0 Rate).`,
                    timestamp: new Date().toISOString()
                }]);
                
                if (logErr) throw logErr;
                showToast("Task marked as completed with 0 rate (Free).");
            } else {
                let firmId = null;
                const { data: gstSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').maybeSingle();
                if (gstSetting) firmId = gstSetting.setting_value;

                const billNo = await window.getNextInvoiceNumber(firmId);
                const periodStr = getDeterministicLongPeriod(period);

                const invoiceData = { 
                    client_id: clientId, 
                    service_name: `GST Return Fees - ${periodStr}`, 
                    amount: amount, 
                    status: 'Unpaid', 
                    bill_number: billNo, 
                    generated_date: new Date().toISOString() 
                };
                if (firmId) invoiceData.firm_id = firmId;

                const { error } = await supabaseClient.from('invoices').insert([invoiceData]);
                
                if (error) throw error;
                showToast("Bill prepared successfully!");
            }
            
            loadGSTCenterData(); // Refresh table
        } catch (err) { 
            showToast("Error: " + err.message); 
        }
    }

    window.promptCancelGstBill = async function(clientId, clientName, period, isFree) {
        // Resolve the exact invoices first so the user sees what will be cancelled — never cancel blind.
        let matchingInvoices = [];
        if (!isFree) {
            const { data: invoices, error: fetchErr } = await supabaseClient.from('invoices')
                .select('invoice_id, bill_number, service_name, amount, status')
                .eq('client_id', clientId)
                .neq('status', 'Cancelled');
            if (fetchErr) return showToast("Error loading bills: " + fetchErr.message);
            matchingInvoices = (invoices || []).filter(inv => isGstReturnInvoiceForPeriod(inv, period));
            if (matchingInvoices.length === 0) {
                showToast(`No active GST return bill found for ${clientName} (${period}). Nothing to cancel.`);
                return;
            }
        }

        const billList = matchingInvoices.map(inv => `• ${inv.bill_number} — ${inv.service_name} — ₹${inv.amount}`).join('\n');
        const confirmMsg = isFree
            ? `Remove the Free (0 rate) mark for ${clientName} (Period: ${period})?`
            : `Cancel these bill(s) for ${clientName} (Period: ${period})?\n\n${billList}\n\nOnly the bills listed above will be cancelled.`;
        if (!confirm(confirmMsg)) {
            return;
        }

        const reason = prompt("Please enter the reason for cancellation (required):");
        if (reason === null) return; // User cancelled
        if (!reason.trim()) {
            showToast("A reason is required to cancel the billing status.");
            return;
        }

        try {
            if (isFree) {
                // Remove free billing log from task_history
                const { error: delErr } = await supabaseClient.from('task_history')
                    .delete()
                    .eq('client_id', clientId)
                    .eq('task_type', 'GST')
                    .ilike('note', `%[GST Free - ${period}]%`);
                
                if (delErr) throw delErr;
            } else {
                // Cancel only the GST return bills the user just confirmed
                const { error: invErr } = await supabaseClient.from('invoices')
                    .update({ status: 'Cancelled' })
                    .in('invoice_id', matchingInvoices.map(inv => inv.invoice_id))
                    .neq('status', 'Cancelled');
                if (invErr) throw invErr;
            }
            const cancelledBills = matchingInvoices.map(inv => inv.bill_number).join(', ');

            // Record log in task_history
            const { error: logErr } = await supabaseClient.from('task_history').insert([{
                client_id: clientId,
                task_type: 'GST',
                task_name: 'Billing Cancelled',
                user_id: currentUser.id,
                note: `[GST Billing Cancelled - ${period}] Reason: ${reason}${cancelledBills ? ` | Bills: ${cancelledBills}` : ''}`,
                timestamp: new Date().toISOString()
            }]);
            
            if (logErr) throw logErr;

            showToast("Billing status cancelled and logged successfully.");
            loadGSTCenterData(); // Refresh GST Center view
        } catch (err) {
            showToast("Error cancelling bill: " + err.message);
        }
    }

    window.openBulkBillModal = function() {
        const modal = document.getElementById('bulkBillModal');
        if (!modal) return;

        const selectEl = document.getElementById('gstMonthFilter');
        const selectedPeriod = selectEl ? selectEl.value : '';
        if (!selectedPeriod) return showToast("Please select a period first!");

        const periodStr = getDeterministicLongPeriod(selectedPeriod);

        document.getElementById('bulkBillModalPeriod').innerText = `Period: ${periodStr}`;

        const tbody = document.getElementById('bulkBillModalTableBody');
        tbody.innerHTML = '';

        let totalClients = 0;
        let totalAmount = 0;
        window.bulkBillClientsList = []; // Store list for generation

        globalGstClients.forEach(client => {
            const trackRecord = globalGstTrackingData.find(t => t.client_id === client.client_id) || {};
            const isBilled = window.globalGstBilledMap && window.globalGstBilledMap[client.client_id];

            // Only if GSTR-3B is completed AND NOT billed!
            if (trackRecord.is_gstr3b && !isBilled) {
                const rate = parseFloat(window.globalGstRatesMap[client.client_id]) || 0;

                    client_id: client.client_id,
                    display_name: client.display_name,

                });

            }
        });

        document.getElementById('bulkBillModalTotalClients').innerText = totalClients;
        document.getElementById('bulkBillModalTotalAmount').innerText = `₹${totalAmount.toFixed(2)}`;

        if (totalClients === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center py-6 text-gray-500">No unbilled clients with completed GSTR-3B found for this period.</td></tr>`;

    window.generateBulkBills = async function() {
        if (!window.bulkBillClientsList || window.bulkBillClientsList.length === 0) {

        }

        const selectEl = document.getElementById('gstMonthFilter');
        const selectedPeriod = selectEl ? selectEl.value : '';

        if (!confirm(`Are you sure you want to generate bills for ${window.bulkBillClientsList.length} clients?`)) return;

        closeBulkBillModal();

        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Generating Bulk Bills...</td></tr>';

        try {
            let successCount = 0;
            let firmId = null;
            const { data: gstSetting } = await supabaseClient.from('app_settings').select('setting_value').eq('setting_key', 'office_os_default_gst_firm').single();
            if (gstSetting) firmId = gstSetting.setting_value;

            for (const client of window.bulkBillClientsList) {

                            client_id: client.client_id,
                            task_type: 'GST',
                            task_name: 'Billing',
                            user_id: currentUser.id,
                            note: `[GST Free - ${selectedPeriod}] Marked as Free (0 Rate).`,
                            timestamp: new Date().toISOString()
                        }]);
                        if (logErr) throw logErr;
                        successCount++;
                    } else {
                        const billNo = await window.getNextInvoiceNumber(firmId);
                        const invoiceData = { 
                            client_id: client.client_id, 
                            service_name: `GST Return Fees - ${periodStr}`, 
                            amount: client.rate, 
                            status: 'Unpaid', 
                            bill_number: billNo,
