<div id="editClientDrawer" class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-[0_20px_50px_rgba(8,_112,_184,_0.15)] flex flex-col animate-scale-in overflow-hidden border border-white/20">
        <!-- Header -->
        <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-gradient-to-r from-violet-600 to-indigo-600 text-white">
            <div>
                <h3 class="text-xl font-black tracking-tight">Update Client Profile</h3>
                <p class="text-[10px] font-bold text-indigo-100 uppercase tracking-widest mt-0.5">Modify master record details</p>
            </div>
            <button onclick="closeEditClient()" class="text-white/60 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-10 h-10 flex items-center justify-center transition-all duration-300">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-8 overflow-y-auto space-y-6 max-h-[70vh] os-scroll">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Client Name *</label>
                    <input type="text" id="editClientName" class="w-full rounded-2xl border border-slate-200 p-4 text-sm font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-slate-50 transition-all duration-300 focus:bg-white">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">PAN Number</label>
                        <input type="text" id="editClientPan" class="w-full rounded-2xl border border-slate-200 p-4 text-sm font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-slate-50 uppercase transition-all duration-300 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">GSTIN</label>
                        <input type="text" id="editClientGst" class="w-full rounded-2xl border border-slate-200 p-4 text-sm font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-slate-50 uppercase transition-all duration-300 focus:bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Entity Type</label>
                    <div class="relative">
                        <select id="editClientEntity" class="w-full rounded-2xl border border-slate-200 p-4 text-sm font-bold outline-none bg-slate-50 focus:ring-2 focus:ring-violet-500 transition-all duration-300 appearance-none focus:bg-white">
                            <option value="Individual">Individual</option>
                            <option value="HUF">HUF</option>
                            <option value="Partnership Firm">Partnership Firm</option>
                            <option value="LLP">LLP</option>
                            <option value="Private Limited">Private Limited</option>
                            <option value="Trust / Society">Trust / Society</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">GST Filing Frequency</label>
                    <div class="relative">
                        <select id="editClientGstFrequency" class="w-full rounded-2xl border border-slate-200 p-4 text-sm font-bold outline-none bg-slate-50 focus:ring-2 focus:ring-violet-500 transition-all duration-300 appearance-none focus:bg-white">
                            <option value="Monthly">Monthly Regular</option>
                            <option value="Quarterly">Quarterly (QRMP)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 px-1 border-b border-slate-100 pb-2">Enrollment Categories</label>
                    <div id="editClientServicesCheckboxes" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-2xl border border-slate-100 shadow-inner">
                        <!-- Checkboxes injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-8 border-t border-slate-100 bg-slate-50/50 flex justify-end gap-3">
            <button onclick="closeEditClient()" class="px-6 py-3 text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-600 transition-all duration-300">Cancel</button>
            <button onclick="saveClientEdit()" id="saveClientBtn" class="px-8 py-3.5 text-xs font-black bg-gradient-to-r from-violet-600 to-indigo-600 text-white hover:from-violet-700 hover:to-indigo-700 rounded-2xl shadow-xl shadow-indigo-100 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
                Save Profile Changes
            </button>
        </div>
    </div>
</div>

<div id="universalClientProfileDrawer" class="hidden fixed inset-0 z-[60] bg-slate-50 overflow-y-auto w-full h-full os-scroll transition-all duration-500">
    <div class="w-full max-w-6xl mx-auto py-8 px-4 md:px-8">
        <div class="mb-6 flex flex-col gap-4">
            <button onclick="closeUniversalClientProfile()" class="w-max text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-1.5 hover:scale-[1.02] active:scale-[0.98]"><i class="fa-solid fa-arrow-left text-xs"></i> Back to Directory</button>
            <div class="bg-gradient-to-br from-violet-600 via-indigo-600 to-cyan-500 text-white rounded-[2rem] shadow-2xl shadow-indigo-100 p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                <div class="absolute bottom-0 left-0 w-32 h-32 bg-violet-400/20 rounded-full blur-2xl translate-y-1/2 -translate-x-1/3"></div>
                <div class="relative z-10">
                    <span class="text-[10px] font-black text-indigo-100 uppercase tracking-widest mb-1.5 block" id="prof-client-entity">Entity Type</span>
                    <h3 id="prof-client-name" class="text-2xl md:text-3xl font-black tracking-tight mb-2">Client Name</h3>
                    <div class="flex flex-wrap gap-x-6 gap-y-2 mt-3">
                        <p class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-1.5 bg-white/10 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-id-card text-xs text-indigo-200"></i> PAN: <span id="prof-client-pan" class="font-black">PAN</span></p>
                        <p class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-1.5 bg-white/10 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-receipt text-xs text-indigo-200"></i> GST: <span id="prof-client-gst" class="font-black">GST</span></p>
                    </div>
                </div>
                <div class="flex items-center gap-3 relative z-10">
                    <button onclick="openEditClient()" class="bg-white/10 text-white hover:bg-white hover:text-indigo-600 border border-white/20 px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-1.5 shadow-lg hover:scale-[1.02] active:scale-[0.98]"><i class="fa-solid fa-pen-to-square text-xs"></i> Edit Profile</button>
                    <button onclick="deleteClient()" class="bg-red-500/20 text-red-100 hover:bg-red-600 hover:text-white border border-red-500/30 px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-1.5 shadow-lg hover:scale-[1.02] active:scale-[0.98]"><i class="fa-solid fa-trash text-xs"></i> Delete Client</button>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            <div class="space-y-6">
                <!-- Contact Persons -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 hover:shadow-md transition-all duration-300 group">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                        <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider"><i class="fa-solid fa-address-book text-violet-500 mr-2"></i> Contact Persons</h4>
                    </div>
                    <div id="prof-contacts-list" class="space-y-3 mb-4"></div>
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 shadow-inner">
                        <div class="flex justify-between items-center border-b border-slate-200 pb-2 mb-3">
                            <h5 class="text-xs font-black text-slate-600 uppercase tracking-wide" id="contactFormTitle">Add New Contact</h5>
                            <button onclick="resetContactForm()" id="cancelEditContactBtn" class="hidden text-xs font-bold text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-times mr-1"></i>Cancel</button>
                        </div>
                        <div class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="newContactName" placeholder="Full Name" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-white transition-all duration-300">
                                <input type="text" id="newContactJob" placeholder="Job Title" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-white transition-all duration-300">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="newContactPhone" placeholder="Phone Number" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-white transition-all duration-300">
                                <input type="email" id="newContactEmail" placeholder="Email Address" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-violet-500 bg-white transition-all duration-300">
                            </div>
                            <button onclick="saveContact()" id="saveContactBtn" class="w-full bg-violet-50 text-violet-600 border border-violet-100 font-black py-2.5 rounded-lg shadow-sm hover:bg-violet-600 hover:text-white transition-all duration-300 text-xs hover:scale-[1.01]">Save Contact</button>
                        </div>
                    </div>
                </div>
                <!-- Enrolled Compliances -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 hover:shadow-md transition-all duration-300 group">
                    <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-4 border-b border-slate-100 pb-3"><i class="fa-solid fa-clipboard-check text-emerald-500 mr-2"></i> Enrolled Compliances</h4>
                    <div id="prof-compliances-list" class="flex flex-wrap gap-2 mb-4"></div>
                    <div class="flex gap-3 items-center bg-slate-50 border border-slate-100 p-3 rounded-xl shadow-inner">
                        <div class="relative flex-1">
                            <select id="prof-add-compliance-select" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none bg-white focus:ring-2 focus:ring-emerald-500 transition-all duration-300 appearance-none"></select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                        <button onclick="addComplianceToClient()" class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-5 py-2.5 rounded-lg text-xs font-black hover:bg-emerald-600 hover:text-white transition-all duration-300 shadow-sm hover:scale-[1.02]">Enroll</button>
                    </div>
                </div>
            </div>
            <div class="space-y-6">
                <!-- Tally Financials -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-all duration-300 group">
                    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <h4 class="font-black text-slate-800 text-xs uppercase tracking-wider"><i class="fa-solid fa-wallet text-rose-500 mr-2"></i> Tally Financials</h4>
                        <span class="text-xs font-black bg-white border border-slate-100 px-3 py-1.5 rounded-lg text-slate-600 shadow-sm">Total Due: <span id="prof-total-due" class="text-rose-600 ml-1 text-sm font-black">₹0</span></span>
                    </div>
                    <div class="p-6">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Mapped Tally Ledgers</p>
                        <div id="prof-mapped-ledgers" class="space-y-2 mb-4"></div>
                        <div class="pt-5 border-t border-slate-100 mt-3 bg-slate-50/50 -mx-6 px-6 -mb-6 pb-6">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Map Another Ledger</p>
                            <div class="flex gap-3">
                                <input type="text" list="profLedgerDatalist" id="prof-ledger-search" class="flex-1 border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none bg-white focus:ring-2 focus:ring-indigo-500 transition-all duration-300 shadow-sm" placeholder="Search & Auto-fill ledger...">
                                <datalist id="profLedgerDatalist"></datalist>
                                <button onclick="linkLedgerToClient()" id="profLinkLedgerBtn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-xs font-black shadow-lg hover:bg-indigo-700 transition-all duration-300 hover:scale-[1.02]">Link</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Active Tasks & Audits -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition-all duration-300 group">
                    <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                        <h4 class="font-black text-slate-800 text-xs uppercase tracking-wider"><i class="fa-solid fa-list-check text-sky-500 mr-2"></i> Active Tasks & Audits</h4>
                    </div>
                    <div id="prof-active-tasks" class="p-6 space-y-4 max-h-[400px] overflow-y-auto bg-white"></div>
                </div>
            </div>
        </div>
    </div>
</div>
